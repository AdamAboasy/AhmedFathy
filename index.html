/* ---------------- Confirm ---------------- */
function confirmDialog(title, msg, okLabel, cb, danger){
  const id = Modal.open({ title: title, size: 'sm', autofocus: false,
    body: `<p style="line-height:1.9">${esc(msg)}</p>`,
    footer: `<button class="btn" data-close="${'__ID__'}">إلغاء</button><button class="btn ${danger ? 'bad' : 'pri'}" id="cfOk">${esc(okLabel || 'تأكيد')}</button>` });
  const ov = $(`.overlay[data-mid="${id}"]`);
  ov.querySelector('#cfOk').onclick = () => { Modal.close(id); cb(); };
  return id;
}
/* ============================================================
   الأدوار: مالك · مدرس · ولي أمر
   -----------------------------------------------------------------
   • المالك (المستر) = أول جهاز، من غير أي تسجيل دخول خالص.
   • المدرس = يدخل بإيميل وباسورد مرة واحدة على جهازه، وممنوع من:
     الحذف · السلة · التراجع · الإعدادات · قفل السنة · النسخ الاحتياطية
     · إدارة المدرسين · تغيير اللوجو · النشر · اختيار السيرفر
   • ولي الأمر = شاشة المتابعة (رابط الطالب) — قراءة فقط
   منع الأزرار في الواجهة بيتم هنا، والحماية النهائية على السيرفر
   بتتضاف في مرحلة القواعد.
   ============================================================ */
const ROLE_INFO = {
  owner:   { ar:'المالك',  chip:'b-brand', ic:'star',  note:'صلاحيات كاملة — إنت' },
  teacher: { ar:'مدرس',    chip:'b-info',  ic:'users', note:'حضور · درجات · ملاحظات · طلاب' },
  parent:  { ar:'ولي أمر', chip:'b-gray',  ic:'eye',   note:'يشوف ابنه بس — قراءة فقط' },
  pending: { ar:'بانتظار الموافقة', chip:'b-warn', ic:'clock', note:'طلبك عند المستر' },
  guest:   { ar:'جهاز غير مسجّل', chip:'b-warn', ic:'alert', note:'محتاج تسجيل دخول' }
};
/* الأقسام اللي المالك بس يقدر يرفعها على السحابة (نفس قواعد فايربيز) */
const OWNER_SECTIONS = ['settings','members','invites','requests'];
/* الأعمال اللي المالك بس يقدر يعملها */
const OWNER_ONLY = ['delStudent','delGroup','delExam','delExamAll','trashOpen','trashRestore','trashEmpty','trashRestoreAsk',
  'undoOpen','undoLast','ycOpen','ycDo','ycArchive','snapRestoreAsk','snapshotNow',
  'deployOpen','deployZip','deployShell','deployCopy','deployTry','standaloneSave',
  'saveSettings','logoPick','logoClear','logoFile','membersOpen','memberInvite','memberRevoke',
  'seed','fbPickServer','fbTryNext','authWizard','fbPaste','fbClear','dataReset'];

const Roles = {
  KEY:'mostar_role', UIDK:'mostar_uid',
  ls(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } },
  lsSet(k, v){ try{ v ? localStorage.setItem(k, v) : localStorage.removeItem(k); }catch(e){} },
  uid(){ const s = this.ls(this.UIDK); if (s) return s; let u = ''; try{ u = Cloud.uid(); }catch(e){} return u || this.devId(); },
  devId(){
    let d = this.ls('mostar_dev_id');
    if (!d){ d = 'dev-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); this.lsSet('mostar_dev_id', d); }
    return d;
  },
  members(){ if (!S.data.members || typeof S.data.members !== 'object' || Array.isArray(S.data.members)) S.data.members = {}; return S.data.members; },
  invites(){ if (!S.data.invites || typeof S.data.invites !== 'object' || Array.isArray(S.data.invites)) S.data.invites = {}; return S.data.invites; },
  count(){ return Object.keys(this.members()).length; },
  role(){
    const saved = this.ls(this.KEY);
    const m = this.members(), u = this.uid();
    if (m[u] && m[u].role) return m[u].role;
    if (saved === 'pending') return 'pending';                    // بعت طلب وبيستنى الموافقة
    if (saved === 'guest') return 'guest';
    if (saved === 'teacher'){
      if (S.fb && S.fb.denied) return 'guest';      // فايربيز رفضت الوصول → الصلاحية مش سارية
      // جهاز المدرس: لو القايمة الحالية جاية من السحابة وهو مش فيها → الصلاحية اتلغت
      if (Object.keys(m).length && !m[u] && S.fb && S.fb.status === 'live') return 'guest';
      return 'teacher';
    }
    if (saved === 'owner' && this.hasLocalData()) return 'owner';  // جهاز المستر (حتى لو شهادته اتجددت)
    if (!Object.keys(m).length) return 'owner';    // أول جهاز = المالك
    if (this.hasData()) return 'owner';            // جهاز قديم فيه بيانات المستر
    return 'guest';                                 // جهاز جديد من غير تسجيل
  },
  /* فيه بيانات المنصة على الجهاز؟ (أي بيانات) */
  hasLocalData(){
    try{
      if (S.data.meta && S.data.meta.hadData) return true;
      return !!((S.data.students || []).length || (S.data.groups || []).length || (S.data.exams || []).length
        || Object.keys(S.data.attendance || {}).length || Object.keys(S.data.grades || {}).length);
    }catch(e){ return false; }
  },
  /* جهاز المستر القديم: فيه بيانات المنصة، ولسه مفيش فيه أعضاء مسجّلين (يعني بياناته أقدم من نظام الأدوار) */
  hasData(){
    try{
      const old = !Object.keys(this.members()).length;
      if (!old) return false;
      if (S.data.meta && S.data.meta.hadData) return true;
      return !!((S.data.students || []).length || (S.data.groups || []).length || (S.data.exams || []).length
        || Object.keys(S.data.attendance || {}).length || Object.keys(S.data.grades || {}).length);
    }catch(e){ return false; }
  },
  /* نجيب قايمة الأعضاء من السحابة (بتنجح بس لو إحنا من الأعضاء) — وده اللي بيدخّل
     الجهاز المعتمد لوحده بعد ما المستر يوافق على طلبه، وبيشيل صلاحية اللي اترفض */
  async syncMembers(){
    const u = this.uid(), m = this.members(), saved = this.ls(this.KEY);
    let d = null;
    try{ d = await Cloud.rtdb('GET', Cloud.rootPath() + '/members'); }
    catch(e){
      // فايربيز رفضت قايمة الأعضاء ومعانا دور مدرس محفوظ → يعني المستر شال صلاحيتنا
      if (saved === 'teacher' && S.fb && S.fb.denied){
        delete m[u]; this.lsSet(this.KEY, 'guest');
        try{ commit({ silent:true }); saveLocal(); }catch(x){}
        try{ this.apply(); }catch(x){}
      }
      return false;
    }
    if (!d || typeof d !== 'object') return false;
    Object.keys(d).forEach(k => { if (!m[k]) m[k] = d[k]; });
    if (d[u] && d[u].role){
      if (d[u].role !== saved){ this.lsSet(this.KEY, d[u].role); this.lsSet(this.UIDK, u); try{ commit({ silent:true }); }catch(e){} }
      return true;
    }
    if (saved === 'teacher' && Object.keys(d).length){
      // القايمة اتقرات فعلًا وإحنا مش فيها → المستر شال صلاحية الجهاز ده
      delete m[u]; this.lsSet(this.KEY, 'guest');
      try{ commit({ silent:true }); saveLocal(); }catch(e){}
      try{ this.apply(); }catch(e){}
      return false;
    }
    return false;
  },
  code(){ return this.uid(); },
  isOwner(){ return this.role() === 'owner'; },
  info(r){ return ROLE_INFO[r || this.role()] || ROLE_INFO.guest; },
  label(){ return this.info().ar; },
  device(){ try{ return (typeof devKind === 'function') ? devKind() : 'جهاز'; }catch(e){ return 'جهاز'; } },
  /* اعتماد الجهاز كمالك — ونتأكد إن فايربيز قبلت (القواعد هي الحكم) */
  async becomeOwner(msg){
    const m = this.members(), u = this.uid();
    m[u] = Object.assign({}, m[u] || {}, { role:'owner', name:(S.data.settings.teacherName || 'المستر'),
      at:(m[u] && m[u].at) || new Date().toISOString(), device:this.device() });
    this.lsSet(this.UIDK, u); this.lsSet(this.KEY, 'owner'); this._claimed = true;
    try{ commit({ silent:true }); }catch(e){}
    let okWrite = true;
    try{ await Cloud.rtdb('PUT', Cloud.rootPath() + '/members/' + u, m[u]); }
    catch(e){ okWrite = false; }
    if (!okWrite){
      // فايربيز رفضت: يعني فيه أعضاء بالفعل والجهاز ده مش منهم → جهاز جديد محتاج تسجيل
      delete m[u]; this.lsSet(this.KEY, 'guest');
      try{ Roles.apply(); }catch(e){}
      return false;
    }
    if (msg) setTimeout(() => toast(msg, 'ok', 'الأدوار'), 1200);
    return true;
  },
  /* أول جهاز بياخد دور المالك لوحده — وأي جهاز تاني فيه بيانات المستر بيتعتمد كمان
     ملاحظة مهمة: جهاز جديد من غير بيانات ماياخدش المالك غير لو السحابة فاضية فعلًا */
  async init(){
    const savedRole = this.ls(this.KEY);
    const m0 = this.members(), u0 = this.uid();
    if (m0[u0] && m0[u0].role) return false;
    if (savedRole === 'teacher'){
      if (S.fb && S.fb.denied){ this.lsSet(this.KEY, 'guest'); try{ this.apply(); }catch(e){} return false; }
      if (this._memAt && Date.now() - this._memAt < 60000) return false;    // فحص الأعضاء مرة كل دقيقة بالكتير
      this._memAt = Date.now();
      if (await this.syncMembers()){ if (this.ls(this.KEY) !== 'teacher'){ try{ this.apply(); }catch(e){} } }
      return false;
    }
    if (savedRole === 'guest'){
      // ممكن المستر وافق على الجهاز ده وهو واقف على صفحة الدخول → ناخد دورنا من السحابة
      if (this._memAt && Date.now() - this._memAt < 5000) return false;
      this._memAt = Date.now();
      if (await this.syncMembers()){ try{ this.apply(); }catch(e){} return true; }
      return false;
    }
    const m = this.members(), u = this.uid();
    // جهاز المستر اللي شهادته اتجدّدت (أو عضويته اتشالت بالغلط) → نرجّعه مالك
    if (this.ls(this.KEY) === 'owner' && this.hasLocalData()) return await this.becomeOwner('');
    if (Object.keys(m).length){ for (const k in m){ if ((m[k] || {}).role) { if (this.hasData()) return await this.becomeOwner('تم اعتماد الجهاز ده كجهاز للمستر ✅'); return false; } } }
    // جهاز المستر القديم (فيه بيانات المنصة) → مالك على طول
    if (this.hasData()) return await this.becomeOwner('');
    if (this._checking) return false;
    this._checking = true;
    let cloudMembers = null, cloudMeta = null;
    try{ cloudMembers = await Cloud.rtdb('GET', Cloud.rootPath() + '/members'); }catch(e){}
    try{ cloudMeta = await Cloud.rtdb('GET', Cloud.rootPath() + '/meta'); }catch(e){}
    this._checking = false;
    const cloudKnown = (cloudMembers && typeof cloudMembers === 'object' && Object.keys(cloudMembers).length)
                    || (cloudMeta && typeof cloudMeta === 'object' && Object.keys(cloudMeta).length);
    const denied = (S.fb && S.fb.denied);      // فايربيز رفضت القراءة = فيه أعضاء والجهاز ده مش منهم
    if (cloudKnown || denied){
      // المنصة موجودة على السحابة وجهازنا مش من أعضائها → محتاج اعتماد من المستر
      if (cloudMembers && typeof cloudMembers === 'object'){
        Object.keys(cloudMembers).forEach(k => { if (!m[k]) m[k] = cloudMembers[k]; });
      }
      this.lsSet(this.KEY, 'guest');
      try{ Roles.apply(); }catch(e){}
      return false;
    }
    return await this.becomeOwner('');
  },
  setRole(uid, role, extra){
    if (!uid) return;
    const m = this.members();
    if (role === null) delete m[uid];
    else m[uid] = Object.assign({}, m[uid] || {}, extra || {}, { role: role, at:(m[uid] && m[uid].at) || new Date().toISOString() });
    if (uid === this.uid()) this.lsSet(this.KEY, role === null ? '' : role);
    try{ commit({ silent:true }); }catch(e){}
    this.push(uid, role === null);
  },
  push(uid, del){
    try{ Cloud.rtdb(del ? 'DELETE' : 'PUT', Cloud.rootPath() + '/members/' + uid, del ? undefined : this.members()[uid]); }catch(e){}
  },
  /* اللي مسموح لكل دور */
  can(act){
    if (!act) return true;
    const r = this.role();
    if (r === 'guest' || r === 'pending'){
      // جهاز لسه مسجّلش: ممنوع من كل حاجة غير أزرار صفحة الدخول
      return ['rolesOpen','guestCodeCopy','lSend','lGo','lCheck','lCancel','lAgain'].indexOf(act) >= 0;
    }
    if (r === 'owner') return true;
    if (OWNER_ONLY.indexOf(act) >= 0) return false;
    if (/^del|^trash/i.test(act)) return false;
    return true;
  },
  deny(){
    if (this.role() === 'guest') toast('الجهاز ده مش مصرّح — اطلب من المستر دعوة', 'warn', 'الصلاحيات');
    else toast('الحاجة دي للمستر بس (إنت داخل كمدرس) — كلّم المستر لو محتاجها', 'warn', 'الصلاحيات');
    return false;
  },
  /* الشارة + إخفاء الأزرار الممنوعة + صفحة تسجيل الدخول للأجهزة الجديدة */
  apply(){
    try{
      const r = this.role(), info = this.info(r), owner = this.isOwner();
      const b = document.body;
      if (b.dataset.role !== r) b.dataset.role = r;
      b.classList.toggle('role-mem', !owner);
      // أي جهاز مش مسجّل أو بانتظار الموافقة → صفحة تسجيل الدخول على الشاشة كاملة
      if (r === 'guest' || r === 'pending'){ try{ LMode.show(r); }catch(e){} }
      else { try{ LMode.hide(); }catch(e){} try{ localStorage.removeItem('mostar_ptok'); }catch(e){} }
      const badge = $('#roleBadge');
      if (badge){
        let txt = info.ar;
        try{ if (owner){ const n = Requests.pending().length; if (n) txt += ' · ' + n + ' طلب'; } }catch(e){}
        badge.textContent = txt; badge.className = 'role-badge ' + info.chip;
      }

/* ============================================================
   التراجع + سلة المحذوفات — الشبكة الأمان بتاعة المستر
   • أي عملية بيتاخد لها لقطة، وزر «رجّع» بيظهر جوه التنبيه 10 ثواني
   • أي حذف بيروح «سلة المحذوفات» 30 يوم، وبيترجع بكل حاجته (درجات + حضور)
   ============================================================ */
const Undo = {
  KEY: 'mostar_undo_log',
  stack: [], CAP: 15, LIMIT: 5 * 1024 * 1024, bytes: 0,
  snap(label){
    try{
      const json = JSON.stringify(S.data);
      this.stack.push({ label: label, at: new Date(), data: json });
      this.bytes += json.length;
      while (this.stack.length > this.CAP || (this.bytes > this.LIMIT && this.stack.length > 2)){
        this.bytes -= (this.stack.shift().data || '').length;
      }
      this.log(label);
    }catch(e){}
  },
  log(label){
    try{
      const list = JSON.parse(localStorage.getItem(this.KEY) || '[]');
      list.unshift({ label: String(label || ''), at: new Date().toISOString() });
      localStorage.setItem(this.KEY, JSON.stringify(list.slice(0, 20)));
    }catch(e){}
  },
  logs(){ try{ return JSON.parse(localStorage.getItem(this.KEY) || '[]'); }catch(e){ return []; } },
  can(){ return this.stack.length > 0; },
  top(){ return this.stack.length ? this.stack[this.stack.length - 1] : null; },
  run(){
    const e = this.stack.pop();
    if (!e){ toast('مفيش عملية ترجعها', 'info'); return false; }
    try{
      this.bytes -= (e.data || '').length;
      const d = migrate(JSON.parse(e.data));
      S.data = d; bustCache(); commit({ silent:false });
      toast('تم الرجوع: ' + e.label, 'ok', 'رجّعنا');
      return true;
    }catch(err){ toast('مش قادر أرجع العملية دي', 'bad'); return false; }
  }
};
// بنسجّل العملية قبل ما تحصل (ممكن تترجع 10 ثواني من التنبيه أو من الإعدادات)
function undoable(label, fn, opts){
  opts = opts || {};
  Undo.snap(label);
  const r = fn();
  if (!opts.silent) toast(label + ' — تقدر ترجّعها', opts.type || 'ok', opts.title, true);
  return r;
}

const Trash = {
  KEY: 'mostar_trash', DAYS: 30,
  all(){
    try{
      const list = JSON.parse(localStorage.getItem(this.KEY) || '[]');
      const fresh = list.filter(x => x && x.at && (Date.now() - new Date(x.at).getTime()) < this.DAYS * 86400000);
      if (fresh.length !== list.length) this.save(fresh);
      return fresh;
    }catch(e){ return []; }
  },
  save(list){ try{ localStorage.setItem(this.KEY, JSON.stringify((list || []).slice(0, 60))); }catch(e){} },
  add(entry){
    try{
      const list = this.all();
      list.unshift(Object.assign({ id: uid('t'), at: new Date().toISOString() }, entry));
      this.save(list);
      S.ui.trashCount = list.length;
      return list[0];
    }catch(e){ return null; }
  },
  get(id){ return this.all().filter(x => x.id === id)[0] || null; },
  remove(id){ this.save(this.all().filter(x => x.id !== id)); },
  count(){ return this.all().length; },
  // بناخد نسخة كاملة من السجل وحاجته قبل الحذف
  async capture(kind, rec){
    const e = { kind: kind, at: new Date().toISOString(), rec: JSON.parse(JSON.stringify(rec || {})), grades: {}, att: {}, links: [] };
    if (kind === 'student'){
      const sid = rec.id;
      Object.keys(S.data.grades || {}).forEach(eid => { if (sid in (S.data.grades[eid] || {})) e.grades[eid] = S.data.grades[eid][sid]; });
      Object.keys(S.data.attendance || {}).forEach(k => { const r = (S.data.attendance[k] || {}).records || {}; if (sid in r) e.att[k] = r[sid]; });
      e.label = 'طالب: ' + (rec.name || '');
      const cm = S.fb.lastPush ? ', آخر نسخة على السحابة ' + S.fb.lastPush.toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' }) : '';
      e.note = ((rec.groupId ? 'كان في حصة ' + ((groupOf(rec.groupId) || {}).name || '') + ' · ' : '') + 'درجات: ' + Object.keys(e.grades).length + ' · أيام حضور: ' + Object.keys(e.att).length + cm);
    } else if (kind === 'group'){
      e.label = 'حصة: ' + (rec.name || '');
      e.links = (S.data.students || []).filter(x => x.groupId === rec.id).map(x => ({ id: x.id, name: x.name }));
      e.note = 'كان فيها ' + e.links.length + ' طالب';
    } else {
      e.label = 'امتحان: ' + (rec.name || '');
      e.grades = Object.assign({}, (S.data.grades || {})[rec.id] || {});
      e.note = 'درجات مسجّلة: ' + Object.keys(e.grades).length;
    }
    return e;
  },
  // نرجّع السجل ودرجاته وحضوره (بدون ما نلمس أي حاجة أحدث)
  restore(id){
    const e = this.get(id);
    if (!e){ toast('السجل مش موجود في السلة', 'bad'); return false; }
    Undo.snap('استرجاع ' + e.label);
    const rec = JSON.parse(JSON.stringify(e.rec || {}));
    if (e.kind === 'student'){
      if (!(S.data.students || []).some(x => x.id === rec.id)){ rec._t = Date.now(); S.data.students.push(rec); }
      else toast('الطالب موجود أصلًا بهذا الاسم', 'warn');
      Object.keys(e.grades || {}).forEach(eid => {
        S.data.grades[eid] = S.data.grades[eid] || {};
        if (!(rec.id in S.data.grades[eid])) S.data.grades[eid][rec.id] = e.grades[eid];
      });
      Object.keys(e.att || {}).forEach(k => {
        if (!S.data.attendance[k]){
          const parts = String(k).split('@');
          S.data.attendance[k] = { groupId: parts[1] || '', date: parts[0] || '', records: {} };
        }
        S.data.attendance[k].records = S.data.attendance[k].records || {};
        if (!(rec.id in S.data.attendance[k].records)) S.data.attendance[k].records[rec.id] = e.att[k];
      });
    } else if (e.kind === 'group'){
      if (!(S.data.groups || []).some(x => x.id === rec.id)){ rec._t = Date.now(); S.data.groups.push(rec); }
      (e.links || []).forEach(l => { const st = student(l.id); if (st && !st.groupId) st.groupId = rec.id; });
    } else if (e.kind === 'exam'){
      if (!(S.data.exams || []).some(x => x.id === rec.id)){ rec._t = Date.now(); S.data.exams.push(rec); }
      S.data.grades[rec.id] = S.data.grades[rec.id] || {};
      Object.keys(e.grades || {}).forEach(sid => { if (!(sid in S.data.grades[rec.id])) S.data.grades[rec.id][sid] = e.grades[sid]; });
    }
    this.remove(id);
    commit();
    toast('رجّعنا ' + e.label + ' بكل بياناته ✅', 'ok', 'سلة المحذوفات');
    return true;
  }
};

function nextCode(){
  const nums = S.data.students.map(s => Number(String(s.code || '').replace(/\D/g, '')) || 0);
  return 'S' + String((nums.length ? Math.max.apply(null, nums) : 0) + 1).padStart(3, '0');
}

/* ---------------- نموذج الطالب ---------------- */
/* ============================================================
   روابط متابعة أولياء الأمور
   • كل طالب له رابط خاص (توكن عشوائي طويل) — ولي الأمر يفتحه على موبايله
     ويشوف ابنه لوحده: الحضور + الدرجات + الملاحظات. الرابط قراءة فقط.
   • اللينك فيه كود المنصة، ومفتاح فايربيز (لو متاح) عشان جهاز ولي الأمر
     يعمل الدخول الصامت لوحده من غير أي كتابة.
   ============================================================ */
const Parent = {
  map(){ if (!S.data.ptokens || typeof S.data.ptokens !== 'object') S.data.ptokens = {}; return S.data.ptokens; },
  of(sid){ const t = this.map()[sid]; return (t && t.token) || ''; },
  rec(sid){ return this.map()[sid] || null; },
  rnd(){
    const a = new Uint8Array(16);
    try{ (window.crypto || {}).getRandomValues(a); }catch(e){ for (let i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256); }
    return Array.prototype.map.call(a, b => ('0' + (b & 255).toString(16)).slice(-2)).join('');
  },
  hash(o){ let h = 5381; const t = JSON.stringify(o || ''); for (let i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0; return h.toString(36); },
  base(){ try{ return platformBase(); }catch(e){ return PLATFORM_URL_DEFAULT; } },
  link(token){
    let code = FB_DEFAULT.code || FB_DEFAULT.projectId;
    try{ code = Cloud.cfgNow().code || code; }catch(e){}
    let k = '';
    try{ k = Cloud.authKeyOf() || ''; }catch(e){ k = ''; }
    return this.base() + '?p=' + encodeURIComponent(token) + '&c=' + encodeURIComponent(code) + (k ? '&k=' + encodeURIComponent(k) : '');
  },
  /* صورة مختصرة لبيانات الطالب — دي اللي ولي الأمر بيقراها (ملف صغير جدًا وبيتحدّث لوحده) */
  snapshot(sid){
    const s = student(sid) || {}, g = groupOf(s.groupId) || {}, st = S.data.settings || {};
    const rows = (attIndex()[sid] || []).slice(-150);
    const att = rows.map(r => ({ d: r.date, g: r.groupId || '', s: r.status }));
    const t = attStats(sid, '', '');
    const ex = [];
    sortBy(S.data.exams.filter(e => typeof (S.data.grades[e.id] || {})[sid] === 'number'), e => e.date || '', 'asc')
      .slice(-40).forEach(e => ex.push({ n: e.name || '', d: e.date || '', max: Number(e.max || 0), m: Number(S.data.grades[e.id][sid]) }));
    const notes = [];
    Object.keys(S.data.feedback || {}).forEach(eid => {
      const f = fbOf(eid, sid); if (!f || (!f.err && !f.hw)) return;
      const e = S.data.exams.filter(x => x.id === eid)[0] || {};
      notes.push({ d: e.date || '', n: e.name || 'امتحان', err: f.err || '', hw: f.hw || '' });
    });
    notes.sort((a, b) => (a.d < b.d ? 1 : -1));
    const abs = [];
    Object.keys(S.data.absNotes || {}).forEach(ssid => { if (ssid === sid) return; });   // ملاحظات الغياب خاصة بالطالب
    const box = (S.data.absNotes || {})[sid] || {};
    Object.keys(box).forEach(d => abs.push({ d: d, n: box[d] }));
    abs.sort((a, b) => (a.d < b.d ? 1 : -1));
    return { v: 2, at: new Date().toISOString(),
      sid: sid, name: s.name || '', stage: s.stage || '', group: g.name || '', gid: s.groupId || '',
      tname: st.teacherName || 'أحمد فتحي', tphone: st.phone || '',
      tot: { present: t.present, absent: t.absent, late: t.late, rate: t.rate, total: t.total },
      att: att, ex: ex, notes: notes.slice(0, 25), abs: abs.slice(0, 25) };
  },
  async put(sid, token){
    const snap = this.snapshot(sid);
    await Cloud.rtdb('PUT', Cloud.rootPath() + '/parents/' + token, snap);
    const r = this.map()[sid]; if (r) r.hash = this.hash(snap);
    return snap;
  },
  /* ذيل المتابعة اللي بيتحط في آخر كل رسالة لولي الأمر: الكود + رابط المنصة + لينك ابنه */
  follow(sid){
    const s = student(sid) || {};
    const t = this.of(sid), L = [];
    L.push('━━━━━━━━━━━━━');
    if (t){
      // الأهم الأول: الجملة + اللينك اللي بيفتح صفحة ابنه على طول
      L.push('لمتابعة تفاصيل ابنك، يرجى الدخول على صفحة ابنك من اللينك ده:');
      L.push(this.link(t));
      L.push('');
      L.push('واحفظ اللينك عندك وارجع له في أي وقت — بيتحدّث لوحده أول ما يحصل أي جديد ✅');
      L.push('');
      L.push('ولو حبيت تدخل من جهاز تاني في أي وقت:');
      L.push('🔑 كود المتابعة: ' + t);
      L.push('🌐 رابط المنصة: ' + this.base());
    } else {
      L.push('(المستر هيرسل لك لينك صفحة ' + (String(s.name || '').split(' ')[0] || 'ابنك') + ' على طول — كلّم المستر لو مالكش.)');
    }
    return L.join('\n');
  },
  /* بلوك رسالة الطالب: لينك صفحته عشان يبقى عارف مستواه */
  followStudent(sid){
    const s = student(sid) || {};
    const t = this.of(sid), L = [];
    L.push('━━━━━━━━━━━━━');
    if (t){
      L.push('لمتابعة مستواك ودرجاتك وحضورك، ادخل على صفحتك من اللينك ده:');
      L.push(this.link(t));
      L.push('');
      L.push('تقدر تحفظ اللينك عندك وترجع له في أي وقت — بيتحدّث لوحده أول ما يحصل أي جديد ✅');
    } else {
      L.push('(المستر هيبعتلك لينك صفحتك على طول — تشوف منه درجاتك وحضورك.)');
    }
    return L.join('\n');
  },
  /* نجهّز كود المتابعة لوحده (من غير إزعاج) — بنستخدمه قبل أي رسالة تتبعت لولي الأمر */
  async ensure(sid, quiet){
    if (!student(sid)) return '';
    const have = this.of(sid);
    if (have) return have;
    if (typeof Cloud === 'undefined' || !Cloud.dbUrl() || (S.fb && S.fb.status !== 'live')) return '';
    const m = this.map(), token = this.rnd(), at = new Date().toISOString();
    m[sid] = { token: token, at: at };
    try{ await this.put(sid, token); }
    catch(e){ delete m[sid]; if (!quiet) toast('مش قادر أجهّز كود المتابعة — اتأكد من النت', 'bad', 'رابط المتابعة'); return ''; }
    try{ saveLocal(); }catch(e){}
    if (!quiet) toast('كود المتابعة اتجهّز ✅', 'ok', 'رابط المتابعة');
    return token;
  },
  async ensureAll(sids){
    const list = (sids || []).filter(id => student(id) && !this.of(id));
    if (!list.length) return 0;
    let n = 0;
    for (let i = 0; i < list.length && i < 40; i++){
      if (this.of(list[i])) continue;
      const t = await this.ensure(list[i], true);
      if (t) n++;
    }
    if (n){ try{ commit({ silent:true }); }catch(e){} }
    return n;
  },
  async make(sid){
    const s = student(sid); if (!s){ toast('الطالب مش موجود', 'bad'); return ''; }
    const m = this.map();
    let token = this.of(sid);
    if (!token){ token = this.rnd(); m[sid] = { token: token, at: new Date().toISOString() }; }
    try{ await this.put(sid, token); }
    catch(e){ toast('مش قادر أرفع الرابط على فايربيز — اتأكد إن النت شغال', 'bad', 'رابط المتابعة'); return ''; }
    commit({ silent:true });
    toast('الرابط جاهز ✅ ابعته لولي الأمر', 'ok', 'رابط المتابعة');
    return token;
  },
  async reset(sid){
    const s = student(sid); if (!s) return;
    const m = this.map(), old = this.of(sid), token = this.rnd();
    m[sid] = { token: token, at: new Date().toISOString() };
    try{
      await this.put(sid, token);
      if (old){ try{ await Cloud.rtdb('DELETE', Cloud.rootPath() + '/parents/' + old); }catch(e){} }
    }catch(e){ toast('مش قادر أرفع الرابط — جرّب تاني', 'bad', 'رابط المتابعة'); return; }
    commit({ silent:true });
    toast('اتعمل رابط جديد — القديم ما بقاش شغال', 'ok', 'رابط المتابعة');
  },
  msg(sid){
    const s = student(sid) || {}, st = S.data.settings || {};
    const t = this.of(sid);
    return 'السلام عليكم ' + (s.guardian || '') + '،\n'
      + 'تحياتي أ. ' + (st.teacherName || 'أحمد فتحي') + ' — ' + (st.platformName || 'منصة المستر') + '.\n'
      + 'تحب تتابع مستوى ' + (s.name || 'الطالب') + '؟\n\n'
      + 'كود المتابعة بتاعك:\n' + t + '\n\n'
      + 'رابط المنصة:\n' + this.base() + '\n\n'
      + 'أو افتح لينك ابنك على طول (أسهل حاجة):\n' + this.link(t) + '\n\n'
      + 'الدخول بالكود: افتح رابط المنصة ← «عندك كود متابعة؟» ← اكتب الكود، وهتفتحلك صفحة ' + (s.name || 'ابنك') + ' على طول.\n'
      + 'تقدر تحفظ اللينك عندك وترجع له في أي وقت — بيتحدّث لوحده أول ما يحصل أي جديد.';
  },
  wa(sid){
    const s = student(sid) || {}, ph = s.parentPhone || s.phone;
    if (!this.of(sid)){ toast('اعمل الرابط الأول', 'warn'); return; }
    if (!ph){ toast('مفيش رقم ولي أمر مسجّل للطالب ده', 'warn', 'رابط المتابعة'); return; }
    window.open(waLink(ph, this.msg(sid)), '_blank');
  },
  /* تحديث كل روابط المتابعة على السحابة (بس اللي اتغيّر فعلًا) */
  async refreshAll(manual){
    const m = this.map(), ids = Object.keys(m).filter(sid => m[sid] && m[sid].token);
    if (!ids.length){ if (manual) toast('لسه مفيش روابط متابعة — اعمل رابط من ملف الطالب', 'info', 'روابط المتابعة'); return 0; }
    if (this._busy){ return -1; }
    this._busy = true; this._last = Date.now();
    let n = 0, fail = 0;
    for (let i = 0; i < ids.length; i++){
      const sid = ids[i], t = m[sid].token;
      if (!student(sid)) continue;
      let snap; try{ snap = this.snapshot(sid); }catch(e){ continue; }
      const h = this.hash(snap);
      if (!manual && m[sid].hash === h) continue;
      try{ await Cloud.rtdb('PUT', Cloud.rootPath() + '/parents/' + t, snap); m[sid].hash = h; m[sid].at = new Date().toISOString(); n++; }
      catch(e){ fail++; }
    }
    this._busy = false;
    if (manual){
      if (fail) toast('اتحدّث ' + n + ' رابط · فشل ' + fail + ' (اتأكد من النت)', 'warn', 'روابط المتابعة');
      else if (n) toast('اتحدّث ' + n + ' رابط متابعة ✅', 'ok', 'روابط المتابعة');
      else toast('كل الروابط محدّثة بالفعل ✅', 'ok', 'روابط المتابعة');
    }
    return n;
  },
  /* بعد أي تعديل: نحدّث الروابط لوحدنا (مرة كل شوية وبس اللي اتغيّر) */
  touch(){
    if (!Object.keys(this.map()).length) return;
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      if (Date.now() - (this._last || 0) < 45000) { this.touch(); return; }
      this.refreshAll(false);
    }, 8000);
  },
  count(){ return Object.keys(this.map()).filter(sid => this.of(sid)).length; },
  open(sid, retry){
    const s = student(sid); if (!s){ toast('الطالب مش موجود', 'bad'); return; }
    const token = this.of(sid);
    if (!token && !retry){
      // بنعمله لوحده على طول (القواعد بتسمح للمالك والمدرس بالكتابة في مسار الروابط)
      toast('بنجهّز رابط المتابعة...', 'info', 'رابط المتابعة');
      this.ensure(sid, true).then(() => this.open(sid, true)).catch(() => this.open(sid, true));
      return;
    }
    if (!token){
      Modal.open({ title:'رابط متابعة ولي الأمر', sub:s.name, size:'md',
        body:`<div class="help info" style="line-height:1.95">اعمل لولي أمر <b>${esc(s.name)}</b> رابط خاص بيه — يفتحه على موبايله ويشوف
          <b>الحضور والدرجات والملاحظات</b> أول بأول، ومش شايف أي طالب تاني. الرابط <b>قراءة فقط</b> ومش بيعدّل أي حاجة.</div>`,
        footer:`<button class="btn pri" data-act="pLinkMake" data-id="${sid}">${icon('link')} إنشاء الرابط</button>
          <button class="btn ghost" data-close>إغلاق</button>` });
      return;
    }
    const link = this.link(token), noKey = link.indexOf('&k=') < 0;
    const r = this.rec(sid) || {};
    Modal.open({ title:'رابط متابعة ولي الأمر', sub:s.name, size:'md',
      body:`
        <div class="help ok" style="line-height:1.95">الرابط شغال ✅ — ولي الأمر بيشوف منه <b>حضور ${esc(s.name)} ودرجاته وملاحظاتك</b> بس.
          <br>ومش محتاج تنسخ حاجة: <b>لينك صفحة الطالب بيتحط لوحده في آخر كل رسالة لولي الأمر</b>
          (بجملة «لمتابعة تفاصيل ابنك، يرجى الدخول على صفحة ابنك»)، وكمان <b>رسالة الطالب</b> بيبقى فيها لينك صفحته.
          ${r.at ? '<br>آخر تحديث للبيانات: ' + esc(String(r.at).slice(0, 10)) : ''}</div>
        <div class="field" style="margin-top:12px"><label>كود المتابعة (بيتبعت لولي الأمر)</label>
          <div class="flex wrap" style="gap:8px;align-items:center">
            <code class="code" style="direction:ltr;font-size:12.5px;padding:8px 11px;background:var(--bg);border-radius:9px;flex:1;overflow:auto">${esc(token)}</code>
            <button class="btn sm" data-act="pLinkCodeCopy" data-id="${sid}">${icon('copy')} انسخ الكود</button>
          </div></div>
        <div class="field"><label>رابط المنصة</label>
          <div class="flex wrap" style="gap:8px;align-items:center">
            <code class="code" style="direction:ltr;font-size:12.5px;padding:8px 11px;background:var(--bg);border-radius:9px;flex:1;overflow:auto">${esc(this.base())}</code>
            <button class="btn sm" data-act="pLinkPlatCopy" data-id="${sid}">${icon('copy')} انسخ</button>
          </div>
          <div class="small muted" style="margin-top:6px;line-height:1.9">الدخول بالكود: يفتح رابط المنصة ← «عندك كود متابعة؟» ← يكتب الكود.</div></div>
        <div class="field"><label>لينك ابنك المباشر</label>
          <code class="code" style="display:block;direction:ltr;text-align:left;font-size:12px;padding:9px 11px;background:var(--bg);border-radius:9px;word-break:break-all">${esc(link)}</code>
          <div class="small muted" style="margin-top:7px;line-height:1.9">لو فتحته من متصفح أي موبايل هتشوف صفحة المتابعة على طول — جرّبه بنفسك الأول لو حبيت.</div></div>
        ${noKey ? `<div class="role-strip" style="background:var(--warn-bg);color:var(--warn);line-height:1.9">
          ملاحظة: مفتاح المشروع مش على الجهاز ده. لو ولي الأمر فتح على جهاز جديد ومش عارف يدخل،
          افتح <b>الإعدادات ← المزامنة ← «أمّن البيانات»</b> مرة واحدة، وبعدها ابعتله الرسالة تاني.
        </div>` : ''}`,
      footer:`<button class="btn sm" data-act="pLinkCopy" data-id="${sid}">${icon('copy')} انسخ</button>
        <button class="btn sm pri" data-act="pLinkWa" data-id="${sid}">${icon('whatsapp')} ابعت لولي الأمر</button>
        <button class="btn sm ghost" data-act="pLinkNew" data-id="${sid}">${icon('refresh')} رابط جديد</button>
        <button class="btn ghost" data-close>إغلاق</button>` });
  }
};

/* ============================================================
   طلبات الانضمام: أي جهاز جديد يبعت طلب للمالك، والمالك يقبل
   (ويحدد الدور: مالك أو مدرس) أو يرفض خالص.
   ============================================================ */
const Requests = {
  map(){ if (!S.data.requests || typeof S.data.requests !== 'object' || Array.isArray(S.data.requests)) S.data.requests = {}; return S.data.requests; },
  pending(){ return Object.keys(this.map()).filter(k => (this.map()[k] || {}).status === 'pending' && !Roles.members()[k]); },
  of(uid){ return this.map()[uid] || null; },
  async put(uid, obj){
    this.map()[uid] = Object.assign({}, this.map()[uid] || {}, obj);
    try{ await Cloud.rtdb('PUT', Cloud.rootPath() + '/requests/' + uid, this.map()[uid]); }catch(e){ throw e; }
    return this.map()[uid];
  },
  async approve(uid, role){
    const req = this.of(uid) || {};
    Roles.setRole(uid, role, { name:req.name || (role === 'owner' ? 'جهاز المستر' : 'مدرس'), device:req.device || 'جهاز', via:'request' });
    await this.put(uid, { status:'approved', role:role, at:new Date().toISOString() });
    try{ commit({ silent:true }); }catch(e){}
  },
  async reject(uid){
    await this.put(uid, { status:'rejected', at:new Date().toISOString() });
    try{ commit({ silent:true }); }catch(e){}
  },
  /* إشعار للمالك لما يوصل طلب جديد */
  notice(){
    if (!Roles.isOwner()) return;
    const ps = this.pending(); if (!ps.length) return;
    let seen = [];
    try{ seen = JSON.parse(localStorage.getItem('mostar_seen_req') || '[]'); }catch(e){ seen = []; }
    const fresh = ps.filter(u => seen.indexOf(u) < 0);
    if (fresh.length){
      try{ localStorage.setItem('mostar_seen_req', JSON.stringify(seen.concat(fresh))); }catch(e){}
      const r = this.of(fresh[0]) || {};
      toast('طلب انضمام جديد من «' + (r.name || 'جهاز جديد') + '» (' + (r.device || '') + ') — افتح الصلاحيات ووافق أو ارفض',
        'info', 'طلب انضمام', false);
    }
  },
  /* كتابة الطلب من الجهاز الجديد */
  async send(name){
    const uid = Roles.uid();
    const obj = { name:(name || '').trim() || 'جهاز جديد', device:Roles.device(), at:new Date().toISOString(), status:'pending', v:1 };
    await this.put(uid, obj);
    Roles.lsSet(Roles.UIDK, uid); Roles.lsSet(Roles.KEY, 'pending');
    try{ commit({ silent:true }); }catch(e){}
    return obj;
  },
  async cancel(){
    const uid = Roles.uid();
    await this.put(uid, { status:'cancelled', at:new Date().toISOString() });
    Roles.lsSet(Roles.KEY, ''); Roles.lsSet(Roles.UIDK, '');
  },
  /* المالك: نجيب الطلبات من السحابة على طول (مش مستنيين دورة المزامنة) */
  async sync(){
    let d = null;
    try{ d = await Cloud.rtdb('GET', Cloud.rootPath() + '/requests'); }catch(e){ return 0; }
    if (!d || typeof d !== 'object' || Array.isArray(d)) return 0;
    let n = 0;
    Object.keys(d).forEach(k => {
      const cur = this.map()[k];
      if (!cur || JSON.stringify(cur) !== JSON.stringify(d[k])){ this.map()[k] = d[k]; n++; }
    });
    if (n){ try{ saveLocal(); }catch(e){} }
    return n;
  },
  async state(){                                   // الجهاز الجديد بيسأل: وافقوا عليّ ولا لأ؟
    const uid = Roles.uid();
    let mem = null, req = null;
    try{ mem = await Cloud.rtdb('GET', Cloud.rootPath() + '/members/' + uid); }catch(e){}
    try{ req = await Cloud.rtdb('GET', Cloud.rootPath() + '/requests/' + uid); }catch(e){}
    if (mem && mem.role){                       // اتقبل ✅
      Roles.setRole(uid, mem.role, { name:mem.name, email:mem.email, device:mem.device });
      return 'approved';
    }
    if (req && req.status) return req.status;    // pending / rejected / cancelled
    return 'none';
  }
};

/* رابط دخول ولي الأمر بكود المتابعة (بيستخدم رابط المنصة الرسمي) */
function parentEntryUrl(code){
  let c = '', k = '';
  try{ c = Cloud.cfgNow().code || ''; }catch(e){}
  try{ k = Cloud.authKeyOf() || ''; }catch(e){ k = ''; }
  return platformBase() + '?p=' + encodeURIComponent(code) + (c ? '&c=' + encodeURIComponent(c) : '') + (k ? '&k=' + encodeURIComponent(k) : '');
}

/* ============================================================
   صفحة تسجيل الدخول (الأجهزة اللي لسه مسجّلتش)
   • الجهاز يكتب اسمه ← يبعت طلب انضمام ← المالك يقبل أو يرفض
   • أو يكمل بدعوة مدرس (كود) لو معاه واحد
   • بعد الموافقة: بيدخل المنصة على طول وحسب الدور اللي المالك حدّده
   ============================================================ */
const LMode = {
  node:null, shown:'', timer:null, busy:false, state:'none',
  show(role){
    const st = (role === 'pending') ? 'pending' : 'none';
    if (!this.node){
      this.node = document.createElement('div'); this.node.id = 'lview';
      document.body.appendChild(this.node);
      this.render(st);
    } else if (this.shown !== st){
      this.render(st);
    }
    document.body.classList.add('lmode');
    if (st === 'pending') this.watch(); else this.watch(9000);
  },
  hide(){
    this.stopWatch();
    if (this.node){ this.node.remove(); this.node = null; this.shown = ''; }
    document.body.classList.remove('lmode');
  },
  head(){
    const st = S.data.settings || {};
    return `<img class="jv-logo" src="logo.jpg" alt="" onerror="this.style.display='none'">
      <div class="jv-t">${esc(st.platformName || 'منصة المستر')}</div>
      <div class="jv-s">${esc(st.teacherName || 'أ. أحمد فتحي')} · تسجيل دخول الجهاز</div>`;
  },
  render(state){
    if (!this.node) return;
    this.state = state; this.shown = state === 'pending' ? 'pending' : 'none';
    if (state === 'pending'){ this.renderPending(); this.watch(6000); return; }
    if (state === 'rejected') return this.renderRejected();
    this.node.innerHTML = this.head() + `
      <div class="jv-card">
        <div class="jv-badge">${icon('alert')} <span>الجهاز ده <b>لسه مش مسجّل</b> على المنصة — محتاج موافقة المستر.</span></div>
        <div class="field"><label>اسم الجهاز / اسمك</label>
          <input class="inp" id="lName" placeholder="مثال: موبايل المستر · تابلت الحصة"></div>
        <div class="btn-row" style="margin-top:12px">
          <button class="btn pri" id="lSend">${icon('check')} ابعت طلب انضمام للمستر</button>
        </div>
        <div class="jv-foot">هيوصل للمستر إشعار على المنصة، وهو يقبل (ويحدد دورك: مالك أو مدرس) أو يرفض.</div>
        <div class="sep"></div>
        <div class="field"><label>${icon('eye')} عندك كود متابعة؟ (ولي أمر)</label>
          <div class="small muted" style="margin-bottom:6px;line-height:1.9">لو المستر باعتلك كود لمتابعة ابنك، اكتبه هنا وهتفتحلك صفحة ابنك على طول.</div>
          <div class="flex wrap" style="gap:8px">
            <input class="inp" id="lPCode" placeholder="كود المتابعة" style="flex:1;min-width:150px;direction:ltr;text-align:left">
            <button class="btn pri" id="lPGo">${icon('link')} اعرض متابعة ابني</button>
          </div></div>
        <div class="sep"></div>
        <div class="field"><label>معاك كود دعوة من المستر؟ (مدرس)</label>
          <div class="flex wrap" style="gap:8px">
            <input class="inp" id="lCode" placeholder="كود الدعوة" style="flex:1;min-width:150px;direction:ltr;text-align:left">
            <button class="btn" id="lGo">${icon('link')} ادخل بالكود</button>
          </div></div>
      </div>`;
    const n = $('#lName', this.node); if (n) n.focus();
    const send = $('#lSend', this.node);
    if (send) send.onclick = () => this.send();
    const go = $('#lGo', this.node);
    if (go) go.onclick = () => this.byCode();
    const pg = $('#lPGo', this.node);
    if (pg) pg.onclick = () => this.asParent();
    const pi = $('#lPCode', this.node);
    if (pi) pi.addEventListener('keydown', e => { if (e.key === 'Enter') this.asParent(); });
  },
  /* الدخول بكود متابعة ولي الأمر */
  async asParent(){
    const inp = $('#lPCode', this.node), btn = $('#lPGo', this.node);
    const code = (inp ? inp.value : '').trim().toLowerCase().replace(/[^0-9a-f]/g, '');
    if (code.length < 8){ toast('اكتب كود المتابعة كامل', 'warn', 'متابعة ولي الأمر'); return; }
    if (btn){ btn.disabled = true; btn.textContent = 'بنتأكد من الكود...'; }
    let found = null;
    try{ found = await Cloud.rtdb('GET', Cloud.rootPath() + '/parents/' + code, null, false, '?t=' + Date.now()); }catch(e){}
    if (!found || typeof found !== 'object'){
      if (btn){ btn.disabled = false; btn.innerHTML = 'اعرض متابعة ابني'; }
      const strip = document.createElement('div');
      strip.className = 'role-strip';
      strip.style.cssText = 'background:var(--bad-bg);color:var(--bad);margin-top:10px;line-height:1.9';
      strip.textContent = 'الكود ده مش موجود — اتأكد منه أو اطلب من المستر يبعتهولك تاني.';
      if (btn && btn.parentNode) btn.parentNode.parentNode.appendChild(strip);
      return;
    }
    try{ PMode.remember(code); }catch(e){}
    location.href = parentEntryUrl(code);
  },
  async send(){
    if (this.busy) return; this.busy = true;
    const n = $('#lName', this.node), btn = $('#lSend', this.node);
    const name = n ? n.value.trim() : '';
    if (btn){ btn.disabled = true; btn.textContent = 'بنبعت الطلب...'; }
    try{
      await Requests.send(name);
      this.render('pending');
    }catch(e){
      this.busy = false;
      if (btn){ btn.disabled = false; btn.innerHTML = 'ابعت طلب انضمام للمستر'; }
      this.node.innerHTML = this.head() + `<div class="jv-card">
        <div class="role-strip" style="background:var(--bad-bg);color:var(--bad)">مقدرناش نبعت الطلب — اتأكد إن النت شغال وجرّب تاني.</div>
        <div class="btn-row" style="margin-top:11px"><button class="btn pri" id="lRetry">${icon('refresh')} جرّب تاني</button></div></div>`;
      const r = $('#lRetry', this.node); if (r) r.onclick = () => this.render('none');
      return;
    }
    this.busy = false;
  },
  renderPending(){
    this.node.innerHTML = this.head() + `
      <div class="jv-card" style="text-align:center">
        <div class="pm-spin" style="margin:6px auto 12px"></div>
        <div style="font-weight:800;font-size:16px">طلبك وصل للمستر ✅</div>
        <div class="small muted" style="margin-top:7px;line-height:1.95">
          المستر هيراجع الطلب ويقبله أو يرفضه.<br>الصفحة دي هتفتحلك لوحدها أول ما يوافق — من غير ما تعمل أي حاجة.
        </div>
        <div class="field" style="margin-top:14px;text-align:right"><label>كود الجهاز (لو المستر طلبه)</label>
          <div class="flex wrap" style="gap:8px">
            <code class="code" id="lDev" style="direction:ltr;padding:8px 11px;background:var(--bg);border-radius:9px;font-size:12px;flex:1;overflow:auto">${esc(Roles.code())}</code>
            <button class="btn sm" data-act="guestCodeCopy">${icon('copy')} انسخ</button>
          </div></div>
        <div class="btn-row" style="margin-top:12px">
          <button class="btn" id="lCheck">${icon('refresh')} اتأكد من الحالة</button>
          <button class="btn ghost" id="lCancel">${icon('trash')} إلغاء الطلب</button>
        </div>
      </div>`;
    const c = $('#lCheck', this.node); if (c) c.onclick = () => this.check(true);
    const x = $('#lCancel', this.node);
    if (x) x.onclick = async () => { x.disabled = true; try{ await Requests.cancel(); }catch(e){} this.render('none'); Roles.apply(); };
  },
  renderRejected(){
    this.node.innerHTML = this.head() + `
      <div class="jv-card">
        <div class="role-strip" style="background:var(--bad-bg);color:var(--bad);line-height:1.95">
          <b>طلبك اترفض</b><br>المستر رفض طلب الانضمام للجهاز ده. لو في غلط، كلّمه وابعت طلب تاني.
        </div>
        <div class="btn-row" style="margin-top:12px">
          <button class="btn pri" id="lAgain">${icon('refresh')} ابعت طلب تاني</button>
        </div>
      </div>`;
    const a = $('#lAgain', this.node); if (a) a.onclick = () => this.render('none');
  },
  byCode(){
    const c = ($('#lCode', this.node) || {}).value || '';
    const t = c.trim();
    if (!t){ toast('اكتب كود الدعوة', 'warn'); return; }
    let code = FB_DEFAULT.code || FB_DEFAULT.projectId, k = '';
    try{ code = Cloud.cfgNow().code || code; }catch(e){}
    try{ k = Cloud.authKeyOf() || ''; }catch(e){ k = ''; }
    let base = String(location.href || '').split('#')[0].split('?')[0];
    location.href = base + '?j=' + encodeURIComponent(t) + '&c=' + encodeURIComponent(code) + (k ? '&k=' + encodeURIComponent(k) : '');
  },
  watch(ms){
    this.stopWatch();
    const every = (this.state === 'pending') ? 6000 : (ms || 12000);
    this.timer = setInterval(() => this.check(false), every);
    setTimeout(() => this.check(false), 800);
  },
  stopWatch(){ if (this.timer){ clearInterval(this.timer); this.timer = null; } },
  async check(manual){
    if (this.busy) return;
    this.busy = true;
    let st = 'none';
    try{ st = await Requests.state(); }catch(e){ st = this.state === 'pending' ? 'pending' : 'none'; }
    this.busy = false;
    if (st === 'approved'){
      toast('تمت الموافقة ✅ — أهلاً بيك', 'ok', 'الأدوار');
      try{ Roles.apply(); }catch(e){}
      setTimeout(() => { try{ const u = String(location.href).split('?')[0]; if (location.search) location.replace(u); else location.reload(); }catch(e){} }, 900);
      return;
    }
    if (st === 'rejected'){ if (this.shown !== 'rejected'){ this.shown = 'rejected'; this.render('rejected'); } return; }
    if (st === 'pending'){ if (this.shown !== 'pending') this.render('pending'); return; }
    if (st === 'cancelled'){ if (this.shown !== 'none') this.render('none'); return; }
    if (manual) toast('لسه المستر ماردش — جرّب بعد شوية', 'info');
  }
};

const JMode = {
  token:'', code:'', key:'', inv:null, busy:false,
  qp(n){ try{ return (new URLSearchParams(String(location.search || ''))).get(n) || ''; }catch(e){ return ''; } },
  fromUrl(){ return this.qp('j') || ''; },
  async start(){
    const t = this.fromUrl(); if (!t) return false;
    this.token = t; this.code = this.qp('c') || FB_DEFAULT.code || FB_DEFAULT.projectId; this.key = this.qp('k') || '';
    try{
      let th = ''; try{ th = localStorage.getItem(LS_KEY + '_theme') || ''; }catch(e){}
      if (!th) th = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.dataset.theme = th;
    }catch(e){}
    document.body.classList.add('jmode');
    this.node = document.createElement('div'); this.node.id = 'jview';
    document.body.appendChild(this.node);
    this.form('بنجهّز الدعوة...');
    try{
      Cloud._active = Object.assign({}, FB_DEFAULT, { projectId:this.code, code:this.code, authDomain:this.code + '.firebaseapp.com', apiKey:this.key || '' });
      if (this.key){ try{ Cloud.saveKeyFor(this.code, this.key); }catch(e){} }
    }catch(e){}
    try{ await Cloud.ensureTok(); }catch(e){}
    let inv = null;
    try{ inv = await Cloud.rtdb('GET', Cloud.rootPath() + '/invites/' + this.token, null, false, '?t=' + Date.now()); }catch(e){}
    if (!inv || typeof inv !== 'object'){ this.dead(); return true; }
    this.inv = inv; this.form(); return true;
  },
  head(){
    return `<img class="jv-logo" src="logo.jpg" alt="" onerror="this.style.display='none'">
      <div class="jv-t">${esc((S.data.settings && S.data.settings.platformName) || 'منصة المستر')}</div>
      <div class="jv-s">${esc((S.data.settings && S.data.settings.teacherName) || 'أ. أحمد فتحي')} · دخول المدرسين</div>`;
  },
  form(over){
    const inv = this.inv || {};
    this.node.innerHTML = this.head() + `
      <div class="jv-card">
        <div class="jv-badge">${icon('users')} <span>إنت مدعو كـ<b>مدرس</b> — صلاحياتك: حضور · درجات · ملاحظات · طلاب، <b>ومن غير أي حذف</b>.</span></div>
        ${over ? `<div class="role-strip" style="margin-bottom:11px">${esc(over)}</div>` : ''}
        <div class="field"><label>الاسم</label><input class="inp" id="jvName" value="${esc(inv.name || '')}" placeholder="اسمك"></div>
        <div class="field"><label>الإيميل</label><input class="inp" id="jvMail" type="email" value="${esc(inv.email || '')}" placeholder="name@example.com" style="direction:ltr;text-align:left"></div>
        <div class="field"><label>باسورد (٦ حروف على الأقل)</label><input class="inp" id="jvPass" type="password" placeholder="••••••" style="direction:ltr;text-align:left"></div>
        <div class="btn-row" style="margin-top:12px">
          <button class="btn pri" id="jvGo">${icon('check')} إنشاء الحساب والدخول</button>
          <button class="btn" id="jvIn">${icon('user')} عندي حساب بالفعل</button>
        </div>
        <div class="jv-foot">الجهاز ده هيفضل فاكر دخولك — من غير ما تكتب حاجة تاني في كل مرة.</div>
      </div>`;
    const name = $('#jvName', this.node), mail = $('#jvMail', this.node), pass = $('#jvPass', this.node);
    if (name) name.focus();
    const go = $('#jvGo', this.node), inn = $('#jvIn', this.node);
    if (go) go.onclick = () => this.submit('signUp', name.value.trim(), mail.value.trim(), pass.value);
    if (inn) inn.onclick = () => this.submit('signIn', name.value.trim(), mail.value.trim(), pass.value);
  },
  async auth(mode, email, pass){
    const url = 'https://identitytoolkit.googleapis.com/v1/accounts:' + (mode === 'signUp' ? 'signUp' : 'signInWithPassword') + '?key=' + encodeURIComponent(this.key);
    const r = await fetch(url, { method:'POST', cache:'no-store', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify(mode === 'signUp' ? { email:email, password:pass, returnSecureToken:true } : { email:email, password:pass, returnSecureToken:true }) });
    let j = null; try{ j = await r.json(); }catch(e){ j = null; }
    if (j && j.idToken) return j;
    const code = (j && j.error && j.error.message) || 'FAIL';
    throw Object.assign(new Error(code), { code:code });
  },
  async submit(mode, name, email, pass){
    if (this.busy) return;
    if (!email || email.indexOf('@') < 0){ this.form('اكتب إيميل صح'); return; }
    if (!pass || pass.length < 6){ this.form('الباسورد لازم ٦ حروف على الأقل'); return; }
    if (mode === 'signUp' && !name){ this.form('اكتب اسمك'); return; }
    if (!this.key){ this.form('الرابط ناقص المفتاح — اطلب من المستر يبعتلك الرابط تاني'); return; }
    this.busy = true;
    const go = $('#jvGo', this.node); if (go){ go.disabled = true; go.textContent = 'لحظة...'; }
    let j = null;
    try{ j = await this.auth(mode, email, pass); }
    catch(e){
      this.busy = false;
      const c = String(e.code || '');
      if (mode === 'signUp' && /EMAIL_EXISTS/i.test(c)) { this.form('الإيميل ده مستخدم بالفعل — دوس «عندي حساب بالفعل»'); return; }
      if (mode === 'signIn' && /EMAIL_NOT_FOUND|INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD/i.test(c)){ this.form('الإيميل أو الباسورد غلط — جرّب تاني'); return; }
      if (/OPERATION_NOT_ALLOWED|CONFIGURATION_NOT_FOUND/i.test(c)){ this.form('الدخول بالإيميل لسه مش مفعّل في فايربيز — المستر يفعّله من Authentication ← Sign-in method ← Email/Password (مجاني)'); return; }
      if (/INVALID_API_KEY|API key not valid/i.test(c)){ this.form('مفتاح المشروع غلط — اطلب من المستر يبعتلك الرابط تاني'); return; }
      this.form('مش قادر أدخّلك دلوقتي (' + (c || 'خطأ') + ') — جرّب تاني');
      return;
    }
    const uid = j.localId, email2 = j.email || email;
    try{ Cloud.saveTokFor(this.code, { id:j.idToken, refresh:j.refreshToken, exp: Date.now() + Number(j.expiresIn || 3600) * 1000 }); }catch(e){}
    // نعلّم الدعوة إنها اتستخدمت الأول — القواعد بتشترط ده قبل اعتماد المدرس
    let usedOk = false;
    try{
      await Cloud.rtdb('PUT', Cloud.rootPath() + '/invites/' + this.token + '/used', { at:new Date().toISOString(), uid:uid });
      usedOk = true;
    }catch(e){ usedOk = false; }
    // نسجّل العضو (الدعوة نفسها هي الإذن — والقواعد بتتحقق منها على السيرفر)
    try{ Roles.lsSet(Roles.UIDK, uid); Roles.lsSet(Roles.KEY, 'teacher'); }catch(e){}
    try{ Roles.setRole(uid, 'teacher', { name:name || (this.inv && this.inv.name) || 'مدرس', email:email2, device:Roles.device(), via:this.token }); }catch(e){}
    if (!usedOk) toast('الرابط اتسجّل على الجهاز، بس مش قادر أوصّل السحابة دلوقتي — لو ما فتحش على طول، اضغط «تحديث»', 'warn', 'الدعوة');
    try{ saveLocal(); }catch(e){}
    // نعيد التحميل من غير رابط الدعوة → المنصة تفتح بوضع المدرس
    let base = String(location.href || '').split('#')[0].split('?')[0];
    this.node.innerHTML = this.head() + `<div class="jv-card"><div class="jv-badge">${icon('check')} <span>تمام! خلصنا — بنجهّز المنصة ليك...</span></div></div>`;
    setTimeout(() => { try{ location.replace(base); }catch(e){ location.href = base; } }, 700);
  },
  dead(){
    this.node.innerHTML = this.head() + `<div class="jv-card">
      <div class="role-strip" style="background:var(--bad-bg);color:var(--bad)">الرابط ده مش شغال — يمكن المستر شاله أو الرابط قديم. اطلب منه دعوة جديدة من «الصلاحيات والأعضاء».</div>
    </div>`;
  }
};

      $('#saveStu', body).onclick = () => {
        const name = $('#fName', body).value.trim();
        if (!name){ toast('اكتب اسم الطالب', 'warn'); return; }
        if (!stageEl.value){ toast('اختر المرحلة الدراسية', 'warn'); stageEl.focus(); return; }
        if (!$('#fSys', body).value){ toast('اختر نظام الدراسة', 'warn'); $('#fSys', body).focus(); return; }
        const data = {
          name: name, code: $('#fCode', body).value.trim(), stage: stageEl.value, studySystem: $('#fSys', body).value,
          type: $('#fType', body).value, level: $('#fLevel', body).value, groupId: $('#fGroup', body).value,
          payMode: $('#fPay', body).value, phone: $('#fPhone', body).value.trim(), parentPhone: $('#fPPhone', body).value.trim(),
          guardian: $('#fGuardian', body).value.trim(), joinDate: $('#fJoin', body).value || today(),
          status: $('#fStatus', body).value, notes: $('#fNotes', body).value.trim()
        };
        if (id){ Object.assign(student(id), data); toast('تم تحديث بيانات ' + name, 'ok'); }
        else { S.data.students.push(Object.assign({ id: uid('s') }, data)); toast('تمت إضافة ' + name, 'ok'); }
        Modal.closeAll(); commit();
      };
    }
  });
}

function assignStudent(sid){

  Modal.open({
    title: 'تحديد حصة', sub: s.name + (s.stage ? ' — ' + s.stage : ''), size: 'sm',
    body: `<div class="pick-list" style="max-height:320px">
      <label class="pick"><input type="radio" name="ag" value="" ${!s.groupId ? 'checked' : ''}><span class="pt"><b>بدون حصة</b><span>اتركه بدون توزيع حاليًا</span></span></label>
      ${gs.map(g => `<label class="pick"><input type="radio" name="ag" value="${g.id}" ${s.groupId === g.id ? 'checked' : ''}>
        <span class="pt"><b>${esc(g.name)}</b><span>${AR_DAYS[g.day]} · ${timeRange(g)} · ${esc(g.stage || '')} · ${studentsOfGroup(g.id).length} طالب${g.stage && s.stage && g.stage !== s.stage ? ' · ⚠️ مرحلة مختلفة' : ''}</span></span>
        ${payBadge(g.payMode)}</label>`).join('')}
    </div>`,
    footer: `<button class="btn" data-close="__ID__">إلغاء</button><button class="btn pri" id="asSave">${icon('save')} حفظ</button>`,
    onMount(body){
      $('#asSave', body).onclick = () => {
        const r = $$('input[name=ag]', body).find(x => x.checked);
        const gid = r ? r.value : '';
        const g = groupOf(gid);
        s.groupId = gid;
        if (g) s.payMode = s.payMode || g.payMode;
        if (g && !s.stage) s.stage = g.stage;
        Modal.closeAll(); commit(); toast('تم تحديد الحصة: ' + (g ? g.name : 'بدون حصة'), 'ok');
      };
    }
  });
}

/* ---------------- ملف الطالب ---------------- */
function openProfile(id){
  const s = student(id); if (!s) return;
  const a = attStats(s.id), g = groupOf(s.groupId);
  const avg = examAvg(s.id);
  const mk = monthKey(today());
  const y = Number(mk.slice(0,4)), m = Number(mk.slice(5,7));

  for (let d = 1; d <= lastD; d++){
    const ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec = getAtt(ds, s.groupId); const v = rec && rec.records[s.id];
    cal += `<div class="cd ${v || ''}" title="${fmtDate(ds)}">${d}</div>`;
  }
  Modal.open({
    title: s.name, sub: `${s.code || ''} · ${s.stage || 'بدون مرحلة'}${s.studySystem ? ' · ' + s.studySystem : ''} · ${g ? g.name : 'بدون حصة'}`,

    body: `
      <div class="grid g-4" style="margin-bottom:14px">
        ${statCard({ label:'نسبة الحضور', icon:'check-square', value: a.rate + '%', tone: a.rate >= 80 ? 'ok' : a.rate >= 60 ? '' : 'bad',
          foot:`<span class="muted">${a.present + a.late} حضور من ${a.total}</span>` })}
        ${statCard({ label:'الغياب', icon:'alert', value: ar(a.absent), tone: a.absent ? 'bad' : 'ok',
          foot:`<span class="muted">${a.late} تأخير · ${a.excused} بعذر</span>` })}
        ${statCard({ label:'متوسط الدرجات', icon:'award', value: avg == null ? '—' : avg + '%', tone: avg == null ? '' : avg >= 65 ? 'ok' : 'bad',
          foot:`<span class="muted">${examCount(s.id)} امتحان</span>` })}
        ${statCard({ label:'حضور آخر 30 يوم', icon:'calendar', value: ar(attStats(s.id, addDays(today(),-30), today()).present), tone:'info',
          foot:`<span class="muted">${attStats(s.id, addDays(today(),-30), today()).absent} غياب</span>` })}
      </div>

function pdfStudent(id){
  const s = student(id); if (!s) return;
  const a = attStats(s.id), g = groupOf(s.groupId);
  const attRows = sortBy(S.data.exams.length ? [] : [], () => 0);
  const recs = [];
  Object.keys(S.data.attendance).forEach(k => {
    const rec = S.data.attendance[k], parts = k.split('@');
    if (rec.records && rec.records[s.id]) recs.push([parts[0], groupName(parts[1] === 'none' ? '' : parts[1]), { present:'حاضر', absent:'غائب', late:'متأخر', excused:'بعذر' }[rec.records[s.id]]]);
  });
  const last = sortBy(recs, r => r[0], 'desc').slice(0, 30);
  const gradeRows = S.data.exams.map(e => {
    const v = (S.data.grades[e.id] || {})[s.id];
    return [e.name, e.stage || '—', fmtDate(e.date), e.max, typeof v === 'number' ? v : '—', typeof v === 'number' ? Math.round(v / e.max * 100) + '%' : '—'];
  });
  const inner = reportHeader('تقرير متابعة طالب', 'ملف الطالب: ' + esc(s.name)) +
    summaryHTML([['نسبة الحضور', a.rate + '%'], ['مرات الحضور', a.present + a.late], ['الغياب', a.absent], ['التأخير', a.late],
      ['بعذر', a.excused], ['متوسط الدرجات', examAvg(s.id) == null ? '—' : examAvg(s.id) + '%']]) +
    tableHTML(['البند','البيانات'], [
      ['الاسم', s.name], ['الكود', s.code || '—'], ['المرحلة', s.stage || '—'], ['نظام الدراسة', s.studySystem || '—'],
      ['نوع الطالب', s.type || '—'], ['المستوى', s.level || '—'],
      ['الحصة', g ? g.name + ' — ' + AR_DAYS[g.day] + ' ' + timeRange(g) : 'بدون حصة'],
      ['نظام الدفع', payLabel(s.payMode)], ['هاتف الطالب', s.phone || '—'], ['ولي الأمر', (s.guardian || '—') + (s.parentPhone ? ' — ' + s.parentPhone : '')],
      ['تاريخ الانضمام', fmtDate(s.joinDate)], ['حالة الطالب', studentStatus(s).label], ['ملاحظات', s.notes || '—']
    ], { center:[1] }) +
    `<h4 style="margin:16px 0 8px;font-size:13px">سجل الحضور (آخر 30 تسجيل)</h4>` +
    (last.length ? tableHTML(['التاريخ','الحصة','الحالة'], last, { center:[2] }) : '<p style="font-size:12px;color:#666">لا يوجد سجل حضور</p>') +
    `<h4 style="margin:16px 0 8px;font-size:13px">نتائج الامتحانات</h4>` +
    (gradeRows.length ? tableHTML(['الامتحان','المرحلة','التاريخ','من','الدرجة','النسبة'], gradeRows, { center:[3,4,5] }) : '<p style="font-size:12px;color:#666">لا توجد امتحانات</p>');
  openPDF(inner);
}

function pdfGroups(){

function pdfExam(id){
  const e = examOf(id); if (!e) return;
  const gr = S.data.grades[e.id] || {};
  let sts = (e.groupId ? studentsOfGroup(e.groupId) : (e.stage ? studentsOfStage(e.stage) : S.data.students)).filter(s => typeof gr[s.id] === 'number');
  sts = sortBy(sts, s => gr[s.id], 'desc');
  const vals = sts.map(s => gr[s.id]);
  const avg = vals.length ? (sum(vals) / vals.length).toFixed(1) : '—';
  const pass = vals.filter(v => v >= e.max * 0.5).length;
  let rank = 0, prev = null;
  const inner = reportHeader('نتائج امتحان', `${esc(e.name)} — ${esc(e.stage || '')}${e.groupId ? ' — ' + esc(groupName(e.groupId)) : ''}`) +
    summaryHTML([['التاريخ', fmtDate(e.date)], ['الدرجة النهائية', e.max], ['عدد الطلاب', sts.length], ['المتوسط', avg],
      ['أعلى درجة', vals.length ? Math.max.apply(null, vals) : '—'], ['نسبة النجاح', vals.length ? Math.round(pass / vals.length * 100) + '%' : '—']]) +
    tableHTML(['ترتيب','الطالب','المرحلة','الحصة','الدرجة','النسبة','التقدير'],
      sts.map((s, i) => { if (prev === null) rank = 0; else if (gr[s.id] !== prev) rank = i; prev = gr[s.id];
        const pc = Math.round(gr[s.id] / e.max * 100);
        const gr2 = pc >= 90 ? 'ممتاز' : pc >= 80 ? 'جيد جدًا' : pc >= 65 ? 'جيد' : pc >= 50 ? 'مقبول' : 'ضعيف';
        return [rank + 1, s.name, s.stage || '—', groupName(s.groupId), gr[s.id], pc + '%', gr2]; }), { center:[0,4,5,6] });
  openPDF(inner);
}
function attPDF(){
  const a = S.ui.att, gid = a.groupId, g = groupOf(gid);
  if (!g){ toast('اختر حصة أولًا', 'warn'); return; }
  const y = Number(a.date.slice(0,4)), m = Number(a.date.slice(5,7)), lastD = new Date(y, m, 0).getDate();
  const days = []; for (let d = 1; d <= lastD; d++) days.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  const ss = studentsOfGroup(gid);
  const rows = ss.map(s => {
    let p = 0, ab = 0, l = 0, ex = 0;
    const cells = days.map(d => { const r = getAtt(d, gid); const v = r && r.records[s.id];
      if (v === 'present'){ p++; return '✓'; } if (v === 'absent'){ ab++; return '✕'; } if (v === 'late'){ l++; return 'م'; } if (v === 'excused'){ ex++; return 'ع'; } return ''; });
    const counted = p + ab + l;
    return [s.name].concat(cells).concat([p + l, ab, (counted ? Math.round((p + l) / counted * 100) : 0) + '%']);
  });
  const inner = reportHeader('كشف حضور شهري',
      `${esc(g.name)} — ${AR_DAYS[g.day]} ${timeRange(g)} — ${esc(g.stage || '')} — شهر ${monthName(a.date.slice(0,7))}`) +
    summaryHTML([['عدد الطلاب', ss.length], ['أيام الشهر', days.length],
      ['الحصص المسجلة', days.filter(d => getAtt(d, gid)).length],
      ['مفتاح الكشف', '✓ حاضر · م متأخر · ✕ غائب · ع بعذر']]) +
    tableHTML(['الطالب'].concat(days.map(d => String(Number(d.slice(-2))))).concat(['حضور','غياب','النسبة']), rows,
      { center: days.map((_, i) => i + 1).concat([days.length + 1, days.length + 2, days.length + 3, 0]) });
  openPDF(inner);
}
function pdfReport(){
  const r = S.ui.rep, ss = repRows();
  if (r.kind === 'student'){ const s = student(r.studentId) || S.data.students[0]; if (s) pdfStudent(s.id); else toast('لا يوجد طلاب', 'warn'); return; }
  if (r.kind === 'exams'){ const e = examOf(r.examId) || S.data.exams[0]; if (e) pdfExam(e.id); else toast('لا توجد امتحانات', 'warn'); return; }
  if (r.kind === 'attendance'){
    const rows = ss.map(s => { const a = attStats(s.id, r.from, r.to);
      return [s.name, s.stage || '—', groupName(s.groupId), a.present, a.late, a.absent, a.excused, a.total, a.rate + '%']; });
    const tot = { p:0, l:0, ab:0, ex:0, t:0 };
    ss.forEach(s => { const a = attStats(s.id, r.from, r.to); tot.p += a.present; tot.l += a.late; tot.ab += a.absent; tot.ex += a.excused; tot.t += a.total; });
    const inner = reportHeader('كشف الحضور والغياب', `من ${fmtDate(r.from)} إلى ${fmtDate(r.to)}${r.stage ? ' — ' + esc(r.stage) : ''}`) +
      summaryHTML([['عدد الطلاب', ss.length], ['إجمالي الحضور', tot.p + tot.l], ['إجمالي الغياب', tot.ab],
        ['نسبة الحضور', (tot.t ? Math.round((tot.p + tot.l) / tot.t * 100) : 0) + '%']]) +
      tableHTML(['الطالب','المرحلة','الحصة','حاضر','متأخر','غائب','بعذر','الإجمالي','النسبة'], rows, { center:[3,4,5,6,7,8] });
    openPDF(inner); return;
  }
  if (r.kind === 'students'){ pdfStudents(); return; }
  const attR = ss.map(s => attStats(s.id, r.from, r.to)).reduce((t, a) => ({ t: t.t + a.total, ok: t.ok + a.present + a.late, ab: t.ab + a.absent }), { t:0, ok:0, ab:0 });
  const avgs = ss.map(s => examAvg(s.id)).filter(v => v != null);
  const inner = reportHeader('تقرير عام', `من ${fmtDate(r.from)} إلى ${fmtDate(r.to)}${r.stage ? ' — ' + esc(r.stage) : ''}`) +
    summaryHTML([['الطلاب', ss.length], ['نسبة الحضور', (attR.t ? Math.round(attR.ok / attR.t * 100) : 0) + '%'],
      ['الحصص الأسبوعية', S.data.groups.length], ['متوسط الدرجات', avgs.length ? Math.round(sum(avgs) / avgs.length) + '%' : '—']]) +
    tableHTML(['الطالب','المرحلة','الحصة','الحضور','الغياب','النسبة','متوسط الدرجات'],
      ss.map(s => { const a = attStats(s.id, r.from, r.to); const v = examAvg(s.id);
        return [s.name, s.stage || '—', groupName(s.groupId), a.present + a.late, a.absent, a.rate + '%', v == null ? '—' : v + '%']; }),
      { center:[3,4,5,6] });
  openPDF(inner);
}

  const data = defaultData();
  const groups = [
    { name:'حصة السبت — الثالث الثانوي', stage:'الثالث الثانوي', day:6, from:'16:00', to:'18:00', payMode:'monthly', level:'متقدم', note:'مراجعة شاملة' },
    { name:'حصة الأحد — الثاني الثانوي', stage:'الثاني الثانوي', day:0, from:'17:00', to:'19:00', payMode:'monthly', level:'جيد', note:'' },
    { name:'حصة الاثنين — الأول الثانوي', stage:'الأول الثانوي', day:1, from:'15:00', to:'16:30', payMode:'session', level:'متوسط', note:'مجموعة صغيرة' },
    { name:'حصة الثلاثاء — الثالث الإعدادي', stage:'الثالث الإعدادي', day:2, from:'18:00', to:'19:30', payMode:'session', level:'ممتاز', note:'' },
    { name:'حصة الخميس — الثاني الثانوي', stage:'الثاني الثانوي', day:4, from:'16:00', to:'18:00', payMode:'monthly', level:'جيد جدًا', note:'' }
  ];
  const gids = groups.map(g => { const id = uid('g'); data.groups.push(Object.assign({ id: id }, g)); return id; });
  const names = ['محمد أحمد فتحي','يوسف خالد','عمر مصطفى','آدم طارق','زياد حسام','مالك إبراهيم','علي محمود','حسن سامي','كريم وليد','سيف الدين',
    'ملك أشرف','جنى عمرو','مريم شريف','حبيبة رامي','سلمى نادر','نور الهدى','رقية أيمن','فريدة مازن','هنا خالد','ريم عصام',
    'أحمد ياسر','مروان عادل','لؤي هشام','تميم فؤاد','إياد سامح','طه عمرو'];
  const types = ['جديد','مستمر','متميز'];
  names.forEach((n, i) => {
    const gi = i % gids.length, g = groups[gi];
    const noGroup = i % 13 === 12;
    data.students.push({
      id: uid('s'), code: 'S' + String(i + 1).padStart(3, '0'), name: n,
      stage: noGroup ? data.settings.stages[i % 12] : g.stage,
      studySystem: isBacStage(g.stage) ? ['عام','بكالوريا','أزهر'][i % 3] : (i % 3 === 0 ? 'أزهر' : 'عام'),
      type: types[i % 3], level: data.settings.levels[i % 5],
      groupId: noGroup ? '' : gids[gi], payMode: noGroup ? (i % 2 ? 'monthly' : 'session') : g.payMode,
      phone: '010' + String(10000000 + i * 137911).slice(0, 8),
      parentPhone: '011' + String(20000000 + i * 271911).slice(0, 8),
      guardian: 'والد ' + n.split(' ')[0], joinDate: addMonths(today(), -(1 + i % 4)),
      status: i % 15 === 14 ? 'paused' : 'active', notes: i % 6 === 0 ? 'طالب متميز ويحتاج تدريبات إضافية' : ''
    });
  });
  /* حضور آخر 45 يوم على أيام الحصص */
  for (let d = 45; d >= 0; d--){
    const date = addDays(today(), -d), dow = parseISO(date).getDay();
    data.groups.forEach(g => {
      if (Number(g.day) !== dow) return;
      const ss = data.students.filter(s => s.groupId === g.id);
      if (!ss.length) return;
      const records = {};
      ss.forEach(s => { const r = Math.random(); records[s.id] = r < 0.78 ? 'present' : r < 0.88 ? 'late' : r < 0.96 ? 'absent' : 'excused'; });
      data.attendance[date + '@' + g.id] = { groupId: g.id, note:'', records: records, rev: 1, savedAt: new Date().toISOString() };
    });
  }
  /* امتحانات ودرجات */
  [['امتحان الشهر الأول', -30, 20], ['امتحان نصف المستوى', -15, 30], ['امتحان الشهر الثاني', -3, 20]].forEach((e, i) => {
    const g = data.groups[i % data.groups.length];
    const ex = { id: uid('e'), name: e[0], stage: g.stage, groupId: g.id, date: addDays(today(), e[1]), max: e[2], note:'' };
    data.exams.push(ex); data.grades[ex.id] = {};
    data.students.filter(s => s.groupId === g.id).forEach(s => { data.grades[ex.id][s.id] = Math.round(e[2] * (0.4 + Math.random() * 0.6) * 2) / 2; });
  });
  S.data = migrate(data);
  commit();
  toast('تم تحميل بيانات تجريبية: 26 طالب · 5 حصص · 3 امتحانات', 'ok');
}

/* ---------------- PWA ---------------- */
const PWA = {
  canInstall: false, installed: false, swReady: false, deferred: null, reg: null,
  init(){
    try{
      this.installed = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }catch(e){}
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault(); this.deferred = e; this.canInstall = true; this.paint();
    });
    window.addEventListener('appinstalled', () => {
      this.installed = true; this.canInstall = false; this.deferred = null; this.paint();
      toast('تم تثبيت المنصة على جهازك 🎉', 'ok');
    });
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
      navigator.serviceWorker.register('sw.js').then(reg => {
        this.reg = reg; this.swReady = true; this.paint();
        reg.addEventListener('updatefound', () => {});
      }).catch(err => { console.warn('SW', err); this.paint(); });
    }
    this.paint();
  },
  paint(){
    const b = $('#installBtn');
    if (b) b.classList.toggle('hide', !this.canInstall && !this.installed);
    if (b && this.installed){ b.disabled = true; b.innerHTML = icon('check') + ' المنصة مثبّتة'; }
  },
  async install(){
    if (this.installed){ toast('المنصة مثبّتة بالفعل', 'ok'); return; }
    if (!this.deferred){
      Modal.open({ title:'تثبيت المنصة على الجهاز', size:'sm', body:
        `<div class="help"><b>طريقة التثبيت:</b><br>
         • <b>أندرويد (Chrome):</b> من قائمة الثلاث نقاط ← «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».<br>
         • <b>آيفون (Safari):</b> زر المشاركة ⬆️ ← «إضافة إلى الشاشة الرئيسية».<br>
         • <b>كمبيوتر (Chrome/Edge):</b> أيقونة التثبيت ⊕ في شريط العنوان.<br><br>
         ملاحظة: التثبيت بيشتغل لما المنصة تكون مفتوحة من رابط <b>HTTPS</b> (زي GitHub Pages) أو من localhost.</div>` });
      return;
    }
    this.deferred.prompt();
    const res = await this.deferred.userChoice;
    if (res && res.outcome === 'accepted'){ this.canInstall = false; this.paint(); }
  },
  async update(){
    try{
      if (this.reg){
        await this.reg.update();
        const wk = this.reg.waiting || this.reg.installing;
        if (wk) wk.postMessage({ type:'SKIP_WAITING' });
      }
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
      toast('تم تحديث نسخة الأوفلاين — جارٍ إعادة التحميل', 'ok');
      setTimeout(() => location.reload(), 700);
    }catch(e){ toast('تعذّر التحديث: ' + e.message, 'bad'); }
  }
};

function openGroupInfo(id){
  const g = groupOf(id); if (!g) return;
  const ss = studentsOfGroup(g.id);
  const rate = ss.length ? Math.round(sum(ss, s => attRate(s.id)) / ss.length) : 0;
  Modal.open({
    title: g.name, sub: `${AR_DAYS[g.day]} · ${timeRange(g)}${g.stage ? ' · ' + g.stage : ''}`, size: 'lg',
    body: `<div class="grid g-4" style="margin-bottom:14px">
        ${statCard({ label:'عدد الطلاب', icon:'users', value: ar(ss.length) })}
        ${statCard({ label:'متوسط الحضور', icon:'check-square', value: rate + '%', tone: rate >= 80 ? 'ok' : '' })}
        ${statCard({ label:'المرحلة', icon:'cap', value: `<span style="font-size:15px">${esc(g.stage || '—')}</span>` })}
        ${statCard({ label:'نظام الدفع', icon:'tag', value: `<span style="font-size:15px">${esc(payLabel(g.payMode))}</span>` })}
      </div>
      <div class="btn-row" style="margin-bottom:14px">
        <button class="btn pri sm" data-act="attGroup" data-id="${g.id}">${icon('check-square')} تسجيل حضور</button>
        <button class="btn sm" data-act="manageGroup" data-id="${g.id}">${icon('users')} تعديل الطلاب</button>
        <button class="btn sm" data-act="editGroup" data-id="${g.id}">${icon('edit')} تعديل الحصة</button>
      </div>
      ${ss.length ? `<div class="tbl-wrap" style="max-height:330px"><table class="tbl">
        <thead><tr><th>الطالب</th><th>المرحلة</th><th>الحضور</th><th>الدرجات</th></tr></thead>
        <tbody>${ss.map(s => { const v = examAvg(s.id); return `<tr><td>${stuCell(s)}</td><td>${stageBadge(s.stage)}</td>
          <td>${bar(attRate(s.id), attRate(s.id) >= 80 ? 'ok' : '')}<span class="small muted">${attRate(s.id)}%</span></td>
          <td>${v == null ? '<span class="muted small">—</span>' : v + '%'}</td></tr>`; }).join('')}</tbody></table></div>`
        : '<p class="muted small">لا يوجد طلاب في هذه الحصة</p>'}`,
    footer: `<button class="btn" data-close="__ID__">إغلاق</button>`
  });
}

document.addEventListener('change', function(e){
  const t = e.target;
  if (t.matches('[data-filter]')){ S.ui.stuFilter[t.dataset.filter] = t.value; S.ui.stuLimit = 60; render(); return; }
  if (t.matches('[data-att]')){
    S.ui.att[t.dataset.att === 'date' ? 'date' : 'groupId'] = t.value; attDraft = null; render(); return; }
  if (t.matches('[data-rep]')){ S.ui.rep[t.dataset.rep] = t.value; render(); return; }
  if (t.matches('[data-exam-hw]')){
    const ex = examOf(t.dataset.examHw); if (!ex) return;
    ex.hw = t.value.trim(); commit({ silent:true });
    toast(ex.hw ? 'تم حفظ الواجب المطلوب 📌' : 'تم مسح الواجب المطلوب', 'ok');
    return;
  }
  if (t.matches('[data-grade]')){
    const ex = examOf(S.ui.exam.id) || S.data.exams[0]; if (!ex) return;
    S.data.grades[ex.id] = S.data.grades[ex.id] || {};
    const v = t.value.trim();
    if (v === '') delete S.data.grades[ex.id][t.dataset.grade];
    else S.data.grades[ex.id][t.dataset.grade] = clamp(Number(v) || 0, 0, ex.max);
    commit({ silent:true }); return;
  }
  if (t.matches('[data-absnote]')){
    const parts = t.dataset.absnote.split('|');
    setAbsReason(parts[0], parts[1], t.value); commit({ silent:true });
    toast(t.value.trim() ? 'تم تسجيل سبب الغياب' : 'تم مسح السبب', 'ok');
    return;
  }
  if (t.id === 'darkToggle'){ setTheme(t.checked ? 'dark' : 'light'); return; }
  if (t.id === 'authToggle'){
    S.data.settings.auth = t.checked;
    if (!t.checked){ Cloud.clearTok(); S.fb.auth = 'off'; }
    else { S.fb.auth = Cloud.authKeyOf() ? 'ready' : 'no-key'; if (t.checked && S.fb.auth === 'ready') Cloud.signIn().then(() => { S.fb.auth = 'on'; paintCloud(); }).catch(e => { S.fb.auth = 'fail'; S.fb.authErr = e.message; }); }
    commit();
    toast(t.checked ? 'التأمين مفعّل — المنصة بتسجّل الجهاز لوحدها ✅' : 'التأمين اتوقف — البيانات بقت مفتوحة لأي حد يعرف الرابط', t.checked ? 'ok' : 'warn', 'السحابة');
    return;
  }
  if (t.id === 'cloudMirrorToggle'){ S.data.settings.fbMirror = t.checked; commit(); toast(t.checked ? 'المرآة شغالة — كل تعديل على السيرفرين ✅' : 'المرآة اتوقفت', t.checked ? 'ok' : 'info', 'السحابة'); return; }
  if (t.id === 'cloudBackupToggle'){ S.data.settings.cloudBackup = t.checked; commit(); toast(t.checked ? 'النسخة الاحتياطية اليومية شغالة ✅' : 'اتوقفت النسخة اليومية — تقدر تعمل نسخة بضغطة في أي وقت', t.checked ? 'ok' : 'info', 'السحابة'); return; }
  if (t.id === 'impFile' && t.files && t.files[0]){
    const f = t.files[0];
    toast('بنقرا الملف...', 'info', 'الاستيراد');
    Import.fromFile(f).then(grid => {
      try{ t.value = ''; }catch(e){}
      if (!grid || grid.length < 2){ toast('مش قادر أقرا الملف — لو إكسل جرّب تحفظه CSV أو الصق الجدول', 'bad'); return; }
      Modal.closeAll();
      setTimeout(() => openImportMap(grid), 120);
    }).catch(e => toast(e.message || 'مش قادر أقرا الملف ده', 'bad', 'الاستيراد'));
    return;
  }
  if (t.id === 'logoInput' && t.files && t.files[0]){ readLogoFile(t.files[0]); return; }
  if (t.id === 'fileInput' && t.files && t.files[0]){
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const d = JSON.parse(rd.result);
        if (!d || (!d.students && !d.groups)) throw new Error('ملف غير صالح');
        const lg = d._logo; delete d._logo;
        S.data = migrate(d); attDraft = null; bustCache(); commit();
        if (typeof lg === 'string' && lg.indexOf('data:image/') === 0) setLogo(lg);
        toast('تم استيراد البيانات: ' + S.data.students.length + ' طالب', 'ok');
      }catch(err){ toast('فشل الاستيراد: ' + err.message, 'bad'); }
    };
    rd.readAsText(t.files[0]); t.value = ''; return;
  }
});

    ${S.fb.ahead ? '<div class="help brand" style="margin-top:10px"><b>عندك تعديلات لسه مرفوعتش</b> — اضغط "رفع الكل" عشان تشوفها على الأجهزة التانية.</div>' : ''}`;
  Modal.open({ title: 'المزامنة السحابية', sub: 'بياناتك على جهازك وفي السحابة', size: 'sm', body: body,
    footer: `<button class="btn pri" data-act="fbTest">${icon('check-square')} اختبار الاتصال</button>
      <button class="btn" data-act="fbPull">${icon('download')} تنزيل</button>
      <button class="btn" data-act="fbPushAll">${icon('upload')} رفع الكل</button>
      <button class="btn ghost" data-act="${st === 'live' ? 'fbDisconnect' : 'fbConnect'}">${icon(st === 'live' ? 'x' : 'link')} ${st === 'live' ? 'فصل' : 'اتصال'}</button>` });
};

function setTheme(t){
  document.documentElement.dataset.theme = t;
  S.data.settings.theme = t;
  localStorage.setItem(LS_KEY + '_theme', t);
  const use = $('#themeBtn use'); if (use) use.setAttribute('href', t === 'dark' ? '#i-sun' : '#i-moon');
  const cb = $('#darkToggle'); if (cb) cb.checked = t === 'dark';
