  stopWatchdog(){ if (S.fb.wd){ clearInterval(S.fb.wd); S.fb.wd = null; } },
  stopPolling(){ if (S.fb.timer){ clearInterval(S.fb.timer); S.fb.timer = null; } },
  async checkRemote(){
    if (S.fb.status !== 'live' || S.fb.syncing) return;
    try{
      if (this.mode() === 'rtdb'){
        const n = await this.pullSections(true);      // بيقرأ meta صغيرة وينزّل المتغير بس
        if (n > 0 && !dirty.main) toast('تم تحديث البيانات من السحابة 🔄', 'info', 'السحابة');
        paintCloud();
        return;
      }
      const meta = await this.readMeta();
      const rev = meta.rev || 0;
      S.fb.remoteRev = rev;
      const local = S.data.meta.rev || 0;
      if (rev > local){
        if (dirty.main){ S.fb.behind = true; S.fb.ahead = false; paintCloud(); }
        else { S.fb.behind = false; await this.doPull(true); toast('تم تحديث البيانات من السحابة 🔄', 'info', 'السحابة'); }
      } else {
        S.fb.behind = false; S.fb.ahead = local > rev; paintCloud();
      }
    }catch(e){
      if (e.kind === 'net' || e.kind === 'rules') this.setStatus('error', e.message);
    }
  },

  /* ---------- الرفع ---------- */
  payload(withAtt){
    const p = { appVersion: 2, meta: this.slimMeta(), settings: S.data.settings, groups: S.data.groups,
      students: S.data.students, exams: S.data.exams, grades: S.data.grades,
      feedback: S.data.feedback || {}, absNotes: S.data.absNotes || {}, msgSent: S.data.msgSent || {} };
    if (withAtt) p.attendance = S.data.attendance;
    const lg = logoRef();
    if (lg && lg.length <= 300000) p._logo = lg;
    return p;
  },
  hasAnyData(){
    return ((S.data.students || []).length + (S.data.groups || []).length + (S.data.exams || []).length) > 0;
  },
  async doPush(all){
    const cfg = this.merged();
    if (!cfg.dbUrl && !cfg.apiKey){ toast('إعدادات السحابة ناقصة', 'bad'); return false; }
    // 🛡️ حماية: جهاز جديد/عمره ما شاف بيانات ما يرفعش فراغ فوق بيانات موجودة على السحابة
    // (ده كان أخطر سيناريو: إعادة تثبيت أو جهاز جديد يمسح كل شغل المستر)
    if (!this.hasAnyData() && !(S.data.meta || {}).hadData && !S.fb.cloudEmpty){
      toast('الجهاز ده مفيهوش بيانات، والبيانات موجودة على السحابة — بننزّلها بدل ما نرفع فراغ', 'info', 'السحابة');
      await this.doPull(true);
      return true;
    }
    if (all && !this.hasAnyData() && !(S.data.meta || {}).hadData){ dirty.main = false; S.fb.syncing = false; return true; }
    if (S.fb.syncing){ this._pushAgain = true; this._pushAgainAll = !!all; return true; }   // مفيش رفعين في نفس الوقت
    S.fb.syncing = true; paintCloud();
    try{
      if (this.mode() === 'rtdb'){
        const n = await this.pushSections(!!all);
        // نسخة كاملة بملف واحد للأجهزة القديمة: بس مع "رفع الكل" عشان السرعة
        if (all) await this.writeRoot({ json: JSON.stringify(this.payload(true)), rev: S.data.meta.rev, updatedAt: new Date().toISOString(), split: true });
        S.fb.lastPush = new Date();
        if (!n && !all){                                  // مفيش أي تغيير حقيقي → مفيش حاجة تتكتب
          dirty.main = false;
          S.fb.syncing = false; S.fb.syncingTxt = ''; this.setStatus('live');
          if (this._pushAgain){ const a = this._pushAgainAll; this._pushAgain = false; this._pushAgainAll = false; setTimeout(() => this.doPush(!!a), 300); }
          return true;
        }
      } else {
        if (all) S.data.meta.rev = (S.data.meta.rev || 0) + 1;
        const rev = S.data.meta.rev || 0;
        let p = this.payload(true), split = true;
        let json = JSON.stringify(p);
        if (json.length > 700000){ p.attendance = {}; json = JSON.stringify(p); }
        await this.writeRoot({ json: json, rev: rev, updatedAt: new Date().toISOString(), split: split });
        await this.writeMeta(rev);
        await this.writeAttendance();
      }
      dirty.main = false; S.fb.syncing = false; S.fb.syncingTxt = ''; S.fb.lastSync = new Date();
      S.fb.remoteRev = S.data.meta.rev; S.fb.behind = false; S.fb.ahead = false; S.fb.cloudEmpty = false;
      try{ S.fb.pending = this.pending().count; }catch(e){}
      this.setStatus('live'); S.fb.errKind = '';
      if (all) toast('تم رفع كل البيانات للسحابة ✅', 'ok', 'السحابة');
      // لو وصل تحديث أحدث أثناء الرفع: ننزّله فورًا بدل ما يفضل معلّق
      if (Number(S.fb.remoteRev || 0) > Number(S.data.meta.rev || 0)) this.onRemoteChange(Number(S.fb.remoteRev));
      if (this._pushAgain){ const a = this._pushAgainAll; this._pushAgain = false; this._pushAgainAll = false; setTimeout(() => this.doPush(!!a), 400); }
      return true;
    }catch(e){
      S.fb.syncing = false; S.fb.syncingTxt = ''; S.fb.errKind = e.kind;
      // خلصت الكمية المجانية للسيرفر ده؟ نحوّل للسيرفر التاني عشان المشروع ما يقفش
      if (e.kind === 'quota' && await this.switchOnQuota(e)) return true;
      this.setStatus('error', e.message);
      if (!dirty.main) dirty.main = true;                       // نعيد المحاولة بعد شوية
      toast('فشل الرفع: ' + e.message, 'bad', 'السحابة');
      if (!this._retry){ this._retry = setTimeout(() => { this._retry = null; if (dirty.main && S.fb.status !== 'off') this.doPush(false); }, 12000); }
      if (this._pushAgain){ this._pushAgain = false; this._pushAgainAll = false; }
      return false;
    }
  },

  /* ---------- التنزيل ---------- */
  async doPull(silent){
    if (this.mode() === 'rtdb'){
      S.fb.syncing = true; paintCloud();
      try{
        const n = await this.pullSections(!!silent);
        S.fb.syncing = false; S.fb.syncingTxt = '';
        this.setStatus('live');
        if (n === -1){
          S.fb.cloudEmpty = true;
          if (!silent) toast('مفيش بيانات مرفوعة على السحابة لسه — من الجهاز اللي فيه البيانات اعمل "رفع الكل"', 'info', 'السحابة');
          return false;
        }
        if (!silent && n === 0) toast('البيانات عندك محدّثة بالفعل ✅', 'ok', 'السحابة');
        return true;
      }catch(e){
        S.fb.syncing = false; S.fb.syncingTxt = ''; S.fb.errKind = e.kind;
        this.setStatus('error', e.message);
        if (!silent) toast('فشل التنزيل: ' + e.message, 'bad', 'السحابة');
        return false;
      }
    }
    return this.doPullLegacy(silent);
  },
  /* نسخة قديمة (ملف واحد) — للتوافق مع مشاريع Firestore أو بيانات قديمة على السحابة */
  async doPullLegacy(silent){
    S.fb.syncing = true; paintCloud();
    try{
      const r = await this.readRoot();
      const d = r.data;
      if (!d || !d.json){ S.fb.syncing = false; this.setStatus('live'); S.fb.cloudEmpty = true;
        if (!silent) toast('مفيش بيانات مرفوعة على السحابة لسه — من الجهاز اللي فيه البيانات اعمل "رفع الكل"', 'info', 'السحابة');
        return false; }
      const remote = JSON.parse(d.json);
      remote.attendance = Object.assign({}, remote.attendance || {}, await this.readAttendanceAll());
      this.applyRemote(remote, Number(d.rev || 0));
      if (remote._logo){ try{ setLogo(remote._logo); }catch(e){} }
      await this.afterLegacyPull();
      S.fb.syncing = false; S.fb.lastSync = new Date(); S.fb.cloudEmpty = false;
      this.setStatus('live');
      if (!silent) toast('تم تنزيل البيانات من السحابة ✅ (' + (remote.students || []).length + ' طالب)', 'ok', 'السحابة');
      return true;
    }catch(e){
      S.fb.syncing = false; S.fb.errKind = e.kind;
      this.setStatus('error', e.message);
      if (!silent) toast('فشل التنزيل: ' + e.message, 'bad', 'السحابة');
      return false;
    }
  },
  /* بعد تنزيل نسخة قديمة: نحوّل بياناتها لأجزاء ونحدّث البصمة */
  async afterLegacyPull(){
    this.refreshCache();
    try{ await this.pushSections(true); }catch(e){}
  },

  applyRemote(remote, rev){
    const att = Object.assign({}, S.data.attendance, remote.attendance || {});
    S.applyingRemote = true;
    try{
      S.data = migrate({
        meta: Object.assign({}, S.data.meta, remote.meta || {}, { rev: Number(rev || 0) }),
        settings: Object.assign({}, S.data.settings, remote.settings || {}),
        groups: remote.groups || [], students: remote.students || [], exams: remote.exams || [],
        grades: remote.grades || {}, attendance: att,
        feedback: remote.feedback || {}, absNotes: remote.absNotes || {}, msgSent: remote.msgSent || {}
      });
      attDraft = null;
      bustCache();
      if (this.hasAnyData()) S.data.meta.hadData = true;
      saveLocal(); render();
      S.fb.remoteRev = Number(rev || 0);
      S.fb.behind = false; S.fb.ahead = false;
      S.fb.lastSync = new Date();
    } finally { S.applyingRemote = false; }
  },

  push(force){
    if (S.fb.status !== 'live' || S.applyingRemote) return;
    this._push = this._push || debounce(() => { if (!S.applyingRemote) this.doPush(false); }, 1200);
    if (force) this.doPush(false); else this._push();
  },

  /* ---------- أزرار مباشرة ---------- */
  async ensure(){
    if (S.fb.status === 'live') return true;
    return await this.connect({ silent:false });
  },
  async pullNow(){
    if (!(await this.ensure())) return;
    const local = S.data.meta.rev || 0, remote = S.fb.remoteRev;
    if (remote != null && remote < local && (S.data.students.length + S.data.groups.length) > 0){
      confirmDialog('تنزيل من السحابة', 'النسخة اللي على السحابة أقدم من اللي عندك على الجهاز ده. التنزيل هيستبدل بياناتك الحالية. متابعة؟', 'تنزيل', () => this.doPull(false), true);
      return;
    }
    this.doPull(false);
  },
  async pushNow(){
    if (!(await this.ensure())) return;
    this.doPush(true);
  },

  /* ---------- اختبار شامل ---------- */
  async test(){
    const out = [];
    const c = this.merged();
    const kindTxt = this.mode() === 'rtdb' ? 'Realtime Database' : 'Firestore';
    out.push(['نوع قاعدة البيانات', '✅ ' + kindTxt + ' · ' + (c.projectId || '—') + ' · كود المنصة: ' + (c.code || '—'), 'ok']);
    const pin = this.pinned();
    const lat = (this.lat || {})[c.projectId];
    out.push(['السيرفر المختار', pin
      ? ('✅ ' + (pin.nick || pin.projectId) + (pin.projectId === c.projectId ? ' (شغال عليه دلوقتي)' : ' (شغال على ' + (c.nick || c.projectId) + ' مؤقتًا)'))
      : 'تلقائي — المنصة بتختار لوحدها وتتحوّل عند الحاجة', pin && pin.projectId !== c.projectId ? 'warn' : 'ok']);
    out.push(['سرعة السيرفر من مكانك', lat != null ? ('⚡ ' + nf(lat) + ' مللي ثانية' + (lat < 300 ? ' — ممتاز' : lat < 800 ? ' — مقبول' : ' — بطيء، جرّب سيرفر تاني'))
      : 'اضغط "اختيار السيرفر" وشوف السرعة لكل سيرفر', lat != null && lat < 800 ? 'ok' : 'warn']);
    let okBase = false;
    try{
      await this.readMeta();
      okBase = true; out.push(['الاتصال بقاعدة البيانات', '✅ الوصول شغال', 'ok']);
    }catch(e){
      if (e.kind === 'empty'){ okBase = true; out.push(['الاتصال بقاعدة البيانات', '✅ شغال (لسه مفيش بيانات)', 'ok']); }
      else out.push(['الاتصال بقاعدة البيانات', '❌ ' + e.message, 'bad']);
    }
    if (okBase){
      try{
        await this.writeMeta((S.data.meta.rev || 0));
        out.push(['الكتابة على السحابة', '✅ الكتابة مسموحة من قواعد الحماية', 'ok']);
      }catch(e){ out.push(['الكتابة على السحابة', '❌ ' + e.message, 'bad']); }
      try{
        if (this.mode() === 'rtdb'){
          const meta = await this.readMeta();
          const d = meta.data || {};
          const secs = d.sec ? Object.keys(d.sec).length : 0;
          const atts = d.att ? Object.keys(d.att).length : 0;
          if (!meta.exists || (!secs && !d.rev)) out.push(['البيانات المرفوعة', '⚠️ لسه مفيش بيانات مرفوعة', 'warn']);
          else out.push(['البيانات المرفوعة', '✅ موجودة — ' + secs + ' جزء · ' + atts + (atts === 1 ? ' شهر حضور' : ' شهور حضور') +
            ' · نسخة ' + (d.rev || 0) + (d.at ? ' · آخر تحديث: ' + new Date(d.at).toLocaleString('ar-EG') : ''), 'ok']);
        } else {
          const r = await this.readRoot();
          const d = r.data || {};
          out.push(['البيانات المرفوعة', d.json ? ('✅ موجودة — آخر تعديل: ' + (d.updatedAt ? new Date(d.updatedAt).toLocaleString('ar-EG') : '—') + ' · نسخة ' + (d.rev || 0)) : '⚠️ لسه مفيش بيانات مرفوعة', d.json ? 'ok' : 'warn']);
        }
      }catch(e){ out.push(['البيانات المرفوعة', '⚠️ مش قادر أقرأها (' + e.message + ')', 'warn']); }
      if (this.mode() === 'rtdb'){
        const stt = S.fb.stream;
        out.push(['التحديث اللحظي', stt === 'live' ? '✅ شغال — أي تعديل بيوصل لحظيًا من غير ريفريش' :
          stt === 'connecting' ? '⏳ بنوصّله دلوقتي — والفحص الاحتياطي شغال' :
          '⚠️ الفحص الدوري شغال كل 8 ثواني (التحديث اللحظي مش متاح دلوقتي)', stt === 'live' ? 'ok' : 'warn']);
        out.push(['طريقة النقل', '✅ ' + (this.secKeys().length + Object.keys(this.attMonthsLocal()).length) + ' جزء منفصل — بيتنقل اللي اتغير بس بدل الملف كله', 'ok']);
        // مقارنة أرقام النسخ: أي جزء نسخته على السحابة أحدث من نسخة الجهاز = محتاج تنزيل
        const dm = S.fb.meta || {};
        const behind = [], ahead = [];
        this.secKeys().forEach(k => {
          const cr = Number((dm.sec || {})[k] || 0), lr = this.locRev('sec', k);
          if (cr > lr) behind.push(k);
          else if (lr > cr) ahead.push(k);
        });
        const pp = this.pending();
        out.push(['تعديلات لسه مرفوعة', pp.any ? ('⚠️ ' + this.pendText() + ' — بتترفع لوحدها') : '✅ مفيش، كل حاجة مرفوعة', pp.any ? 'warn' : 'ok']);
        if (behind.length) out.push(['فيه أجزاء محتاجة تنزيل', '⚠️ ' + behind.join(' · ') + ' — دوس "مزامنة كاملة"', 'warn']);
        else if (ahead.length) out.push(['فيه أجزاء لسه مرفوعتش', '⚠️ ' + ahead.join(' · ') + ' — بتترفع لوحدها، أو دوس "مزامنة كاملة"', 'warn']);
        else out.push(['توحيد الأجهزة', '✅ كل الأجزاء متطابقة مع السحابة (' + this.secKeys().length + ' جزء)', 'ok']);
      }
      const hasLocal = (S.data.students.length + S.data.groups.length) > 0;
      out.push(['بيانات الجهاز ده', (hasLocal ? '✅ ' + nf(S.data.students.length) + ' طالب · ' + nf(S.data.groups.length) + ' حصة' : '⚠️ فاضية — اضغط "تنزيل" لجلب بياناتك'), hasLocal ? 'ok' : 'warn']);
    }
    const okAll = out.every(x => x[2] === 'ok');
    Modal.open({
      title: 'اختبار الاتصال بالسحابة', sub: okAll ? 'كله تمام ✅' : 'فيه خطوة محتاجة ظبط', size: 'sm',
      body: out.map(x => `<div class="alert-row ${x[2]}">
          <span class="ai">${icon(x[2] === 'ok' ? 'check' : x[2] === 'bad' ? 'alert' : 'bell')}</span>
          <span class="at"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></span></div>`).join(''),
      footer: okBase
        ? `<button class="btn pri" data-act="fbPushAll">${icon('upload')} رفع الكل</button>
           <button class="btn" data-act="fbPull">${icon('download')} تنزيل</button>
           <button class="btn" data-act="fbFullSync">${icon('refresh')} مزامنة كاملة</button>
           <button class="btn" data-act="fbStatus">${icon('cloud')} حالة المزامنة</button>
           <button class="btn ghost" data-close>إغلاق</button>`
        : `<button class="btn pri" data-act="fbHelp">${icon('alert')} الخطوات والحل</button>
           <button class="btn" data-act="fbRulesPage">${icon('link')} فتح صفحة القواعد</button>
           <button class="btn ghost" data-close>إغلاق</button>`
    });
    return okAll;
  }
};

function paintCloud(){
  try{ if (typeof Roles !== 'undefined' && S.fb.status === 'live') Roles.init(); }catch(e){}
  const chip = $('#cloudChip'); if (!chip) return;
  const st = S.fb.status;
  let cls = '', title = 'تخزين محلي', sub = 'اضغط للربط بالسحابة';
  if (st === 'busy'){ cls = 'busy'; title = 'جارٍ الاتصال...'; sub = 'Firebase'; }
  else if (st === 'live'){
    cls = 'live'; title = 'متصل بالسحابة';
    if (S.fb.syncing) sub = S.fb.syncingTxt ? ('جارٍ رفع ' + S.fb.syncingTxt) : 'جارٍ المزامنة...';
    else if (S.fb.behind) { cls = 'warn'; title = 'فيه تحديث أحدث على السحابة'; sub = 'بيتنزّل لوحده كمان لحظة'; }
    else if (S.fb.ahead) { cls = 'warn'; title = 'عندك تعديلات لم تُرفع'; sub = 'بتترفع لوحدها'; }
    else if (S.fb.pinBack){ cls = 'warn'; title = 'سيرفرك المختار رجع ✅'; sub = 'اضغط للرجوع ليه'; }
    else if (S.fb.fellBack){ cls = 'warn'; title = 'شغال على سيرفر الطوارئ'; sub = S.fb.pinnedNick ? ('المختار: ' + S.fb.pinnedNick + ' · اضغط للاختيار') : 'اضغط للاختيار'; }
    else if (S.fb.stream === 'live') sub = 'مزامنة لحظية ⚡' + (S.fb.pinnedNick ? ' · ' + S.fb.pinnedNick : '') + (S.fb.lastSync ? ' · ' + S.fb.lastSync.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}) : '');
    else if (S.fb.mirrorBad) sub = 'المرآة (السيرفر التاني) واقفة — المشروع شغال عادي';
    else if (S.fb.pending > 0) sub = 'عندك ' + S.fb.pending + ' جزء لسه بيترفع...';
    else if (S.fb.stream === 'connecting') sub = 'بنوصّل التحديث اللحظي...';
    else sub = S.fb.lastSync ? ('آخر مزامنة ' + S.fb.lastSync.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})) : 'المزامنة تلقائية';
  }
  else if (st === 'error'){ cls = 'err'; title = 'مشكلة في السحابة'; sub = 'اضغط للتشخيص والحل'; }
  chip.className = 'cloud ' + cls;
  $('#cloudTitle').textContent = title;
  $('#cloudSub').textContent = sub;
}

function copyText(txt, okMsg){
  const done = () => toast(okMsg || 'تم النسخ ✅', 'ok');
  try{
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, () => fallback()); return; }
  }catch(e){}
  fallback();
  function fallback(){
    try{
      const ta = document.createElement('textarea');
      ta.value = txt; ta.setAttribute('readonly',''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      done();
    }catch(e){ Modal.open({ title:'قواعد الحماية', sub:'انسخ الكود ده والصقه في تبويب Rules', size:'md', body:`<pre class="code" style="white-space:pre-wrap;direction:ltr;text-align:left">${esc(txt)}</pre>` }); }
  }
}

/* ============================================================
   حقيبة النشر على فايربيز (Hosting) — المنصة بيت لها رابط ثابت مجاني
   • بنعمل ملف ZIP جوه المتصفح من غير أي مكتبة (فك وضغط، ZIP قياسي)
   • بيتنزل فيه: المنصة + الأيقونات + إعدادات النشر + خطوات مكتوبة
   ============================================================ */
const Zip = {
  crcTable: null,
  crc32(b){
    if (!this.crcTable){
      const t = this.crcTable = new Array(256);
      for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; }
    }
    let c = 0xFFFFFFFF;
    for (let i = 0; i < b.length; i++) c = this.crcTable[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  },
  // files: [{ name:'index.html', data: Uint8Array | string }]
  make(files){
    const enc = new TextEncoder();
    const chunks = [], central = [];
    let offset = 0, count = 0;
    const u16 = (v) => [v & 255, (v >> 8) & 255];
    const u32 = (v) => [v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255];
    const push = arr => chunks.push(new Uint8Array(arr));
    (files || []).forEach(f => {
      const name = enc.encode(f.name);
      const raw = (typeof f.data === 'string') ? enc.encode(f.data) : f.data;
      const crc = this.crc32(raw);
      // (1) محلي
      push([].concat([0x50,0x4B,0x03,0x04], u16(20), u16(0x0800), u16(0), u16(0), u16(0),
        u32(crc), u32(raw.length), u32(raw.length), u16(name.length), u16(0)));
      chunks.push(name); chunks.push(raw);
      // (2) الفهرس
      central.push([].concat([0x50,0x4B,0x01,0x02], u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
        u32(crc), u32(raw.length), u32(raw.length), u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset)));
      central.push(name);
      offset += 30 + name.length + raw.length;
      count++;
    });
    const cdStart = offset;
    let cdSize = 0;
    central.forEach(c => { cdSize += c.length; chunks.push(new Uint8Array(c)); });
    push([].concat([0x50,0x4B,0x05,0x06], u16(0), u16(0), u16(count), u16(count), u32(cdSize), u32(cdStart), u16(0)));
    return new Blob(chunks, { type: 'application/zip' });
  }
};

const Deploy = {
  async grab(file){
    try{
      const r = await fetch(file, { cache: 'no-store' });
      if (!r || !r.ok) return null;
      const buf = await r.arrayBuffer();
      return { name: file, data: new Uint8Array(buf) };
    }catch(e){ return null; }
  },
  async payload(){
    const files = [];
    for (const f of DEPLOY_FILES){
      const got = await this.grab(f);
      if (got) files.push(got);
      else if (f === 'index.html') return null;      // لو مفيش نسخة، مايفدش ننشر
    }
    if (!files.length) return null;
    Object.keys(DEPLOY_CFG).forEach(k => files.push({ name: k, data: DEPLOY_CFG[k] }));
    // ملف الربط بالمشروع كمان (عشان أمر النشر يعرف المشروع لوحده)
    files.push({ name: '.firebaserc', data: JSON.stringify({ projects: { default: (S.fb.cfg && S.fb.cfg.projectId) || FB_DEFAULT.projectId } }, null, 2) });
    return files;
  },
  async makeZip(){
    toast('بنجهّز ملف النشر...', 'info', 'النشر على فايربيز');
    const files = await this.payload();
    if (!files){ toast('مش قادر أقرا ملفات المنصة — افتح المنصة من رابط (مش ملف على الجهاز) وجرّب تاني', 'bad', 'النشر'); return false; }

    const a = document.createElement('a'); a.href = url; a.download = 'mostar-deploy.zip';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 600);
    toast('اتنزّل mostar-deploy.zip (' + files.length + ' ملف) — ارفعه في Cloud Shell ونفّذ سطرين وخلاص', 'ok', 'النشر على فايربيز');
    return true;
  },
  // نسخة مستقلة: ملف HTML واحد يشتغل من أي مكان (حتى من غير نت)
  async standalone(){
    const got = await this.grab('index.html');

    if (!html || html.length < 20000){
      try{ const r = await fetch(location.href, { cache:'no-store' }); html = await r.text(); }catch(e){}
    }
    if (!html || html.length < 20000){ toast('مش قادر أجهّز النسخة المستقلة من هنا — افتح المنصة من رابط وجرّب تاني', 'bad'); return ''; }

/* ============================================================
   استيراد الطلاب من Excel / CSV — من غير أي مكتبة خارجية
   • CSV / TXT: بيدعم الفاصلة والفاصلة المنقوطة والتاب، والعربي (UTF-8 و Windows-1256)
   • XLSX: بيتفك لوحده (ZIP + فك ضغط المتصفح) وبيقرا أول ورقة
   ============================================================ */
const Import = {
  // فك تشفير الملف: لو مش UTF-8 سليم نجرّب العربي (Windows-1256) اللي إكسل بيحفظ بيه
  decode(buf){
    const bytes = new Uint8Array(buf);
    try{ return new TextDecoder('utf-8', { fatal:true }).decode(bytes); }
    catch(e){
      try{ return new TextDecoder('windows-1256').decode(bytes); }catch(e2){ return new TextDecoder('utf-8').decode(bytes); }
    }
  },
  delim(text){
    const head = String(text).split(/\r?\n/).slice(0, 4).join('\n');
    const cands = [',', ';', '\t', '|'];
    let best = ',', bestN = -1;
    cands.forEach(d => { const n = head.split(d).length; if (n > bestN){ bestN = n; best = d; } });
    return best;
  },
  // CSV مع دعم علامات التنصيص والأسطر اللي جوه خانة
  parseCSV(text, d){
    const src = String(text).replace(/^\uFEFF/, '');
    const sep = d || this.delim(src);
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < src.length; i++){
      const c = src[i];
      if (q){
        if (c === '"'){ if (src[i+1] === '"'){ cell += '"'; i++; } else q = false; }
        else cell += c;
        continue;
      }
      if (c === '"'){ q = true; continue; }
      if (c === sep){ row.push(cell); cell = ''; continue; }
      if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; continue; }
      if (c === '\r') continue;
      cell += c;
    }
    row.push(cell); rows.push(row);
    return rows.filter(r => r.some(x => String(x).trim() !== ''));
  },
  // فك ضغط ZIP (المستخدم في XLSX) — بنستخدم فك الضغط المدمج في المتصفح
  async unzip(buf){
    const b = new Uint8Array(buf);
    const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
    let eocd = -1;
    for (let i = b.length - 22; i >= 0 && i > b.length - 66000; i--){ if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; } }
    if (eocd < 0) throw new Error('الملف مش ملف Excel صالح');
    const count = dv.getUint16(eocd + 10, true);
    let off = dv.getUint32(eocd + 16, true);
    const out = {};
    for (let n = 0; n < count; n++){
      if (dv.getUint32(off, true) !== 0x02014b50) break;
      const method = dv.getUint16(off + 10, true);
      const csize = dv.getUint32(off + 20, true);
      const nameLen = dv.getUint16(off + 28, true), extraLen = dv.getUint16(off + 30, true), cmtLen = dv.getUint16(off + 32, true);
      const lho = dv.getUint32(off + 42, true);
      const name = new TextDecoder('utf-8').decode(b.subarray(off + 46, off + 46 + nameLen));
      const lNameLen = dv.getUint16(lho + 26, true), lExtraLen = dv.getUint16(lho + 28, true);
      const start = lho + 30 + lNameLen + lExtraLen;
      const raw = b.subarray(start, start + csize);
      if (method === 0) out[name] = raw.slice();
      else if (method === 8) out[name] = await this.inflate(raw);
      off += 46 + nameLen + extraLen + cmtLen;
    }
    return out;
  },
  async inflate(bytes){
    if (typeof DecompressionStream === 'undefined') throw new Error('المتصفح ده قديم شوية — احفظ الملف من إكسل بصيغة CSV وارفعها وهتشتغل');
    const ds = new DecompressionStream('deflate-raw');
    const w = ds.writable.getWriter();
    w.write(bytes); w.close();
    const reader = ds.readable.getReader();
    const chunks = []; let total = 0;
    for(;;){ const r = await reader.read(); if (r.done) break; chunks.push(r.value); total += r.value.length; }
    const out = new Uint8Array(total); let p = 0;
    chunks.forEach(c => { out.set(c, p); p += c.length; });
    return out;
  },
  xmlText(s){
    return String(s).replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
      .replace(/&#(\d+);/g, (m, d) => String.fromCharCode(Number(d))).replace(/&amp;/g, '&');
  },
  colOf(ref){
    const m = String(ref || '').match(/^([A-Z]+)/i);
    if (!m) return 0;
    let n = 0; const L = m[1].toUpperCase();
    for (let i = 0; i < L.length; i++) n = n * 26 + (L.charCodeAt(i) - 64);
    return n - 1;
  },
  parseSheetXml(xml, shared){
    const grid = [];
    const rows = String(xml).match(/<row[\s\S]*?<\/row>/g) || [];
    rows.forEach((rowXml) => {
      const rIdx = Number((rowXml.match(/<row[^>]*\sr="(\d+)"/) || [])[1] || (grid.length + 1)) - 1;
      const line = [];
      const cells = rowXml.match(/<c[\s>][\s\S]*?(?:<\/c>|\/>)/g) || [];
      cells.forEach(c => {
        const ref = (c.match(/\sr="([A-Z]+\d+)"/) || [])[1] || '';
        const t = (c.match(/\st="([^"]+)"/) || [])[1] || '';
        let v = '';
        if (t === 'inlineStr'){ v = this.xmlText((c.match(/<t[^>]*>([\s\S]*?)<\/t>/) || [])[1] || ''); }
        else if (t === 's'){ const i = Number((c.match(/<v>([\s\S]*?)<\/v>/) || [])[1]); v = shared[i] || ''; }
        else { v = this.xmlText((c.match(/<v>([\s\S]*?)<\/v>/) || [])[1] || ''); }
        line[this.colOf(ref)] = v;
      });
      for (let i = 0; i < line.length; i++) if (line[i] === undefined) line[i] = '';
      grid[rIdx] = line;
    });
    const out = [];
    grid.forEach(r => { if (r && r.some(x => String(x).trim() !== '')) out.push(r); });
    return out;
  },
  async parseXlsx(buf){
    const files = await this.unzip(buf);
    const dec = k => this.decode(files[k]);
    const shared = [];
    let ssKey = Object.keys(files).filter(k => /sharedStrings\.xml$/i.test(k))[0];
    if (ssKey){
      const ss = dec(ssKey);
      (ss.match(/<si[\s>][\s\S]*?<\/si>/g) || []).forEach(si => {
        const parts = si.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || [];
        shared.push(parts.map(x => this.xmlText(x.replace(/<[^>]+>/g, ''))).join(''));
      });
    }
    let sheetKey = Object.keys(files).filter(k => /worksheets\/sheet\d*\.xml$/i.test(k)).sort()[0];
    if (!sheetKey) throw new Error('مالقيتش ورقة بيانات جوه الملف');
    return this.parseSheetXml(dec(sheetKey), shared);
  },
  async fromFile(file){
    const name = String((file && file.name) || '').toLowerCase();
    const buf = await file.arrayBuffer();
    if (/\.xlsx?$/.test(name) || /spreadsheet/.test(file.type || '')) return await this.parseXlsx(buf);
    return this.parseCSV(this.decode(buf));
  }
};

function impNorm(x){

    .replace(/تاني/g, 'ثاني').replace(/تالت/g, 'ثالث').replace(/تالث/g, 'ثالث')   // العامي = الفصحى

}
function impGuess(headers){
  const out = {}; const used = {};
  (headers || []).forEach((h, i) => {
    const n = impNorm(h); if (!n) return;
    for (const f of IMP_FIELDS){
      if (out[f.k] != null) continue;
      if (f.aliases.some(a => { const an = impNorm(a); return an === n || (an.length > 2 && n.indexOf(an) === 0); })){
        out[f.k] = i; used[i] = 1; break;
      }
    }
  });
  return out;
}

/* خطوة 1: نختار الملف أو نلصق الجدول */
/* ============================================================
   السنة الدراسية: قفل السنة وترحيل الطلاب للمرحلة اللي بعدها
   • مفيش بيانات بتتمسح: درجات وحضور السنة القديمة بتفضل زي ما هي
   • بياخد نسخة احتياطية على السحابة قبل القفل + ملف أرشيف على الجهاز
   ============================================================ */
function currentYearLabel(){
  const st = S.data.settings || {};
  if (st.year) return st.year;
  const d = new Date(), y = d.getFullYear();
  const start = (d.getMonth() >= 8) ? y : y - 1;     // السنة الدراسية بتبدأ في سبتمبر
  return start + '/' + (start + 1);
}
function nextYearLabel(y){
  const m = String(y || '').match(/(\d{4})\s*\/\s*(\d{2,4})/);
  const start = m ? Number(m[1]) + 1 : new Date().getFullYear();
  return start + '/' + String(start + 1).slice(2);
}
function stageNext(stage){
  const list = (S.data.settings.stages || []).slice();
  const i = list.findIndex(x => impNorm(x) === impNorm(stage));
  if (i < 0) return stage;                       // مرحلة مش في الإعدادات → تفضل زي ما هي
  return (i < list.length - 1) ? list[i + 1] : list[i];
}
// خيارات المرحلة الجديدة: بنضمن إن المرحلة الحالية نفسها موجودة كخيار (عشان محدش يتنقل بالغلط)
function stageOptions(stage){
  const all = (S.data.settings.stages || []).slice();
  if (stage && !all.some(a => impNorm(a) === impNorm(stage))) all.unshift(stage);
  return all;
}

async function runYearClose(){
  const label = (($('#ycLabel') && $('#ycLabel').value) || '').trim() || nextYearLabel(currentYearLabel());
  const map = {};
  $$('[data-ycmap]').forEach(sel => { map[sel.dataset.ycmap] = sel.value; });
  const moveStopped = $('#ycStopped') && $('#ycStopped').value === 'move';
  const wantSnap = !$('#ycSnap') || $('#ycSnap').checked;
  const wantFile = !$('#ycFile') || $('#ycFile').checked;
  const counts = { students: (S.data.students || []).length, groups: (S.data.groups || []).length, exams: (S.data.exams || []).length, days: Object.keys(S.data.attendance || {}).length };
  Modal.closeAll();
  Undo.snap('قفل السنة الدراسية ' + currentYearLabel());
  let snapKey = '';
  if (wantSnap){ toast('بنعمل نسخة احتياطية على السحابة قبل القفل...', 'info', 'السحابة'); snapKey = await Cloud.snapshotNow(false, 'قفل السنة — ' + currentYearLabel()); if (!snapKey) snapKey = ''; }
  if (wantFile){ try{ download('mostar-archive-' + String(label).replace(/\W+/g, '-') + '.json', JSON.stringify(Object.assign({ _archive: { label: label, from: currentYearLabel(), at: new Date().toISOString() } }, S.data), null, 1), 'application/json'); }catch(e){} }
  let moved = 0, stayed = 0;
  (S.data.students || []).forEach(st => {
    if (String(st.status) === 'stopped' && !moveStopped){ stayed++; return; }
    const to = map[st.stage] || st.stage;
    if (to && to !== st.stage) st.stage = to;
    st.year = label; st._t = Date.now();
    moved++;
  });
  S.data.years = S.data.years || [];
  S.data.years.unshift({ label: label, from: currentYearLabel(), at: new Date().toISOString(), counts: counts, snap: snapKey, moved: moved });
  S.data.years = S.data.years.slice(0, 20);
  S.data.settings.year = label;
  commit();
  toast('السنة الجديدة ' + label + ' بدأت ✅ ' + (moved ? ('اتنقل ' + nf(moved) + ' طالب') : '') + (stayed ? (' · ' + nf(stayed) + ' متوقف فاضل زي ما هو') : '') + (snapKey ? ' · وفي نسخة احتياطية على السحابة' : ''), 'ok', 'قفل السنة');
  render();

}

/* خطوة 3: التنفيذ */
function runImport(){
  const imp = S.ui.imp || {};
  const rows = imp.rows || [];
  const map = {};
  $$('[data-impcol]').forEach(sel => { if (sel.value) map[sel.value] = Number(sel.dataset.impcol); });
  if (map.name == null){ toast('حدّد عمود «الاسم» الأول', 'bad'); return; }
  const dupMode = ($('#impDup') && $('#impDup').value) || 'skip';
  const mkGroups = !$('#impNewGroups') || $('#impNewGroups').checked;
  const mkMeta = !$('#impNewMeta') || $('#impNewMeta').checked;
  Undo.snap('استيراد ' + nf(rows.length) + ' سجل من ملف');
  const st = S.data.settings;
  const addMeta = (listKey, val) => {
    const v = String(val || '').trim(); if (!v) return '';
    const arr = st[listKey] = st[listKey] || [];
    if (!arr.some(x => impNorm(x) === impNorm(v))){ if (mkMeta) arr.push(v); }
    const found = arr.filter(x => impNorm(x) === impNorm(v))[0];
    return found || (mkMeta ? v : '');
  };
  let added = 0, updated = 0, skipped = 0, groupsMade = 0, noName = 0, twins = 0;
  rows.forEach(r => {
    const get = k => (map[k] == null ? '' : String(r[map[k]] == null ? '' : r[map[k]]).trim());
    const name = get('name');
    if (!name){ noName++; return; }
    const parentPhone = get('parentPhone').replace(/[^0-9+]/g, '');
    const phone = get('phone').replace(/[^0-9+]/g, '');
    const groupName = get('group');
    let groupId = '';
    if (groupName){
      const g = (S.data.groups || []).filter(x => impNorm(x.name) === impNorm(groupName))[0];
      if (g) groupId = g.id;
      else if (mkGroups){
        groupId = uid('g');
        S.data.groups.push({ id: groupId, name: groupName, day: '', from: '', to: '', stage: addMeta('stages', get('stage')), payMode: st.defaultPayMode || 'session' });
        groupsMade++;
      }
    }
    // التكرار بيتحدد بالاسم لوحده (ده اللي بيحصل فعلًا لما تعيد استيراد قايمة محدّثة)
    const exist = (S.data.students || []).filter(x => impNorm(x.name) === impNorm(name))[0];
    if (exist) twins++;
    if (exist){
      if (dupMode === 'skip'){ skipped++; return; }
      if (dupMode === 'update'){
        if (get('stage')) exist.stage = addMeta('stages', get('stage'));
        if (get('studySystem')) exist.studySystem = addMeta('studySystems', get('studySystem'));
        if (get('type')) exist.type = addMeta('studentTypes', get('type'));
        if (get('level')) exist.level = addMeta('levels', get('level'));
        if (phone) exist.phone = phone;
        if (parentPhone) exist.parentPhone = parentPhone;
        if (groupId) exist.groupId = groupId;
        exist._t = Date.now();
        updated++; return;
      }
    }
    const rec = { id: uid('s'), name: name, status: 'active', created: today() };
    if (get('code')) rec.code = get('code');
    rec.stage = addMeta('stages', get('stage')) || (S.data.settings.stages || [])[0] || '';
    if (get('studySystem')) rec.studySystem = addMeta('studySystems', get('studySystem'));
    if (get('type')) rec.type = addMeta('studentTypes', get('type'));
    if (get('level')) rec.level = addMeta('levels', get('level'));
    if (phone) rec.phone = phone;
    if (parentPhone) rec.parentPhone = parentPhone;
    if (groupId) rec.groupId = groupId;
    rec._t = Date.now();
    S.data.students.push(rec);
    added++;
  });
  commit();
  Modal.closeAll();
  const bits = [];
  if (added) bits.push(addAr(added) + ' طالب جديد');
  if (updated) bits.push('تحديث ' + addAr(updated) + ' موجود');
  if (skipped) bits.push('تخطّي ' + addAr(skipped) + ' مكرر');
  if (groupsMade) bits.push(addAr(groupsMade) + ' حصة جديدة (ظبط مواعيدها من شاشة الحصص)');
  if (noName) bits.push(addAr(noName) + ' سطر من غير اسم');
  if (twins && dupMode !== 'add') bits.push('فيه ' + addAr(twins) + ' اسم متطابق — لو دول طلاب مختلفين اختار «أضِفه كطالب جديد» واستورد تاني');
  toast(bits.length ? bits.join(' · ') : 'مفيش حاجة اتضافت', bits.length ? 'ok' : 'warn', 'نتيجة الاستيراد');
  if (groupsMade) S.ui.impNote = 'فيه ' + addAr(groupsMade) + ' حصة اتعملت من الملف ومحتاجة تظبط مواعيدها';
  render();
}

function setLogoIcon(v){ try{ v ? localStorage.setItem(LOGO_ICON_KEY, v) : localStorage.removeItem(LOGO_ICON_KEY); }catch(e){} }
function logoRef(){ try { return localStorage.getItem(LOGO_KEY) || ''; } catch(e){ return ''; } }
function logoKB(){ const v = logoRef(); return v ? Math.max(1, Math.round(v.length * 0.75 / 1024)) : 0; }
function paintLogo(){
  const src = AF_logoSrc(), custom = logoRef();
  $$('img[data-logo]').forEach(im => {
    im.onerror = function(){ AF_logoNext(this); };
    if (im.getAttribute('src') !== src){ im.style.visibility = ''; im.src = src; }
  });
  const icon = logoIcon();                                  // نسخة صغيرة للأيقونات
  const iconSafe = (icon && icon.length < 400000) ? icon : '';   // لو ضخمة، ما نستعملهاش
  $$('link[rel="icon"], link[rel="apple-touch-icon"]').forEach(l => {
    if (!l.dataset.afOrig) l.dataset.afOrig = l.getAttribute('href') || '';
    l.setAttribute('href', iconSafe || l.dataset.afOrig);
  });
  paintManifest(iconSafe);
}
/* المانيفست: أيقونة التطبيق المثبّت / الشاشة الرئيسية / التاسكبار تتبع نفس اللوجو */
let AF_MANIFEST_OBJ = null, AF_MANIFEST_URL = '';
function paintManifest(custom){
  const link = $('link[rel="manifest"]');
  if (!link) return;
  if (!link.dataset.afOrig) link.dataset.afOrig = link.getAttribute('href') || 'manifest.webmanifest';
  if (custom && custom.length > 400000) custom = '';      // حماية: أيقونة ضخمة = كراش المتصفح
  if (!custom){                                   // مفيش لوجو مخصص → المانيفست الأصلي
    if (AF_MANIFEST_URL){ try{ URL.revokeObjectURL(AF_MANIFEST_URL); }catch(e){} AF_MANIFEST_URL = ''; }
    link.setAttribute('href', link.dataset.afOrig);
    return;
  }
  const build = base => {
    const man = Object.assign({}, base);
    man.icons = [
      { src: custom, sizes: '512x512', type: 'image/png', purpose: 'any' },
      { src: custom, sizes: '192x192', type: 'image/png', purpose: 'any' }
    ];
    if (man.shortcuts) man.shortcuts = man.shortcuts.map(sc => Object.assign({}, sc, { icons: [man.icons[0]] }));
    try{
      const txt = JSON.stringify(man);
      if (AF_MANIFEST_URL){ try{ URL.revokeObjectURL(AF_MANIFEST_URL); }catch(e){} }
      AF_MANIFEST_URL = '';
      try{ AF_MANIFEST_URL = URL.createObjectURL(new Blob([txt], { type: 'application/manifest+json' })); }catch(e){}
      if (!AF_MANIFEST_URL){
        try{ AF_MANIFEST_URL = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(txt); }catch(e){}
      }
      if (AF_MANIFEST_URL) link.setAttribute('href', AF_MANIFEST_URL);
    }catch(e){}
  };
  if (AF_MANIFEST_OBJ){ build(AF_MANIFEST_OBJ); return; }
  fetch(link.dataset.afOrig).then(r => r.json()).then(base => { AF_MANIFEST_OBJ = base; build(base); })
    .catch(() => { AF_MANIFEST_OBJ = { name:'منصة المستر', short_name:'منصة المستر', start_url:'./index.html', scope:'./', display:'standalone', background_color:'#0b0b0d', theme_color:'#fac518' }; build(AF_MANIFEST_OBJ); });
}
function setLogo(dataUrl){
  try { localStorage.setItem(LOGO_KEY, dataUrl); }
  catch(e){ return false; }            // المساحة مش كافية
  setLogoIcon('');                     // الأيقونة القديمة اتشالت لحد ما تتبني الجديدة
  paintLogo();
  makeLogoIcon(dataUrl);               // أيقونة التطبيق (مقاس صغير) — منعًا لأي كراش
  return true;
}
function clearLogo(){
  try { localStorage.removeItem(LOGO_KEY); } catch(e){}
  setLogoIcon('');
  paintLogo();
}
/* أيقونة التطبيق: نسخة مربعة بمقاس صغير (٥١٢) — الأيقونات مينفعش تبقى صورة ضخمة */
function makeLogoIcon(src){
  const finish = url => {
    if (!url) return;
    setLogoIcon(url);
    paintLogo();
    toast('أيقونة التطبيق اتحدثت بالصورة الجديدة ✅', 'ok', 'اللوجو');
  };
  const im = new Image();
  let done = false;
  const guard = setTimeout(() => { if (!done){ done = true; } }, 8000);
  im.onload = () => {
    if (done) return; done = true; clearTimeout(guard);
    try{
      [512, 192, 180].some(size => {                       // نجرّب مقاسات لحد ما نلاقي حجم معقول
        const c = document.createElement('canvas');
        c.width = size; c.height = size;
        const ctx = c.getContext ? c.getContext('2d') : null;
        if (!ctx) return true;
        ctx.fillStyle = '#0b0b0d'; ctx.fillRect(0, 0, size, size);
        const w = im.naturalWidth || 1, h = im.naturalHeight || 1;
        const k = Math.min(size / w, size / h);
        const dw = Math.max(1, Math.round(w * k)), dh = Math.max(1, Math.round(h * k));
        ctx.drawImage(im, Math.round((size - dw) / 2), Math.round((size - dh) / 2), dw, dh);
        const out = c.toDataURL('image/png');
        if (out && out.length < 400000){ finish(out); return true; }
        return false;
      });
    }catch(e){}
  };
  im.onerror = () => { done = true; clearTimeout(guard); };
  im.src = src;
}
function shrinkImg(src, maxDim, outType, quality, cb){
  let done = false, timer = null;
  const finish = v => { if (done) return; done = true; if (timer) clearTimeout(timer); cb(v); };
  const im = new Image();
  im.onload = () => {
    try{
      const w = im.naturalWidth || 1, h = im.naturalHeight || 1, r = Math.min(1, maxDim / Math.max(w, h));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w * r)); c.height = Math.max(1, Math.round(h * r));
      const ctx = c.getContext ? c.getContext('2d') : null;
      if (!ctx){ finish(null); return; }
      ctx.drawImage(im, 0, 0, c.width, c.height);
      finish(c.toDataURL(outType, quality));
    }catch(e){ finish(null); }
  };
  im.onerror = () => finish(null);
  timer = setTimeout(() => finish(null), 3000);   // لو الصورة ما حمّلتش، ما نوقفش الواجهة
  im.src = src;
}
function logoDone(fileName, reduced){
  toast('اتغيّر اللوجو: ' + esc(fileName || 'صورة') + (reduced ? ' (اتصغّرت الأبعاد للنقل بس — الشكل زي ما هو)' : ' (زي ما هي بدون أي تعديل)'),
        reduced ? 'info' : 'ok', 'اللوجو');
  resetLogoInput(); render();
}
function readLogoFile(file){
  if (!file) return;
  if (!/^image\//.test(file.type || '')){ toast('الملف لازم يكون صورة (PNG / JPG / WEBP)', 'bad'); resetLogoInput(); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const raw = rd.result, name = file.name;
    const rawSize = raw.length * 0.75;                             // الحجم التقريبي بالبايت
    if (rawSize <= 1.2 * 1024 * 1024 && setLogo(raw)){ logoDone(name, false); return; }   // صورة معقولة → تُخزَّن زي ما هي
    const isPng = /png$/i.test(file.type || '');
    const steps = [
      [1600, isPng ? 'image/png' : 'image/jpeg', 0.92],
      [1200, isPng ? 'image/png' : 'image/jpeg', 0.92],
      [1024, 'image/jpeg', 0.9],
      [768,  'image/jpeg', 0.85],
      [512,  'image/jpeg', 0.82]
    ];
    (function attempt(i){
      if (i >= steps.length){ toast('الصورة كبيرة جدًا على التخزين — جرّب صورة أصغر', 'bad'); resetLogoInput(); return; }
      const [d, type, q] = steps[i];
      shrinkImg(raw, d, type, q, out => {
        if (out && setLogo(out)){ logoDone(name, true); return; }
        attempt(i + 1);
      });
    })(0);
  };
  rd.onerror = () => { toast('فشل قراءة الملف', 'bad'); resetLogoInput(); };
  rd.readAsDataURL(file);
}

/* نظام الدراسة: تانية ثانوي = عام/بكالوريا/أزهر، وغيرها = عام/أزهر */
function isBacStage(stage){

  return s === key || s.indexOf('الثاني الثانوي') > -1 || s.indexOf('تانية ثانوي') > -1 || s === '2 ثانوي';

/* تعارض مواعيد الحصص */
function groupsConflict(day, from, to, exceptId){
  const f = toMin(from), t = toMin(to);
  if (f == null || t == null) return null;
  for (const g of S.data.groups){
    if (g.id === exceptId) continue;
    if (Number(g.day) !== Number(day)) continue;
    const gf = toMin(g.from), gt = toMin(g.to);
    if (gf == null || gt == null) continue;
    if (f < gt && gf < t) return g;
  }
  return null;
}
/* الحضور */
function attKey(date, gid){ return date + '@' + (gid || 'none'); }
function getAtt(date, gid){ return S.data.attendance[attKey(date, gid)] || null; }
function setAtt(date, gid, records, note){
  const k = attKey(date, gid), prev = S.data.attendance[k] || {};
  S.data.attendance[k] = { groupId: gid || '', note: note || '', records: records, rev: (prev.rev || 0) + 1, savedAt: new Date().toISOString() };
  bustCache();
}
/* ==========================================================
   فهارس الأداء — المنصة بتبني فهرس الحضور والدرجات مرة واحدة
   وبعدها كل حساب بياخد وقت ثابت. من غير كده كل طالب كان بيعيد
   قراءة كل سجلات الحضور من الصفر (بطء شديد مع البيانات الكبيرة).
   ========================================================== */
let PERF = { rev:0, attIndex:null, attStats:{}, exam:null };
function bustCache(){ PERF.rev++; PERF.attIndex = null; PERF.attStats = {}; PERF.exam = null; }
// فهرس الحضور: { studentId: [ {date, groupId, status}, ... ] } مرتب بالتاريخ
function attIndex(){
  if (PERF.attIndex) return PERF.attIndex;
  const idx = {};
  const att = S.data.attendance || {};
  Object.keys(att).forEach(k => {
    const rec = att[k]; if (!rec) return;
    const at = k.indexOf('@');
    const date = at > 0 ? k.slice(0, at) : k;
    const rawG = at > 0 ? k.slice(at + 1) : '';
    const groupId = rawG === 'none' ? '' : rawG;
    const recs = rec.records || {};
    Object.keys(recs).forEach(sid => {
      (idx[sid] = idx[sid] || []).push({ date: date, groupId: groupId, status: recs[sid] });
    });
  });
  Object.keys(idx).forEach(sid => idx[sid].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0)));
  PERF.attIndex = idx;
  return idx;
}
function allAttRecords(){
  const idx = attIndex(), out = [];
  Object.keys(idx).forEach(sid => idx[sid].forEach(r => out.push({ date:r.date, groupId:r.groupId, studentId:sid, status:r.status })));
  return out;
}
function attStats(sid, from, to){
  const key = sid + '|' + (from || '') + '|' + (to || '');
  const hit = PERF.attStats[key];
  if (hit) return hit;
  const st = { present:0, absent:0, late:0, excused:0, total:0 };
  const rows = attIndex()[sid] || [];
  for (let i = 0; i < rows.length; i++){
    const r = rows[i];
    if (from && r.date < from) continue;
    if (to && r.date > to) continue;
    if (st[r.status] != null) st[r.status]++;
    st.total++;
  }
  const counted = st.present + st.absent + st.late;
  st.rate = counted ? Math.round(((st.present + st.late) / counted) * 100) : 0;
  st.absentRate = counted ? Math.round((st.absent / counted) * 100) : 0;
  PERF.attStats[key] = st;
  return st;
}
function attRate(sid, from, to){ return attStats(sid, from, to).rate; }
// فهرس الدرجات: مجموع النسب وعدد الامتحانات لكل طالب — مرة واحدة بدل كل مرة
function examIndex(){
  if (PERF.exam) return PERF.exam;
  const sum = {}, count = {}, avg = {};
  S.data.exams.forEach(e => {
    const g = S.data.grades[e.id] || {};
    Object.keys(g).forEach(sid => {
      const v = g[sid];
      if (typeof v !== 'number' || !e.max) return;
      sum[sid] = (sum[sid] || 0) + (v / e.max) * 100;
      count[sid] = (count[sid] || 0) + 1;
    });
  });
  Object.keys(count).forEach(sid => { avg[sid] = Math.round(sum[sid] / count[sid]); });
  PERF.exam = { sum: sum, count: count, avg: avg };
  return PERF.exam;
}
function examAvg(sid){ const b = examIndex(); return b.count[sid] ? b.avg[sid] : null; }
function examCount(sid){ return examIndex().count[sid] || 0; }
function studentStatus(s){
  if (s.status === 'stopped') return { key:'stopped', label:'موقوف', cls:'b-gray' };
  if (s.status === 'paused') return { key:'paused', label:'متوقف مؤقتًا', cls:'b-gray' };
  const st = attStats(s.id, addDays(today(), -30), today());
  if (st.total >= 4 && st.absentRate >= 40) return { key:'weak', label:'غياب متكرر', cls:'b-bad' };
  if (!s.groupId) return { key:'nogroup', label:'بدون حصة', cls:'b-warn' };
  return { key:'ok', label:'منتظم', cls:'b-ok' };
}

/* ==========================================================
   رسائل الواتساب — ولي الأمر والطالب
   الرسالة بتتبني من بيانات المنصة نفسها: الدرجات، الأخطاء،
   الواجب، الحضور والغياب — والمستر يقدر يعدّل النص قبل الإرسال.
   ========================================================== */
const HW_LABEL = { done:'سلّم الواجب كامل ✅', late:'سلّم الواجب متأخر ⏰', none:'ما سلّمش الواجب ❌' };
function gradePC(exam, sid){
  const v = (S.data.grades[exam.id] || {})[sid];
  return typeof v === 'number' ? Math.round(v / exam.max * 100) : null;
}
function gradeWord(pc){
  if (pc == null) return '';
  return pc >= 90 ? 'ممتاز' : pc >= 80 ? 'جيد جدًا' : pc >= 65 ? 'جيد' : pc >= 50 ? 'مقبول' : 'يحتاج تحسين';
}
function gradeOf(exam, sid){ const v = (S.data.grades[exam.id] || {})[sid]; return typeof v === 'number' ? v : null; }
/* الأخطاء وحالة الواجب لكل امتحان/طالب */
function fbOf(examId, sid){
  const box = (S.data.feedback || {})[examId] || {};
  return box[sid] || {};
}
function setFb(examId, sid, patch){
  if (!examId || !sid) return;
  S.data.feedback = S.data.feedback || {};
  const box = S.data.feedback[examId] = S.data.feedback[examId] || {};
  const cur = Object.assign({}, box[sid] || {}, patch);
  if (cur.err !== undefined) cur.err = String(cur.err || '').trim();
  if (!cur.err && !cur.hw) delete box[sid]; else box[sid] = Object.assign(cur, { at: new Date().toISOString() });
  if (!Object.keys(box).length) delete S.data.feedback[examId];
}
/* كل امتحانات الطالب بترتيب الأحدث (الحصص اللي فاتت) */
function examHistory(sid, limit){
  const list = sortBy(S.data.exams.filter(e => typeof (S.data.grades[e.id] || {})[sid] === 'number'), e => e.date || '', 'desc');
  return limit ? list.slice(0, limit) : list;
}
function lastExamOf(sid){
  const h = examHistory(sid, 1);
  if (h.length) return h[0];
  const s = student(sid);
  const pool = s && s.groupId ? S.data.exams.filter(e => e.groupId === s.groupId) : S.data.exams;
  return sortBy(pool, e => e.date || '', 'desc')[0] || null;
}
/* الواجب المطلوب: من الامتحان المحدد، أو آخر امتحان مطلوب فيه واجب */
function hwFor(sid, examId){
  if (examId){ const ex = examOf(examId); if (ex && ex.hw) return { text: ex.hw, exam: ex }; }
  const s = student(sid);
  const pool = S.data.exams.filter(e => e.hw && (!s || !s.groupId || !e.groupId || e.groupId === s.groupId));
  const ex = sortBy(pool, e => e.date || '', 'desc')[0];
  return ex ? { text: ex.hw, exam: ex } : null;
}
/* سجل الغياب */
function absRecordsOf(sid, limit){
  const out = [];
  Object.keys(S.data.attendance || {}).forEach(k => {
    const rec = S.data.attendance[k], parts = k.split('@');
    if (((rec || {}).records || {})[sid] === 'absent') out.push({ date: parts[0], groupId: parts[1] === 'none' ? '' : parts[1] });
  });
  return sortBy(out, r => r.date, 'desc').slice(0, limit || 8);
}
function absReason(date, sid){ return (((S.data.absNotes || {})[sid] || {})[date]) || ''; }
function setAbsReason(sid, date, v){
  S.data.absNotes = S.data.absNotes || {};
  const box = S.data.absNotes[sid] = S.data.absNotes[sid] || {};
  const txt = String(v || '').trim();
  if (txt) box[date] = txt; else delete box[date];
  if (!Object.keys(box).length) delete S.data.absNotes[sid];
}
function msgSign(){
  const st = S.data.settings;
  return 'تحياتي — أ. ' + (st.teacherName || 'أحمد فتحي') + (st.phone ? ' · ' + st.phone : '');
}
function absWord(n){ n = Number(n) || 0; return n === 1 ? 'مرة واحدة' : n === 2 ? 'مرتين' : n + ' مرات'; }
function shortDate(s){ const d = parseISO(s); return d ? (d.getDate() + '/' + (d.getMonth() + 1)) : String(s || ''); }
function datesTxt(arr){ return arr.map(shortDate).join('، '); }

/* ---------- رسالة ولي الأمر: المستوى + الدرجات + الأخطاء + الواجب + الغياب ---------- */
function buildParentMsg(sid, opts){
  opts = opts || {};
  const s = student(sid); if (!s) return '';
  const st = S.data.settings;
  const exam = (opts.examId ? examOf(opts.examId) : null) || examHistory(sid, 1)[0] || null;
  const att = attStats(sid);
  const hist = examHistory(sid, 6);
  const abs = absRecordsOf(sid, 4);
  const L = [];
  L.push('السلام عليكم' + (s.guardian ? ' ' + s.guardian : ''));
  L.push('معاك أ. ' + (st.teacherName || 'أحمد فتحي') + ' من ' + (st.platformName || 'منصة المستر') + ' 🌟');
  L.push('تقرير متابعة: ' + s.name + (s.stage ? ' — ' + s.stage : '') + (s.studySystem ? ' (' + s.studySystem + ')' : ''));
  L.push('');
  if (exam && gradeOf(exam, sid) != null){
    const v = gradeOf(exam, sid), pc = gradePC(exam, sid), word = gradeWord(pc);
    const fb = fbOf(exam.id, sid);
    L.push('📝 نتيجة: ' + exam.name + (exam.date ? ' (' + fmtDate(exam.date) + ')' : ''));
    L.push('الدرجة: ' + v + ' من ' + exam.max + (pc != null ? ' — ' + pc + '%' + (word ? ' (' + word + ')' : '') : ''));
    L.push('الأخطاء: ' + (fb.err || 'مفيش أخطاء تستاهل التنبيه 👌'));
    if (exam.hw) L.push('📌 الواجب المطلوب: ' + exam.hw);
    if (fb.hw) L.push('حالة الواجب: ' + (HW_LABEL[fb.hw] || fb.hw));
    L.push('');
  }
  L.push('📊 المستوى في الحصص اللي فاتت (' + nf(hist.length) + (hist.length === 1 ? ' امتحان' : ' امتحانات') + '):');
  if (hist.length){
    hist.forEach(e => {
      const pc = gradePC(e, sid), w = gradeWord(pc);
      L.push('• ' + e.name + ' — ' + gradeOf(e, sid) + ' من ' + e.max + (pc != null ? ' (' + pc + '%' + (w ? ' — ' + w : '') + ')' : ''));
    });
    const avg = examAvg(sid);
    if (avg != null && hist.length > 1) L.push('المتوسط العام: ' + avg + '% — ' + gradeWord(avg));
  } else L.push('• لسه مفيش درجات مسجّلة');
  L.push('');
  L.push('🗓️ الحضور: ' + nf(att.present + att.late) + ' حضور من ' + nf(att.total) + (att.total ? ' (' + att.rate + '%)' : '') + ' · غياب ' + nf(att.absent) + (att.late ? ' · تأخير ' + nf(att.late) : ''));
  if (abs.length){
    L.push('⚠️ غياب ' + absWord(att.absent) + ' في: ' + datesTxt(abs.map(a => a.date)));
    const why = abs.map(a => absReason(a.date, sid)).filter(Boolean);
    if (why.length) L.push('السبب المسجّل عندنا: ' + unique(why).join(' / '));
    else L.push('برجاء توضيح سبب الغياب عشان نتابعه ونعوّض اللي فاته 🙏');
  }
  const hwn = hwFor(sid, exam ? exam.id : '');
  if (hwn && (!exam || !exam.hw)) L.push('📌 الواجب المطلوب حاليًا: ' + hwn.text);
  L.push('');
  L.push(msgSign());
  // 👇 كود المتابعة + رابط المنصة + لينك ابنه — في آخر كل رسالة لولي الأمر
  try{ L.push(''); L.push(Parent.follow(sid)); }catch(e){}
  return L.join('\n');
}

/* ---------- رسالة الطالب: الواجب + الدرجة + الأخطاء ---------- */
function buildStudentMsg(sid, opts){
  opts = opts || {};
  const s = student(sid); if (!s) return '';
  const st = S.data.settings;
  const exam = (opts.examId ? examOf(opts.examId) : null) || examHistory(sid, 1)[0] || null;
  const att = attStats(sid);
  const L = [];

  L.push('معاك أ. ' + (st.teacherName || 'أحمد فتحي'));
  L.push('');
  if (exam && gradeOf(exam, sid) != null){
    const v = gradeOf(exam, sid), pc = gradePC(exam, sid), word = gradeWord(pc), fb = fbOf(exam.id, sid);
    L.push('امتحان: ' + exam.name + (exam.date ? ' (' + fmtDate(exam.date) + ')' : ''));
    L.push('درجتك: ' + v + ' من ' + exam.max + (pc != null ? ' — ' + pc + '%' : '') + (word ? ' (' + word + ')' : ''));
    L.push('غلطت في إيه: ' + (fb.err || 'مفيش أخطاء مهمة — شغل ممتاز 👏'));
    L.push('📌 الواجب: ' + (exam.hw || 'مفيش واجب مطلوب في الامتحان ده'));
    if (fb.hw) L.push('تسليمك للواجب: ' + (HW_LABEL[fb.hw] || fb.hw));

  } else {

    L.push('لسه مفيش درجة مسجّلة لك في امتحان.');
    if (hwn) L.push('📌 الواجب المطلوب: ' + hwn.text);
    L.push('استعد للامتحان الجاي وأنا معاك 💪');
  }
  L.push('');
  L.push('🗓️ حضورك: ' + nf(att.present + att.late) + ' من ' + nf(att.total));
  const abs = absRecordsOf(sid, 3);
  if (abs.length) L.push('⚠️ عندك غياب في: ' + datesTxt(abs.map(a => a.date)) + ' — لو فيه عذر ابعتلي.');
  L.push('');
  L.push('بالتوفيق 🌟');
  L.push(msgSign());
  // لينك صفحة الطالب عشان يبقى عارف مستواه
  try{ L.push(''); L.push(Parent.followStudent(sid)); }catch(e){}
  return L.join('\n');
}

/* ---------- رسالة استفسار عن الغياب ---------- */
function buildAbsenceMsg(sid, date, groupId){
  const s = student(sid); if (!s) return '';
  const st = S.data.settings;
  const recs = date ? [{ date: date, groupId: groupId || s.groupId }] : absRecordsOf(sid, 3);
  const g = groupOf((recs[0] || {}).groupId || s.groupId);
  const reason = (recs.map(r => absReason(r.date, sid)).filter(Boolean)[0]) || '';
  const L = [];
  L.push('السلام عليكم' + (s.guardian ? ' ' + s.guardian : ''));
  L.push('معاك أ. ' + (st.teacherName || 'أحمد فتحي') + ' من ' + (st.platformName || 'منصة المستر'));
  L.push('');
  L.push('📌 ' + s.name + ' مكانش موجود' + (g ? ' في ' + g.name : '') + (recs.length ? ' يوم ' + datesTxt(recs.map(r => r.date)) : ''));
  if (reason) L.push('السبب المسجّل: ' + reason);
  L.push('بنستفسر عن سبب الغياب عشان نتابعه ونعوّض اللي فاته 🙏');
  const abs = absRecordsOf(sid, 6);
  if (abs.length > 1) L.push('(إجمالي الغياب المسجّل: ' + absWord(attStats(sid).absent) + ' — آخرها ' + datesTxt(abs.slice(0, 3).map(a => a.date)) + ')');
  const avg = examAvg(sid);
  if (avg != null) L.push('مستواه الحالي في الامتحانات: ' + avg + '% (' + gradeWord(avg) + ')');
  L.push('');
  L.push('لو الغياب بعذر رسمي ابعتلي وأنا أسجّله ✅');
  L.push(msgSign());
  try{ L.push(''); L.push(Parent.follow(sid)); }catch(e){}   // كود المتابعة + اللينك في رسالة الغياب كمان
  return L.join('\n');
}

function buildMsg(sid, draft){
  draft = draft || {};
  if (draft.kind === 'student') return buildStudentMsg(sid, { examId: draft.examId });
  if (draft.absDate) return buildAbsenceMsg(sid, draft.absDate, draft.groupId);
  return buildParentMsg(sid, { examId: draft.examId });
}

function alerts(){
  const out = [], t = today();
  S.data.students.forEach(s => {
    if (s.status === 'stopped') return;
    const st = studentStatus(s);
    const a30 = attStats(s.id, addDays(t, -30), t);
    if (!s.groupId) out.push({ sev:'warn', icon:'layers', title:`${s.name} بدون حصة`, sub:'حدّد له مجموعة من شاشة المجموعات', act:'assign', id:s.id });
    else if (a30.absent >= (S.data.settings.absentWarn || 3))
      out.push({ sev:'bad', icon:'alert', title:`غياب متكرر: ${s.name}`, sub:`${a30.absent} غياب خلال 30 يوم · نسبة الحضور ${a30.rate}%`, act:'wa', id:s.id });
    if (!s.stage) out.push({ sev:'info', icon:'cap', title:`${s.name} بدون مرحلة`, sub:'حدّد المرحلة الدراسية لتظهر في التقارير', act:'edit', id:s.id });
    const avg = examAvg(s.id);
    if (avg != null && avg < 50) out.push({ sev:'warn', icon:'award', title:`مستوى منخفض: ${s.name}`, sub:`متوسط الدرجات ${avg}% — يحتاج متابعة`, act:'profile', id:s.id });
  });
  const order = { bad:0, warn:1, info:2 };
  return out.sort((a, b) => order[a.sev] - order[b.sev]);
}

/* ---------------- CSV & Files ---------------- */
function download(filename, content, type){
  const blob = new Blob([content], { type: type || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
}
function toCSV(headers, rows){
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  return '\uFEFF' + [headers.map(q).join(',')].concat(rows.map(r => r.map(q).join(','))).join('\r\n');
}
function exportCSV(name, headers, rows){
  download(name + '.csv', toCSV(headers, rows), 'text/csv;charset=utf-8');
  toast('تم تصدير ' + name + '.csv', 'ok');
}

/* ================= Charts ================= */
const Charts = {
  prep(cv, h){
    if (!cv) return null;
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth || (cv.parentElement && cv.parentElement.clientWidth) || 300;
    const hh = h || cv.clientHeight || 200;
    cv.width = w * dpr; cv.height = hh * dpr; cv.style.height = hh + 'px';
    const c = cv.getContext('2d'); if (!c) return null;
    c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, hh);
    c.font = '600 11px Cairo, Tahoma, sans-serif';
    return { c: c, w: w, h: hh };
  },
  css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); },
  bar(cv, labels, values, opt){
    opt = opt || {};
    const p = this.prep(cv); if (!p) return;
    const { c, w, h } = p, padB = 26, padT = 22, padS = 8;
    const max = Math.max(1, Math.max.apply(null, values.concat([0]))) * 1.15;
    const n = values.length || 1, slot = (w - padS * 2) / n, bw = Math.min(46, slot * 0.56);
    c.strokeStyle = this.css('--line');
    for (let i = 0; i <= 4; i++){ const yy = padT + ((h - padT - padB) / 4) * i; c.beginPath(); c.moveTo(padS, yy); c.lineTo(w - padS, yy); c.stroke(); }
    values.forEach((v, i) => {
      const bh = (h - padT - padB) * (v / max), x = padS + slot * i + (slot - bw) / 2, yy = h - padB - bh;
      const col = v > 0 ? (opt.color || this.css('--brand') || '#fac518') : this.css('--line');
      if (bh > 0){ c.fillStyle = col; c.fillRect(x, yy, bw, bh); }
      c.fillStyle = this.css('--muted-2'); c.textAlign = 'center';
      c.fillText(String(labels[i] || ''), x + bw / 2, h - padB + 16);
      if (v > 0){ c.fillStyle = this.css('--ink-2'); c.font = '700 11px Cairo, Tahoma, sans-serif';
        c.fillText(opt.fmt ? opt.fmt(v) : nf(v), x + bw / 2, yy - 6); c.font = '600 11px Cairo, Tahoma, sans-serif'; }
    });
  },
  line(cv, labels, values, opt){
    opt = opt || {};
    const p = this.prep(cv); if (!p) return;
    const { c, w, h } = p, padB = 24, padT = 14, padS = 26;
    const vals = values.filter(v => v != null);
    const max = opt.max || Math.max(1, Math.max.apply(null, vals.concat([0]))) * 1.15;
    const iw = w - padS - 10, ih = h - padB - padT;
    c.strokeStyle = this.css('--line');
    for (let i = 0; i <= 4; i++){ const yy = padT + (ih / 4) * i; c.beginPath(); c.moveTo(padS, yy); c.lineTo(w - 8, yy); c.stroke();
      c.fillStyle = this.css('--muted-2'); c.textAlign = 'left'; c.fillText(String(Math.round(max - (max / 4) * i)), 2, yy + 4); }
    const step = values.length > 1 ? iw / (values.length - 1) : iw;
    const pts = values.map((v, i) => ({ x: padS + step * i, y: v == null ? null : padT + ih - ih * (v / max) }));
    const def = pts.filter(p2 => p2.y != null);
    const col = opt.color || this.css('--ok') || '#12a150';
    if (def.length > 1){
      c.beginPath(); c.moveTo(def[0].x, padT + ih);
      def.forEach(p2 => c.lineTo(p2.x, p2.y));
      c.lineTo(def[def.length-1].x, padT + ih); c.closePath();
      c.fillStyle = col + '22'; c.fill();
      c.beginPath(); def.forEach((p2, i) => i ? c.lineTo(p2.x, p2.y) : c.moveTo(p2.x, p2.y));
      c.strokeStyle = col; c.lineWidth = 2.5; c.lineJoin = 'round'; c.stroke();
    }
    pts.forEach(p2 => { if (p2.y == null) return;
      c.beginPath(); c.arc(p2.x, p2.y, 4, 0, Math.PI * 2); c.fillStyle = this.css('--card'); c.fill();
      c.lineWidth = 2.5; c.strokeStyle = col; c.stroke(); });
    c.fillStyle = this.css('--muted-2'); c.textAlign = 'center';
    labels.forEach((l, i) => { if (labels.length <= 16 || i % 2 === 0) c.fillText(String(l), pts[i].x, h - 7); });
  },
  donut(cv, data){
    const p = this.prep(cv, (cv && cv.clientHeight) || 190); if (!p) return;
    const { c, w, h } = p, total = sum(data, d => d.value);
    const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 10, r = R * 0.62;
    if (!total){ c.fillStyle = this.css('--muted'); c.textAlign = 'center'; c.fillText('لا توجد بيانات', cx, cy); return; }
    let a0 = -Math.PI / 2;
    data.forEach(d => {
      const a1 = a0 + (d.value / total) * Math.PI * 2;
      c.beginPath(); c.arc(cx, cy, R, a0, a1); c.arc(cx, cy, r, a1, a0, true); c.closePath();
      c.fillStyle = d.color || '#fac518'; c.fill();
      c.strokeStyle = this.css('--card'); c.lineWidth = 2; c.stroke();
      a0 = a1;
    });
    c.fillStyle = this.css('--ink'); c.textAlign = 'center'; c.font = '800 20px Cairo, Tahoma, sans-serif';
    c.fillText(nf(total), cx, cy + 2);
    c.font = '600 11px Cairo, Tahoma, sans-serif'; c.fillStyle = this.css('--muted');
    c.fillText('طالب', cx, cy + 18);
  }
};

Views.students = function(){
  const f = S.ui.stuFilter;
  let list = S.data.students.slice();
  const q = S.query.trim().toLowerCase();
  if (q) list = list.filter(s => (s.name + ' ' + (s.code||'') + ' ' + (s.phone||'') + ' ' + (s.parentPhone||'') + ' ' + (s.guardian||'') + ' ' + (s.stage||'')).toLowerCase().includes(q));
  if (f.stage) list = list.filter(s => s.stage === f.stage);
  if (f.groupId) list = list.filter(s => (s.groupId || '') === f.groupId);
  if (f.payMode) list = list.filter(s => (s.payMode || 'monthly') === f.payMode);
  if (f.type) list = list.filter(s => s.type === f.type);
  if (f.status) list = list.filter(s => (s.status || 'active') === f.status);
  const sorters = { name: x => x.name || '', joinDate: x => x.joinDate || '', rate: x => attStats(x.id).rate, avg: x => -1 * (examAvg(x.id) || 0), stage: x => x.stage || '', group: x => groupName(x.groupId) };
  list = sortBy(list, sorters[f.sort] || sorters.name, (f.sort === 'rate') ? 'desc' : 'asc');

  const shownList = list.slice(0, S.ui.stuLimit || 60);
  const rows = shownList.map(s => {
    const a = attStats(s.id), avg = examAvg(s.id), stt = studentStatus(s), g = groupOf(s.groupId);

      <td>${stuCell(s)}</td>

function groupCards(list){
  if (!list.length) return '';
  return list.map(g => {
    const ss = studentsOfGroup(g.id);
    const rate = ss.length ? Math.round(sum(ss, s => attRate(s.id)) / ss.length) : 0;
    const conflict = null;
    return `<div class="card">

}

let attDraft = null;

/* ================= الحضور والغياب ================= */
Views.attendance = function(){
  const a = S.ui.att;
  if (!S.data.groups.length){
    return pageHead('الحضور والغياب', 'أنشئ حصة أولًا لتسجيل الحضور') +
      `<div class="card"><div class="card-b">${emptyState('لا توجد حصص',
        'الحضور بيتسجل لكل حصة على حدة — ابدأ بإنشاء حصة وتحديد يومها ومواعيدها',
        `<button class="btn pri" data-act="addGroup">${icon('plus')} إنشاء حصة</button>`)}</div></div>`;
  }
  let gid = a.groupId;
  if (!gid || !groupOf(gid)){
    const dg = groupsSorted().find(g => Number(g.day) === parseISO(a.date).getDay());
    gid = (dg || groupsSorted()[0] || {}).id;
    a.groupId = gid;
  }
  if (attDraft == null || attDraft.date !== a.date || attDraft.groupId !== gid){
    const saved = getAtt(a.date, gid);
    attDraft = { date: a.date, groupId: gid, records: Object.assign({}, (saved && saved.records) || {}), note: (saved && saved.note) || '', dirty: false };
  }
  const g = groupOf(gid);
  const ss = studentsOfGroup(gid).filter(s => s.status !== 'stopped');
  const rec = attDraft.records;
  const counts = { present:0, absent:0, late:0, excused:0 };
  ss.forEach(s => { if (rec[s.id] && counts[rec[s.id]] != null) counts[rec[s.id]]++; });
  const marked = sum(Object.values(counts));
  const dow = parseISO(a.date) ? parseISO(a.date).getDay() : 0;
  const sameDay = g && Number(g.day) === dow;

  /* كشف الشهر للحصة المختارة */
  const y = Number(a.date.slice(0,4)), m = Number(a.date.slice(5,7));
  const lastD = new Date(y, m, 0).getDate();
  const mDays = [];
  for (let d = 1; d <= lastD; d++) mDays.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);

  return pageHead('الحضور والغياب', `${esc(g ? g.name : '')} · ${ar(ss.length)} طالب`,
    `<button class="btn" data-act="attPDF">${icon('pdf')} كشف الحضور PDF</button>
     <button class="btn" data-act="expAtt">${icon('download')} Excel</button>
     <button class="btn pri" data-act="attSave">${icon('save')} حفظ الحضور</button>
     <button class="btn" data-act="waAbsent">${icon('whatsapp')} رسائل الغياب${counts.absent ? ' (' + ar(counts.absent) + ')' : ''}</button>`) + `

  <div class="card">
    <div class="card-h">
      <h3>${icon('check-square')} تسجيل الحضور</h3>
      <span class="sp"></span>
      <input type="date" class="inp" style="max-width:165px" data-att="date" value="${a.date}">
      <select class="inp" style="max-width:260px" data-att="group">
        ${groupsSorted().map(x => `<option value="${x.id}" ${gid === x.id ? 'selected' : ''}>${esc(x.name)} — ${AR_DAYS[x.day]} ${timeRange(x)}</option>`).join('')}
      </select>
    </div>
    <div class="card-b">
      ${!sameDay ? `<div class="help" style="margin-bottom:12px">ملاحظة: الحصة دي يوم <b>${AR_DAYS[g.day]}</b> وأنت بتسجّل يوم <b>${AR_DAYS[dow]}</b> (${fmtDate(a.date)}) — التسجيل مسموح لأي يوم.</div>` : ''}
      ${ss.length ? `
      <div class="flex wrap" style="margin-bottom:12px">
        <button class="btn sm" data-act="attAll" data-v="present">${icon('check')} الكل حاضر</button>
        <button class="btn sm ghost" data-act="attClear">${icon('refresh')} تفريغ</button>
        <div class="sp"></div>
        <div class="att-sum">
          <span class="k"><i style="background:var(--ok)"></i> حاضر ${counts.present}</span>
          <span class="k"><i style="background:var(--warn)"></i> متأخر ${counts.late}</span>
          <span class="k"><i style="background:var(--bad)"></i> غائب ${counts.absent}</span>
          <span class="k"><i style="background:var(--info)"></i> بعذر ${counts.excused}</span>
          <span class="badge ${marked === ss.length && ss.length ? 'b-ok' : 'b-warn'}">${marked}/${ss.length} مُسجَّل</span>
        </div>
      </div>
      <div id="attList">${ss.map(s => `
        <div class="att-row" data-sid="${s.id}">
          ${avatar(s.name, s.id)}
          <span class="an"><b>${esc(s.name)}</b>
            <span>${esc(s.stage || '')}${s.code ? ' · ' + esc(s.code) : ''} · حضور سابق ${attRate(s.id)}%</span></span>
          <span class="seg">
            ${[['present','حاضر'],['late','متأخر'],['absent','غائب'],['excused','بعذر']].map(x =>
              `<button data-act="mark" data-id="${s.id}" data-v="${x[0]}" class="${rec[s.id] === x[0] ? 'on' : ''}">${x[1]}</button>`).join('')}
          </span>
        </div>`).join('')}</div>
      <div class="field" style="margin-top:13px;margin-bottom:0"><label>ملاحظة الحصة ${icon('edit')}</label>
        <input class="inp" id="attNote" placeholder="مثال: تم حل تمارين الوحدة الثانية..." value="${esc(attDraft.note)}"></div>
      ` : emptyState('لا يوجد طلاب في هذه الحصة', 'أضف طلاب للحصة من شاشة المجموعات أو من ملف الطالب',
          `<button class="btn pri" data-act="manageGroup" data-id="${gid}">${icon('plus')} إضافة طلاب للحصة</button>`)}
    </div>
  </div>

  <div class="card mt">
    <div class="card-h"><h3>${icon('calendar')} كشف شهر ${monthName(a.date.slice(0,7))}</h3><span class="sub">${esc(g ? g.name : '')}</span>
      <span class="sp"></span>
      <div class="att-sum"><span class="k"><i style="background:var(--ok)"></i>حاضر</span><span class="k"><i style="background:var(--bad)"></i>غائب</span>
        <span class="k"><i style="background:var(--warn)"></i>متأخر</span><span class="k"><i style="background:var(--info)"></i>بعذر</span></div>
    </div>
    <div class="tbl-wrap"><table class="tbl" id="attMatrix">
      <thead><tr><th style="min-width:160px">الطالب</th>
      ${mDays.map(d => `<th style="text-align:center;padding:6px 3px;min-width:32px">${Number(d.slice(-2))}</th>`).join('')}
      <th>حضور</th><th>غياب</th><th>النسبة</th></tr></thead>
      <tbody>${ss.map(s => {
        let p = 0, ab = 0, l = 0, ex = 0;
        const cells = mDays.map(d => {
          const rr = getAtt(d, gid); const v = rr && rr.records[s.id];
          if (v === 'present') p++; else if (v === 'absent') ab++; else if (v === 'late') l++; else if (v === 'excused') ex++;
          const ch = v === 'present' ? '✓' : v === 'absent' ? '✕' : v === 'late' ? 'م' : v === 'excused' ? 'ع' : '';
          return `<td style="padding:3px 2px"><div class="cd ${v || ''}" data-cell="${s.id}:${d}" style="border-radius:7px;aspect-ratio:auto;height:26px">${ch}</div></td>`;
        }).join('');
        const counted = p + ab + l, rate = counted ? Math.round(((p + l) / counted) * 100) : 0;
        return `<tr><td>${stuCell(s)}</td>${cells}
          <td class="num" style="color:var(--ok)">${p + l}</td>
          <td class="num" style="color:var(--bad)">${ab}</td>
          <td>${counted ? `<span class="badge ${rate >= 80 ? 'b-ok' : rate >= 60 ? 'b-warn' : 'b-bad'}">${rate}%</span>` : '<span class="muted small">—</span>'}</td></tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>`;
};

      </div>
    </div>

      <div class="card-h"><h3>${esc(sel.name)}</h3>

  <div id="repOut" class="mt">${reportPreview()}</div>`;

function repRows(){
  const r = S.ui.rep;
  let ss = S.data.students.slice();
  if (r.stage) ss = ss.filter(s => s.stage === r.stage);
  if (r.groupId) ss = ss.filter(s => s.groupId === r.groupId);
  return ss;
}
function reportPreview(){
  const r = S.ui.rep, ss = repRows();
  if (r.kind === 'student'){
    const s = student(r.studentId) || S.data.students[0];
    if (!s) return `<div class="card"><div class="card-b">${emptyState('لا يوجد طلاب','أضف طالبًا أولًا')}</div></div>`;
    const a = attStats(s.id), g = groupOf(s.groupId);
    return `<div class="card"><div class="card-h"><h3>${icon('user')} ملف متابعة: ${esc(s.name)}</h3><span class="sp"></span>
      <button class="btn sm pri" data-act="pdfStudent" data-id="${s.id}">${icon('pdf')} PDF</button></div>
      <div class="card-b"><dl class="kv">
        <dt>المرحلة</dt><dd>${esc(s.stage || '—')} ${s.studySystem ? '· ' + esc(s.studySystem) : ''}</dd>
        <dt>نوع الطالب</dt><dd>${esc(s.type || '—')}</dd>
        <dt>المستوى</dt><dd>${esc(s.level || '—')}</dd>
        <dt>الحصة</dt><dd>${g ? esc(g.name) + ' — ' + dayTimeText(g) : 'بدون حصة'}</dd>
        <dt>نظام الدفع</dt><dd>${esc(payLabel(s.payMode))}</dd>
        <dt>هاتف الطالب / ولي الأمر</dt><dd>${esc(s.phone || '—')} / ${esc(s.parentPhone || '—')}</dd>
        <dt>نسبة الحضور</dt><dd>${a.rate}% (${a.present + a.late} حضور · ${a.absent} غياب · ${a.late} تأخير من ${a.total})</dd>
        <dt>متوسط الدرجات</dt><dd>${examAvg(s.id) == null ? '—' : examAvg(s.id) + '%'}</dd>
        <dt>ملاحظات</dt><dd>${esc(s.notes || '—')}</dd>
      </dl></div></div>`;
  }
  if (r.kind === 'attendance'){
    const rows = ss.map(s => {
      const a = attStats(s.id, r.from, r.to);
      return [s.name, s.stage || '—', groupName(s.groupId), a.present, a.late, a.absent, a.excused, a.total, a.rate + '%'];
    });
    return previewCard('كشف الحضور', `من ${fmtDate(r.from)} إلى ${fmtDate(r.to)}`,
      ['الطالب','المرحلة','الحصة','حاضر','متأخر','غائب','بعذر','إجمالي','النسبة'], rows, [1,2,3,4,5,6,7,8]);
  }
  if (r.kind === 'students'){
    const rows = ss.map(s => [s.name, s.stage || '—', s.studySystem || '—', s.type || '—', groupName(s.groupId), s.groupId ? dayTimeText(groupOf(s.groupId)) : '—', payLabel(s.payMode), attRate(s.id) + '%', examAvg(s.id) == null ? '—' : examAvg(s.id) + '%']);
    return previewCard('كشف الطلاب', `${ss.length} طالب`,
      ['الطالب','المرحلة','نظام الدراسة','النوع','الحصة','المواعيد','الدفع','الحضور','الدرجات'], rows, [7,8]);
  }
  if (r.kind === 'exams'){
    const e = examOf(r.examId) || S.data.exams[0];
    if (!e) return `<div class="card"><div class="card-b">${emptyState('لا توجد امتحانات','أنشئ امتحانًا أولًا')}</div></div>`;
    const gr = S.data.grades[e.id] || {};
    let sts = (e.groupId ? studentsOfGroup(e.groupId) : (e.stage ? studentsOfStage(e.stage) : S.data.students)).filter(s => typeof gr[s.id] === 'number');
    sts = sortBy(sts, s => gr[s.id], 'desc');
    let rank = 0, prev = null;
    const rows = sts.map((s, i) => { if (prev === null) rank = 0; else if (gr[s.id] !== prev) rank = i; prev = gr[s.id];
      return [String(rank + 1), s.name, s.stage || '—', groupName(s.groupId), gr[s.id], e.max, Math.round(gr[s.id] / e.max * 100) + '%']; });
    const avg = sts.length ? (sum(sts, s => gr[s.id]) / sts.length).toFixed(1) : '—';
    return `<div class="card"><div class="card-h"><h3>${icon('award')} ${esc(e.name)}</h3>
      <span class="sub">${esc(e.stage || '')}${e.groupId ? ' · ' + esc(groupName(e.groupId)) : ''} · ${fmtDate(e.date)} · الدرجة النهائية ${e.max}</span>
      <span class="sp"></span><span class="badge b-brand">المتوسط ${avg}</span></div>
      <div class="card-b">${previewTable(['ترتيب','الطالب','المرحلة','الحصة','الدرجة','من','النسبة'], rows, [0,4,5,6])}</div></div>`;
  }
  /* summary */
  const attR = ss.map(s => attStats(s.id, r.from, r.to)).reduce((t, a) => ({ t: t.t + a.total, ok: t.ok + a.present + a.late, ab: t.ab + a.absent }), { t:0, ok:0, ab:0 });
  const avgs = ss.map(s => examAvg(s.id)).filter(v => v != null);
  const rows = [
    ['عدد الطلاب', nf(ss.length)],
    ['الطلاب النشطين', nf(ss.filter(s => s.status === 'active').length)],
    ['عدد الحصص الأسبوعية', nf(S.data.groups.length)],
    ['طلاب بدون حصة', nf(ss.filter(s => !s.groupId).length)],
    ['عدد تسجيلات الحضور بالفترة', nf(attR.t)],
    ['نسبة الحضور بالفترة', (attR.t ? Math.round(attR.ok / attR.t * 100) : 0) + '%'],
    ['إجمالي الغياب بالفترة', nf(attR.ab)],
    ['عدد الامتحانات', nf(S.data.exams.length)],
    ['متوسط الدرجات العام', avgs.length ? Math.round(sum(avgs) / avgs.length) + '%' : '—'],
    ['عدد المراحل المسجلة', nf(unique(ss.map(s => s.stage).filter(Boolean)).length)]
  ];
  return previewCard('تقرير عام', `من ${fmtDate(r.from)} إلى ${fmtDate(r.to)}`, ['البند','القيمة'], rows, [1]);
}
function previewTable(headers, rows, numCols){
  numCols = numCols || [];
  return `<div class="tbl-wrap" style="max-height:620px"><table class="tbl">
    <thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${numCols.includes(i) ? 'num' : ''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function previewCard(title, sub, headers, rows, numCols){
  return `<div class="card"><div class="card-h"><h3>${icon('chart')} ${title}</h3><span class="sub">${esc(sub)}</span>
    <span class="sp"></span><span class="badge b-brand">${nf(rows.length)} سجل</span></div>
    <div class="card-b">${rows.length ? previewTable(headers, rows, numCols) : emptyState('لا توجد بيانات مطابقة','غيّر الفلاتر ثم اضغط تحديث المعاينة')}</div></div>`;
}
