/* ---------------- Boot ---------------- */
/* ============================================================
   وضع ولي الأمر — شاشة المتابعة (بتفتح من الرابط اللي المستر بيبعته)
   • الرابط شكله: .../?p=التوكن&c=كود-المنصة&k=مفتاح-فايربيز
   • الشاشة بتقرا ملف صغير جدًا من فايربيز فيه بيانات الطالب لوحده
   • مفيش أي كتابة ولا تعديل — قراءة بس، وبتتحدّث لوحدها
   ============================================================ */
const PMode = {
  token:'', code:'', key:'', rec:null, es:null, timer:null, busy:false,
  lsGet(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } },
  qp(n){ try{ return (new URLSearchParams(String(location.search || ''))).get(n) || ''; }catch(e){ return ''; } },
  fromUrl(){
    let t = this.qp('p');
    if (!t){ const h = String(location.hash || ''); if (h.indexOf('#p=') === 0) t = h.slice(3).split('&')[0]; }
    if (t) return t;
    return this.remembered();          // نفس الجهاز: بيفتح على صفحة ابنه على طول
  },
  remembered(){
    try{
      const role = localStorage.getItem('mostar_role') || '';
      if (role === 'owner' || role === 'teacher') return '';     // جهاز المستر/المدرس مايفضلش عالق
      return localStorage.getItem('mostar_ptok') || '';
    }catch(e){ return ''; }
  },
  remember(token){
    try{
      const role = localStorage.getItem('mostar_role') || '';
      if (role === 'owner' || role === 'teacher') return;
      localStorage.setItem('mostar_ptok', token);
      const c = this.qp('c'); if (c) localStorage.setItem('mostar_pcode', c);
      const k = this.qp('k'); if (k) localStorage.setItem('mostar_pkey', k);
    }catch(e){}
  },
  forget(){
    try{ localStorage.removeItem('mostar_ptok'); localStorage.removeItem('mostar_pcode'); localStorage.removeItem('mostar_pkey'); }catch(e){}
    try{ const u = String(location.href).split('?')[0]; location.replace(u); }catch(e){ try{ location.reload(); }catch(err){} }
  },
  async start(){
    const token = this.fromUrl(); if (!token) return false;
    this.token = token;
    this.code = this.qp('c') || this.lsGet('mostar_pcode') || FB_DEFAULT.code || FB_DEFAULT.projectId;
    this.key = this.qp('k') || this.lsGet('mostar_pkey') || '';
    this.remember(token);
    try{
      let th = ''; try{ th = localStorage.getItem(LS_KEY + '_theme') || ''; }catch(e){}
      if (!th) th = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.dataset.theme = th;
    }catch(e){}
    document.body.classList.add('pmode');
    this.node = document.createElement('div'); this.node.id = 'pview';
    document.body.appendChild(this.node);
    this.loading('بنجهّز لك متابعة ابنك...');
    try{
      const pid = this.code;
      Cloud._active = Object.assign({}, FB_DEFAULT, { projectId: pid, code: pid, authDomain: pid + '.firebaseapp.com', dbUrl: FB_DEFAULT.dbUrl, apiKey: this.key || '' });
      Cloud._key = null;
      if (this.key){ try{ Cloud.saveKeyFor(pid, this.key); }catch(e){} }
    }catch(e){}
    try{ await Cloud.ensureTok(); }catch(e){}
    await this.load();
    this.watch();
    return true;
  },
  loading(t){
    if (!this.node) return;
    this.node.innerHTML = '<div class="pm-load"><div class="pm-spin"></div>' + esc(t || 'لحظة...') + '</div>';
  },
  async load(){
    if (this.busy) return;
    this.busy = true;
    let rec = null, err = '';
    try{ rec = await Cloud.rtdb('GET', Cloud.rootPath() + '/parents/' + this.token, null, false, '?t=' + Date.now()); }
    catch(e){ err = (e && e.message) || 'مشكلة في الاتصال'; }
    this.busy = false;
    if (rec && typeof rec === 'object'){ this.rec = rec; this.render(); return; }
    if (this.rec) return;                       // عندنا نسخة قديمة → نفضل عليها
    if (err) this.fail(err); else this.gone();
  },
  header(){
    const r = this.rec || {};
    return `<div class="pm-head">
      <img src="logo.jpg" alt="" onerror="this.style.display='none'">
      <div><div class="pm-plat">${esc(r.tname || 'منصة المستر')}</div><div class="pm-sub">متابعة ولي الأمر</div></div>
      <span style="flex:1"></span>
      <button class="btn sm ghost" data-pm="reload">${icon('refresh')} تحديث</button>
    </div>`;
  },
  hook(){
    const btn = this.node && this.node.querySelector('[data-pm="reload"]');
    if (btn) btn.onclick = () => { this.loading('بنحدّث البيانات...'); this.load(); };
    const fg = this.node && this.node.querySelector('[data-pm="forget"]');
    if (fg) fg.onclick = e => { e.preventDefault(); this.forget(); };
  },
  pmDate(d){
    const t = String(d || '');
    if (t.length >= 10 && t.charAt(4) === '-') return t.slice(8, 10) + '/' + t.slice(5, 7) + '/' + t.slice(0, 4);
    return t;
  },
  ago(at){
    const ms = Date.now() - new Date(String(at || '')).getTime();
    if (!isFinite(ms) || ms < 0) return 'الآن';
    const m = Math.round(ms / 60000);
    if (m < 1) return 'الآن';
    if (m < 60) return 'من ' + m + ' دقيقة';
    const h = Math.round(m / 60);
    if (h < 24) return 'من ' + h + ' ساعة';
    return this.pmDate(String(at || '').slice(0, 10));
  },
  fail(err){
    const msg = String(err || '');
    const perm = /permission|denied|401|403|unauthorized/i.test(msg);
    this.node.innerHTML = this.header() + `
      <div class="pm-card">
        <div class="pm-alert"><b>مش قادرين نعرض البيانات دلوقتي</b><br>
        ${perm ? 'الرابط ده محتاج يتجدّد من جهاز المستر. اطلب من المستر يفتح ملف الطالب ← «رابط متابعة ولي الأمر» ← «رابط جديد» ويبعتهولك تاني.'
               : 'اتأكد إن النت شغال وجرّب تاني بعد شوية.'}</div>
        <div class="pm-btns"><button class="btn pri" data-pm="reload">${icon('refresh')} جرّب تاني</button></div>
      </div>
      <div class="pm-foot">${esc(msg)}</div>`;
    this.hook();
  },
  gone(){
    this.node.innerHTML = this.header() + `
      <div class="pm-card">
        <div class="pm-alert"><b>الرابط مش شغال</b><br>يمكن الرابط قديم أو المستر عمل رابط جديد.
        اطلب منه يبعتهولك تاني من ملف الطالب.</div>
      </div>`;
    this.hook();
  },
  render(){
    const r = this.rec || {};
    const att = Array.isArray(r.att) ? r.att : [];
    const ex = Array.isArray(r.ex) ? r.ex : [];
    const notes = Array.isArray(r.notes) ? r.notes : [];
    const abs = Array.isArray(r.abs) ? r.abs : [];
    const tot = r.tot || { present: 0, absent: 0, late: 0, rate: 0, total: att.length };
    const LAB = { present:'حاضر', absent:'غائب', late:'متأخر', excused:'بعذر' };
    const TON = { present:'ok', absent:'bad', late:'warn', excused:'' };
    try{ document.title = 'متابعة ' + (r.name || '') + ' — ' + (r.tname || 'منصة المستر'); }catch(e){}
    const rate = Math.max(0, Math.min(100, Number(tot.rate) || 0));
    const rcol = rate >= 75 ? 'var(--ok)' : rate >= 50 ? 'var(--warn)' : 'var(--bad)';
    const last = att.slice(-14).reverse();
    const avg = ex.length ? Math.round(ex.reduce((a, e) => a + (e.max ? (Number(e.m) / Number(e.max)) * 100 : 0), 0) / ex.length) : null;
    const exs = ex.slice(-12).reverse();
    this.node.innerHTML = this.header() + `
      <div class="pm-kid"><div class="n">${esc(r.name || '')}</div>
        <div class="s">${esc(r.stage || '')}${r.group ? ' · ' + esc(r.group) : ''}</div></div>

      <div class="pm-card">
        <h3>${icon('check')} الحضور</h3>
        <div class="pm-rate">
          <div class="pm-num" style="color:${rcol}">${rate}%</div>
          <div style="flex:1">
            <div class="pm-bar"><i style="width:${rate}%;background:${rcol}"></i></div>
            <div class="small muted" style="margin-top:6px">من إجمالي ${tot.total || att.length} حصة مسجّلة</div>
          </div>
        </div>
        <div class="pm-chips">
          <span class="pm-chip ok">حضر ${tot.present || 0}</span>
          <span class="pm-chip bad">غاب ${tot.absent || 0}</span>
          <span class="pm-chip warn">تأخر ${tot.late || 0}</span>
        </div>
        ${last.length ? `<div style="margin-top:12px">${last.map(a => `<div class="pm-row">
            <span class="pm-chip ${TON[a.s] || ''}">${LAB[a.s] || esc(a.s || '')}</span>
            <span style="flex:1"></span><span class="d">${this.pmDate(a.d)}</span></div>`).join('')}</div>`
          : '<div class="pm-empty">لسه مفيش حضور مسجّل</div>'}
      </div>

      <div class="pm-card">
        <h3>${icon('award')} الدرجات
          <span style="flex:1"></span>${avg != null ? `<span class="badge ${avg >= 75 ? 'b-ok' : avg >= 50 ? 'b-warn' : 'b-bad'}">المتوسط ${avg}%</span>` : ''}</h3>
        ${exs.length ? exs.map(e => {
          const pc = e.max ? Math.round((Number(e.m) / Number(e.max)) * 100) : null;
          const cl = pc == null ? '' : pc >= 75 ? 'ok' : pc >= 50 ? 'warn' : 'bad';
          return `<div class="pm-row"><div><div class="t">${esc(e.n || 'امتحان')}</div>
            <div class="d">${this.pmDate(e.d)}</div></div><span style="flex:1"></span>
            <span class="pm-g ${cl}">${esc(String(e.m))}${e.max ? ' / ' + esc(String(e.max)) : ''}</span>
            ${pc != null ? `<span class="pm-chip ${cl === 'ok' ? 'ok' : cl === 'bad' ? 'bad' : 'warn'}">${pc}%</span>` : ''}</div>`;
        }).join('') : '<div class="pm-empty">لسه مفيش درجات مسجّلة</div>'}
      </div>

      <div class="pm-card">
        <h3>${icon('book')} ملاحظات المستر</h3>
        ${notes.length ? notes.slice(0, 10).map(n => `<div class="pm-note">
            <b>${esc(n.n || 'امتحان')} · ${this.pmDate(n.d)}</b>
            ${n.err ? '<div>🔻 الأخطاء: ' + esc(n.err) + '</div>' : ''}
            ${n.hw ? '<div>📘 الواجب: ' + esc(n.hw) + '</div>' : ''}</div>`).join('')
          : '<div class="pm-empty">مفيش ملاحظات لحد الآن</div>'}
        ${abs.length ? `<div style="margin-top:10px"><b class="small">ملاحظات الغياب</b>
          ${abs.slice(0, 8).map(a => `<div class="pm-row"><span class="d">${this.pmDate(a.d)}</span><span style="flex:1"></span><span>${esc(a.n)}</span></div>`).join('')}</div>` : ''}
      </div>

      <div class="pm-btns">
        ${r.tphone ? `<a class="btn pri" target="_blank" rel="noopener" href="${waLink(r.tphone, 'السلام عليكم أ. ' + (r.tname || '') + '، بخصوص ' + (r.name || '') + ' — ')}">${icon('whatsapp')} كلّم المستر</a>` : ''}
        <button class="btn" data-pm="reload">${icon('refresh')} تحديث</button>
      </div>
      <div class="pm-foot">
        آخر تحديث: ${this.ago(r.at)} · البيانات بتتحدّث لوحدها أول ما يحصل أي جديد
        <br>الصفحه دي للقراءة فقط — مفيش أي تعديل ممكن منها
        <br><a href="#" data-pm="forget" style="color:var(--muted)">مش ده جهازي؟ ارجع لصفحة المنصة</a>
      </div>`;
    this.hook();
  },
  watch(){
    this.stop();
    const self = this;
    (async () => {
      let tok = '';
      try{ tok = await Cloud.ensureTok(); }catch(e){ tok = ''; }
      if (typeof EventSource !== 'undefined'){
        let url = Cloud.dbUrl() + '/' + Cloud.rootPath() + '/parents/' + this.token + '.json';
        if (tok) url += '?auth=' + encodeURIComponent(tok);
        let es = null;
        try{ es = new EventSource(url); }catch(e){ es = null; }
        if (es){
          self.es = es;
          const on = ev => {
            let d = null; try{ d = JSON.parse(ev.data); }catch(e){ return; }
            if (!d || d.data == null || typeof d.data !== 'object') return;
            self.rec = d.data; self.render();
          };
          es.addEventListener('put', on);
          es.addEventListener('patch', on);
          es.addEventListener('open', () => {});
          es.addEventListener('error', () => { if (!self.timer) self.poll(); });
        }
      }
      self.poll();
    })();
  },
  poll(){
    clearInterval(this.timer);
    this.timer = setInterval(() => { if (!this.busy && !document.hidden) this.load(); }, 90000);
  },
  stop(){
    if (this.es){ try{ this.es.close(); }catch(e){} this.es = null; }
    clearInterval(this.timer); this.timer = null;
  }
};

(function boot(){
  // لو الرابط رابط متابعة ولي أمر → شاشة المتابعة على طول (مفيش أي حاجة تانية)
  try{ if (PMode.fromUrl()){ PMode.start(); return; } }catch(e){}
  try{ if (JMode.fromUrl()){ JMode.start(); return; } }catch(e){}
  let theme = localStorage.getItem(LS_KEY + '_theme');
  if (!theme) theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
  // أي خطأ يحصل في المنصة بيتسجّل لوحده — عشان نقدر نصلّحه من غير تخمين
  window.addEventListener('error', e => logErr('js', (e && e.message) || 'خطأ غير معروف', ((e && e.filename) || '') + ':' + ((e && e.lineno) || '')));
  window.addEventListener('unhandledrejection', e => logErr('promise', (e && e.reason && (e.reason.message || e.reason)) || 'وعد مرفوض'));
  let had = loadLocal();
  if (!had && loadSafeCopy()){
    had = true;
    setTimeout(() => toast('المتصفح كان مسح الداتا — رجّعنا لك آخر نسخة أمان من الجهاز نفسه ✅ (راجع إن كل حاجة زي ما هي)', 'warn', 'استرجاع تلقائي'), 900);
  }
  if (!had){ const d = defaultData(); d.meta.rev = 1; S.data = d; saveLocal(); }
  S.data.settings.theme = theme;
  const use = $('#themeBtn use'); if (use) use.setAttribute('href', theme === 'dark' ? '#i-sun' : '#i-moon');
  const mt = document.querySelector('meta[name=theme-color]');
  if (mt) mt.setAttribute('content', theme === 'dark' ? '#0b0b0d' : '#fac518');
  try{ Roles.init(); }catch(e){}
  PWA.init();
  paintCloud(); paintLogo();
  const h = (location.hash || '').slice(1);
  if (VIEW_LIST.includes(h)) S.view = h;
  render();
  if (!had) setTimeout(() => toast('أهلًا بك في منصة المستر 👋 ابدأ بإنشاء حصة ثم إضافة الطلاب', 'info', 'مرحبًا'), 700);

  /* السحابة: الإعدادات جاهزة جوه الكود → اتصال تلقائي ومزامنة تلقائية */
  const cfg = Cloud.merged();
  S.fb.cfg = cfg;
  if (cfg && (cfg.dbUrl || (cfg.apiKey && cfg.projectId))){
    Cloud.writeCfg(cfg);        // تصحيح ذاتي: الإعدادات الصح تتحفظ على الجهاز
    setTimeout(() => Cloud.connect({ config: cfg, auto: true, silent: true }), 300);
  }

  /* فحص فوري لما ترجع للصفحة أو تفتحها تاني */
  window.addEventListener('focus', () => { if (S.fb.status === 'live') Cloud.checkRemote(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (S.fb.status === 'live'){ Cloud.checkRemote(); Cloud.flushPending(false); }
    // لو البث وقف وهو بعيد: نوصّله تاني
    if (S.fb.status === 'live' && S.fb.stream !== 'live' && navigator.onLine !== false) Cloud.stream();
  });
  window.addEventListener('beforeunload', () => { if (dirty.main) Cloud.push(true); });
  window.addEventListener('online', () => {
    Cloud._offlineSeen = true;
    if (S.fb.status === 'error') Cloud.connect({ silent:true });
    else if (S.fb.status === 'live'){ if (S.fb.stream !== 'live') Cloud.stream(); Cloud.flushPending(false); }
  });
  window.addEventListener('offline', () => { S.fb.stream = 'down'; Cloud._offlineSeen = true; paintCloud(); });
})();
