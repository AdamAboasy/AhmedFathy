function pdfExam(id){
  const e = examOf(id); if (!e) return;
  const gr = S.data.grades[e.id] || {};
  let sts = (e.groupId ? studentsOfGroup(e.groupId) : (e.stage ? studentsOfStage(e.stage) : S.data.students)).filter(s => typeof gr[s.id] === 'number');
  sts = sortBy(sts, s => gr[s.id], 'desc');
  const vals = sts.map(s => gr[s.id]);
  const avg = vals.length ? (sum(vals) / vals.length).toFixed(1) : '—';
  const pass = vals.filter(v => v >= e.max * 0.5).length;
  let rank = 0, prev = null;
  const inner = reportHeader('نتائج امتحان', `${esc(e.name)} — ${esc(e.stage || '')}${e.groupId ? ' — ' + esc(groupName(e.groupId)) : ''}`) +
    summaryHTML([['التاريخ', fmtDate(e.date)], ['الدرجة النهائية', e.max], ['عدد الطلاب', sts.length], ['المتوسط', avg],
      ['أعلى درجة', vals.length ? Math.max.apply(null, vals) : '—'], ['نسبة النجاح', vals.length ? Math.round(pass / vals.length * 100) + '%' : '—']]) +
    tableHTML(['ترتيب','الطالب','المرحلة','الحصة','الدرجة','النسبة','التقدير'],
      sts.map((s, i) => { if (prev === null) rank = 0; else if (gr[s.id] !== prev) rank = i; prev = gr[s.id];
        const pc = Math.round(gr[s.id] / e.max * 100);
        const gr2 = pc >= 90 ? 'ممتاز' : pc >= 80 ? 'جيد جدًا' : pc >= 65 ? 'جيد' : pc >= 50 ? 'مقبول' : 'ضعيف';
        return [rank + 1, s.name, s.stage || '—', groupName(s.groupId), gr[s.id], pc + '%', gr2]; }), { center:[0,4,5,6] });
  openPDF(inner);
}
function attPDF(){
  const a = S.ui.att, gid = a.groupId, g = groupOf(gid);
  if (!g){ toast('اختر حصة أولًا', 'warn'); return; }
  const y = Number(a.date.slice(0,4)), m = Number(a.date.slice(5,7)), lastD = new Date(y, m, 0).getDate();
  const days = []; for (let d = 1; d <= lastD; d++) days.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  const ss = studentsOfGroup(gid);
  const rows = ss.map(s => {
    let p = 0, ab = 0, l = 0, ex = 0;
    const cells = days.map(d => { const r = getAtt(d, gid); const v = r && r.records[s.id];
      if (v === 'present'){ p++; return '✓'; } if (v === 'absent'){ ab++; return '✕'; } if (v === 'late'){ l++; return 'م'; } if (v === 'excused'){ ex++; return 'ع'; } return ''; });
    const counted = p + ab + l;
    return [s.name].concat(cells).concat([p + l, ab, (counted ? Math.round((p + l) / counted * 100) : 0) + '%']);
  });
  const inner = reportHeader('كشف حضور شهري',
      `${esc(g.name)} — ${AR_DAYS[g.day]} ${timeRange(g)} — ${esc(g.stage || '')} — شهر ${monthName(a.date.slice(0,7))}`) +
    summaryHTML([['عدد الطلاب', ss.length], ['أيام الشهر', days.length],
      ['الحصص المسجلة', days.filter(d => getAtt(d, gid)).length],
      ['مفتاح الكشف', '✓ حاضر · م متأخر · ✕ غائب · ع بعذر']]) +
    tableHTML(['الطالب'].concat(days.map(d => String(Number(d.slice(-2))))).concat(['حضور','غياب','النسبة']), rows,
      { center: days.map((_, i) => i + 1).concat([days.length + 1, days.length + 2, days.length + 3, 0]) });
  openPDF(inner);
}
function pdfReport(){
  const r = S.ui.rep, ss = repRows();
  if (r.kind === 'student'){ const s = student(r.studentId) || S.data.students[0]; if (s) pdfStudent(s.id); else toast('لا يوجد طلاب', 'warn'); return; }
  if (r.kind === 'exams'){ const e = examOf(r.examId) || S.data.exams[0]; if (e) pdfExam(e.id); else toast('لا توجد امتحانات', 'warn'); return; }
  if (r.kind === 'attendance'){
    const rows = ss.map(s => { const a = attStats(s.id, r.from, r.to);
      return [s.name, s.stage || '—', groupName(s.groupId), a.present, a.late, a.absent, a.excused, a.total, a.rate + '%']; });
    const tot = { p:0, l:0, ab:0, ex:0, t:0 };
    ss.forEach(s => { const a = attStats(s.id, r.from, r.to); tot.p += a.present; tot.l += a.late; tot.ab += a.absent; tot.ex += a.excused; tot.t += a.total; });
    const inner = reportHeader('كشف الحضور والغياب', `من ${fmtDate(r.from)} إلى ${fmtDate(r.to)}${r.stage ? ' — ' + esc(r.stage) : ''}`) +
      summaryHTML([['عدد الطلاب', ss.length], ['إجمالي الحضور', tot.p + tot.l], ['إجمالي الغياب', tot.ab],
        ['نسبة الحضور', (tot.t ? Math.round((tot.p + tot.l) / tot.t * 100) : 0) + '%']]) +
      tableHTML(['الطالب','المرحلة','الحصة','حاضر','متأخر','غائب','بعذر','الإجمالي','النسبة'], rows, { center:[3,4,5,6,7,8] });
    openPDF(inner); return;
  }
  if (r.kind === 'students'){ pdfStudents(); return; }
  const attR = ss.map(s => attStats(s.id, r.from, r.to)).reduce((t, a) => ({ t: t.t + a.total, ok: t.ok + a.present + a.late, ab: t.ab + a.absent }), { t:0, ok:0, ab:0 });
  const avgs = ss.map(s => examAvg(s.id)).filter(v => v != null);
  const inner = reportHeader('تقرير عام', `من ${fmtDate(r.from)} إلى ${fmtDate(r.to)}${r.stage ? ' — ' + esc(r.stage) : ''}`) +
    summaryHTML([['الطلاب', ss.length], ['نسبة الحضور', (attR.t ? Math.round(attR.ok / attR.t * 100) : 0) + '%'],
      ['الحصص الأسبوعية', S.data.groups.length], ['متوسط الدرجات', avgs.length ? Math.round(sum(avgs) / avgs.length) + '%' : '—']]) +
    tableHTML(['الطالب','المرحلة','الحصة','الحضور','الغياب','النسبة','متوسط الدرجات'],
      ss.map(s => { const a = attStats(s.id, r.from, r.to); const v = examAvg(s.id);
        return [s.name, s.stage || '—', groupName(s.groupId), a.present + a.late, a.absent, a.rate + '%', v == null ? '—' : v + '%']; }),
      { center:[3,4,5,6] });
  openPDF(inner);
}

    { name:'حصة السبت — الثالث الثانوي', stage:'الثالث الثانوي', day:6, from:'16:00', to:'18:00', payMode:'monthly', level:'متقدم', note:'مراجعة شاملة' },

    { name:'حصة الاثنين — الأول الثانوي', stage:'الأول الثانوي', day:1, from:'15:00', to:'16:30', payMode:'session', level:'متوسط', note:'مجموعة صغيرة' },
    { name:'حصة الثلاثاء — الثالث الإعدادي', stage:'الثالث الإعدادي', day:2, from:'18:00', to:'19:30', payMode:'session', level:'ممتاز', note:'' },
    { name:'حصة الخميس — الثاني الثانوي', stage:'الثاني الثانوي', day:4, from:'16:00', to:'18:00', payMode:'monthly', level:'جيد جدًا', note:'' }
  ];
  const gids = groups.map(g => { const id = uid('g'); data.groups.push(Object.assign({ id: id }, g)); return id; });
  const names = ['محمد أحمد فتحي','يوسف خالد','عمر مصطفى','آدم طارق','زياد حسام','مالك إبراهيم','علي محمود','حسن سامي','كريم وليد','سيف الدين',
    'ملك أشرف','جنى عمرو','مريم شريف','حبيبة رامي','سلمى نادر','نور الهدى','رقية أيمن','فريدة مازن','هنا خالد','ريم عصام',
    'أحمد ياسر','مروان عادل','لؤي هشام','تميم فؤاد','إياد سامح','طه عمرو'];
  const types = ['جديد','مستمر','متميز'];
  names.forEach((n, i) => {
    const gi = i % gids.length, g = groups[gi];
    const noGroup = i % 13 === 12;
    data.students.push({
      id: uid('s'), code: 'S' + String(i + 1).padStart(3, '0'), name: n,
      stage: noGroup ? data.settings.stages[i % 12] : g.stage,
      studySystem: isBacStage(g.stage) ? ['عام','بكالوريا','أزهر'][i % 3] : (i % 3 === 0 ? 'أزهر' : 'عام'),
      type: types[i % 3], level: data.settings.levels[i % 5],
      groupId: noGroup ? '' : gids[gi], payMode: noGroup ? (i % 2 ? 'monthly' : 'session') : g.payMode,
      phone: '010' + String(10000000 + i * 137911).slice(0, 8),
      parentPhone: '011' + String(20000000 + i * 271911).slice(0, 8),
      guardian: 'والد ' + n.split(' ')[0], joinDate: addMonths(today(), -(1 + i % 4)),
      status: i % 15 === 14 ? 'paused' : 'active', notes: i % 6 === 0 ? 'طالب متميز ويحتاج تدريبات إضافية' : ''
    });
  });
  /* حضور آخر 45 يوم على أيام الحصص */
  for (let d = 45; d >= 0; d--){
    const date = addDays(today(), -d), dow = parseISO(date).getDay();
    data.groups.forEach(g => {
      if (Number(g.day) !== dow) return;
      const ss = data.students.filter(s => s.groupId === g.id);
      if (!ss.length) return;
      const records = {};
      ss.forEach(s => { const r = Math.random(); records[s.id] = r < 0.78 ? 'present' : r < 0.88 ? 'late' : r < 0.96 ? 'absent' : 'excused'; });
      data.attendance[date + '@' + g.id] = { groupId: g.id, note:'', records: records, rev: 1, savedAt: new Date().toISOString() };
    });
  }
  /* امتحانات ودرجات */
  [['امتحان الشهر الأول', -30, 20], ['امتحان نصف المستوى', -15, 30], ['امتحان الشهر الثاني', -3, 20]].forEach((e, i) => {
    const g = data.groups[i % data.groups.length];
    const ex = { id: uid('e'), name: e[0], stage: g.stage, groupId: g.id, date: addDays(today(), e[1]), max: e[2], note:'' };
    data.exams.push(ex); data.grades[ex.id] = {};
    data.students.filter(s => s.groupId === g.id).forEach(s => { data.grades[ex.id][s.id] = Math.round(e[2] * (0.4 + Math.random() * 0.6) * 2) / 2; });
  });
  S.data = migrate(data);
  commit();
  toast('تم تحميل بيانات تجريبية: 26 طالب · 5 حصص · 3 امتحانات', 'ok');
}

/* ---------------- PWA ---------------- */
const PWA = {
  canInstall: false, installed: false, swReady: false, deferred: null, reg: null,
  init(){
    try{
      this.installed = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }catch(e){}
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault(); this.deferred = e; this.canInstall = true; this.paint();
    });
    window.addEventListener('appinstalled', () => {
      this.installed = true; this.canInstall = false; this.deferred = null; this.paint();
      toast('تم تثبيت المنصة على جهازك 🎉', 'ok');
    });
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
      navigator.serviceWorker.register('sw.js').then(reg => {
        this.reg = reg; this.swReady = true; this.paint();
        reg.addEventListener('updatefound', () => {});
      }).catch(err => { console.warn('SW', err); this.paint(); });
    }
    this.paint();
  },
  paint(){
    const b = $('#installBtn');
    if (b) b.classList.toggle('hide', !this.canInstall && !this.installed);
    if (b && this.installed){ b.disabled = true; b.innerHTML = icon('check') + ' المنصة مثبّتة'; }
  },
  async install(){
    if (this.installed){ toast('المنصة مثبّتة بالفعل', 'ok'); return; }
    if (!this.deferred){
      Modal.open({ title:'تثبيت المنصة على الجهاز', size:'sm', body:
        `<div class="help"><b>طريقة التثبيت:</b><br>
         • <b>أندرويد (Chrome):</b> من قائمة الثلاث نقاط ← «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».<br>
         • <b>آيفون (Safari):</b> زر المشاركة ⬆️ ← «إضافة إلى الشاشة الرئيسية».<br>
         • <b>كمبيوتر (Chrome/Edge):</b> أيقونة التثبيت ⊕ في شريط العنوان.<br><br>
         ملاحظة: التثبيت بيشتغل لما المنصة تكون مفتوحة من رابط <b>HTTPS</b> (زي GitHub Pages) أو من localhost.</div>` });
      return;
    }
    this.deferred.prompt();
    const res = await this.deferred.userChoice;
    if (res && res.outcome === 'accepted'){ this.canInstall = false; this.paint(); }
  },
  async update(){
    try{
      if (this.reg){
        await this.reg.update();
        const wk = this.reg.waiting || this.reg.installing;
        if (wk) wk.postMessage({ type:'SKIP_WAITING' });
      }
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
      toast('تم تحديث نسخة الأوفلاين — جارٍ إعادة التحميل', 'ok');
      setTimeout(() => location.reload(), 700);
    }catch(e){ toast('تعذّر التحديث: ' + e.message, 'bad'); }
  }
};

/* ---------------- Renderer ---------------- */
function render(){
  const ae = document.activeElement;
  const rid = ae && ae.id ? ae.id : null;
  const rs = ae && typeof ae.selectionStart === 'number' ? ae.selectionStart : null;
  const re = ae && typeof ae.selectionEnd === 'number' ? ae.selectionEnd : null;

  const v = Views[S.view] ? S.view : 'dashboard';
  const t = TITLES[v] || TITLES.dashboard;
  $('#pageTitle').textContent = t[0];
  $('#pageSub').textContent = t[1];
  $('#content').innerHTML = Views[v]();

  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.view === v));
  const al = alerts().length;
  const pill = $('#navAlertsPill'); pill.textContent = al; pill.classList.toggle('hide', !al);
  $('#navStudentsPill').textContent = S.data.students.length;
  $('#brandName').textContent = S.data.settings.teacherName || 'أحمد فتحي';
  $('#brandSub').textContent = S.data.settings.platformName || 'منصة المستر';
  document.title = t[0] + ' · ' + (S.data.settings.platformName || 'منصة المستر');

  if (typeof Views['after_' + v] === 'function'){ try{ Views['after_' + v](); }catch(e){ console.warn(e); } }
  paintCloud(); PWA.paint();

  if (rid){ const el = document.getElementById(rid);
    if (el){ try{ el.focus(); if (rs != null && el.setSelectionRange) el.setSelectionRange(rs, re); }catch(e){} } }
}
const VIEW_LIST = ['dashboard','alerts','students','groups','attendance','exams','reports','settings'];
function go(view, extra){
  if (!VIEW_LIST.includes(view)) view = 'dashboard';
  S.view = view;
  if (extra && extra.groupId) S.ui.att.groupId = extra.groupId;
  if (view === 'attendance' && !S.ui.att.groupId && S.data.groups[0]) S.ui.att.groupId = S.data.groups[0].id;
  if (view === 'attendance') attDraft = null;
  closeDrawer(); render();
  try { if (location.hash.slice(1) !== view) history.replaceState(null, '', '#' + view); } catch (e) {}
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function closeDrawer(){ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); }
function refreshAttCounts(){
  if (!attDraft) return;
  const ss = studentsOfGroup(attDraft.groupId).filter(s => s.status !== 'stopped');
  const counts = { present:0, absent:0, late:0, excused:0 };
  ss.forEach(s => { const v = attDraft.records[s.id]; if (counts[v] != null) counts[v]++; });
  const marked = sum(Object.values(counts));
  const ch = $$('#content .att-sum .k');
  if (ch.length >= 4) ch.forEach(k => {
    const t = k.textContent.trim();
    if (t.startsWith('حاضر')) k.lastChild.nodeValue = ' حاضر ' + counts.present;
    else if (t.startsWith('متأخر')) k.lastChild.nodeValue = ' متأخر ' + counts.late;
    else if (t.startsWith('غائب')) k.lastChild.nodeValue = ' غائب ' + counts.absent;
    else if (t.startsWith('بعذر')) k.lastChild.nodeValue = ' بعذر ' + counts.excused;
  });
  const badge = $('#content .att-sum .badge');
  if (badge){ badge.textContent = marked + '/' + ss.length + ' مُسجَّل'; badge.className = 'badge ' + (marked === ss.length && ss.length ? 'b-ok' : 'b-warn'); }
}
function waListModal(title, list){
  Modal.open({ title: title, sub: list.length + ' طالب', size: 'sm',
    body: list.length ? list.map(x => `<div class="alert-row ${x.tone || 'info'}">
        <span class="ai">${icon(x.icon || 'whatsapp')}</span>
        <span class="at"><b>${esc(x.name)}</b><span>${esc(x.sub)}</span></span>
        ${x.phone ? `<a class="btn sm" target="_blank" rel="noopener" href="${waLink(x.phone, x.msg)}">${icon('whatsapp')} إرسال</a>` : '<span class="badge b-gray">لا يوجد رقم</span>'}
      </div>`).join('') : '<p class="muted small">لا توجد أرقام متاحة</p>' });
}

/* ---------------- Click delegation ---------------- */
document.addEventListener('click', function(e){
  const closeBtn = e.target.closest('[data-close]');
  if (closeBtn){ Modal.close(closeBtn.getAttribute('data-close')); return; }
  const nav = e.target.closest('#nav a[data-view]');
  if (nav){ go(nav.dataset.view); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;

  switch (act){
    /* --- تنقل وفلاتر --- */
    case 'go': go(id, { groupId: el.dataset.group }); break;
    case 'clearFilters': S.ui.stuFilter = { stage:'', groupId:'', payMode:'', type:'', status:'', sort:'name' }; S.query = ''; $('#globalSearch').value = ''; render(); break;
    case 'filterStage': Modal.closeAll(); S.ui.stuFilter = Object.assign({}, S.ui.stuFilter, { stage: id }); S.view = 'students'; render(); break;
    case 'grpDay': S.ui.grpFilter.day = id; render(); break;
    case 'grpClear': S.ui.grpFilter = { stage:'', day:'' }; render(); break;

    /* --- الطلاب --- */
    case 'addStudent': openStudentForm(); break;
    case 'editStudent': Modal.closeAll(); setTimeout(() => openStudentForm(id), 120); break;
    case 'profile': Modal.closeAll(); setTimeout(() => openProfile(id), 120); break;
    case 'delStudent': {
      const s = student(id); if (!s) break;
      confirmDialog('حذف الطالب', `متأكد من حذف «${s.name}»؟ سيتم حذف درجاته وسجل حضوره بالكامل.`, 'حذف نهائيًا', () => {
        S.data.students = S.data.students.filter(x => x.id !== id);
        Object.keys(S.data.attendance).forEach(k => { delete S.data.attendance[k].records[id];
          if (!Object.keys(S.data.attendance[k].records).length) delete S.data.attendance[k]; });
        Object.keys(S.data.grades).forEach(eid => { delete S.data.grades[eid][id]; });
        commit(); toast('تم حذف الطالب', 'ok');
      }, true); break;
    }
    case 'assign': Modal.closeAll(); setTimeout(() => assignStudent(id), 130); break;
    case 'assignAll': Modal.closeAll(); setTimeout(assignAllModal, 130); break;
    case 'expStudents': exportCSV('students-' + today(), ['الاسم','الكود','المرحلة','نظام الدراسة','نوع الطالب','المستوى','الحصة','اليوم','من','إلى','نظام الدفع','الحضور %','متوسط الدرجات','هاتف','ولي الأمر','حالة'],
      repRows().map(s => { const g = groupOf(s.groupId); const v = examAvg(s.id);
        return [s.name, s.code, s.stage, s.studySystem, s.type, s.level, g ? g.name : 'بدون حصة', g ? AR_DAYS[g.day] : '', g ? fmtTime(g.from) : '', g ? fmtTime(g.to) : '',
          payLabel(s.payMode), attRate(s.id), v == null ? '' : v, s.phone, s.parentPhone, studentStatus(s).label]; })); break;
    case 'pdfStudents': pdfStudents(); break;

    /* --- الحصص --- */
    case 'addGroup': openGroupForm(); break;
    case 'editGroup': Modal.closeAll(); setTimeout(() => openGroupForm(id), 120); break;
    case 'openGroup': openGroupInfo(id); break;
    case 'delGroup': {
      const g = groupOf(id); if (!g) break;
      const n = studentsOfGroup(id).length;
      confirmDialog('حذف الحصة', n ? `الحصة «${g.name}» بها ${n} طالب — هيتحوّلوا إلى «بدون حصة». متابعة؟` : `حذف الحصة «${g.name}»؟`, 'حذف', () => {
        S.data.students.forEach(s => { if (s.groupId === id) s.groupId = ''; });
        S.data.groups = S.data.groups.filter(x => x.id !== id);
        commit(); toast('تم حذف الحصة', 'ok');
      }, true); break;
    }
    case 'manageGroup': Modal.closeAll(); setTimeout(() => manageGroupStudents(id), 130); break;
    case 'attGroup': go('attendance', { groupId: id }); break;
    case 'pdfGroups': pdfGroups(); break;

    /* --- الحضور --- */
    case 'mark': {
      if (!attDraft) break;
      attDraft.records[id] = el.dataset.v; attDraft.dirty = true;
      const row = el.closest('.att-row');
      $$('.seg button', row).forEach(b => b.classList.toggle('on', b.dataset.v === el.dataset.v));
      const cell = document.querySelector(`#attMatrix [data-cell="${id}:${attDraft.date}"]`);
      if (cell){ cell.className = 'cd ' + el.dataset.v; cell.textContent = el.dataset.v === 'present' ? '✓' : el.dataset.v === 'absent' ? '✕' : el.dataset.v === 'late' ? 'م' : 'ع'; }
      refreshAttCounts(); break;
    }
    case 'attAll': if (attDraft){ studentsOfGroup(attDraft.groupId).filter(s => s.status !== 'stopped').forEach(s => attDraft.records[s.id] = 'present'); attDraft.dirty = true; render(); } break;
    case 'attClear':
      if (attDraft) confirmDialog('تفريغ الحضور', 'هيتم تفريغ التسجيل المعروض (لسه متحفظش). متابعة؟', 'تفريغ', () => { attDraft.records = {}; attDraft.dirty = true; render(); });
      break;
    case 'attSave': {
      if (!attDraft) break;
      const gid = attDraft.groupId, date = attDraft.date;
      const noteEl = $('#attNote'); if (noteEl) attDraft.note = noteEl.value;
      if (!Object.keys(attDraft.records).length){ toast('سجّل حضور طالب واحد على الأقل', 'warn'); break; }
      setAtt(date, gid, attDraft.records, attDraft.note);
      commit();
      const absent = Object.keys(attDraft.records).filter(k => attDraft.records[k] === 'absent').map(k => student(k)).filter(Boolean);
      toast('تم حفظ حضور ' + groupName(gid) + ' — ' + fmtDate(date), 'ok');
      if (absent.length) setTimeout(() => waListModal('غياب اليوم — تنبيه أولياء الأمور', absent.map(s => ({
        name: s.name, sub: 'غائب اليوم ' + fmtDate(date), phone: s.parentPhone || s.phone, tone: 'bad', icon: 'alert',
        msg: `السلام عليكم ${s.guardian || ''}، نود إبلاغكم بغياب ${s.name} عن حصة اليوم ${fmtDate(date)}. برجاء التواصل معنا. — ${S.data.settings.platformName || ''} ${S.data.settings.teacherName || ''}` }))), 400);
      break;
    }
    case 'attPDF': attPDF(); break;
    case 'expAtt': {
      const gid = S.ui.att.groupId, g = groupOf(gid); if (!g) break;
      const a = S.ui.att;
      const y = Number(a.date.slice(0,4)), m = Number(a.date.slice(5,7)), lastD = new Date(y, m, 0).getDate();
      const days = []; for (let d = 1; d <= lastD; d++) days.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
      exportCSV('attendance-' + g.name + '-' + a.date.slice(0,7),
        ['الطالب','المرحلة'].concat(days.map(d => String(Number(d.slice(-2))))).concat(['حضور','غياب','النسبة']),
        studentsOfGroup(gid).map(s => {
          let p = 0, ab = 0, l = 0;
          const cells = days.map(d => { const r = getAtt(d, gid); const v = r && r.records[s.id];
            if (v === 'present'){ p++; return 'حاضر'; } if (v === 'absent'){ ab++; return 'غائب'; } if (v === 'late'){ l++; return 'متأخر'; } if (v === 'excused') return 'بعذر'; return ''; });
          const counted = p + ab + l;
          return [s.name, s.stage || ''].concat(cells).concat([p + l, ab, (counted ? Math.round((p + l) / counted * 100) : 0) + '%']);
        }));
      break;
    }

    /* --- الامتحانات --- */
    case 'addExam': openExamForm(); break;
    case 'editExam': Modal.closeAll(); setTimeout(() => openExamForm(id), 120); break;
    case 'selExam': S.ui.exam.id = id; render(); break;
    case 'delExam': {
      const ex = examOf(id); if (!ex) break;

        S.data.exams = S.data.exams.filter(x => x.id !== id); delete S.data.grades[id];
        S.ui.exam.id = ''; commit(); toast('تم حذف الامتحان', 'ok');
      }, true); break;
    }
    case 'clearGrade': {
      const ex = examOf(S.ui.exam.id); if (!ex) break;
      delete (S.data.grades[ex.id] || {})[id];
      commit({ silent:true }); render(); break;
    }
    case 'saveGrades': {
      const ex = examOf(id); if (!ex) break;
      let n = 0;
      S.data.grades[ex.id] = S.data.grades[ex.id] || {};
      $$('[data-grade]').forEach(inp => {
        const v = inp.value.trim();
        if (v === '') delete S.data.grades[ex.id][inp.dataset.grade];
        else { S.data.grades[ex.id][inp.dataset.grade] = clamp(Number(v) || 0, 0, ex.max); n++; }
      });
      commit(); toast('تم حفظ ' + n + ' درجة', 'ok'); break;
    }
    case 'expExam': {
      const ex = examOf(id); if (!ex) break;
      const gr = S.data.grades[ex.id] || {};
      exportCSV('exam-' + ex.name, ['الطالب','المرحلة','الحصة','الدرجة','من','النسبة'],
        sortBy((ex.groupId ? studentsOfGroup(ex.groupId) : (ex.stage ? studentsOfStage(ex.stage) : S.data.students)).filter(s => typeof gr[s.id] === 'number'), s => gr[s.id], 'desc')
          .map(s => [s.name, s.stage || '', groupName(s.groupId), gr[s.id], ex.max, Math.round(gr[s.id] / ex.max * 100) + '%']));
      break;
    }
    case 'pdfExam': pdfExam(id); break;

    /* --- التقارير --- */
    case 'repKind': S.ui.rep.kind = id; render(); break;
    case 'runReport': render(); toast('تم تحديث المعاينة', 'info'); break;
    case 'pdfReport': pdfReport(); break;

      const r = S.ui.rep, ss = repRows();

        const a = attStats(s.id);
        exportCSV('student-' + s.name, ['البند','القيمة'], [['الاسم', s.name], ['المرحلة', s.stage], ['نظام الدراسة', s.studySystem], ['نوع الطالب', s.type],
          ['الحصة', groupName(s.groupId)], ['الدفع', payLabel(s.payMode)], ['نسبة الحضور', a.rate + '%'], ['غياب', a.absent], ['متوسط الدرجات', examAvg(s.id)]]);
        break; }
      if (r.kind === 'attendance')
        exportCSV('attendance-report-' + today(), ['الطالب','المرحلة','الحصة','حاضر','متأخر','غائب','بعذر','الإجمالي','النسبة'],
          ss.map(s => { const a = attStats(s.id, r.from, r.to); return [s.name, s.stage, groupName(s.groupId), a.present, a.late, a.absent, a.excused, a.total, a.rate + '%']; }));
      else if (r.kind === 'students') exportCSV('students-' + today(), ['الاسم','المرحلة','الحصة','الدفع','الحضور %'],
        ss.map(s => [s.name, s.stage, groupName(s.groupId), payLabel(s.payMode), attRate(s.id)]));
      else if (r.kind === 'exams'){ const ex = examOf(r.examId) || S.data.exams[0]; if (!ex) break;
        const gr = S.data.grades[ex.id] || {};
        exportCSV('exam-' + ex.name, ['الطالب','الدرجة','من','النسبة'],
          ss.filter(s => typeof gr[s.id] === 'number').map(s => [s.name, gr[s.id], ex.max, Math.round(gr[s.id] / ex.max * 100) + '%']));
      } else
        exportCSV('summary-' + today(), ['الطالب','المرحلة','الحصة','الحضور %','متوسط الدرجات'],
          ss.map(s => { const v = examAvg(s.id); return [s.name, s.stage, groupName(s.groupId), attRate(s.id), v == null ? '' : v]; }));
      break;
    }
    case 'waAll': {
      const list = S.data.students.filter(s => { const a = attStats(s.id, addDays(today(), -30), today()); return (s.groupId && a.absent >= (S.data.settings.absentWarn || 3)) || (!s.groupId && s.status === 'active'); })
        .map(s => ({ name: s.name, tone:'warn', icon:'alert', phone: s.parentPhone || s.phone,
          sub: (!s.groupId ? 'بدون حصة' : 'غياب ' + attStats(s.id, addDays(today(), -30), today()).absent + ' مرات'),
          msg: `السلام عليكم ${s.guardian || ''}، بخصوص ${s.name}: ${!s.groupId ? 'نرجو تحديد موعد الحصة المناسب' : 'نلاحظ تكرار الغياب، نرجو المتابعة'}. — ${S.data.settings.platformName || ''}` }));
      waListModal('تنبيه أولياء الأمور', list);
      break;
    }

    /* --- الإعدادات --- */
    case 'saveSettings': {
      const st = S.data.settings;
      $$('[data-set]').forEach(inp => { const k = inp.dataset.set;
        st[k] = ['absentWarn'].includes(k) ? (Number(inp.value) || 0) : inp.value; });
      $$('[data-list]').forEach(inp => {
        const k = inp.dataset.list;
        const arr = inp.value.split(/[\n,،]+/).map(x => x.trim()).filter(Boolean);
        if (arr.length) st[k] = arr;
      });
      commit(); toast('تم حفظ الإعدادات', 'ok'); break;
    }
    case 'install': PWA.install(); break;
    case 'swUpdate': PWA.update(); break;
    case 'fbConnect': {
      const cfg = {};
      $$('[data-fb]').forEach(inp => { if (inp.value.trim()) cfg[inp.dataset.fb] = inp.value.trim(); });
      if (!cfg.apiKey || !cfg.projectId || !cfg.code){ toast('اكتب API Key و Project ID وكود المنصة', 'warn'); return; }
      Cloud.connect({ config: cfg }); break;
    }
    case 'fbPull': Cloud.pull(); break;
    case 'fbPushAll': Cloud.pushAll(); break;
    case 'fbDisconnect': Cloud.disconnect(); render(); break;
    case 'expJSON': download('mostar-backup-' + today() + '.json', JSON.stringify(S.data, null, 1), 'application/json');
      toast('تم تصدير النسخة الاحتياطية', 'ok'); break;
    case 'impJSON': $('#fileInput').click(); break;
    case 'seed': {
      const run = () => seedDemo();
      if (S.data.students.length) confirmDialog('بيانات تجريبية', 'سيتم استبدال كل البيانات الحالية ببيانات تجريبية. متابعة؟', 'استبدال', run, true);
      else run(); break;
    }
    case 'wipe': confirmDialog('حذف كل البيانات', 'سيتم حذف كل الطلاب والحصص والامتحانات وسجل الحضور نهائيًا.', 'حذف الكل', () => {
      localStorage.removeItem(LS_KEY);
      S.data = defaultData(); S.ui.att.groupId = ''; attDraft = null;
      commit(); toast('تم حذف كل البيانات', 'ok');
    }, true); break;
  }
});

/* ---------------- Other listeners ---------------- */
document.addEventListener('change', function(e){
  const t = e.target;
  if (t.matches('[data-filter]')){ S.ui.stuFilter[t.dataset.filter] = t.value; render(); return; }
  if (t.matches('[data-att]')){
    S.ui.att[t.dataset.att === 'date' ? 'date' : 'groupId'] = t.value; attDraft = null; render(); return; }
  if (t.matches('[data-rep]')){ S.ui.rep[t.dataset.rep] = t.value; render(); return; }
  if (t.matches('[data-grade]')){
    const ex = examOf(S.ui.exam.id) || S.data.exams[0]; if (!ex) return;
    S.data.grades[ex.id] = S.data.grades[ex.id] || {};
    const v = t.value.trim();
    if (v === '') delete S.data.grades[ex.id][t.dataset.grade];
    else S.data.grades[ex.id][t.dataset.grade] = clamp(Number(v) || 0, 0, ex.max);
    commit({ silent:true }); return;
  }
  if (t.id === 'darkToggle'){ setTheme(t.checked ? 'dark' : 'light'); return; }
  if (t.id === 'fileInput' && t.files && t.files[0]){
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const d = JSON.parse(rd.result);
        if (!d || (!d.students && !d.groups)) throw new Error('ملف غير صالح');
        S.data = migrate(d); attDraft = null; commit();
        toast('تم استيراد البيانات: ' + S.data.students.length + ' طالب', 'ok');
      }catch(err){ toast('فشل الاستيراد: ' + err.message, 'bad'); }
    };
    rd.readAsText(t.files[0]); t.value = ''; return;
  }
});
document.addEventListener('input', debounce(function(e){
  const t = e.target;
  if (t.id === 'globalSearch'){
    S.query = t.value;
    if (S.query && S.view !== 'students') S.view = 'students';
    render(); return;
  }
  if (t.id === 'stuSearch'){ S.query = t.value; render(); return; }
  if (t.id === 'attNote' && attDraft){ attDraft.note = t.value; return; }
}, 250));

$('#burger').onclick = () => { $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('on'); };
$('#scrim').onclick = closeDrawer;
$('#quickAddBtn').onclick = () => openStudentForm();
$('#installBtn').onclick = () => PWA.install();
$('#themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
$('#cloudChip').onclick = () => go('settings');

function setTheme(t){
  document.documentElement.dataset.theme = t;
  S.data.settings.theme = t;
  localStorage.setItem(LS_KEY + '_theme', t);
  const use = $('#themeBtn use'); if (use) use.setAttribute('href', t === 'dark' ? '#i-sun' : '#i-moon');
  const cb = $('#darkToggle'); if (cb) cb.checked = t === 'dark';
  const mt = document.querySelector('meta[name=theme-color]');
  if (mt) mt.setAttribute('content', t === 'dark' ? '#0b0b0d' : '#fac518');
  saveLocal();
  if (['dashboard','settings'].includes(S.view)) render();
}
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && Modal.stack.length) Modal.close();
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
    if (S.view === 'attendance'){ e.preventDefault(); const b = $('[data-act=attSave]'); if (b) b.click(); }
  }
});
window.addEventListener('resize', throttle(() => {
  const f = Views['after_' + S.view];
  if (typeof f === 'function'){ try{ f(); }catch(e){} }
}, 220));

/* ---------------- Boot ---------------- */
(function boot(){
  let theme = localStorage.getItem(LS_KEY + '_theme');
  if (!theme) theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
  const had = loadLocal();
  if (!had){ const d = defaultData(); d.meta.rev = 1; S.data = d; saveLocal(); }
  S.data.settings.theme = theme;
  const use = $('#themeBtn use'); if (use) use.setAttribute('href', theme === 'dark' ? '#i-sun' : '#i-moon');
  const mt = document.querySelector('meta[name=theme-color]');
  if (mt) mt.setAttribute('content', theme === 'dark' ? '#0b0b0d' : '#fac518');
  const cfg = Cloud.readCfg();
  if (cfg && cfg.apiKey && cfg.projectId){ S.fb.cfg = cfg; Cloud.connect({ config: cfg, save: false }); }
  PWA.init();
  paintCloud();
  const h = (location.hash || '').slice(1);
  if (VIEW_LIST.includes(h)) S.view = h;
  render();
  if (!had) setTimeout(() => toast('أهلًا بك في منصة المستر 👋 ابدأ بإنشاء حصة ثم إضافة الطلاب', 'info', 'مرحبًا'), 700);
  window.addEventListener('beforeunload', () => { if (dirty.main) Cloud.push(true); });
})();

window.AF = { S: S, Cloud: Cloud, PWA: PWA, render: render, go: go, seedDemo: seedDemo, setTheme: setTheme, openStudentForm: openStudentForm, openGroupForm: openGroupForm, openExamForm: openExamForm, openProfile: openProfile, assignStudent: assignStudent, pdfStudent: pdfStudent, pdfStudents: pdfStudents, pdfGroups: pdfGroups, pdfExam: pdfExam, pdfReport: pdfReport, attPDF: attPDF, manageGroupStudents: manageGroupStudents, groupsConflict: groupsConflict };

</script>
