<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="منصة المستر - نظام متابعة الطلاب والحصص والامتحانات والحضور | أحمد فتحي">
<meta name="theme-color" content="#fac518">
<meta name="color-scheme" content="light dark">
<title>منصة المستر | أحمد فتحي</title>
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="منصة المستر">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   منصة المستر — Stylesheet
   ألوان الهوية مأخوذة من اللوجو: الذهبي #fac518 + الأسود
   ========================================================== */
:root{
  --brand:#fac518;          /* اللون الذهبي من اللوجو */
  --brand-2:#ffd94a;
  --brand-3:#e0a800;
  --brand-soft:rgba(250,197,24,.16);
  --ink:#101014;
  --ink-2:#33363f;
  --muted:#6b7280;
  --muted-2:#9aa1ad;
  --bg:#f5f6f8;
  --card:#ffffff;
  --line:#e7e9ee;
  --line-2:#f0f1f5;
  --side:#0b0b0d;
  --side-2:#16161a;
  --side-ink:#c6cad3;
  --ok:#12a150; --ok-bg:#e7f8ee;
  --warn:#c07a00; --warn-bg:#fff5dc;
  --bad:#e02424; --bad-bg:#feecec;
  --info:#2563eb; --info-bg:#e9f0ff;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 6px 22px -10px rgba(16,24,40,.16);
  --shadow-lg:0 24px 60px -24px rgba(16,24,40,.42);
  --r:16px; --r-sm:11px;
  --sb:266px;
  --font:'Cairo','Segoe UI',Tahoma,system-ui,-apple-system,sans-serif;
}
[data-theme="dark"]{
  --ink:#f3f4f7; --ink-2:#d8dbe2; --muted:#9aa1ad; --muted-2:#79808d;
  --bg:#0a0a0c; --card:#141418; --line:#26262c; --line-2:#1c1c21;
  --side:#000000; --side-2:#101014; --side-ink:#c2c6cf;
  --ok-bg:#0c2a1c; --warn-bg:#2b2208; --bad-bg:#2b1111; --info-bg:#0f1c33;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.65;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(760px 320px at 100% 0,rgba(250,197,24,.13),transparent 62%)}
h1,h2,h3,h4,p,dl,dd,dt{margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(130,136,150,.38);border-radius:20px;border:3px solid transparent;background-clip:content-box}
.hide{display:none !important}

/* ---------- Shell ---------- */
.shell{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{width:var(--sb);flex:0 0 var(--sb);background:var(--side);color:var(--side-ink);
  display:flex;flex-direction:column;position:fixed;inset-block:0;inset-inline-start:0;z-index:60;transition:transform .28s cubic-bezier(.4,0,.2,1)}
.sidebar::after{content:"";position:absolute;top:0;bottom:0;inset-inline-start:0;width:3px;background:linear-gradient(180deg,var(--brand),transparent 72%)}
.brand{display:flex;align-items:center;gap:12px;padding:16px 15px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:0 0 56px;background:#000;box-shadow:0 0 0 2px var(--brand),0 6px 18px -6px rgba(250,197,24,.6)}
.brand .bt{min-width:0}
.brand .bt b{display:block;color:#fff;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .bt span{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.2px}
.brand .bt span i{width:6px;height:6px;border-radius:50%;background:var(--brand);display:block}
.nav{padding:10px 9px 14px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1}
.nav .nlabel{font-size:10.5px;color:#6b7280;font-weight:800;letter-spacing:.4px;padding:11px 11px 4px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--side-ink);
  font-weight:600;font-size:14px;position:relative;transition:.16s;cursor:pointer}
.nav a svg{width:19px;height:19px;flex:0 0 19px;opacity:.82}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:linear-gradient(90deg,var(--brand-soft),rgba(250,197,24,.03));color:#fff}
.nav a.on svg{opacity:1;color:var(--brand)}
.nav a.on::before{content:"";position:absolute;inset-inline-end:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--brand)}
.nav .pill{margin-inline-start:auto;background:var(--brand);color:#1b1b1b;font-size:11px;font-weight:800;padding:1px 7px;border-radius:20px;min-width:22px;text-align:center}
.side-foot{padding:11px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:8px}
.cloud{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:11px;background:rgba(255,255,255,.06);cursor:pointer;transition:.16s;border:0;color:inherit;text-align:start;width:100%}
.cloud:hover{background:rgba(255,255,255,.12)}
.cloud .dot{width:9px;height:9px;border-radius:50%;background:var(--muted-2);flex:0 0 9px}
.cloud.live .dot{background:#22c55e;animation:pulse 1.8s infinite}
.cloud.busy .dot{background:var(--brand)} .cloud.err .dot{background:var(--bad)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(34,197,94,.18)}50%{box-shadow:0 0 0 8px rgba(34,197,94,.02)}}
.cloud .ct{min-width:0;line-height:1.35}
.cloud .ct b{display:block;color:#fff;font-size:12.5px;font-weight:700}
.cloud .ct span{display:block;font-size:10.5px;color:#8b93a1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.install-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:11px;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--brand),var(--brand-3));color:#1b1b1b;font-weight:800;font-size:13px;transition:.16s}
.install-btn:hover{filter:brightness(1.07)}
.install-btn svg{width:17px;height:17px}

.main{flex:1;min-width:0;margin-inline-start:var(--sb);display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:var(--card);background:color-mix(in srgb,var(--card) 88%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding:10px 18px;display:flex;align-items:center;gap:11px;min-height:66px}
.burger{display:none;width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--card);cursor:pointer;align-items:center;justify-content:center}
.burger svg{width:20px;height:20px}
.ptitle{min-width:0}
.ptitle h1{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.searchbox{position:relative}
.searchbox svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted-2)}
.searchbox input{width:250px;padding:9px 38px 9px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);outline:none;transition:.16s}
.searchbox input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.content{padding:18px;flex:1;min-width:0}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);padding:9px 14px;border-radius:11px;font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s;white-space:nowrap;text-decoration:none}
.btn svg{width:17px;height:17px}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#1b1b1b}
.btn.pri:hover{background:var(--brand-2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
[data-theme="dark"] .btn.dark{background:#2b2b33;border-color:#3a3a44}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--line-2);color:var(--ink);box-shadow:none}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.sm svg{width:15px;height:15px}
.btn.icon{padding:8px;width:36px;height:36px}
.btn.icon.sm{width:30px;height:30px;padding:0}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:14px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.card-h h3 svg{width:18px;height:18px;color:var(--brand-3)}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:600}
.card-h .sp,.sp{margin-inline-start:auto}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-23{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-32{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.mt{margin-top:14px}

/* ---------- Stats ---------- */
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--brand)}
.stat.ok::after{background:var(--ok)} .stat.bad::after{background:var(--bad)} .stat.info::after{background:var(--info)}
.stat .st-h{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:700}
.stat .st-h .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-3)}
.stat .st-h .ic svg{width:16px;height:16px}
.stat.ok .st-h .ic{background:var(--ok-bg);color:var(--ok)}
.stat.bad .st-h .ic{background:var(--bad-bg);color:var(--bad)}
.stat.info .st-h .ic{background:var(--info-bg);color:var(--info)}
.stat .val{font-size:26px;font-weight:900;margin-top:5px;letter-spacing:-.5px}
.stat .val small{font-size:13px;font-weight:700;color:var(--muted)}
.stat .foot{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* ---------- Tables ---------- */
.tbl-wrap{overflow:auto}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.tbl th{position:sticky;top:0;background:var(--card);z-index:2;text-align:start;padding:11px 12px;font-weight:800;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tbody tr:hover{background:var(--line-2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{font-variant-numeric:tabular-nums;font-weight:700}
.tbl td .row-actions{display:flex;gap:4px;justify-content:flex-end}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;color:#1b1b1b;flex:0 0 36px;font-size:13px;background:var(--brand)}
.who .wt{min-width:0}
.who .wt b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.who .wt span{display:block;font-size:11.5px;color:var(--muted)}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:800;white-space:nowrap;border:1px solid transparent}
.badge svg{width:13px;height:13px}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-info{background:var(--info-bg);color:var(--info)}
.b-gray{background:var(--line-2);color:var(--muted)}
.b-brand{background:var(--brand-soft);color:var(--brand-3);border-color:rgba(250,197,24,.35)}
[data-theme="dark"] .b-brand{color:var(--brand)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
[data-theme="dark"] .chip.on{background:var(--brand);color:#1b1b1b;border-color:var(--brand)}
.chips{display:flex;gap:7px;flex-wrap:wrap}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field>label{font-size:12.5px;font-weight:800;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.field .req{color:var(--bad)}
.field .hint{font-size:11px;color:var(--muted-2);font-weight:600}
.inp,input[type=text],input[type=number],input[type=date],input[type=month],input[type=time],input[type=tel],input[type=email],input[type=password],select,textarea{
  width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);outline:none;transition:.15s}
textarea{min-height:78px;resize:vertical;line-height:1.7}
.inp:focus,input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.inp:disabled,input:disabled{background:var(--line-2);color:var(--muted)}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2.2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:left 11px center;background-size:16px;padding-inline-start:34px}
.frow{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.frow-3{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch .track{width:44px;height:25px;border-radius:20px;background:var(--line);position:relative;transition:.2s;flex:0 0 44px}
.switch .track::after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;top:3px;inset-inline-end:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+.track{background:var(--ok)}
.switch input:checked+.track::after{inset-inline-end:22px}
.switch .lb{font-weight:700;font-size:13.5px}
.switch .lb span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,8,10,.64);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:22px 14px;overflow-y:auto;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:720px;margin:auto;animation:pop .22s cubic-bezier(.2,.9,.3,1.2);border:1px solid var(--line)}
.modal.sm{max-width:470px} .modal.lg{max-width:940px} .modal.xl{max-width:1180px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line-2)}
.modal-h h3{font-size:16.5px;font-weight:800}
.modal-h .sub{font-size:12px;color:var(--muted);font-weight:600}
.modal-h .x{margin-inline-start:auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;transition:.15s}
.modal-h .x:hover{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.modal-h .x svg{width:17px;height:17px}
.modal-b{padding:18px;max-height:calc(100vh - 210px);overflow-y:auto}
.modal-f{padding:13px 18px;border-top:1px solid var(--line-2);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- Toasts ---------- */
.toasts{position:fixed;bottom:18px;inset-inline-start:18px;z-index:400;display:flex;flex-direction:column;gap:9px;max-width:min(380px,90vw)}
.toast{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-lg);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;animation:slideInRtl .26s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slideInRtl{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.toast .ti{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 30px;background:var(--info-bg);color:var(--info)}
.toast .ti svg{width:16px;height:16px}
.toast.ok .ti{background:var(--ok-bg);color:var(--ok)}
.toast.bad .ti{background:var(--bad-bg);color:var(--bad)}
.toast.warn .ti{background:var(--warn-bg);color:var(--warn)}
.toast .tt{min-width:0;flex:1}
.toast .tt b{display:block;font-size:13.5px;font-weight:800}
.toast .tt span{font-size:12.5px;color:var(--muted)}

/* ---------- Empty ---------- */
.empty{text-align:center;padding:42px 18px;color:var(--muted)}
.empty .ic{width:68px;height:68px;border-radius:20px;background:var(--line-2);display:grid;place-items:center;margin:0 auto 13px;color:var(--brand-3)}
.empty .ic svg{width:32px;height:32px}
.empty h4{font-size:15.5px;font-weight:800;color:var(--ink)}
.empty p{font-size:13px;margin-top:4px}

/* ---------- Attendance ---------- */
.att-row{display:flex;align-items:center;gap:12px;padding:10px 13px;border:1px solid var(--line);border-radius:13px;background:var(--card);margin-bottom:8px;transition:.15s;flex-wrap:wrap}
.att-row:hover{border-color:var(--brand)}
.att-row .an{flex:1;min-width:150px}
.att-row .an b{display:block;font-weight:700}
.att-row .an span{font-size:11.5px;color:var(--muted)}
.seg{display:flex;gap:5px;background:var(--line-2);padding:4px;border-radius:12px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--muted);transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on[data-v=present]{color:var(--ok)} .seg button.on[data-v=absent]{color:var(--bad)}
.seg button.on[data-v=late]{color:var(--warn)} .seg button.on[data-v=excused]{color:var(--info)}
.att-sum{display:flex;gap:10px;flex-wrap:wrap}
.att-sum .k{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.att-sum .k i{width:9px;height:9px;border-radius:3px;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-hd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.cal-hd div{text-align:center;font-size:11px;font-weight:800;color:var(--muted-2)}
.cd{aspect-ratio:1;border-radius:9px;background:var(--line-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.cd.present{background:var(--ok-bg) !important;color:var(--ok) !important}
.cd.absent{background:var(--bad-bg) !important;color:var(--bad) !important}
.cd.late{background:var(--warn-bg) !important;color:var(--warn) !important}
.cd.excused{background:var(--info-bg) !important;color:var(--info) !important}

/* ---------- Schedule (week grid) ---------- */
.sched{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}
.sched .day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px;min-height:120px}
.sched .day h4{font-size:12.5px;font-weight:800;text-align:center;color:var(--muted);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.sched .slot{background:linear-gradient(135deg,var(--brand-soft),rgba(250,197,24,.05));border:1px solid rgba(250,197,24,.4);border-radius:11px;padding:8px;margin-bottom:7px;cursor:pointer;transition:.15s}
.sched .slot:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.sched .slot b{display:block;font-size:12.5px;font-weight:800}
.sched .slot span{display:block;font-size:11px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.sched .slot em{display:block;font-size:10.5px;color:var(--brand-3);font-style:normal;font-weight:800;margin-top:3px}
.sched .none{text-align:center;color:var(--muted-2);font-size:11.5px;padding:18px 0}

/* ---------- Charts ---------- */
.chart{width:100%;display:block;height:210px}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:9px}
.legend .lg{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.legend .lg i{width:11px;height:11px;border-radius:4px;display:block}

/* ---------- Progress & misc ---------- */
.bar{height:8px;border-radius:6px;background:var(--line-2);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--brand);transition:width .5s}
.bar.ok>i{background:var(--ok)} .bar.bad>i{background:var(--bad)} .bar.info>i{background:var(--info)}
.alert-row{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;background:var(--card);flex-wrap:wrap}
.alert-row .ai{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 34px;background:var(--line-2);color:var(--muted)}
.alert-row .ai svg{width:17px;height:17px}
.alert-row.warn .ai{background:var(--warn-bg);color:var(--warn)}
.alert-row.bad .ai{background:var(--bad-bg);color:var(--bad)}
.alert-row.info .ai{background:var(--info-bg);color:var(--info)}
.alert-row .at{flex:1;min-width:140px}
.alert-row .at b{display:block;font-weight:700;font-size:13.5px}
.alert-row .at span{font-size:11.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0;font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:15px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:800;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;transition:.15s;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--brand)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;direction:ltr;text-align:left}
.help{background:var(--info-bg);border-radius:13px;padding:12px 14px;font-size:13px;line-height:1.85}
.help.brand{background:var(--brand-soft)}
.help code{background:rgba(0,0,0,.08);padding:1px 6px;border-radius:6px;font-family:ui-monospace,monospace;font-size:12px;direction:ltr;display:inline-block}
[data-theme="dark"] .help code{background:rgba(255,255,255,.12)}
.sep{height:1px;background:var(--line);margin:15px 0}
.flex{display:flex;align-items:center;gap:10px}
.flex.wrap{flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:12px} .strong{font-weight:800}
.center{text-align:center} .nowrap{white-space:nowrap} .mono{font-variant-numeric:tabular-nums}
.scrim{display:none}
.pick-list{max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px}
.pick{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;cursor:pointer;transition:.14s}
.pick:hover{background:var(--line-2)}
.pick input{width:17px;height:17px;accent-color:var(--brand-3);flex:0 0 17px}
.pick .pt{flex:1;min-width:0}
.pick .pt b{display:block;font-size:13px;font-weight:700}
.pick .pt span{font-size:11px;color:var(--muted)}

/* ---------- Responsive ---------- */
@media (max-width:1200px){
  .g-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-23,.g-32{grid-template-columns:minmax(0,1fr)}
  .sched{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:900px){
  .sidebar{transform:translateX(100%)}
  [dir=ltr] .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.55)}
  .main{margin-inline-start:0}
  .burger{display:flex}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;opacity:0;pointer-events:none;transition:.25s}
  .scrim.on{opacity:1;pointer-events:auto}
  .g-3,.g-2{grid-template-columns:minmax(0,1fr)}
  .searchbox input{width:150px}
  .sched{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .content{padding:12px}
  .topbar{padding:9px 12px;gap:8px}
  .g-4{grid-template-columns:minmax(0,1fr)}
  .frow,.frow-3{grid-template-columns:minmax(0,1fr)}
  .stat .val{font-size:22px}
  .ptitle h1{font-size:16px} .ptitle p{display:none}
  .searchbox{display:none}
  .overlay{padding:0;align-items:flex-end}
  .modal{max-width:100%;border-radius:18px 18px 0 0;margin:0}
  .modal-b{max-height:none}
  .toasts{inset-inline:12px;bottom:12px;max-width:none}
  .sched{grid-template-columns:minmax(0,1fr)}
}

/* ==========================================================
   PRINT / PDF  — منطقة الطباعة المخصصة
   ========================================================== */
#printArea{display:none}
.rep-head{display:flex;align-items:center;gap:14px;border-bottom:3px solid #fac518;padding-bottom:12px;margin-bottom:14px}
.rep-head img{width:66px;height:66px;border-radius:50%;object-fit:cover;border:2px solid #fac518}
.rep-head .rm{flex:1}
.rep-head .rm b{display:block;font-size:19px;font-weight:800}
.rep-head .rm span{display:block;font-size:12.5px;color:#555}
.rep-head .rd{font-size:12px;color:#555;text-align:left;line-height:1.7}
.rep-title{background:#fff6dd;border:1px solid #f0dca0;border-radius:10px;padding:9px 13px;font-weight:800;font-size:14px;margin-bottom:12px}
.rep-sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rep-sum div{border:1px solid #e2e2e2;border-radius:10px;padding:8px 13px;font-size:12.5px;color:#444}
.rep-sum div b{display:block;font-size:16px;color:#111;font-weight:800}
.rep-table{width:100%;border-collapse:collapse;font-size:12.5px}
.rep-table th,.rep-table td{border:1px solid #d9d9d9;padding:6px 8px;text-align:right}
.rep-table th{background:#f4f5f7;font-weight:800}
.rep-table tr:nth-child(even) td{background:#fafbfc}
.rep-table td.c{text-align:center;font-variant-numeric:tabular-nums}
.rep-foot{margin-top:16px;border-top:1px dashed #ccc;padding-top:9px;font-size:11px;color:#666;display:flex;justify-content:space-between}

@media print{
  @page{size:A4;margin:12mm 10mm}
  html,body{background:#fff !important;height:auto}
  body>*{display:none !important}
  #printArea{display:block !important;color:#111;padding:0;margin:0}
  #printArea .rep-table{font-size:11.5px}
  #printArea .rep-table th,#printArea .rep-table td{padding:5px 6px}
  .rep-foot{position:fixed;bottom:0;left:0;right:0}
}

<script>

/* ==== 20-core.js ==== */
/* ==========================================================
   منصة المستر — Part 1/4 : Core
   الأدوات · الحالة · التخزين · Firebase · المكوّنات
   ========================================================== */
'use strict';

const AF_LOGO_FALLBACK = window.AF_LOGO_FALLBACK;

/* ---------------- DOM helpers ---------------- */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.prototype.slice.call(root.querySelectorAll(sel));
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function icon(name, cls){ return `<svg class="${cls || ''}"><use href="#i-${name}"/></svg>`; }
function uid(p){ return (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function debounce(fn, ms){ let t; return function(){ const a = arguments, c = this; clearTimeout(t); t = setTimeout(() => fn.apply(c, a), ms); }; }
function throttle(fn, ms){ let last = 0, tm = null; return function(){ const a = arguments, now = Date.now();
  if (now - last > ms){ last = now; fn.apply(this, a); } else { clearTimeout(tm); tm = setTimeout(() => { last = Date.now(); fn.apply(this, a); }, ms - (now - last)); } }; }
function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
function sum(arr, f){ return arr.reduce((t, x) => t + (f ? f(x) : x), 0); }
function groupBy(arr, f){ const m = {}; arr.forEach(x => { const k = f(x); (m[k] = m[k] || []).push(x); }); return m; }
function sortBy(arr, f, dir){ return arr.slice().sort((a, b) => { const x = f(a), y = f(b); return (x < y ? -1 : x > y ? 1 : 0) * (dir === 'desc' ? -1 : 1); }); }
function unique(a){ return Array.from(new Set(a)); }
function nf(n, dec){ return (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }); }
function pct(a, b){ return b ? Math.round((a / b) * 100) : 0; }
function ar(n){ return nf(n, 0); }

/* ---------------- Arabic dates & times ---------------- */
const AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const AR_DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const AR_DAYS_SHORT = ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const DAY_ORDER = [6,0,1,2,3,4,5]; // سبت أول الأسبوع

function iso(d){ const x = d ? new Date(d) : new Date();
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
function today(){ return iso(new Date()); }
function parseISO(s){ if (!s) return null; const p = String(s).split('-').map(Number); if (p.length < 3 || !p[0]) return null; return new Date(p[0], p[1]-1, p[2]); }
function monthKey(d){ if (typeof d === 'string' && /^\d{4}-\d{2}/.test(d)) return d.slice(0,7); const x = d ? new Date(d) : new Date();
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`; }
function monthName(k){ const p = String(k).split('-'); return (AR_MONTHS[Number(p[1])-1] || '') + ' ' + p[0]; }
function fmtDate(s, withDay){ const d = parseISO(s); if (!d) return '—'; const base = `${d.getDate()} ${AR_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  return withDay ? `${AR_DAYS[d.getDay()]} ${base}` : base; }
function fmtShort(s){ const d = parseISO(s); return d ? `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}` : '—'; }
function addDays(s, n){ const d = typeof s === 'string' ? parseISO(s) : new Date(s); d.setDate(d.getDate() + n); return iso(d); }
function addMonths(s, n){ const d = parseISO(s) || new Date(); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
  const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day, last)); return iso(d); }
function daysBetween(a, b){ const d1 = parseISO(a), d2 = parseISO(b); return (d1 && d2) ? Math.round((d2 - d1) / 86400000) : 0; }
function monthRange(startKey, n){ const out = []; let k = startKey; for (let i = 0; i < n; i++){ out.push(k); k = monthKey(addMonths(k + '-01', 1)); } return out; }
function monthSeq(a, b){ const out = []; let k = a, g = 0; while (k <= b && g++ < 240){ out.push(k); k = monthKey(addMonths(k + '-01', 1)); } return out; }
/* الوقت */
function toMin(t){ const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || '')); return m ? (+m[1]) * 60 + (+m[2]) : null; }
function fmtTime(t){
  const m = toMin(t); if (m == null) return '—';
  let h = Math.floor(m / 60); const mm = m % 60;
  const suf = h >= 12 ? 'م' : 'ص';
  let hh = h % 12; if (hh === 0) hh = 12;
  return `${hh}:${String(mm).padStart(2,'0')} ${suf}`;
}
function timeRange(g){ return fmtTime(g.from) + ' — ' + fmtTime(g.to); }
function nowStamp(){ const d = new Date(); return d.toLocaleDateString('ar-EG', { day:'2-digit', month:'2-digit', year:'numeric' }) + ' — ' + d.toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' }); }
function initials(n){ const p = String(n || '').trim().split(/\s+/); return (p[0] ? p[0][0] : '?') + (p[1] ? p[1][0] : ''); }
const AV_COLORS = ['#fac518','#2563eb','#12a150','#e02424','#7c3aed','#0891b2','#db2777','#ea580c','#4f46e5','#0d9488'];
function avColor(k){ let h = 0; const s = String(k || ''); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 9973; return AV_COLORS[h % AV_COLORS.length]; }
function parsePhone(p){ return String(p || '').replace(/[^\d+]/g, ''); }
function waLink(phone, text){
  let p = parsePhone(phone);
  if (p.startsWith('+')) p = p.slice(1);
  if (p.startsWith('0')) p = '20' + p.slice(1);
  if (!p.startsWith('20') && p.length <= 11) p = '20' + p;
  return `https://wa.me/${p}?text=${encodeURIComponent(text || '')}`;
}

/* ---------------- Toast ---------------- */
function toast(msg, type, title){
  const box = $('#toasts'); if (!box) return;
  const t = document.createElement('div');
  const icons = { ok:'check', bad:'alert', warn:'alert', info:'bell' };
  t.className = 'toast ' + (type || 'info');
  t.innerHTML = `<span class="ti">${icon(icons[type] || 'bell')}</span>
    <span class="tt"><b>${esc(title || ({ok:'تم بنجاح',bad:'خطأ',warn:'تنبيه',info:'معلومة'})[type] || 'معلومة')}</b><span>${esc(msg)}</span></span>`;
  box.appendChild(t);
  setTimeout(() => { t.style.transition = '.3s'; t.style.opacity = '0'; t.style.transform = 'translateY(10px)'; setTimeout(() => t.remove(), 320); }, type === 'bad' ? 6000 : 3600);
}

/* ---------------- Modal ---------------- */
const Modal = {
  stack: [],
  open(opt){
    const id = uid('m');
    const ov = document.createElement('div');
    ov.className = 'overlay'; ov.dataset.mid = id;
    ov.innerHTML = `
      <div class="modal${opt.size ? ' ' + opt.size : ''}" role="dialog" aria-modal="true">
        <div class="modal-h">
          <div><h3>${esc(opt.title || '')}</h3>${opt.sub ? `<div class="sub">${esc(opt.sub)}</div>` : ''}</div>
          <button class="x no-print" data-close="${id}" aria-label="إغلاق">${icon('x')}</button>
        </div>
        <div class="modal-b">${opt.body || ''}</div>
        ${opt.footer === null ? '' : `<div class="modal-f no-print">${opt.footer || `<button class="btn" data-close="${id}">إغلاق</button>`}</div>`}
      </div>`;
    $('#modalRoot').appendChild(ov);
    ov.querySelectorAll('[data-close="__ID__"]').forEach(b => b.setAttribute('data-close', id));
    this.stack.push(id);
    document.body.style.overflow = 'hidden';
    ov.addEventListener('click', e => { if (e.target === ov && opt.dismissable !== false) this.close(id); });
    if (opt.onMount) opt.onMount(ov.querySelector('.modal'), ov);
    const f = ov.querySelector('input,select,textarea,button.pri');
    if (f && opt.autofocus !== false && window.innerWidth > 700) setTimeout(() => { try{ f.focus(); }catch(e){} }, 60);
    return id;
  },
  close(id){
    const ov = id ? $(`.overlay[data-mid="${id}"]`) : (this.stack.length ? $(`.overlay[data-mid="${this.stack[this.stack.length-1]}"]`) : null);
    if (!ov) return;
    this.stack = this.stack.filter(x => x !== ov.dataset.mid);
    ov.style.transition = '.18s'; ov.style.opacity = '0';
    setTimeout(() => ov.remove(), 180);
    if (!this.stack.length) document.body.style.overflow = '';
  },
  closeAll(){ this.stack.slice().forEach(id => this.close(id)); }
};

/* ---------------- الإعدادات الافتراضية ---------------- */
const DEFAULT_STAGES = ['الأول الابتدائي','الثاني الابتدائي','الثالث الابتدائي','الرابع الابتدائي','الخامس الابتدائي','السادس الابتدائي',
  'الأول الإعدادي','الثاني الإعدادي','الثالث الإعدادي','الأول الثانوي','الثاني الثانوي','الثالث الثانوي'];

function defaultData(){
  return {
    meta: { version: 2, rev: 0, updatedAt: new Date().toISOString(), createdAt: new Date().toISOString() },
    settings: {
      platformName: 'منصة المستر',
      teacherName: 'أحمد فتحي',
      phone: '',
      stages: DEFAULT_STAGES.slice(),
      studySystems: ['عام','أزهر'],
      studySystemsBac: ['عام','بكالوريا','أزهر'],
      bacStage: 'الثاني الثانوي',
      studentTypes: ['جديد','مستمر','متميز'],
      levels: ['ممتاز','جيد جدًا','جيد','متوسط','ضعيف'],
      payModes: { session: 'بالحصة', monthly: 'بالشهر' },
      absentWarn: 3,
      theme: 'light'
    },
    groups: [], students: [], exams: [], grades: {}, attendance: {}
  };
}

const S = {
  data: defaultData(),
  view: 'dashboard',
  query: '',
  ui: {
    stuFilter: { stage:'', groupId:'', payMode:'', type:'', status:'', sort:'name' },
    grpFilter: { stage:'', day:'' },
    att: { date: today(), groupId:'' },
    exam: { id:'' },
    rep: { kind:'student', from: addDays(today(), -30), to: today(), stage:'', groupId:'', studentId:'', examId:'' }
  },
  fb: { status:'off', cfg:null, app:null, db:null, api:null, path:'', unsubs:[], err:'', syncing:false, lastSync:null },
  applyingRemote: false
};

/* ---------------- Storage ---------------- */
const LS_KEY = 'mostar_platform_v2';
const FB_KEY = 'mostar_platform_fb';

function migrate(d){
  const base = defaultData();
  const out = Object.assign({}, base, d || {});
  out.meta = Object.assign({}, base.meta, d && d.meta);
  out.settings = Object.assign({}, base.settings, d && d.settings);
  ['stages','studySystems','studySystemsBac','studentTypes','levels'].forEach(k => {
    if (!Array.isArray(out.settings[k]) || !out.settings[k].length) out.settings[k] = base.settings[k].slice();
  });
  out.groups = (out.groups || []).map(g => Object.assign({ id: uid('g'), name:'', stage:'', day: 6, from:'16:00', to:'18:00', payMode:'monthly', level:'', note:'' }, g));
  out.students = (out.students || []).map(s => Object.assign({
    id: uid('s'), code:'', name:'', stage:'', studySystem:'', type:'', level:'', groupId:'',
    payMode:'monthly', phone:'', parentPhone:'', guardian:'', joinDate: today(), status:'active', notes:''
  }, s));
  out.exams = (out.exams || []).map(e => Object.assign({ id: uid('e'), name:'', stage:'', groupId:'', date: today(), max: 20, note:'' }, e));
  out.grades = out.grades || {};
  out.attendance = out.attendance || {};
  return out;
}
function loadLocal(){
  try{ const raw = localStorage.getItem(LS_KEY);
    if (raw){ S.data = migrate(JSON.parse(raw)); return true; } }catch(e){ console.warn(e); }
  return false;
}
const saveLocal = debounce(function(){
  try{ S.data.meta.updatedAt = new Date().toISOString(); localStorage.setItem(LS_KEY, JSON.stringify(S.data)); }
  catch(e){ console.warn(e); toast('تعذّر الحفظ في المتصفح', 'bad'); }
}, 200);

const dirty = { main:false };
function commit(opts){
  opts = opts || {};
  S.data.meta.rev = (S.data.meta.rev || 0) + 1;
  S.data.meta.updatedAt = new Date().toISOString();
  dirty.main = true;
  saveLocal();
  if (!opts.silent) render();
  Cloud.push();
}

/* ---------------- Cloud (Firebase) ---------------- */
const Cloud = {
  readCfg(){ try{ return JSON.parse(localStorage.getItem(FB_KEY) || 'null'); }catch(e){ return null; } },
  writeCfg(c){ c ? localStorage.setItem(FB_KEY, JSON.stringify(c)) : localStorage.removeItem(FB_KEY); },
  setStatus(s, msg){ S.fb.status = s; if (msg) S.fb.err = msg; paintCloud(); },
  path(){ return 'platforms/' + ((S.fb.cfg && S.fb.cfg.code) || 'default'); },

  async connect(opts){
    opts = opts || {};
    const cfg = opts.config || this.readCfg();
    if (!cfg || !cfg.apiKey || !cfg.projectId){ toast('أدخل إعدادات Firebase أولًا', 'warn'); return false; }
    this.disconnect(true);
    S.fb.cfg = cfg;
    if (opts.save !== false) this.writeCfg(cfg);
    this.setStatus('busy', 'جارٍ الاتصال...');
    try{
      const V = '10.12.5';
      const [appMod, fsMod] = await Promise.all([
        import('https://www.gstatic.com/firebasejs/' + V + '/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/' + V + '/firebase-firestore.js')
      ]);
      const app = appMod.initializeApp(cfg, 'mostar-' + Date.now().toString(36));
      const db = fsMod.getFirestore(app);
      S.fb.app = app; S.fb.db = db;
      S.fb.api = { doc: fsMod.doc, collection: fsMod.collection, onSnapshot: fsMod.onSnapshot, setDoc: fsMod.setDoc, getDoc: fsMod.getDoc };
      S.fb.path = this.path();
      this.listen();
      this.setStatus('live', null);
      S.fb.lastSync = new Date();
      toast('تم الاتصال بالسحابة — المزامنة شغالة', 'ok');
      paintCloud();
      return true;
    }catch(err){
      console.error(err);
      this.setStatus('error', (err && err.message) || 'فشل الاتصال');
      toast('فشل الاتصال: ' + ((err && err.message) || ''), 'bad');
      return false;
    }
  },
  disconnect(silent){
    (S.fb.unsubs || []).forEach(u => { try{ u(); }catch(e){} });
    S.fb.unsubs = [];
    if (S.fb.app){ try{ S.fb.app.delete(); }catch(e){} }
    S.fb.app = null; S.fb.db = null;
    if (!silent){ this.setStatus('off', null); toast('تم فصل الاتصال — النظام شغال محليًا', 'info'); }
    paintCloud();
  },
  listen(){
    const api = S.fb.api, db = S.fb.db, base = S.fb.path;
    S.fb.unsubs.push(api.onSnapshot(api.doc(db, base), snap => {
      if (!snap.exists()){ this._doPush(); return; }
      const remote = snap.data() || {};
      if ((remote.rev || 0) <= (S.data.meta.rev || 0)){ S.fb.lastSync = new Date(); paintCloud(); return; }
      this.applyRemote(remote);
    }, err => this.setStatus('error', err.message)));

    S.fb.unsubs.push(api.onSnapshot(api.collection(db, base + '/attendance'), snap => {
      let changed = false;
      snap.forEach(d => {
        const data = d.data() || {};
        if ((data.rev || 0) > ((S.data.attendance[d.id] || {}).rev || 0)){
          S.data.attendance[d.id] = { groupId: data.groupId || '', note: data.note || '', records: data.records || {}, rev: data.rev || 0, savedAt: data.savedAt || '' };
          changed = true;
        }
      });
      if (changed){ S.applyingRemote = true; saveLocal(); render(); S.applyingRemote = false; S.fb.lastSync = new Date(); paintCloud(); }
    }, err => this.setStatus('error', err.message)));
  },
  applyRemote(remote){
    if (!remote.students) return;
    const att = S.data.attendance;
    S.applyingRemote = true;
    S.data = migrate({
      meta: Object.assign({}, S.data.meta, remote.meta, { rev: remote.rev || 0 }),
      settings: Object.assign({}, S.data.settings, remote.settings),
      groups: remote.groups, students: remote.students, exams: remote.exams, grades: remote.grades, attendance: att
    });
    saveLocal(); render();
    S.applyingRemote = false;
    S.fb.lastSync = new Date();
    toast('تم تحديث البيانات من السحابة', 'info');
  },
  push(force){
    if (S.fb.status !== 'live' || S.applyingRemote) return;
    this._push = this._push || debounce(() => this._doPush(), 900);
    if (force) this._doPush(); else this._push();
  },
  async _doPush(){
    const api = S.fb.api, db = S.fb.db, base = S.fb.path;
    if (!api || !db) return;
    dirty.main = false;
    S.fb.syncing = true; paintCloud();
    try{
      await api.setDoc(api.doc(db, base), {
        meta: S.data.meta, settings: S.data.settings, groups: S.data.groups, students: S.data.students,
        exams: S.data.exams, grades: S.data.grades, rev: S.data.meta.rev, updatedAt: new Date().toISOString()
      }, { merge: true });
      const keys = Object.keys(S.data.attendance);
      for (const k of keys){
        const rec = S.data.attendance[k];
        await api.setDoc(api.doc(db, base + '/attendance', k), {
          groupId: rec.groupId || '', note: rec.note || '', records: rec.records || {}, rev: rec.rev || 0, savedAt: rec.savedAt || ''
        }, { merge: true });
      }
      S.fb.syncing = false; S.fb.lastSync = new Date(); paintCloud();
    }catch(err){ S.fb.syncing = false; this.setStatus('error', err.message); console.error(err); toast('فشل الرفع للسحابة: ' + err.message, 'bad'); }
  },
  async pull(){
    const api = S.fb.api, db = S.fb.db;
    if (!api){ toast('اتصل بالسحابة أولًا', 'warn'); return; }
    try{
      const snap = await api.getDoc(api.doc(db, S.fb.path));
      if (!snap.exists()){ toast('لا توجد بيانات على السحابة', 'warn'); return; }
      this.applyRemote(snap.data());
      toast('تم تنزيل البيانات', 'ok');
    }catch(e){ toast('فشل التنزيل: ' + e.message, 'bad'); }
  },
  async pushAll(){
    if (S.fb.status !== 'live'){ toast('اتصل بالسحابة أولًا', 'warn'); return; }
    S.data.meta.rev = (S.data.meta.rev || 0) + 1;
    await this._doPush();
    toast('تم رفع كل البيانات', 'ok');
  }
};
function paintCloud(){
  const chip = $('#cloudChip'); if (!chip) return;
  const map = { off:['', 'تخزين محلي', 'اضغط للربط بالسحابة'],

/* تعارض مواعيد الحصص */
function groupsConflict(day, from, to, exceptId){
  const f = toMin(from), t = toMin(to);
  if (f == null || t == null) return null;
  for (const g of S.data.groups){
    if (g.id === exceptId) continue;
    if (Number(g.day) !== Number(day)) continue;
    const gf = toMin(g.from), gt = toMin(g.to);
    if (gf == null || gt == null) continue;
    if (f < gt && gf < t) return g;
  }
  return null;
}
/* الحضور */
function attKey(date, gid){ return date + '@' + (gid || 'none'); }
function getAtt(date, gid){ return S.data.attendance[attKey(date, gid)] || null; }
function setAtt(date, gid, records, note){
  const k = attKey(date, gid), prev = S.data.attendance[k] || {};
  S.data.attendance[k] = { groupId: gid || '', note: note || '', records: records, rev: (prev.rev || 0) + 1, savedAt: new Date().toISOString() };
}
function allAttRecords(){
  const out = [];
  Object.keys(S.data.attendance).forEach(k => {
    const parts = k.split('@'), rec = S.data.attendance[k];
    Object.keys(rec.records || {}).forEach(sid => out.push({ date: parts[0], groupId: parts[1] === 'none' ? '' : parts[1], studentId: sid, status: rec.records[sid] }));
  });
  return out;
}
function attStats(sid, from, to){
  const st = { present:0, absent:0, late:0, excused:0, total:0 };
  allAttRecords().forEach(r => {
    if (r.studentId !== sid) return;
    if (from && r.date < from) return;
    if (to && r.date > to) return;
    if (st[r.status] != null) st[r.status]++;
    st.total++;
  });
  const counted = st.present + st.absent + st.late;
  st.rate = counted ? Math.round(((st.present + st.late) / counted) * 100) : 0;
  st.absentRate = counted ? Math.round((st.absent / counted) * 100) : 0;
  return st;
}
function attRate(sid, from, to){ return attStats(sid, from, to).rate; }
function examAvg(sid){
  const v = [];
  S.data.exams.forEach(e => { const g = (S.data.grades[e.id] || {})[sid]; if (typeof g === 'number' && e.max) v.push((g / e.max) * 100); });
  return v.length ? Math.round(sum(v, x => x) / v.length) : null;
}
function examCount(sid){
  return S.data.exams.filter(e => typeof (S.data.grades[e.id] || {})[sid] === 'number').length;
}
function studentStatus(s){
  if (s.status === 'stopped') return { key:'stopped', label:'موقوف', cls:'b-gray' };
  if (s.status === 'paused') return { key:'paused', label:'متوقف مؤقتًا', cls:'b-gray' };
  const st = attStats(s.id, addDays(today(), -30), today());
  if (st.total >= 4 && st.absentRate >= 40) return { key:'weak', label:'غياب متكرر', cls:'b-bad' };
  if (!s.groupId) return { key:'nogroup', label:'بدون حصة', cls:'b-warn' };
  return { key:'ok', label:'منتظم', cls:'b-ok' };
}
function alerts(){
  const out = [], t = today();
  S.data.students.forEach(s => {
    if (s.status === 'stopped') return;
    const st = studentStatus(s);
    const a30 = attStats(s.id, addDays(t, -30), t);
    if (!s.groupId) out.push({ sev:'warn', icon:'layers', title:`${s.name} بدون حصة`, sub:'حدّد له مجموعة من شاشة المجموعات', act:'assign', id:s.id });
    else if (a30.absent >= (S.data.settings.absentWarn || 3))
      out.push({ sev:'bad', icon:'alert', title:`غياب متكرر: ${s.name}`, sub:`${a30.absent} غياب خلال 30 يوم · نسبة الحضور ${a30.rate}%`, act:'wa', id:s.id });
    if (!s.stage) out.push({ sev:'info', icon:'cap', title:`${s.name} بدون مرحلة`, sub:'حدّد المرحلة الدراسية لتظهر في التقارير', act:'edit', id:s.id });
    const avg = examAvg(s.id);
    if (avg != null && avg < 50) out.push({ sev:'warn', icon:'award', title:`مستوى منخفض: ${s.name}`, sub:`متوسط الدرجات ${avg}% — يحتاج متابعة`, act:'profile', id:s.id });
  });
  const order = { bad:0, warn:1, info:2 };
  return out.sort((a, b) => order[a.sev] - order[b.sev]);
}

/* ---------------- CSV & Files ---------------- */
function download(filename, content, type){
  const blob = new Blob([content], { type: type || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
}
function toCSV(headers, rows){
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  return '\uFEFF' + [headers.map(q).join(',')].concat(rows.map(r => r.map(q).join(','))).join('\r\n');
}
function exportCSV(name, headers, rows){
  download(name + '.csv', toCSV(headers, rows), 'text/csv;charset=utf-8');
  toast('تم تصدير ' + name + '.csv', 'ok');
}

/* ================= Charts ================= */
const Charts = {
  prep(cv, h){
    if (!cv) return null;
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth || (cv.parentElement && cv.parentElement.clientWidth) || 300;
    const hh = h || cv.clientHeight || 200;
    cv.width = w * dpr; cv.height = hh * dpr; cv.style.height = hh + 'px';
    const c = cv.getContext('2d'); if (!c) return null;
    c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, hh);
    c.font = '600 11px Cairo, Tahoma, sans-serif';
    return { c: c, w: w, h: hh };
  },
  css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); },
  bar(cv, labels, values, opt){
    opt = opt || {};
    const p = this.prep(cv); if (!p) return;
    const { c, w, h } = p, padB = 26, padT = 22, padS = 8;
    const max = Math.max(1, Math.max.apply(null, values.concat([0]))) * 1.15;
    const n = values.length || 1, slot = (w - padS * 2) / n, bw = Math.min(46, slot * 0.56);
    c.strokeStyle = this.css('--line');
    for (let i = 0; i <= 4; i++){ const yy = padT + ((h - padT - padB) / 4) * i; c.beginPath(); c.moveTo(padS, yy); c.lineTo(w - padS, yy); c.stroke(); }
    values.forEach((v, i) => {
      const bh = (h - padT - padB) * (v / max), x = padS + slot * i + (slot - bw) / 2, yy = h - padB - bh;
      const col = v > 0 ? (opt.color || this.css('--brand') || '#fac518') : this.css('--line');
      if (bh > 0){ c.fillStyle = col; c.fillRect(x, yy, bw, bh); }
      c.fillStyle = this.css('--muted-2'); c.textAlign = 'center';
      c.fillText(String(labels[i] || ''), x + bw / 2, h - padB + 16);
      if (v > 0){ c.fillStyle = this.css('--ink-2'); c.font = '700 11px Cairo, Tahoma, sans-serif';
        c.fillText(opt.fmt ? opt.fmt(v) : nf(v), x + bw / 2, yy - 6); c.font = '600 11px Cairo, Tahoma, sans-serif'; }
    });
  },
  line(cv, labels, values, opt){
    opt = opt || {};
    const p = this.prep(cv); if (!p) return;
    const { c, w, h } = p, padB = 24, padT = 14, padS = 26;
    const vals = values.filter(v => v != null);
    const max = opt.max || Math.max(1, Math.max.apply(null, vals.concat([0]))) * 1.15;
    const iw = w - padS - 10, ih = h - padB - padT;
    c.strokeStyle = this.css('--line');
    for (let i = 0; i <= 4; i++){ const yy = padT + (ih / 4) * i; c.beginPath(); c.moveTo(padS, yy); c.lineTo(w - 8, yy); c.stroke();
      c.fillStyle = this.css('--muted-2'); c.textAlign = 'left'; c.fillText(String(Math.round(max - (max / 4) * i)), 2, yy + 4); }
    const step = values.length > 1 ? iw / (values.length - 1) : iw;
    const pts = values.map((v, i) => ({ x: padS + step * i, y: v == null ? null : padT + ih - ih * (v / max) }));
    const def = pts.filter(p2 => p2.y != null);
    const col = opt.color || this.css('--ok') || '#12a150';
    if (def.length > 1){
      c.beginPath(); c.moveTo(def[0].x, padT + ih);
      def.forEach(p2 => c.lineTo(p2.x, p2.y));
      c.lineTo(def[def.length-1].x, padT + ih); c.closePath();
      c.fillStyle = col + '22'; c.fill();
      c.beginPath(); def.forEach((p2, i) => i ? c.lineTo(p2.x, p2.y) : c.moveTo(p2.x, p2.y));
      c.strokeStyle = col; c.lineWidth = 2.5; c.lineJoin = 'round'; c.stroke();
    }
    pts.forEach(p2 => { if (p2.y == null) return;
      c.beginPath(); c.arc(p2.x, p2.y, 4, 0, Math.PI * 2); c.fillStyle = this.css('--card'); c.fill();
      c.lineWidth = 2.5; c.strokeStyle = col; c.stroke(); });
    c.fillStyle = this.css('--muted-2'); c.textAlign = 'center';
    labels.forEach((l, i) => { if (labels.length <= 16 || i % 2 === 0) c.fillText(String(l), pts[i].x, h - 7); });
  },
  donut(cv, data){
    const p = this.prep(cv, (cv && cv.clientHeight) || 190); if (!p) return;
    const { c, w, h } = p, total = sum(data, d => d.value);
    const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 10, r = R * 0.62;
    if (!total){ c.fillStyle = this.css('--muted'); c.textAlign = 'center'; c.fillText('لا توجد بيانات', cx, cy); return; }
    let a0 = -Math.PI / 2;
    data.forEach(d => {
      const a1 = a0 + (d.value / total) * Math.PI * 2;
      c.beginPath(); c.arc(cx, cy, R, a0, a1); c.arc(cx, cy, r, a1, a0, true); c.closePath();
      c.fillStyle = d.color || '#fac518'; c.fill();
      c.strokeStyle = this.css('--card'); c.lineWidth = 2; c.stroke();
      a0 = a1;
    });
    c.fillStyle = this.css('--ink'); c.textAlign = 'center'; c.font = '800 20px Cairo, Tahoma, sans-serif';
    c.fillText(nf(total), cx, cy + 2);
    c.font = '600 11px Cairo, Tahoma, sans-serif'; c.fillStyle = this.css('--muted');
    c.fillText('طالب', cx, cy + 18);
  }
};

    ${statCard({ label:'متوسط الدرجات', icon:'award', value: avgAll == null ? '—' : avgAll + '%', tone: avgAll == null ? '' : avgAll >= 65 ? 'ok' : 'bad',

  </div>

  <div class="card mt">

      <span class="sub">اضغط على أي حصة لتسجيل حضورها</span>
      <span class="sp"></span>
      <button class="btn sm" data-act="addGroup">${icon('plus')} حصة جديدة</button></div>

  <div class="grid g-3 mt">

  <div class="grid g-4 mt">

    ${statCard({ label:'المراحل', icon:'cap', value: ar(unique(S.data.groups.map(g => g.stage).filter(Boolean)).length || unique(st.map(s => s.stage).filter(Boolean)).length),

function scheduleHTML(){
  const gs = groupsSorted();
  const dayBox = d => {
    const list = gs.filter(g => Number(g.day) === d);
    return `<div class="day"><h4>${AR_DAYS[d]}</h4>
      ${list.length ? list.map(g => `<div class="slot" data-act="attGroup" data-id="${g.id}" title="تسجيل حضور ${esc(g.name)}">
        <span>${timeRange(g)}</span>
        <b>${esc(g.name)}</b>
        <em>${esc(g.stage || '—')} · ${studentsOfGroup(g.id).length} طالب · ${esc(payLabel(g.payMode))}</em>
      </div>`).join('') : '<div class="none">لا توجد حصص</div>'}</div>`;
  };
  return `<div class="sched">${DAY_ORDER.map(dayBox).join('')}</div>`;
}
function alertBtn(a){
  const s = student(a.id);
  const phone = s ? (s.parentPhone || s.phone) : '';
  if (a.act === 'assign') return `<button class="btn sm pri" data-act="assign" data-id="${a.id}">تحديد حصة</button>`;
  if (a.act === 'edit') return `<button class="btn sm" data-act="editStudent" data-id="${a.id}">تعديل</button>`;
  if (a.act === 'profile') return `<button class="btn sm" data-act="profile" data-id="${a.id}">الملف</button>`;
  if (a.act === 'wa' && phone) return `<a class="btn sm" target="_blank" rel="noopener" href="${waLink(phone, 'السلام عليكم، نودّ الاطمئنان على ' + (s ? s.name : '') + ' — لاحظنا تكرار الغياب. برجاء التواصل معنا.')}">${icon('whatsapp')} واتساب</a>`;
  return '';
}

    const recs = Object.keys(S.data.attendance).filter(k => k.split('@')[0] === d).map(k => S.data.attendance[k].records || {});
    let tot = 0, ok = 0;
    recs.forEach(r => Object.keys(r).forEach(sid => { tot++; if (r[sid] === 'present' || r[sid] === 'late') ok++; }));

  }), { max: 100, fmt: v => v + '%' });

Views.students = function(){
  const f = S.ui.stuFilter;
  let list = S.data.students.slice();
  const q = S.query.trim().toLowerCase();
  if (q) list = list.filter(s => (s.name + ' ' + (s.code||'') + ' ' + (s.phone||'') + ' ' + (s.parentPhone||'') + ' ' + (s.guardian||'') + ' ' + (s.stage||'')).toLowerCase().includes(q));
  if (f.stage) list = list.filter(s => s.stage === f.stage);
  if (f.groupId) list = list.filter(s => (s.groupId || '') === f.groupId);
  if (f.payMode) list = list.filter(s => (s.payMode || 'monthly') === f.payMode);
  if (f.type) list = list.filter(s => s.type === f.type);
  if (f.status) list = list.filter(s => (s.status || 'active') === f.status);
  const sorters = { name: x => x.name || '', joinDate: x => x.joinDate || '', rate: x => attStats(x.id).rate, avg: x => -1 * (examAvg(x.id) || 0), stage: x => x.stage || '', group: x => groupName(x.groupId) };
  list = sortBy(list, sorters[f.sort] || sorters.name, (f.sort === 'rate') ? 'desc' : 'asc');

  const rows = list.map(s => {

      <td>${stuCell(s)}</td>

      <td>${payBadge(s.payMode)}</td>

      </div></td></tr>`;
  }).join('');

  return pageHead('الطلاب', `${list.length} طالب${q ? ' (نتيجة بحث)' : ''} · ${ar(list.filter(s => !s.groupId).length)} بدون حصة`,
    `<button class="btn" data-act="expStudents">${icon('download')} Excel</button>
     <button class="btn" data-act="pdfStudents">${icon('pdf')} PDF</button>
     <button class="btn pri" data-act="addStudent">${icon('plus')} طالب جديد</button>`) + `

      <select class="inp" style="max-width:150px" data-filter="status">

        <option value="active" ${f.status === 'active' ? 'selected' : ''}>نشط</option>
        <option value="paused" ${f.status === 'paused' ? 'selected' : ''}>متوقف مؤقتًا</option>

  </div>`;

  return list.map(g => {

let attDraft = null;

/* ================= الحضور والغياب ================= */
Views.attendance = function(){
  const a = S.ui.att;
  if (!S.data.groups.length){
    return pageHead('الحضور والغياب', 'أنشئ حصة أولًا لتسجيل الحضور') +
      `<div class="card"><div class="card-b">${emptyState('لا توجد حصص',
        'الحضور بيتسجل لكل حصة على حدة — ابدأ بإنشاء حصة وتحديد يومها ومواعيدها',
        `<button class="btn pri" data-act="addGroup">${icon('plus')} إنشاء حصة</button>`)}</div></div>`;
  }
  let gid = a.groupId;
  if (!gid || !groupOf(gid)){
    const dg = groupsSorted().find(g => Number(g.day) === parseISO(a.date).getDay());
    gid = (dg || groupsSorted()[0] || {}).id;
    a.groupId = gid;
  }
  if (attDraft == null || attDraft.date !== a.date || attDraft.groupId !== gid){
    const saved = getAtt(a.date, gid);
    attDraft = { date: a.date, groupId: gid, records: Object.assign({}, (saved && saved.records) || {}), note: (saved && saved.note) || '', dirty: false };
  }
  const g = groupOf(gid);
  const ss = studentsOfGroup(gid).filter(s => s.status !== 'stopped');
  const rec = attDraft.records;
  const counts = { present:0, absent:0, late:0, excused:0 };
  ss.forEach(s => { if (rec[s.id] && counts[rec[s.id]] != null) counts[rec[s.id]]++; });
  const marked = sum(Object.values(counts));
  const dow = parseISO(a.date) ? parseISO(a.date).getDay() : 0;
  const sameDay = g && Number(g.day) === dow;

  /* كشف الشهر للحصة المختارة */
  const y = Number(a.date.slice(0,4)), m = Number(a.date.slice(5,7));
  const lastD = new Date(y, m, 0).getDate();
  const mDays = [];
  for (let d = 1; d <= lastD; d++) mDays.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);

  return pageHead('الحضور والغياب', `${esc(g ? g.name : '')} · ${ar(ss.length)} طالب`,
    `<button class="btn" data-act="attPDF">${icon('pdf')} كشف الحضور PDF</button>
     <button class="btn" data-act="expAtt">${icon('download')} Excel</button>
     <button class="btn pri" data-act="attSave">${icon('save')} حفظ الحضور</button>`) + `

  <div class="card">
    <div class="card-h">
      <h3>${icon('check-square')} تسجيل الحضور</h3>
      <span class="sp"></span>
      <input type="date" class="inp" style="max-width:165px" data-att="date" value="${a.date}">
      <select class="inp" style="max-width:260px" data-att="group">
        ${groupsSorted().map(x => `<option value="${x.id}" ${gid === x.id ? 'selected' : ''}>${esc(x.name)} — ${AR_DAYS[x.day]} ${timeRange(x)}</option>`).join('')}
      </select>
    </div>
    <div class="card-b">
      ${!sameDay ? `<div class="help" style="margin-bottom:12px">ملاحظة: الحصة دي يوم <b>${AR_DAYS[g.day]}</b> وأنت بتسجّل يوم <b>${AR_DAYS[dow]}</b> (${fmtDate(a.date)}) — التسجيل مسموح لأي يوم.</div>` : ''}
      ${ss.length ? `
      <div class="flex wrap" style="margin-bottom:12px">
        <button class="btn sm" data-act="attAll" data-v="present">${icon('check')} الكل حاضر</button>
        <button class="btn sm ghost" data-act="attClear">${icon('refresh')} تفريغ</button>
        <div class="sp"></div>
        <div class="att-sum">
          <span class="k"><i style="background:var(--ok)"></i> حاضر ${counts.present}</span>
          <span class="k"><i style="background:var(--warn)"></i> متأخر ${counts.late}</span>
          <span class="k"><i style="background:var(--bad)"></i> غائب ${counts.absent}</span>
          <span class="k"><i style="background:var(--info)"></i> بعذر ${counts.excused}</span>
          <span class="badge ${marked === ss.length && ss.length ? 'b-ok' : 'b-warn'}">${marked}/${ss.length} مُسجَّل</span>
        </div>
      </div>
      <div id="attList">${ss.map(s => `
        <div class="att-row" data-sid="${s.id}">
          ${avatar(s.name, s.id)}
          <span class="an"><b>${esc(s.name)}</b>
            <span>${esc(s.stage || '')}${s.code ? ' · ' + esc(s.code) : ''} · حضور سابق ${attRate(s.id)}%</span></span>
          <span class="seg">
            ${[['present','حاضر'],['late','متأخر'],['absent','غائب'],['excused','بعذر']].map(x =>
              `<button data-act="mark" data-id="${s.id}" data-v="${x[0]}" class="${rec[s.id] === x[0] ? 'on' : ''}">${x[1]}</button>`).join('')}
          </span>
        </div>`).join('')}</div>
      <div class="field" style="margin-top:13px;margin-bottom:0"><label>ملاحظة الحصة ${icon('edit')}</label>
        <input class="inp" id="attNote" placeholder="مثال: تم حل تمارين الوحدة الثانية..." value="${esc(attDraft.note)}"></div>
      ` : emptyState('لا يوجد طلاب في هذه الحصة', 'أضف طلاب للحصة من شاشة المجموعات أو من ملف الطالب',
          `<button class="btn pri" data-act="manageGroup" data-id="${gid}">${icon('plus')} إضافة طلاب للحصة</button>`)}
    </div>
  </div>

  <div class="card mt">
    <div class="card-h"><h3>${icon('calendar')} كشف شهر ${monthName(a.date.slice(0,7))}</h3><span class="sub">${esc(g ? g.name : '')}</span>
      <span class="sp"></span>
      <div class="att-sum"><span class="k"><i style="background:var(--ok)"></i>حاضر</span><span class="k"><i style="background:var(--bad)"></i>غائب</span>
        <span class="k"><i style="background:var(--warn)"></i>متأخر</span><span class="k"><i style="background:var(--info)"></i>بعذر</span></div>
    </div>
    <div class="tbl-wrap"><table class="tbl" id="attMatrix">
      <thead><tr><th style="min-width:160px">الطالب</th>
      ${mDays.map(d => `<th style="text-align:center;padding:6px 3px;min-width:32px">${Number(d.slice(-2))}</th>`).join('')}
      <th>حضور</th><th>غياب</th><th>النسبة</th></tr></thead>
      <tbody>${ss.map(s => {
        let p = 0, ab = 0, l = 0, ex = 0;
        const cells = mDays.map(d => {
          const rr = getAtt(d, gid); const v = rr && rr.records[s.id];
          if (v === 'present') p++; else if (v === 'absent') ab++; else if (v === 'late') l++; else if (v === 'excused') ex++;
          const ch = v === 'present' ? '✓' : v === 'absent' ? '✕' : v === 'late' ? 'م' : v === 'excused' ? 'ع' : '';
          return `<td style="padding:3px 2px"><div class="cd ${v || ''}" data-cell="${s.id}:${d}" style="border-radius:7px;aspect-ratio:auto;height:26px">${ch}</div></td>`;
        }).join('');
        const counted = p + ab + l, rate = counted ? Math.round(((p + l) / counted) * 100) : 0;
        return `<tr><td>${stuCell(s)}</td>${cells}
          <td class="num" style="color:var(--ok)">${p + l}</td>
          <td class="num" style="color:var(--bad)">${ab}</td>
          <td>${counted ? `<span class="badge ${rate >= 80 ? 'b-ok' : rate >= 60 ? 'b-warn' : 'b-bad'}">${rate}%</span>` : '<span class="muted small">—</span>'}</td></tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>`;
};

    });
    return previewCard('كشف الحضور', `من ${fmtDate(r.from)} إلى ${fmtDate(r.to)}`,
      ['الطالب','المرحلة','الحصة','حاضر','متأخر','غائب','بعذر','إجمالي','النسبة'], rows, [1,2,3,4,5,6,7,8]);
  }
  if (r.kind === 'students'){
    const rows = ss.map(s => [s.name, s.stage || '—', s.studySystem || '—', s.type || '—', groupName(s.groupId), s.groupId ? dayTimeText(groupOf(s.groupId)) : '—', payLabel(s.payMode), attRate(s.id) + '%', examAvg(s.id) == null ? '—' : examAvg(s.id) + '%']);
    return previewCard('كشف الطلاب', `${ss.length} طالب`,
      ['الطالب','المرحلة','نظام الدراسة','النوع','الحصة','المواعيد','الدفع','الحضور','الدرجات'], rows, [7,8]);
  }
  if (r.kind === 'exams'){
    const e = examOf(r.examId) || S.data.exams[0];
    if (!e) return `<div class="card"><div class="card-b">${emptyState('لا توجد امتحانات','أنشئ امتحانًا أولًا')}</div></div>`;
    const gr = S.data.grades[e.id] || {};
    let sts = (e.groupId ? studentsOfGroup(e.groupId) : (e.stage ? studentsOfStage(e.stage) : S.data.students)).filter(s => typeof gr[s.id] === 'number');
    sts = sortBy(sts, s => gr[s.id], 'desc');
    let rank = 0, prev = null;
    const rows = sts.map((s, i) => { if (prev === null) rank = 0; else if (gr[s.id] !== prev) rank = i; prev = gr[s.id];
      return [String(rank + 1), s.name, s.stage || '—', groupName(s.groupId), gr[s.id], e.max, Math.round(gr[s.id] / e.max * 100) + '%']; });
    const avg = sts.length ? (sum(sts, s => gr[s.id]) / sts.length).toFixed(1) : '—';
    return `<div class="card"><div class="card-h"><h3>${icon('award')} ${esc(e.name)}</h3>
      <span class="sub">${esc(e.stage || '')}${e.groupId ? ' · ' + esc(groupName(e.groupId)) : ''} · ${fmtDate(e.date)} · الدرجة النهائية ${e.max}</span>
      <span class="sp"></span><span class="badge b-brand">المتوسط ${avg}</span></div>
      <div class="card-b">${previewTable(['ترتيب','الطالب','المرحلة','الحصة','الدرجة','من','النسبة'], rows, [0,4,5,6])}</div></div>`;
  }
  /* summary */
  const attR = ss.map(s => attStats(s.id, r.from, r.to)).reduce((t, a) => ({ t: t.t + a.total, ok: t.ok + a.present + a.late, ab: t.ab + a.absent }), { t:0, ok:0, ab:0 });
  const avgs = ss.map(s => examAvg(s.id)).filter(v => v != null);
  const rows = [
    ['عدد الطلاب', nf(ss.length)],
    ['الطلاب النشطين', nf(ss.filter(s => s.status === 'active').length)],
    ['عدد الحصص الأسبوعية', nf(S.data.groups.length)],
    ['طلاب بدون حصة', nf(ss.filter(s => !s.groupId).length)],
    ['عدد تسجيلات الحضور بالفترة', nf(attR.t)],
    ['نسبة الحضور بالفترة', (attR.t ? Math.round(attR.ok / attR.t * 100) : 0) + '%'],
    ['إجمالي الغياب بالفترة', nf(attR.ab)],
    ['عدد الامتحانات', nf(S.data.exams.length)],
    ['متوسط الدرجات العام', avgs.length ? Math.round(sum(avgs) / avgs.length) + '%' : '—'],
    ['عدد المراحل المسجلة', nf(unique(ss.map(s => s.stage).filter(Boolean)).length)]
  ];
  return previewCard('تقرير عام', `من ${fmtDate(r.from)} إلى ${fmtDate(r.to)}`, ['البند','القيمة'], rows, [1]);
}
function previewTable(headers, rows, numCols){
  numCols = numCols || [];
  return `<div class="tbl-wrap" style="max-height:620px"><table class="tbl">
    <thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${numCols.includes(i) ? 'num' : ''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function previewCard(title, sub, headers, rows, numCols){
  return `<div class="card"><div class="card-h"><h3>${icon('chart')} ${title}</h3><span class="sub">${esc(sub)}</span>
    <span class="sp"></span><span class="badge b-brand">${nf(rows.length)} سجل</span></div>
    <div class="card-b">${rows.length ? previewTable(headers, rows, numCols) : emptyState('لا توجد بيانات مطابقة','غيّر الفلاتر ثم اضغط تحديث المعاينة')}</div></div>`;
}

/* ---------------- Confirm ---------------- */
function confirmDialog(title, msg, okLabel, cb, danger){
  const id = Modal.open({ title: title, size: 'sm', autofocus: false,
    body: `<p style="line-height:1.9">${esc(msg)}</p>`,
    footer: `<button class="btn" data-close="${'__ID__'}">إلغاء</button><button class="btn ${danger ? 'bad' : 'pri'}" id="cfOk">${esc(okLabel || 'تأكيد')}</button>` });
  const ov = $(`.overlay[data-mid="${id}"]`);
  ov.querySelector('#cfOk').onclick = () => { Modal.close(id); cb(); };
  return id;
}
function nextCode(){
  const nums = S.data.students.map(s => Number(String(s.code || '').replace(/\D/g, '')) || 0);
  return 'S' + String((nums.length ? Math.max.apply(null, nums) : 0) + 1).padStart(3, '0');
}

        if (!name){ toast('اكتب اسم الطالب', 'warn'); return; }
        if (!stageEl.value){ toast('اختر المرحلة الدراسية', 'warn'); stageEl.focus(); return; }
        if (!$('#fSys', body).value){ toast('اختر نظام الدراسة', 'warn'); $('#fSys', body).focus(); return; }
        const data = {
          name: name, code: $('#fCode', body).value.trim(), stage: stageEl.value, studySystem: $('#fSys', body).value,
          type: $('#fType', body).value, level: $('#fLevel', body).value, groupId: $('#fGroup', body).value,
          payMode: $('#fPay', body).value, phone: $('#fPhone', body).value.trim(), parentPhone: $('#fPPhone', body).value.trim(),
          guardian: $('#fGuardian', body).value.trim(), joinDate: $('#fJoin', body).value || today(),
          status: $('#fStatus', body).value, notes: $('#fNotes', body).value.trim()
        };
        if (id){ Object.assign(student(id), data); toast('تم تحديث بيانات ' + name, 'ok'); }
        else { S.data.students.push(Object.assign({ id: uid('s') }, data)); toast('تمت إضافة ' + name, 'ok'); }
        Modal.closeAll(); commit();
      };
    }
  });
}

function assignStudent(sid){

  Modal.open({
    title: 'تحديد حصة', sub: s.name + (s.stage ? ' — ' + s.stage : ''), size: 'sm',
    body: `<div class="pick-list" style="max-height:320px">
      <label class="pick"><input type="radio" name="ag" value="" ${!s.groupId ? 'checked' : ''}><span class="pt"><b>بدون حصة</b><span>اتركه بدون توزيع حاليًا</span></span></label>
      ${gs.map(g => `<label class="pick"><input type="radio" name="ag" value="${g.id}" ${s.groupId === g.id ? 'checked' : ''}>
        <span class="pt"><b>${esc(g.name)}</b><span>${AR_DAYS[g.day]} · ${timeRange(g)} · ${esc(g.stage || '')} · ${studentsOfGroup(g.id).length} طالب${g.stage && s.stage && g.stage !== s.stage ? ' · ⚠️ مرحلة مختلفة' : ''}</span></span>
        ${payBadge(g.payMode)}</label>`).join('')}
    </div>`,
    footer: `<button class="btn" data-close="__ID__">إلغاء</button><button class="btn pri" id="asSave">${icon('save')} حفظ</button>`,
    onMount(body){
      $('#asSave', body).onclick = () => {
        const r = $$('input[name=ag]', body).find(x => x.checked);
        const gid = r ? r.value : '';
        const g = groupOf(gid);
        s.groupId = gid;
        if (g) s.payMode = s.payMode || g.payMode;
        if (g && !s.stage) s.stage = g.stage;
        Modal.closeAll(); commit(); toast('تم تحديد الحصة: ' + (g ? g.name : 'بدون حصة'), 'ok');
      };
    }
  });
}

/* ---------------- ملف الطالب ---------------- */
function openProfile(id){
  const s = student(id); if (!s) return;
  const a = attStats(s.id), g = groupOf(s.groupId);
  const avg = examAvg(s.id);
  const mk = monthKey(today());
  const y = Number(mk.slice(0,4)), m = Number(mk.slice(5,7));
  const first = new Date(y, m-1, 1).getDay(), lastD = new Date(y, m, 0).getDate();
  let cal = '';
  for (let i = 0; i < first; i++) cal += '<div class="cd" style="background:transparent"></div>';
  for (let d = 1; d <= lastD; d++){
    const ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec = getAtt(ds, s.groupId); const v = rec && rec.records[s.id];
    cal += `<div class="cd ${v || ''}" title="${fmtDate(ds)}">${d}</div>`;
  }
  Modal.open({
    title: s.name, sub: `${s.code || ''} · ${s.stage || 'بدون مرحلة'}${s.studySystem ? ' · ' + s.studySystem : ''} · ${g ? g.name : 'بدون حصة'}`,
    size: 'lg',
    body: `
      <div class="grid g-4" style="margin-bottom:14px">
        ${statCard({ label:'نسبة الحضور', icon:'check-square', value: a.rate + '%', tone: a.rate >= 80 ? 'ok' : a.rate >= 60 ? '' : 'bad',
          foot:`<span class="muted">${a.present + a.late} حضور من ${a.total}</span>` })}
        ${statCard({ label:'الغياب', icon:'alert', value: ar(a.absent), tone: a.absent ? 'bad' : 'ok',
          foot:`<span class="muted">${a.late} تأخير · ${a.excused} بعذر</span>` })}
        ${statCard({ label:'متوسط الدرجات', icon:'award', value: avg == null ? '—' : avg + '%', tone: avg == null ? '' : avg >= 65 ? 'ok' : 'bad',
          foot:`<span class="muted">${examCount(s.id)} امتحان</span>` })}
        ${statCard({ label:'حضور آخر 30 يوم', icon:'calendar', value: ar(attStats(s.id, addDays(today(),-30), today()).present), tone:'info',
          foot:`<span class="muted">${attStats(s.id, addDays(today(),-30), today()).absent} غياب</span>` })}
      </div>
      <div class="flex wrap" style="margin-bottom:13px">

function pdfStudent(id){
  const s = student(id); if (!s) return;
  const a = attStats(s.id), g = groupOf(s.groupId);
  const attRows = sortBy(S.data.exams.length ? [] : [], () => 0);
  const recs = [];
  Object.keys(S.data.attendance).forEach(k => {
    const rec = S.data.attendance[k], parts = k.split('@');
    if (rec.records && rec.records[s.id]) recs.push([parts[0], groupName(parts[1] === 'none' ? '' : parts[1]), { present:'حاضر', absent:'غائب', late:'متأخر', excused:'بعذر' }[rec.records[s.id]]]);
  });
  const last = sortBy(recs, r => r[0], 'desc').slice(0, 30);
  const gradeRows = S.data.exams.map(e => {
    const v = (S.data.grades[e.id] || {})[s.id];
    return [e.name, e.stage || '—', fmtDate(e.date), e.max, typeof v === 'number' ? v : '—', typeof v === 'number' ? Math.round(v / e.max * 100) + '%' : '—'];
  });
  const inner = reportHeader('تقرير متابعة طالب', 'ملف الطالب: ' + esc(s.name)) +
    summaryHTML([['نسبة الحضور', a.rate + '%'], ['مرات الحضور', a.present + a.late], ['الغياب', a.absent], ['التأخير', a.late],
      ['بعذر', a.excused], ['متوسط الدرجات', examAvg(s.id) == null ? '—' : examAvg(s.id) + '%']]) +
    tableHTML(['البند','البيانات'], [
      ['الاسم', s.name], ['الكود', s.code || '—'], ['المرحلة', s.stage || '—'], ['نظام الدراسة', s.studySystem || '—'],
      ['نوع الطالب', s.type || '—'], ['المستوى', s.level || '—'],
      ['الحصة', g ? g.name + ' — ' + AR_DAYS[g.day] + ' ' + timeRange(g) : 'بدون حصة'],
      ['نظام الدفع', payLabel(s.payMode)], ['هاتف الطالب', s.phone || '—'], ['ولي الأمر', (s.guardian || '—') + (s.parentPhone ? ' — ' + s.parentPhone : '')],
      ['تاريخ الانضمام', fmtDate(s.joinDate)], ['حالة الطالب', studentStatus(s).label], ['ملاحظات', s.notes || '—']
    ], { center:[1] }) +

  openPDF(inner);
}
