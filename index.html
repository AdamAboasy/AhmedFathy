      res = await fetch(fullUrl, { method: method, cache:'no-store',
        signal: ctl ? ctl.signal : undefined,
        headers: body ? { 'Content-Type':'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined });
    }catch(e){
      if (to) clearTimeout(to);
      const slow = e && (e.name === 'AbortError' || /abort/i.test(String(e && e.message)));
      throw Object.assign(new Error(slow ? 'الاتصال بالسحابة بطيء — بنجرّب تاني لوحده' : 'مفيش اتصال بالسحابة — راجع الإنترنت'),
        { kind:'net', raw:String(e && e.message || e) });
    }
    if (to) clearTimeout(to);
    const txt = await res.text();
    let j = null; try{ j = txt ? JSON.parse(txt) : null; }catch(e){ j = null; }
    this.bw(method, body, txt);                 // عداد الاستهلاك (بنقيس اللي بيعدي من الجهاز ده)
    // المشروع في منطقة تانية → السيرفر بيرجّع العنوان الصح، نحدّث نفسنا ونكرر مرة واحدة
    if (j && j.correctUrl && !retry){
      const c = this.merged(); c.dbUrl = String(j.correctUrl).replace(/\/+$/,'');
      this.writeCfg(c); S.fb.cfg = c;
      return this.rtdb(method, path, body, true, query);
    }
    if (!res.ok || (j && j.error)){
      const raw = (j && (j.error || j.message)) || ('HTTP ' + res.status);
      const diag = this.diagnose(raw, res.status, path);
      // السيرفر رفض الطلب لأن القواعد محكمة وإحنا مش مسجّلين → نسجّل دخول صامت ونجرّب تاني
      if (diag.kind === 'rules' && !retry && !tok && this.authKeyOf()){
        try{ const t2 = await this.signIn(); if (t2){ S.fb.auth = 'on'; return this.rtdb(method, path, body, true, query); } }catch(e){ S.fb.auth = 'fail'; S.fb.authErr = e.message; }
      }
      throw Object.assign(new Error(diag.msg), { kind: diag.kind, raw: raw, http: res.status });
    }
    // ✅ فايربيز قبلت «قايمة الأعضاء»: ده الفيصل → نشيل علامة الرفض القديمة
    if (S.fb.denied && this.pathKind(path) === 'members') S.fb.denied = false;
    // ✅ نجح: نمرّر نفس الكتابة للسيرفر التاني (مرآة) — عشان لو سيرفر وقع أو خلص، التاني فيه كل حاجة
    if (method === 'PUT' || method === 'DELETE') this.mirror(method, path, body);
    return j;
  },
  // السيرفر الحالي وصل حدّه المجاني → نروح للسيرفر التاني فورًا وبياناتنا كلها تفضل معانا
  async switchOnQuota(e){
    const cur = this.cfgNow().projectId;
    const other = FB_PROJECTS.filter(p => p.projectId !== cur)[0];
    if (!other){ this.setStatus('error', e.message); toast(e.message, 'bad', 'السحابة'); return false; }
    if (this._quotaSwitch === other.projectId) return false;         // جربنا ده قبل كده
    this._quotaSwitch = other.projectId;
    S.fb.quotaHit = { from: cur, to: other.projectId, at: new Date() };
    this.setQuotaHit(cur);                                            // يتفضل معروف بعد الريفريش
    toast('خلصت الكمية المجانية لسيرفر ' + (this.cfgNow().nick || cur) + ' — بنحوّل على ' + (other.nick || other.projectId) + ' تلقائيًا وكل بياناتك بتتزامن من غير أي نقصان', 'warn', 'السحابة');
    this._active = null;
    this.writeCfg(other, true);          // نفضل على السيرفر التاني لحد بداية الشهر الجديد
    S.fb.fellBack = true; S.fb.pinned = cur;
    const ok = await this.connect({ silent:true });
    if (ok){ this.markSynced(); dirty.main = true; await this.doPush(false); if (!this._bakAt || Date.now() - this._bakAt > 6 * 3600 * 1000){ this._bakAt = Date.now(); this.checkBackupAge(); } }
    paintCloud();
    return ok;
  },
  // الكتابة اختبار حقيقي: بنكتب قيمة صغيرة ونمسحها — عشان نعرف إن السيرفر فكّ الحد فعلًا
  async probeWrite(cfg){
    const base = String((cfg || {}).dbUrl || '').replace(/\/+$/,'');
    if (!base) return false;
    const url = base + '/_mostar_probe.json';
    try{
      let r = await fetch(url, { method:'PUT', cache:'no-store', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ t: Date.now() }) });
      if (!r.ok) return false;
      await fetch(url, { method:'DELETE', cache:'no-store' });
      return true;
    }catch(e){ return false; }
  },
  // هل نرجع لسيرفرنا الأساسي؟ بنجرّب كتابة فعلية كل شوية (لو الحد اتفك)
  async maybeReturnFromQuota(force){
    const q = S.fb.quotaHit;
    if (!q) return false;
    const pin = FB_PROJECTS.filter(p => p.projectId === q.from)[0];
    if (!pin) return false;
    if (!force && Date.now() - (this._quotaProbeAt || 0) < 3 * 3600000) return false;
    this._quotaProbeAt = Date.now();
    if (!(await this.probeWrite(pin))) return false;                  // لسه عند حده
    this._quotaSwitch = null; S.fb.quotaHit = null; S.fb.fellBack = false; S.fb.pinBack = false;
    this.clearQuotaHit();                                             // نمسح الحد قبل الاتصال عشان يرجع للأساسي
    this.writeCfg(pin);
    toast('سيرفرك الأساسي (' + (pin.nick || pin.projectId) + ') رجع شغال — بنرجع ليه تلقائيًا', 'ok', 'السحابة');
    const ok = await this.connect({ silent:true });
    if (ok){ await this.doPush(true); }
    return ok;
  },
  /* ---------- المرآة: نفس البيانات على السيرفرين ---------- */
  mirrorCfg(){
    const cur = this.cfgNow().projectId;
    if (S.data.settings && S.data.settings.fbMirror === false) return null;
    const atLimit = S.fb.quotaHit && S.fb.quotaHit.from;
    const other = FB_PROJECTS.filter(p => p.projectId !== cur && p.projectId !== atLimit)[0];
    return other || null;
  },
  // دمج من النسخة التانية (المرآة): بناخد منها أي حاجة أحدث أو ناقصة عندنا — واللي عندنا أحدث يفضل
  async mirrorMerge(){
    const cur = this.cfgNow().projectId;
    const others = FB_PROJECTS.filter(p => p.projectId !== cur);
    if (!others.length){ toast('مفيش سيرفر تاني متاح للدمج', 'warn', 'السحابة'); return false; }
    const get = async (base, p) => {
      const r = await fetch(base + '/' + p + '.json', { cache:'no-store' });
      if (!r.ok) throw Object.assign(new Error('HTTP ' + r.status), { kind:'net' });
      return r.json();
    };
    S.fb.syncing = true; S.fb.syncingTxt = 'دمج من النسخ التانية'; paintCloud();
    let n = 0, firstErr = null, tried = 0;
    try{
      for (const m of others){
        const base = String(m.dbUrl || '').replace(/\/+$/,'');
        if (!base) continue;
        tried++;
        const root = 'platforms/' + encodeURIComponent(m.code || m.projectId);
        const ts = await get(base, root + '/ts').catch(() => null);
        if (ts && typeof ts === 'object') S.fb.ts = ts;
        for (const k of this.secKeys()){
          const node = await get(base, root + '/sec/' + k).catch(e => { firstErr = firstErr || e; return null; });
          if (!node || node.v === undefined || node.v === null) continue;
          const merged = this.mergeSec(k, S.data[k], node.v);
          this.markKnown('sec', k, node.v);
          if (this.fp(JSON.stringify(merged == null ? null : merged)) !== this.fp(this.secJson(k))){ S.data[k] = merged; n++; }
        }
        const meta = await get(base, root + '/meta').catch(() => null);
        const months = Object.keys((meta && meta.att) || {});
        for (const mo of unique(months.concat(Object.keys(this.attMonthsLocal())))){
          const node = await get(base, root + '/att/' + mo).catch(() => null);
          if (!node || !node.v || typeof node.v !== 'object') continue;
          const mine = this.attMonthsLocal()[mo] || {};
          const merged = this.mergeAtt(mine, node.v);
          let ch = false;
          Object.keys(merged).forEach(key => { if (this.fp(JSON.stringify(merged[key])) !== this.fp(JSON.stringify(S.data.attendance[key] || null))){ S.data.attendance[key] = merged[key]; ch = true; } });
          if (ch) n++;
        }
        const logo = await get(base, root + '/logo').catch(() => null);
        if (logo && typeof logo.v === 'string' && logo.v.indexOf('data:image/') === 0 && Number(logo.rev || 0) > this.locRev('logo')){
          try{ setLogo(logo.v); n++; }catch(e){}
        }
      }
      bustCache(); attDraft = null; saveLocal(); render();
      dirty.main = true; S.fb.syncing = false; S.fb.syncingTxt = '';
      if (n){ await this.doPush(true); toast('تم الدمج من السيرفرات التانية ✅ (' + n + ' جزء اتحدّث)', 'ok', 'السحابة'); }
      else if (tried === 0) toast('مفيش سيرفر تاني متاح', 'warn', 'السحابة');
      else toast('النسخ التانية مطابقة لبياناتك — مفيش حاجة جديدة', 'info', 'السحابة');
      paintCloud();
      return true;
    }catch(e){
      S.fb.syncing = false; S.fb.syncingTxt = '';
      toast('فشل الدمج: ' + (firstErr ? firstErr.message : e.message), 'bad', 'السحابة');
      paintCloud();
      return false;
    }
  },
  // إيه الأجزاء اللي الجهاز ده فعلًا شاف فيها بيانات؟ (بتتخزن محليًا ومش بتطلع للسحابة)
  knownMaps(){
    const m = this.metaMaps();
    m.known = m.known || {};
    m.known.sec = m.known.sec || {}; m.known.att = m.known.att || {};
    if (m.known.logo == null) m.known.logo = false;
    return m.known;
  },
  markKnown(kind, key, val){
    const k = this.knownMaps();
    if (kind === 'sec'){ if (!this._isEmptyVal(val)) k.sec[key] = true; return; }
    if (kind === 'att'){ if (!this._isEmptyVal(val)) k.att[key] = true; return; }
    if (typeof val === 'string' && val.indexOf('data:image/') === 0) k.logo = true;
  },
  _isEmptyVal(v){
    if (v === '' || v == null) return true;
    if (Array.isArray(v)) return !v.length;
    if (typeof v === 'object') return !Object.keys(v).length;
    return false;
  },
  // إرسال الكتابة للسيرفر التاني في الخلفية (من غير ما تأخّر المستر)
  // بنحتفظ بأحدث نسخة لكل مسار؛ لو وصلت كتابة أحدث أثناء ما فيه واحدة بتتبعت، بتبعت بعدها فورًا
  mirror(method, path, body){
    const m = this.mirrorCfg();
    if (!m || S.fb.status !== 'live') return;
    const base = String(m.dbUrl || '').replace(/\/+$/,'');
    if (!base) return;
    // كل مشروع ليه مسار باسمه على سحابته، فبنحوّل المسار لمسار السيرفر التاني
    const myCode = encodeURIComponent(this.cfgNow().code || 'default');
    const hisCode = encodeURIComponent(m.code || m.projectId);
    const hisPath = (path.indexOf('platforms/' + myCode) === 0) ? ('platforms/' + hisCode + path.slice(('platforms/' + myCode).length)) : path;
    const key = hisPath;
    // 🛡️ حماية المرآة: جهاز عنده بيانات ناقصة (مثلاً لسه ما نزّلش جزء) مايمسحش نسخة المرآة السليمة.
    // لو القيمة فاضية والجهاز ده عمره ما شاف الجزء ده → نتخطى الكتابة (مش بنمسح حاجة مش عارفينها).
    if (method === 'PUT' && body && body.v !== undefined && this._isEmptyVal(body.v)){
      const partKey = String(path).split('/').pop();
      const known = this.knownMaps();
      const att = String(path).indexOf('/att/') >= 0;
      const has = att ? !!known.att[partKey] : (String(path).indexOf('/sec/') >= 0 ? !!known.sec[partKey] : !!known.logo);
      if (!has) return;
    }
    this._mq = this._mq || {}; this._mrun = this._mrun || {};
    this._mq[key] = { method: method, body: body };        // آخر قيمة دايمًا هي اللي بتتبعت
    if (this._mrun[key]) return;                           // فيه واحدة شغالة على نفس المسار → هتاخد دي بعدها
    const self = this;
    (async () => {
      self._mrun[key] = true;
      while (self._mq[key]){
        const job = self._mq[key]; self._mq[key] = null;
        try{
          // شهادة السيرفر التاني (لو تأمينه مفعّل) — كل مشروع ليه شهادته
          let mtok = '';
          try{ mtok = await self.ensureTokFor(m.projectId); }catch(e){}
          const res = await fetch(base + '/' + hisPath + '.json' + (mtok ? '?auth=' + encodeURIComponent(mtok) : ''), { method: job.method, cache:'no-store',
            headers: job.body ? { 'Content-Type':'application/json' } : undefined,
            body: job.body ? JSON.stringify(job.body) : undefined });
          if (res.status === 401 || res.status === 403){
            S.fb.mirrorAuth = 'need-key';
            if (S.fb.status === 'live') toast('السيرفر التاني (المرآة) قافل القواعد ومحتاج مفتاحه — الإعدادات ← «أمّن البيانات» ← الصق إعدادات السيرفر التاني', 'warn', 'السحابة');
            throw new Error('HTTP ' + res.status);
          }
          if (!res.ok) throw new Error('HTTP ' + res.status);
          if (S.fb.mirrorAuth){ S.fb.mirrorAuth = ''; }
          S.fb.mirrorAt = new Date(); S.fb.mirrorErr = '';
          if (S.fb.mirrorBad){ S.fb.mirrorBad = false; paintCloud(); }
        }catch(e){
          S.fb.mirrorErr = String(e && e.message || e);
          if (!S.fb.mirrorBad){ S.fb.mirrorBad = true; paintCloud(); }   // نبيّن للمستر إن المرآة واقفة
          break;
        }
      }
      self._mrun[key] = false;
    })();
  },
  // عداد الاستهلاك (تقديري من الجهاز ده) — عشان المستر يشوف إنه بعيد جدًا عن الحد
  bw(method, body, txt){
    try{
      const m = S.data.meta = S.data.meta || {};
      const now = new Date(), mo = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
      if (!m.bw || m.bw.m !== mo) m.bw = { m: mo, up: 0, down: 0, n: 0 };
      m.bw.n++;
      m.bw.up += (body ? JSON.stringify(body).length : 0) + 120;
      m.bw.down += ((txt ? txt.length : 0) + 120) * (method === 'GET' ? 1 : 0.2);
    }catch(e){}
  },
  /* ---------- الحدود المجانية ---------- */
  LIMITS(){ return { store: 1024, down: 10240, conn: 100 }; },   // ميجا: تخزين 1 جيجا · تنزيل 10 جيجا/شهر · 100 اتصال
  bwText(){
    const b = (S.data.meta || {}).bw || { up:0, down:0 };
    const mb = x => (x / 1048576);
    const sizeKB = (() => { try{ return (new Blob([JSON.stringify(S.data)]).size / 1024); }catch(e){ return 0; } })();
    const L = this.LIMITS();
    return {
      up: mb(b.up).toFixed(2), down: mb(b.down).toFixed(2),
      storeKB: sizeKB.toFixed(0), storePct: (sizeKB / 1024 / L.store * 100),
      downPct: (mb(b.down) / L.down * 100)
    };
  },

  /* ---------- نقل Firestore ---------- */
  async req(method, path, body, extra){
    const c = this.cfgNow();
    if (!c.apiKey || !c.projectId) throw Object.assign(new Error('إعدادات Firestore ناقصة (API Key / Project ID)'), { kind:'cfg' });
    const url = this.base() + path + '?key=' + encodeURIComponent(c.apiKey) + (extra ? '&' + extra : '');
    let res;
    try{
      res = await fetch(url, { method: method, cache:'no-store',
        headers: body ? { 'Content-Type':'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined });
    }catch(e){ throw Object.assign(new Error('مفيش اتصال بالسحابة — راجع الإنترنت أو اتصال المتصفح'), { kind:'net', raw: String(e && e.message || e) }); }
    let j = null; try{ j = await res.json(); }catch(e){}
    if (!res.ok){
      const raw = (j && j.error && j.error.message) || ('HTTP ' + res.status);
      const diag = this.diagnose(raw, res.status, path);
      throw Object.assign(new Error(diag.msg), { kind: diag.kind, raw: raw, http: res.status });
    }
    return j;
  },
  /* نوع المسار: own = المالك بس · core = كل الأعضاء · open = أي مسجّل · members = مسار الأعضاء نفسه (الفيصل) */
  pathKind(path){
    const p = String(path || '');
    if (/(^|\/)(backups|logo)(\/|$)/.test(p)) return 'own';
    const sec = /(^|\/)sec\/([^\/]+)/.exec(p);
    if (sec && ['settings','members','invites','requests'].indexOf(sec[2]) >= 0) return 'own';
    if (/(^|\/)sec(\/|$)/.test(p)) return 'core';
    if (/(^|\/)members(\/|$)/.test(p)) return 'members';      // قايمة الأعضاء: بتتقرا لو المنصة فاضية أو إحنا أعضاء
    if (/(^|\/)(requests|meta|ts|main|att|attendance)(\/|$)/.test(p)) return 'core';
    return 'open';
  },
  diagnose(raw, http, path){
    const m = String(raw || '');
    // حدود الخطة المجانية: فايربيز بيوقف الكتابة لحد ما الشهر يخلص (بترجع 402/429)
    if (http === 402 || http === 429 || /exceeded|quota|billing|limit reached|too many requests/i.test(m))
      return { kind:'quota', msg:'وصلنا لحد الاستخدام المجاني للسيرفر ده — بنحوّل تلقائيًا للسيرفر التاني عشان كل حاجة تكمل' };
    if (/Permission denied|permission_denied|Missing or insufficient permissions|PERMISSION_DENIED/i.test(m) || http === 403){
      // القواعد بترفض: يا إما الجهاز مش عضو (وده مش خطأ — بياخد صفحة تسجيل الدخول)
      // يا إما الدخول الصامت مش شغال، يا إما القواعد نفسها محتاجة تتحدّث
      let role = 'owner';
      try{ role = Roles.role(); }catch(e){}
      const authOk = (S.fb.auth === 'on');
      const pk = this.pathKind(path);
      let fresh = false;
      try{ fresh = !Roles.hasLocalData() && !Roles.ls(Roles.KEY); }catch(e){}
      if (role === 'guest' || role === 'pending' || (authOk && pk === 'members' && (fresh || role === 'owner' || role === 'teacher'))){
        // فايربيز رفضت «قايمة الأعضاء»: يعني المنصة فيها أعضاء وإحنا مش منهم (مش خطأ — دي حالة جهاز جديد)
        if (S.fb.auth === 'on') S.fb.denied = true;
        return { kind:'norole', msg:'الجهاز ده لسه مش مسجّل في المنصة — محتاج موافقة المستر (صفحة تسجيل الدخول)' };
      }
      // مدرس = لو فايربيز رفضت له أي مسار أساسي (مش مسار المالك) يبقى صلاحيته اتلغت فعلًا
      if (authOk && role === 'teacher' && (pk === 'core' || pk === 'members')) S.fb.denied = true;
      if (S.fb.auth === 'fail' || S.fb.auth === 'no-key')
        return { kind:'rules', msg:'القواعد محكمة بس الدخول الصامت مش شغال — الإعدادات ← «أمّن البيانات» وفيه الخطوات بضغطة' };
      return { kind:'rules', msg:'قواعد الحماية بتمنع الوصول — الإعدادات ← «أمّن البيانات»، أو الصق القواعد الجاهزة (زر "قواعد الحماية")' };
    }
    if (/database \(default\) does not exist|datastore\/setup/i.test(m))
      return { kind:'nodb', msg:'قاعدة بيانات Firestore لسه مش متعملة — افتح Firebase Console ← Firestore ← Create database' };
    if (/SERVICE_DISABLED|has not been used in project/i.test(m))
      return { kind:'apioff', msg:'خدمة Cloud Firestore مش مفعّلة في المشروع' };
    if (http === 404 || /not found/i.test(m))
      return { kind:'empty', msg:'متصل — لسه مفيش بيانات مرفوعة على السحابة' };
    if (http === 401 && /API key|API_KEY/i.test(m))
      return { kind:'key', msg:'مفتاح API غلط — راجع API Key' };
    if (http === 401)
      return { kind:'rules', msg:'الوصول مرفوض — راجع قواعد الحماية (Rules)' };
    return { kind:'other', msg: (m || ('خطأ رقم ' + http)) };
  },
  toDoc(o){
    const f = {};
    Object.keys(o).forEach(k => {
      const v = o[k];
      if (v === null || v === undefined) return;
      if (typeof v === 'boolean') f[k] = { booleanValue: v };
      else if (typeof v === 'number') f[k] = { integerValue: String(Math.round(v)) };
      else f[k] = { stringValue: String(v) };
    });
    return { fields: f };
  },
  fromDoc(doc){
    const out = {}, f = (doc && doc.fields) || {};
    Object.keys(f).forEach(k => {
      const v = f[k] || {};
      if (v.stringValue !== undefined) out[k] = v.stringValue;
      else if (v.booleanValue !== undefined) out[k] = v.booleanValue;
      else if (v.integerValue !== undefined) out[k] = Number(v.integerValue);
      else if (v.doubleValue !== undefined) out[k] = Number(v.doubleValue);
      else if (v.timestampValue !== undefined) out[k] = v.timestampValue;
    });
    return out;
  },

  // كتابة/تحديث مستند في Firestore مع تحديد الحقول (بدون ما يمسح باقي البيانات)
  upsert(path, obj){
    const keys = Object.keys(obj).filter(k => obj[k] !== undefined && obj[k] !== null);
    const mask = keys.map(k => 'updateMask.fieldPaths=' + encodeURIComponent(k)).join('&');
    return this.req('PATCH', path, this.toDoc(obj), mask);
  },

  /* ---------- طبقة موحّدة (بتشتغل على النوعين) ---------- */
  async readMeta(){
    if (this.mode() === 'rtdb'){
      const d = await this.rtdb('GET', this.rootPath() + '/meta');
      if (d && d.correctUrl) return { exists:false, rev:0 };
      const rev = Number((d && d.rev) || 0);
      return { exists: !!(d && (d.rev || d.at)), rev: rev, data: d };
    }
    try{
      const doc = await this.req('GET', this.root(), null, 'mask.fieldPaths=rev');
      const dd = this.fromDoc(doc);
      return { exists:true, rev:Number(dd.rev || 0), data: dd };
    }catch(e){
      if (e.kind === 'empty') return { exists:false, rev:0, data:null };   // لسه مفيش مستند = السحابة فاضية
      throw e;
    }
  },
  async writeMeta(rev){
    if (rev != null) S.data.meta.rev = Number(rev) || 0;
    return this.writeMetaFull();       // بنكتب الـ meta كاملة بخريطة الأجزاء — مش رقم بس
  },
  async readRoot(){
    if (this.mode() === 'rtdb'){
      const d = await this.rtdb('GET', this.rootPath() + '/main');
      if (!d) return { exists:false, data:null };
      return { exists:true, data: d, rev: Number(d.rev || 0) };
    }
    try{
      const d = this.fromDoc(await this.req('GET', this.root()));
      return { exists: !!(d && d.json), data: d, rev: Number((d && d.rev) || 0) };
    }catch(e){
      if (e.kind === 'empty') return { exists:false, data:null, rev:0 };
      throw e;
    }
  },
  async writeRoot(obj){
    if (this.mode() === 'rtdb') return this.rtdb('PUT', this.rootPath() + '/main', obj);
    return this.upsert(this.root(), obj);
  },
  async readAttendanceAll(){
    const out = {};
    if (this.mode() === 'rtdb'){
      const d = await this.rtdb('GET', this.rootPath() + '/attendance');
      if (d && typeof d === 'object') Object.keys(d).forEach(k => { if (d[k] && typeof d[k] === 'object') out[k] = d[k]; });
      return out;
    }
    let token = null;
    do{
      const r = await this.req('GET', this.root() + '/attendance?pageSize=300' + (token ? '&pageToken=' + encodeURIComponent(token) : ''));
      (r.documents || []).forEach(doc => {
        const id = decodeURIComponent(String(doc.name).split('/').pop());
        const f = this.fromDoc(doc);
        let rec = null; try{ rec = f.json ? JSON.parse(f.json) : null; }catch(e){}
        if (rec) out[id] = rec;
      });
      token = r.nextPageToken || null;
    } while (token);
    return out;
  },
  async writeAttendance(){
    const keys = Object.keys(S.data.attendance || {});
    if (this.mode() === 'rtdb'){
      const clean = {};
      keys.forEach(k => { clean[k] = S.data.attendance[k]; });
      return this.rtdb('PUT', this.rootPath() + '/attendance', clean);      // كله مرة واحدة — أسرع بكتير
    }
    for (let i = 0; i < keys.length; i++){
      const rec = S.data.attendance[keys[i]] || {};
      await this.upsert(this.root() + '/attendance/' + encodeURIComponent(keys[i]), { json: JSON.stringify(rec), rev: rec.rev || 0 });
      if (i % 10 === 9){ S.fb.syncingTxt = (i + 1) + '/' + keys.length; paintCloud(); }
    }
  },

  /* ==========================================================
     مزامنة ذكية (v4): أجزاء منفصلة + تحديث لحظي
     بدل ما نرفع/ننزّل ملف المنصة كله كل مرة، المنصة بتتقسّم لأجزاء
     صغيرة (طلاب، حصص، درجات، حضور بالشهر…) وكل جزء ليه رقم نسخة.
     فاللي يتغير بس هو اللي بيتنقل، والتحديث بيوصل لحظيًا من غير
     ما المستر يعمل ريفريش أو يدوس "تنزيل".
     ========================================================== */
  secKeys(){ return ['settings','groups','students','exams','grades','feedback','absNotes','msgSent','ptokens','members','invites','requests']; },
  /* أرقام النسخ لازم تكون موحّدة بين كل الأجهزة.
     زمان كل جهاز كان بيعد من عنده (1، 2، 3…) وكل جهاز بيكتب أرقامه فوق التاني،
     فالجهاز يشوف رقم أقل من رقمه يفتكر إن مفيش جديد وما ينزّلش.
     الحل: الرقم = الوقت الحقيقي (دايمًا بيكبر) + رقم السحابة + 1 احتياطًا. */
  nowRev(cloudVal, localVal){
    return Math.max(Date.now(), Number(cloudVal || 0) + 1, Number(localVal || 0) + 1);
  },
  cloudRevOf(kind, key){
    const m = S.fb.meta || {};
    if (kind === 'sec') return Number((m.sec || {})[key] || 0);
    if (kind === 'att') return Number((m.att || {})[key] || 0);
    return Number(m.logo || 0);
  },
  /* ================= محرك السحابة الذكي (v3) =================
     1) طابور أوفلاين مضمون: كل تعديل بياخد ختم وقت وبصمة، فبنعرف في أي لحظة إيه اللي
        لسه محتاج يطلع للسحابة — حتى لو قفلنا المتصفح في نص الشغل أو النت قطع.
     2) دمج سجل بسجل: لو جهازين عدّلوا نفس الجزء، بنقرا نسخة السحابة وندمجها مع نسختنا
        قبل ما نرفع — الأحدث لكل سجل هو اللي بيفضل، ومفيش بيانات تضيع.
     3) النسخ الاحتياطية على السحابة (تحت في قسم النسخ).
     ========================================================== */
  // بصمة سريعة (FNV-1a) — بنعرف بيها إيه اللي اتغير من غير مقارنة نصوص كبيرة
  fp(str){
    let h = 2166136261;
    str = String(str == null ? '' : str);
    for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h;
  },
  // كل الخرايط اللي بنحتاجها للمزامنة الذكية — بتتخزن محليًا مع بيانات الجهاز
  metaMaps(){
    const m = S.data.meta = S.data.meta || {};
    if (!m.last || typeof m.last !== 'object') m.last = {};
    m.last.sec = m.last.sec || {}; m.last.att = m.last.att || {};
    if (m.last.logo == null) m.last.logo = '';
    m.fp = m.fp || {}; m.del = m.del || {}; m.st = m.st || {}; m.gt = m.gt || {};
    m.attT = m.attT || {}; m._sec = m._sec || {};
    m.fp.settings = m.fp.settings || {}; m.fp.att = m.fp.att || {}; m.fp.grades = m.fp.grades || {};
    m.del.grades = m.del.grades || {};
    ['students','groups','exams'].forEach(k => { m.fp[k] = m.fp[k] || {}; m.del[k] = m.del[k] || {}; });
    return m;
  },
  // ختم الوقت: أي سجل اتغير بياخد _t بالوقت الحالي، وأي سجل اختفى بيتسجّل في المحذوفات
  // (بتتنادى من commit — يعني مع أي تعديل، وبتتخطّى الأجزاء اللي ما اتغيرتش)
  stamp(){
    const m = this.metaMaps(), now = Date.now();
    ['settings','students','groups','exams'].forEach(k => {
      const whole = this.fp(this.secJson(k));
      if (m._sec[k] === whole) return;
      m._sec[k] = whole;
      if (k === 'settings'){
        const cur = S.data.settings || {}, f = m.fp.settings;
        Object.keys(cur).forEach(fld => {
          const v = JSON.stringify(cur[fld]);
          if (f[fld] !== v){ f[fld] = v; m.st[fld] = now; }
        });
        return;
      }
      const arr = Array.isArray(S.data[k]) ? S.data[k] : [];
      const f = m.fp[k], del = m.del[k], seen = Object.create(null);
      arr.forEach(r => {
        if (!r || !r.id) return;
        seen[r.id] = 1;
        const v = JSON.stringify(Object.assign({}, r, { _t: 0 }));
        if (f[r.id] !== v){ f[r.id] = v; r._t = now; }          // جديد أو اتعدّل → ختم وقت
      });
      Object.keys(f).forEach(id => { if (!seen[id]){ delete f[id]; if (!del[id]) del[id] = now; } });
    });
    const gwhole = this.fp(JSON.stringify(S.data.grades || {}));
    if (m._sec.grades !== gwhole){
      m._sec.grades = gwhole;
      const gt = m.gt, gf = m.fp.grades, gdel = m.del.grades;
      Object.keys(S.data.grades || {}).forEach(eid => {
        const row = S.data.grades[eid] || {};
        gt[eid] = gt[eid] || {}; gf[eid] = gf[eid] || {}; gdel[eid] = gdel[eid] || {};
        Object.keys(row).forEach(sid => {
          const v = String(row[sid]);
          if (gf[eid][sid] !== v){ gf[eid][sid] = v; gt[eid][sid] = now; }
        });
        Object.keys(gf[eid]).forEach(sid => { if (!(sid in row)){ delete gf[eid][sid]; if (!gdel[eid][sid]) gdel[eid][sid] = now; } });
      });
    }
    const awhole = this.fp(JSON.stringify(this.attMonthsLocal()));
    if (m._sec.att !== awhole){
      m._sec.att = awhole;
      const at = m.attT, af = m.fp.att;
      Object.keys(S.data.attendance || {}).forEach(key => {
        const rec = (S.data.attendance[key] || {}).records || {};
        at[key] = at[key] || {}; af[key] = af[key] || {};
        Object.keys(rec).forEach(sid => {
          const v = String(rec[sid]);
          if (af[key][sid] !== v){ af[key][sid] = v; at[key][sid] = now; }
        });
      });
    }
  },
  // إيه اللي لسه محتاج يطلع للسحابة؟ (بيشتغل حتى بعد قفل المتصفح — مش مجرد علم في الذاكرة)
  pending(){
    const m = this.metaMaps(), months = this.attMonthsLocal();
    if (!Object.keys(m.last.sec).length && !Object.keys(m.last.att).length){
      return { any:true, full:true, sec:this.secKeys().slice(), att:Object.keys(months), count:this.secKeys().length + Object.keys(months).length };
    }
    const sec = [], att = [];
    this.secKeys().forEach(k => { if (m.last.sec[k] !== this.fp(this.secJson(k))) sec.push(k); });
    Object.keys(months).forEach(mo => { if (m.last.att[mo] !== this.fp(JSON.stringify(months[mo]))) att.push(mo); });
    const logo = (typeof logoRef === 'function' && (logoRef() || '') !== (m.last.logo || '')) ? 1 : 0;
    return { any: !!(sec.length || att.length || logo), full:false, sec: sec, att: att, count: sec.length + att.length + logo };
  },
  markPart(kind, key){                       // الجزء ده بقى متطابق مع السحابة
    const m = this.metaMaps();
    if (kind === 'logo'){ m.last.logo = (typeof logoRef === 'function' ? (logoRef() || '') : ''); return; }
    if (kind === 'sec'){ m.last.sec[key] = this.fp(this.secJson(key)); return; }
    const mo = this.attMonthsLocal()[key];
    m.last.att[key] = this.fp(JSON.stringify(mo || {}));
  },
  markSynced(){                              // كل اللي عندنا دلوقتي = اللي على السحابة
    const m = this.metaMaps();
    m.last = { sec:{}, att:{}, logo: (typeof logoRef === 'function' ? (logoRef() || '') : '') };
    this.secKeys().forEach(k => { m.last.sec[k] = this.fp(this.secJson(k)); });
    const months = this.attMonthsLocal();
    Object.keys(months).forEach(mo => { m.last.att[mo] = this.fp(JSON.stringify(months[mo])); });
  },
  pendText(){
    const p = this.pending();
    if (!p.any) return '';
    const names = { settings:'الإعدادات', groups:'الحصص', students:'الطلاب', exams:'الامتحانات', grades:'الدرجات', feedback:'الملاحظات', absNotes:'ملاحظات الغياب', msgSent:'الرسائل' };
    return p.sec.map(k => names[k] || k).concat(p.att.map(mo => 'حضور ' + mo)).join(' · ') + (p.count ? ' (' + p.count + ')' : '');
  },
  // رفع أي تعديلات معلّقة — بتتنادى لوحدها أول ما النت يرجع أو أول ما نفتح المنصة
  async flushPending(manual){
    if (S.fb.status !== 'live' || S.fb.syncing) return false;
    const p = this.pending();
    if (!p.any){ paintCloud(); return false; }
    const hasLocal = this.hasAnyData();
    if (!hasLocal && !(S.data.meta || {}).hadData && !S.fb.cloudEmpty){   // جهاز فاضي والسحابة فيها بيانات → ننزّل مش نرفع
      await this.doPull(true);
      return false;
    }
    const ok = await this.doPush(!!p.full);
    if (ok){
      if (manual) toast('تم رفع كل التعديلات المعلّقة ✅', 'ok', 'السحابة');
      else if (this._offlineSeen) toast('التعديلات اللي اتسجلت وانت بدون نت اترفعت للسحابة ✅', 'ok', 'السحابة');
      this._offlineSeen = false;
    }
    return ok;
  },

  /* ---------- الدمج الذكي (سجل بسجل) ---------- */
  // سجلات (طلاب/حصص/امتحانات): الأحدث لكل سجل بيكسب، والحذف بيتنقل بختم وقت
  mergeRecords(kind, locArr, cloudArr){
    const m = this.metaMaps();
    const del = m.del[kind] || {};
    const cts = S.fb.ts || {};
    const cdel = (cts.del || {})[kind] || {};
    const loc = Object.create(null), cloud = Object.create(null);
    (locArr || []).forEach(r => { if (r && r.id) loc[r.id] = r; });
    (cloudArr || []).forEach(r => { if (r && r.id) cloud[r.id] = r; });
    const out = [], ids = Object.create(null);
    Object.keys(cloud).forEach(id => {
      ids[id] = 1;
      const a = cloud[id], b = loc[id], at = Number(a._t || 0);
      if (b){
        const bt = Number(b._t || 0);
        out.push(bt >= at ? b : a);                       // الاتنين موجودين → الأحدث يكسب
      } else {
        if (del[id] && Number(del[id]) > at) return;      // أنا مسحته بعد النسخة دي → يختفي
        out.push(a);                                      // مش عندي → نكمله (مفيش ضياع)
      }
    });
    Object.keys(loc).forEach(id => {
      if (ids[id]) return;
      const b = loc[id], bt = Number(b._t || 0);
      if (cdel[id] && Number(cdel[id]) > bt) return;      // جهاز تاني مسحه بعد نسختي → يختفي
      out.push(b);
    });
    return out;
  },
  // الدرجات: خلية خلية (امتحان/طالب) بأختام الوقت
  mergeGrades(loc, cloud){
    const m = this.metaMaps();
    const cts = (S.fb.ts || {}).gt || {};
    const cdel = (S.fb.ts || {}).gdel || {};
    const out = {};
    unique(Object.keys(loc || {}).concat(Object.keys(cloud || {}))).forEach(eid => {
      const row = Object.assign({}, (cloud || {})[eid] || {});
      const lrow = (loc || {})[eid] || {};
      const gt = m.gt[eid] || {}, cgt = cts[eid] || {}, gd = m.del.grades[eid] || {}, cgd = cdel[eid] || {};
      Object.keys(row).forEach(sid => {
        const ct = Number(cgt[sid] || 0), lt = Number(gt[sid] || 0);
        if (sid in lrow){ if (lt >= ct) row[sid] = lrow[sid]; }
        else if (gd[sid] && Number(gd[sid]) > ct) delete row[sid];
      });
      Object.keys(lrow).forEach(sid => {
        if (sid in row) return;
        if (cgd[sid] && Number(cgd[sid]) > Number(gt[sid] || 0)) return;
        row[sid] = lrow[sid];
      });
      out[eid] = row;
    });
    return out;
  },
  // الحضور: حصة حصة، وطالب طالب
  mergeAtt(loc, cloud){
    const m = this.metaMaps();
    const cts = (S.fb.ts || {}).attT || {};
    const out = {};
    unique(Object.keys(loc || {}).concat(Object.keys(cloud || {}))).forEach(key => {
      const a = cloud[key], b = loc[key];
      if (!b){ out[key] = a; return; }
      if (!a){ out[key] = b; return; }
      const rec = Object.assign({}, a.records || {}), lrec = b.records || {};
      const at = m.attT[key] || {}, ct = cts[key] || {};
      Object.keys(rec).forEach(sid => {
        if (sid in lrec){ if (Number(at[sid] || 0) >= Number(ct[sid] || 0)) rec[sid] = lrec[sid]; }
      });
      Object.keys(lrec).forEach(sid => { if (!(sid in rec)) rec[sid] = lrec[sid]; });
      out[key] = Object.assign({}, a, b, { records: rec });
    });
    return out;
  },
  // الإعدادات: حقل حقل (الأحدث يكسب)
  mergeSettings(loc, cloud){
    const m = this.metaMaps();
    const cst = (S.fb.ts || {}).st || {};
    const out = Object.assign({}, cloud || {}), l = loc || {};
    unique(Object.keys(l).concat(Object.keys(out))).forEach(fld => {
      if (!(fld in l)) return;
      if (Number(m.st[fld] || 0) >= Number(cst[fld] || 0)) out[fld] = l[fld];
    });
    return out;
  },
  // الخرايط الصغيرة (ملاحظات/رسائل): كل الطرفين بيتحفظوا، واللي عندنا يكسب لو نفس المفتاح
  mergeMaps(loc, cloud){ return Object.assign({}, cloud || {}, loc || {}); },
  mergeSec(k, loc, cloud){
    if (k === 'students' || k === 'groups' || k === 'exams') return this.mergeRecords(k, loc, cloud);
    if (k === 'grades') return this.mergeGrades(loc, cloud);
    if (k === 'settings') return this.mergeSettings(loc, cloud);
    return this.mergeMaps(loc, cloud);
  },
  // هل الجزء ده فيه تعديلات محلية لسه ما طلعتش؟
  secDirty(k){ const m = this.metaMaps(); return m.last.sec[k] !== this.fp(this.secJson(k)); },
  // رفع جزء واحد، ولمّا السحابة يكون فيها تعديل من جهاز تاني → ندمج الأول (مفيش ضياع بيانات)
  async secPushOne(k, at, merge){
    const c = this.cache();
    let value = S.data[k], merged = false;
    if (merge){
      await this.ensureTs();
      const before = this.fp(this.secJson(k));
      let node = null;
      try{ node = await this.rtdb('GET', this.rootPath() + '/sec/' + k); }catch(e){ node = null; }
      if (node && node.v !== undefined && node.v !== null){
        const m = this.mergeSec(k, S.data[k], node.v);
        if (this.fp(JSON.stringify(m == null ? null : m)) !== before){
          S.data[k] = m; value = m; merged = true;
          bustCache(); attDraft = null; saveLocal(); render();
        }
      }
    }
    const rev = this.nowRev(this.cloudRevOf('sec', k), this.locRev('sec', k));
    await this.rtdb('PUT', this.rootPath() + '/sec/' + k, { rev: rev, at: at, v: value });
    this.setLocRev('sec', k, rev);
    c.sec[k] = this.secJson(k);
    this.markPart('sec', k);
    this.markKnown('sec', k, value);
    return merged;
  },
  // نسخة خفيفة من البيانات الوصفية للملف القديم (بدون الخرايط الكبيرة) — عشان الرفع يفضل سريع
  slimMeta(){
    const m = S.data.meta || {};
    return { version: m.version, rev: m.rev, updatedAt: m.updatedAt, createdAt: m.createdAt,
      secrev: m.secrev || {}, attrev: m.attrev || {}, logorev: m.logorev || 0, syncv: m.syncv || 0 };
  },
  cache(){ return this._cache = this._cache || { sec:{}, att:{}, logo:null }; },
  attMonth(k){ return String(k).slice(0,7); },
  attMonthsLocal(){
    const out = {};
    Object.keys(S.data.attendance || {}).forEach(k => {
      const mo = this.attMonth(k); (out[mo] = out[mo] || {})[k] = S.data.attendance[k];
    });
    return out;
  },
  localRevs(){
    const m = S.data.meta = S.data.meta || {};
    m.secrev = m.secrev || {}; m.attrev = m.attrev || {};
    return m;
  },
  locRev(kind, key){
    const m = this.localRevs();
    if (kind === 'sec') return Number(m.secrev[key] || 0);
    if (kind === 'att') return Number(m.attrev[key] || 0);
    return Number(m.logorev || 0);
  },
  setLocRev(kind, key, v){
    const m = this.localRevs(); v = Number(v) || 0;
    if (kind === 'sec') m.secrev[key] = v;
    else if (kind === 'att') m.attrev[key] = v;
    else m.logorev = v;
  },
  secJson(k){
    const v = S.data[k];
    const empty = (k === 'students' || k === 'groups' || k === 'exams') ? [] : (k === 'settings' ? S.data.settings : {});
    return JSON.stringify(v === undefined || v === null ? empty : v);
  },
  // بعد أي تنزيل: نخزّن بصمة الأجزاء عشان أول رفع ما يبعتش نفس الحاجة تاني
  refreshCache(){
    const c = this.cache();
    this.secKeys().forEach(k => { c.sec[k] = this.secJson(k); });
    c.att = {};
    const months = this.attMonthsLocal();
    Object.keys(months).forEach(mo => { c.att[mo] = JSON.stringify(months[mo]); });
    c.logo = (typeof logoRef === 'function' ? (logoRef() || '') : '');
  },
  // أختام الوقت بتتخزن في عقدة صغيرة لوحدها (/ts) — عشان ملف المزامنة يفضل صغير وسريع
  async ensureTs(force){
    if (!force && S.fb.ts && Date.now() - (S.fb.tsAt || 0) < 30000) return S.fb.ts;
    try{
      const d = await this.rtdb('GET', this.rootPath() + '/ts');
      S.fb.ts = (d && typeof d === 'object' && !d.correctUrl) ? d : {};
    }catch(e){ S.fb.ts = S.fb.ts || {}; }
    S.fb.tsAt = Date.now();
    return S.fb.ts;
  },
  // تجهيز أختام الوقت (مدموجة مع اللي على السحابة + مقلمة) — بتتكتب في /ts
  buildStamps(){
    const m = this.metaMaps(), cts = S.fb.ts || {};
    const days = 120 * 86400000, cutoff = Date.now() - days, cap = 2500;
    const maxMap = (a, b, c) => { const out = {}; [a, b, c].forEach(src => Object.keys(src || {}).forEach(k => { const v = Number(src[k] || 0); if (v > Number(out[k] || 0)) out[k] = v; })); return out; };
    const prune = (map) => {
      const keys = Object.keys(map || {});
      if (!keys.length) return {};
      let keep = keys.filter(k => Number(map[k] || 0) >= cutoff);
      if (keep.length > cap){ keep.sort((x, y) => Number(map[y]) - Number(map[x])); keep = keep.slice(0, cap); }
      const out = {}; keep.forEach(k => { out[k] = map[k]; });
      return out;
    };
    const prune2 = (map) => {   // خرايط من مستويين (امتحان → طالب)
      const out = {};
      Object.keys(map || {}).forEach(k => { const inner = prune(map[k]); if (Object.keys(inner).length) out[k] = inner; });
      return out;
    };
    const out = {
      st: prune(maxMap(m.st, cts.st)),
      gt: prune2(maxMap2(m.gt, cts.gt)),
      attT: prune2(maxMap2(m.attT, cts.attT)),
      del: {}, gdel: {}
    };
    ['students','groups','exams'].forEach(k => { out.del[k] = prune(maxMap((m.del || {})[k], (cts.del || {})[k])); });
    out.gdel = prune2(maxMap2(m.del.grades || {}, cts.gdel));
    return out;
    function maxMap2(a, b){ const out = {}; [a, b].forEach(src => Object.keys(src || {}).forEach(k => { out[k] = maxMap((src || {})[k], (out[k] || {})); })); return out; }
  },
  async writeMetaFull(){
    const m = this.localRevs();
    const cloud = S.fb.meta || {};
    const maxOf = (a, b) => Math.max(Number(a || 0), Number(b || 0));
    const sec = {}, att = {};
    // بناخد الأعلى بين اللي عندنا واللي على السحابة — عشان ما نمحوقش أرقام جهاز تاني
    this.secKeys().forEach(k => { const v = maxOf((cloud.sec || {})[k], m.secrev[k]); if (v) sec[k] = v; });
    unique(Object.keys(cloud.att || {}).concat(Object.keys(m.attrev))).forEach(mo => {
      const v = maxOf((cloud.att || {})[mo], m.attrev[mo]); if (v) att[mo] = v;
    });
    const rev = this.nowRev(cloud.rev, m.rev);
    // أختام الوقت بتتنقل مع /ts (عقدة صغيرة لوحدها) — مش مع ملف المزامنة السريع
    const ts = this.buildStamps();
    // ملاحظة مهمة: تنسيق التخزين على السحابة ما اتغيرش (نفس الأجزاء ونفس الخريطة)،
    // فبنكتب v = 3 عشان أي جهاز لسه على النسخة القديمة يفضل شايف البيانات ويزامن عادي
    // (لو كتبنا 4 كان الجهاز القديم هيفتكره ملف قديم ويعمل تنزيل بالطريقة القديمة ويضيع السكة).
    const d = { v: 3, rev: rev, at: new Date().toISOString(), sec: sec, att: att,
      logo: maxOf(cloud.logo, m.logorev), teacher: (S.data.settings || {}).teacherName || '',
      students: (S.data.students || []).length, groups: (S.data.groups || []).length };
    S.fb.meta = d;
    m.rev = rev;                      // نسخة الجهاز تتبع السحابة
    if (this.mode() === 'rtdb'){
      // نكتب الأختام بس لو اتغيرت (توفير في الكتابة والرفع)
      const tfp = this.fp(JSON.stringify(ts));
      if (this._tsFp !== tfp){
        this._tsFp = tfp;
        this.rtdb('PUT', this.rootPath() + '/ts', ts).then(() => { S.fb.ts = ts; S.fb.tsAt = Date.now(); }).catch(() => { this._tsFp = null; });
      }
      return this.rtdb('PUT', this.rootPath() + '/meta', d);
    }
    return this.upsert(this.root(), { json: JSON.stringify(d) });
  },
  // الرفع: بس الأجزاء اللي اتغيرت — وبتتكتب مع بعض (بالتوازي) = أسرع بكتير
  async pushSections(all){
    const self = this, c = this.cache(), jobs = [];
    const at = new Date().toISOString();
    try{ this.stamp(); }catch(e){}                     // نتأكد إن كل تعديل معاه ختم وقت
    // قبل أي رفع: نقرا ملف المزامنة من السحابة من جديد (ملف صغير جدًا) عشان قرار الدمج
    // يبقى مبني على آخر نسخة — مش على نسخة قديمة في الذاكرة (ده اللي كان ممكن يضيّع تعديلات جهاز تاني)
    try{
      const fresh = await this.readMeta();
      if (fresh && fresh.exists){ S.fb.meta = fresh.data || null; S.fb.remoteRev = fresh.rev || 0; }
    }catch(e){}
    const _amOwner = (() => { try{ return Roles.isOwner(); }catch(e){ return true; } })();
    this.secKeys().forEach(k => {
      if (!_amOwner && OWNER_SECTIONS.indexOf(k) >= 0) return;    // المدرس مايرفعش أقسام المالك (القواعد بترفضها)
      const json = self.secJson(k);
      const cloudNewer = self.cloudRevOf('sec', k) > self.locRev('sec', k);   // السحابة فيها تعديل أحدث
      if (!all && c.sec[k] === json && self.locRev('sec', k) && !cloudNewer) return;
      // لو فيه تعديل من جهاز تاني: بنقراه وندمجه سجل بسجل قبل الرفع (مفيش بيانات تضيع)
      jobs.push(self.secPushOne(k, at, cloudNewer));
    });
    const months = this.attMonthsLocal();
    Object.keys(months).forEach(mo => {
      const json = JSON.stringify(months[mo]);
      const cloudNewer = self.cloudRevOf('att', mo) > self.locRev('att', mo);
      if (!all && c.att[mo] === json && self.locRev('att', mo) && !cloudNewer) return;
      jobs.push((async () => {
        let value = months[mo];
        if (cloudNewer){
          await self.ensureTs();
          let node = null;
          try{ node = await self.rtdb('GET', self.rootPath() + '/att/' + mo); }catch(e){ node = null; }
          if (node && node.v && typeof node.v === 'object'){
            const m = self.mergeAtt(months[mo], node.v);
            if (self.fp(JSON.stringify(m)) !== self.fp(JSON.stringify(months[mo]))){
              Object.keys(m).forEach(key => { S.data.attendance[key] = m[key]; });   // نطبّق الدمج عندنا
              value = m;
              bustCache(); attDraft = null; saveLocal(); render();
            } else value = m;
          }
        }
        const rev = self.nowRev(self.cloudRevOf('att', mo), self.locRev('att', mo));
        await self.rtdb('PUT', self.rootPath() + '/att/' + mo, { rev: rev, at: at, v: value });
        c.att[mo] = JSON.stringify(value); self.setLocRev('att', mo, rev); self.markPart('att', mo);
        self.markKnown('att', mo, value);
      })());
    });
    const lg = (typeof logoRef === 'function' ? (logoRef() || '') : '');
    const lgPush = (lg && lg.length <= 300000) ? lg : '';
    if (!_amOwner) { /* اللوجو للمالك بس — القواعد بترفضه من جهاز المدرس */ }
    else if (all || c.logo !== lgPush || (lgPush && !self.locRev('logo'))){
      const rev = self.nowRev(self.cloudRevOf('logo', ''), self.locRev('logo'));
      jobs.push(self.rtdb('PUT', self.rootPath() + '/logo', { rev: rev, at: at, v: lgPush })
        .then(() => { c.logo = lgPush; self.setLocRev('logo', '', rev); self.markPart('logo'); self.markKnown('logo', '', lgPush); }));
    }
    if (!jobs.length){ this.markSynced(); return 0; }
    S.fb.syncingTxt = jobs.length + (jobs.length === 1 ? ' جزء' : ' أجزاء');
    S.fb.parts = jobs.length;
    await Promise.all(jobs);
    S.data.meta.rev = (S.data.meta.rev || 0) + 1;
    await this.writeMetaFull();
    this.markSynced();                                 // كل اللي عندنا بقى متطابق مع السحابة
    return jobs.length;
  },
  // التنزيل: نقرأ الـ meta الصغيرة الأول، وننزّل بس الأجزاء اللي اتغيرت
  async pullSections(silent){
    const meta = await this.readMeta();
    S.fb.meta = meta.data || null;
    S.fb.remoteRev = meta.rev || 0;
    if (!meta.exists){ S.fb.cloudEmpty = true; S.fb.behind = false; return -1; }
    const d = meta.data || {};
    if (!(Number(d.v) >= 3) || !d.sec) return this.doPullLegacy(silent);   // نسخة قديمة (ملف واحد) على السحابة
    const self = this, jobs = [], changed = [], merged = [];
    // لو فيه أي جزء محلي محتاج دمج، نجيب أختام السحابة الأول عشان القرار يبقى صح
    if (this.secKeys().some(k => Number((d.sec || {})[k] || 0) > self.locRev('sec', k) && self.secDirty(k))) await this.ensureTs(true);
    this.secKeys().forEach(k => {
      const rr = Number((d.sec || {})[k] || 0);
      if (rr <= self.locRev('sec', k)) return;
      const dirtySec = self.secDirty(k);          // عندنا تعديلات لسه ما طلعتش في الجزء ده؟
      jobs.push(self.rtdb('GET', self.rootPath() + '/sec/' + k).then(node => {
        if (node && node.v !== undefined && node.v !== null){
          if (dirtySec){                            // ندمج بدل ما نستبدل → مفيش بيانات تضيع
            const m = self.mergeSec(k, S.data[k], node.v);
            if (self.fp(JSON.stringify(m == null ? null : m)) !== self.fp(self.secJson(k))){
              S.data[k] = m; merged.push(k);
            }
          } else S.data[k] = node.v;
          self.markKnown('sec', k, node.v);
          self.setLocRev('sec', k, Number(node.rev || rr));
          self.markPart('sec', k);
          changed.push(k);
        }
      }));
    });
    Object.keys(d.att || {}).forEach(mo => {
      const rr = Number(d.att[mo] || 0);
      if (rr <= self.locRev('att', mo)) return;
      jobs.push(self.rtdb('GET', self.rootPath() + '/att/' + mo).then(node => {
        if (node && node.v && typeof node.v === 'object'){
          const myMonth = self.attMonthsLocal()[mo] || {};
          const dirtyMo = self.metaMaps().last.att[mo] !== self.fp(JSON.stringify(myMonth));
          const value = dirtyMo ? self.mergeAtt(myMonth, node.v) : node.v;      // دمج الحضور
          S.data.attendance = Object.assign({}, S.data.attendance || {}, value);
          self.markKnown('att', mo, value);
          self.setLocRev('att', mo, Number(node.rev || rr));
          self.markPart('att', mo);
          changed.push('حضور ' + mo);
        }
      }));
    });
    if (Number(d.logo || 0) > self.locRev('logo')){
      jobs.push(self.rtdb('GET', self.rootPath() + '/logo').then(node => {
        if (!node) return;
        if (typeof node.v === 'string' && node.v.indexOf('data:image/') === 0){ try{ setLogo(node.v); self.markKnown('logo', '', node.v); }catch(e){} }
        else if (node.v === ''){ try{ clearLogo(); }catch(e){} }
        self.setLocRev('logo', '', Number(node.rev || 0));
      }));
    }
    await Promise.all(jobs);
    S.data.meta = S.data.meta || {};
    // أختام السحابة: بنقراها لو فيه دمج محتاجها
    if (merged.length) await this.ensureTs(true);
    S.data.meta.rev = Math.max(Number(S.data.meta.rev || 0), Number(meta.rev || 0));
    S.fb.remoteRev = Number(meta.rev || 0);
    this.refreshCache();
    S.fb.behind = false; S.fb.ahead = false; S.fb.cloudEmpty = false;
    S.fb.lastSync = new Date(); S.fb.errKind = '';
    if (this.hasAnyData()) S.data.meta.hadData = true;
    this.setStatus('live');
    if (changed.length){
      attDraft = null;
      saveLocal(); render();
      if (!silent) toast('تم تحديث ' + changed.length + (changed.length === 1 ? ' جزء' : ' أجزاء') + ' من السحابة ✅', 'ok', 'السحابة');
    }
    // لو دمجنا حاجة: نرفع الناتج عشان الجهاز التاني يشوف تعديلاتنا كمان
    if (merged.length){ try{ await this.pushSections(false); }catch(e){} }
    return changed.length;
  },

  /* ---------- التحديث اللحظي (بث مباشر من Firebase) ---------- */
  stream(){
    this.stopStream();
    if (S.fb.status !== 'live') return;
    if (this.mode() !== 'rtdb' || typeof EventSource === 'undefined'){ this.startPolling(8000); return; }
    const url = this.dbUrl() + '/' + this.rootPath() + '/meta.json';
    let es = null;
    try{ es = new EventSource(url); }catch(e){ this.startPolling(8000); return; }
    const self = this;
    this._es = es; S.fb.stream = 'connecting'; paintCloud();
    this.watchdog();
    const onData = ev => {
      let d = null; try{ d = JSON.parse(ev.data); }catch(e){ return; }
      if (!d || !d.data) return;
      S.fb.stream = 'live'; S.fb.meta = d.data;
      const rev = Number(d.data.rev || 0);
      if (rev > Number(S.data.meta.rev || 0)) self.onRemoteChange(rev);
      else { S.fb.remoteRev = rev; S.fb.behind = false; paintCloud(); }
      try{ S.fb.pending = self.pending().count; }catch(e){}
    };
    es.addEventListener('put', onData);
    es.addEventListener('patch', onData);
    es.addEventListener('open', () => { S.fb.stream = 'live'; S.fb.retries = 0; self.startPolling(45000); paintCloud(); });
    es.addEventListener('error', () => {
      S.fb.stream = 'down'; S.fb.retries = (S.fb.retries || 0) + 1;
      self.startPolling(8000); paintCloud();
    });
  },
  stopStream(){
    this.stopWatchdog();
    if (this._es){ try{ this._es.close(); }catch(e){} this._es = null; }
    if (this._pullTimer){ clearTimeout(this._pullTimer); this._pullTimer = null; }
    S.fb.stream = null;
  },
  // فيه حاجة جديدة على السحابة: ننزّل الجزء اللي اتغير بس
  onRemoteChange(rev){
    const self = this;
    S.fb.remoteRev = rev;
    if (this._pullTimer) return;
    this._pullTimer = setTimeout(async () => {
      self._pullTimer = null;
      if (S.fb.status !== 'live' || S.fb.syncing) return;
      if (dirty.main){ S.fb.behind = true; S.fb.ahead = true; paintCloud(); return; }
      try{
        const n = await self.pullSections(true);
        if (n > 0){ toast('تم تحديث البيانات من السحابة 🔄', 'info', 'السحابة'); paintCloud(); }
      }catch(e){ if (e.kind === 'net' || e.kind === 'rules') self.setStatus('error', e.message); }
    }, 600);
  },

  /* ---------- الاتصال ---------- */
  async connect(opts){
    opts = opts || {};
    if (opts.config) this.writeCfg(opts.config);
    // لو كان فيه سيرفر وصل حده الشهر ده: نستعيد المعلومة، ونشوف رجع ولا لأ
    const qHit = (S.data.meta || {}).quotaHit;
    if (qHit && this.quotaOf() === qHit.from){
      S.fb.quotaHit = { from: qHit.from, at: qHit.at };
      if (this.probeWrite){ setTimeout(() => { this.maybeReturnFromQuota(false); }, 2500); }
    } else if (qHit && !this.quotaOf()){ S.data.meta.quotaHit = null; S.fb.quotaHit = null; }
    const cfg = this.merged();
    if (!cfg.dbUrl && (!cfg.apiKey || !cfg.projectId)){ this.setStatus('off'); toast('إعدادات السحابة ناقصة', 'bad'); return false; }
    S.fb.cfg = cfg;
    this.setStatus('busy');
    // الترتيب: السيرفر اللي المستر اختاره بإيده الأول، وبعده الباقي للطوارئ
    const list = this.order(cfg);
    let hasData = false, remoteRev = 0, err = null, used = cfg, metaData = null;
    for (let i = 0; i < list.length; i++){
      S.fb.cfg = list[i];
      this._active = list[i];
      try{
        const meta = await this.readMeta();
        hasData = !!meta.exists; remoteRev = meta.rev || 0; err = null; used = list[i];
        metaData = meta.exists ? (meta.data || null) : null;
        break;
      }catch(e){ err = e; }
    }
    this._active = null;
    S.fb.cfg = used; S.fb.remoteRev = remoteRev;
    // مهم: نحدّث نسخة ملف المزامنة اللي عندنا — بيها بنعرف إن جهاز تاني عدّل حاجة قبل ما نرفع
    if (metaData) S.fb.meta = metaData;
    const pin = this.pinned();
    S.fb.pinned = pin ? pin.projectId : '';
    S.fb.pinnedNick = pin ? (pin.nick || pin.projectId) : '';
    S.fb.fellBack = !!(pin && !err && used.projectId !== pin.projectId);
    S.fb.pinBack = false;
    if (!err && used.projectId !== cfg.projectId){
      this.writeCfg(used);                       // نحفظ السيرفر الشغال
      if (!opts.silent && !S.fb.fellBack) toast('اتصلنا بـ' + (used.nick || used.projectId), 'info', 'السحابة');
    }
    if (S.fb.fellBack && this._fallbackTold !== pin.projectId){
      this._fallbackTold = pin.projectId;          // نخبره مرة واحدة بالحالة دي
      const atLimit = this.quotaOf() === pin.projectId;
      toast((atLimit ? 'سيرفرك (' : 'السيرفر اللي اخترته (') + (pin.nick || pin.projectId) + ')' +
        (atLimit ? ' خلصت كميته المجانية الشهر ده' : ' مش راد دلوقتي') + ' — شغالين على ' +
        (used.nick || used.projectId) + ' وكل بياناتك بتتزامن عادي ومن غير أي نقصان', 'warn', 'السحابة');
    } else if (!S.fb.fellBack) this._fallbackTold = null;
    if (err){
      if (err && err.kind === 'norole') this.setStatus('error', err.message, 'norole'); else this.setStatus('error', err.message);
      S.fb.errKind = err.kind;
      toast(err.message, 'bad', 'السحابة');
      // مفيش نوافذ تلقائية — التنبيه في شريحة السحابة وفي الإعدادات، والتفاصيل عند الضغط على "اختبار الاتصال"
      return false;
    }
    if (used && used.projectId) this.writeCfg(used);      // الإعدادات الشغالة تتحفظ تلقائيًا
    S.fb.errKind = ''; S.fb.remoteRev = remoteRev; S.fb.cloudEmpty = !hasData;
    S.fb.ts = S.fb.ts || {}; this.ensureTs().catch(() => {});
    // لو اتنقلنا لسيرفر تاني: كاش الأجزاء ما بقاش صالح، فالرفع الجاي يبعت كل حاجة للسيرفر الجديد
    if (this._cacheProject && this._cacheProject !== used.projectId){
      const c = this.cache(); c.sec = {}; c.att = {}; c.logo = null;
    }
    this._cacheProject = used.projectId;
    this.setStatus('live');
    this.stream();                       // تحديث لحظي + فحص احتياطي
    if (!opts.silent) toast(hasData ? 'تم الاتصال بالسحابة ✅' : 'تم الاتصال — السحابة فاضية، ارفع بياناتك', hasData ? 'ok' : 'info', 'السحابة');
    if (opts.auto) this.autoSync(hasData, remoteRev);
    this.syncUpgrade();          // توحيد الأجهزة بعد تحديث محرك المزامنة
    // طابور الأوفلاين: أي تعديل اتسجل وانت بدون نت بيطلع لوحده أول ما نرجع متصلين
    setTimeout(() => { this.flushPending(false); }, 1800);
    setTimeout(() => { this.maybeSnapshot(); }, 6000);
    return true;
  },
  autoSync(hasData, remoteRev){
    const hasLocal = (S.data.students.length + S.data.groups.length) > 0;
    const localRev = S.data.meta.rev || 0;
    if (!hasData && hasLocal){
      toast('جارٍ رفع بيانات الجهاز للسحابة لأول مرة...', 'info', 'السحابة');
      this.doPush(true);
    } else if (hasData && !hasLocal){
      toast('جارٍ تنزيل بياناتك من السحابة...', 'info', 'السحابة');
      this.doPull(true);
    } else if (hasData && hasLocal){
      if (!hasLocal){                                 // جهاز فاضي (أو أعيد تثبيته) → ننزّل، مش نرفع
        S.fb.behind = true; paintCloud();
        this.doPull(true);
      } else if (remoteRev > localRev && !dirty.main){
        // بيانات السحابة أحدث → ننزّلها أوتوماتيك من غير ما المستر يدوس حاجة
        toast('جارٍ تحديث بياناتك من السحابة...', 'info', 'السحابة');
        this.doPull(true).then(n => { if (n) toast('بياناتك محدّثة ✅', 'ok', 'السحابة'); });
      } else if (remoteRev > localRev && dirty.main){
        S.fb.behind = true; S.fb.ahead = true; paintCloud();      // فيه تعديلات محلية → نسأله
      } else if (localRev > remoteRev && dirty.main){
        this.doPush(false);                                      // تعديلات لسه مرفوعتش
      } else {
        S.fb.behind = false; S.fb.ahead = false; paintCloud();
      }
    }
  },
  disconnect(){
    this._active = null;
    this.stopStream();
    this.stopPolling();
    S.fb.remoteRev = null; S.fb.behind = false; S.fb.ahead = false;
    this.setStatus('off');
    toast('تم فصل الاتصال — النظام شغال محليًا', 'info');
  },

  /* ---------- الفحص الدوري ---------- */
  startPolling(ms){
    const every = Number(ms) || 20000;
    if (S.fb.timer && S.fb.timerMs === every) return;
    this.stopPolling();
    S.fb.timerMs = every;
    S.fb.timer = setInterval(() => { if (!document.hidden) this.checkRemote(); }, every);
  },
  // حارس المزامنة: كل 6 ثواني يتأكد إن مفيش تعديل محلي عالق، وإن مفيش نسخة أحدث نازلة
  watchdog(){
    if (S.fb.wd) return;
    S.fb.wd = setInterval(() => {
      if (S.fb.status !== 'live' || S.fb.syncing || document.hidden) return;
      if (dirty.main) this.doPush(false);
      else if (Number(S.fb.remoteRev || 0) > Number(S.data.meta.rev || 0)) this.onRemoteChange(Number(S.fb.remoteRev));
      else if (Date.now() - (this._pendCheck || 0) > 20000){      // طابور الأوفلاين: كل 20 ثانية
        this._pendCheck = Date.now();
        this.flushPending(false);
      }
      if (Date.now() - (this._snapCheck || 0) > 3600000){ this._snapCheck = Date.now(); this.maybeSnapshot(); }
      // كل دقيقة: لو شغالين على سيرفر طوارئ، نشوف سيرفرك المختار رجع ولا لأ
      if (Date.now() - (this._pinCheck || 0) > 60000){ this._pinCheck = Date.now(); this.checkPinBack(); }
      // لو واقفين على السيرفر التاني بسبب حد الاستخدام: نجرّب نرجع كل شوية
      if (S.fb.quotaHit) this.maybeReturnFromQuota(false);
    }, 6000);
  },
  // هل السيرفر اللي اختاره رجع شغال؟
  async checkPinBack(){
    if (!S.fb.fellBack || S.fb.pinBack) return false;
    const pin = this.pinned();
    if (!pin) return false;
    const r = await this.ping(pin);
    if (!r.ok) return false;
    S.fb.pinBack = true; paintCloud();
    toast('سيرفرك المختار (' + (pin.nick || pin.projectId) + ') رجع شغال — اضغط للرجوع ليه', 'info', 'السحابة');
    return true;
  },
  // بعد تحديث محرك المزامنة: مزامنة كاملة مرة واحدة عشان كل الأجهزة تتوحّد
  syncUpgrade(){
    if (Number((S.data.meta || {}).syncv || 0) >= FB_SYNC_V) return false;
    const self = this;
    let tries = 0;
    const run = () => {
      tries++;
      if (S.fb.status !== 'live') return;                       // اتقطع الاتصال → مشغّل تاني مع الاتصال الجاي
      if (S.fb.syncing){ if (tries < 60) setTimeout(run, 700); return; }   // نستنى أي مزامنة شغالة تخلص
      if (tries === 1) toast('بنزامن كل البيانات مرة واحدة عشان كل أجهزتك تتوحّد...', 'info', 'السحابة');
      self.doPush(true).then(okPush => {
        if (okPush){ S.data.meta.syncv = FB_SYNC_V; saveLocal(); }         // بنسجّلها بعد النجاح بس
        else if (tries < 60) setTimeout(run, 2500);
      });
    };
    setTimeout(run, 500);
    return true;
  },
  // مزامنة كاملة بضغطة: ننزّل الجديد، وبعدين نرفع اللي عندنا — تحلّ أي تعارض
  async fullSync(){
    if (!(await this.ensure())) return false;
    S.fb.syncing = true; S.fb.syncingTxt = 'مزامنة كاملة'; paintCloud();
    try{
      await this.ensureTs(true);
      await this.pullSections(true);
      const n = await this.pushSections(true);
      await this.writeMetaFull();
      S.data.meta.syncv = FB_SYNC_V;
      dirty.main = false; S.fb.syncing = false; S.fb.syncingTxt = '';
      S.fb.lastSync = new Date(); S.fb.behind = false; S.fb.ahead = false;
      this.setStatus('live');
      toast('تمت المزامنة الكاملة ✅ (' + n + ' جزء مرفوع)', 'ok', 'السحابة');
      return true;
    }catch(e){
      S.fb.syncing = false; S.fb.syncingTxt = '';
      this.setStatus('error', e.message);
      toast('فشلت المزامنة الكاملة: ' + e.message, 'bad', 'السحابة');
      return false;
    }
  },
  /* ================= النسخ الاحتياطية على السحابة =================
     نسخة كاملة من بياناتك بتتحفظ على فايربيز نفسها مرة كل يوم (وبضغطة منك في أي وقت)،
     فلو أي جهاز خرب أو أي حاجة اتمسحت، ترجّع أي يوم بضغطة واحدة.
     ================================================================= */
  snapKey(){
    const d = new Date(), p2 = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + '-' + p2(d.getHours()) + p2(d.getMinutes());
  },
  async snapshotNow(manual, note){
    if (!(await this.ensure())) return false;
    if (S.fb.syncing){ toast('استنى المزامنة تخلص وبعدين اعمل نسخة', 'info', 'السحابة'); return false; }
    try{
      const at = new Date().toISOString();
      let json = JSON.stringify(this.payload(true));
      let thin = false;
      if (json.length > 900000){                    // لو الملف ضخم: نسيب النسخة بدون حضور (أخف)
        const p2 = this.payload(false); p2.attendance = {}; json = JSON.stringify(p2); thin = true;
      }
      const key = this.snapKey();
      await this.rtdb('PUT', this.rootPath() + '/backups/' + key, {
        at: at, rev: S.data.meta.rev || 0, thin: thin, note: String(note || ''),
        students: (S.data.students || []).length, groups: (S.data.groups || []).length, json: json });
      S.data.meta.snapAt = at; saveLocal();
      this.pruneBackups().catch(() => {});
      if (manual) toast('تم عمل نسخة احتياطية على السحابة ✅' + (thin ? ' (بدون الحضور — البيانات كبيرة)' : ''), 'ok', 'السحابة');
      paintCloud();
      return key;
    }catch(e){
      if (manual) toast('فشل عمل النسخة: ' + e.message, 'bad', 'السحابة');
      return false;
    }
  },
  async listSnapshots(){
    try{
      const d = await this.rtdb('GET', this.rootPath() + '/backups', null, null, '?shallow=true');
      if (!d || typeof d !== 'object') return [];
      return Object.keys(d).map(k => { const v = d[k] || {};
        return { key: k, at: v.at || '', students: v.students, groups: v.groups, rev: v.rev, thin: !!v.thin, note: v.note || '' };
      }).sort((a, b) => (a.key < b.key ? 1 : -1));
    }catch(e){ return null; }
  },
  async pruneBackups(){
    const list = await this.listSnapshots();
    if (!list || list.length <= 6) return;
    for (let i = 6; i < list.length; i++){ try{ await this.rtdb('DELETE', this.rootPath() + '/backups/' + list[i].key); }catch(e){} }
  },
  async maybeSnapshot(){
    try{
      if (typeof Roles !== 'undefined' && !Roles.isOwner()) return false;    // النسخ الاحتياطية للمالك بس (القواعد بترفضها للمدرس)
      if ((S.data.settings || {}).cloudBackup === false) return false;
      if ((S.data.students.length + S.data.groups.length) === 0) return false;
      const last = S.data.meta.snapAt ? Date.parse(S.data.meta.snapAt) : 0;
      if (Date.now() - last < 20 * 3600000) return false;          // مرة كل يوم تقريبًا
      return await this.snapshotNow(false);
    }catch(e){ return false; }
  },
  async restoreSnapshot(key){
    try{
      const d = await this.rtdb('GET', this.rootPath() + '/backups/' + key);
      if (!d || !d.json) return false;
      const remote = JSON.parse(d.json);
      this.applyRemote(remote, Number(d.rev || 0));
      dirty.main = true;
      await this.doPush(true);                                    // نرفع المسترجَع عشان كل الأجهزة تاخده
      toast('تم استرجاع نسخة ' + key + ' ✅', 'ok', 'السحابة');
      return true;
    }catch(e){ toast('فشل الاسترجاع: ' + e.message, 'bad', 'السحابة'); return false; }
  },
  // شاشة حالة النظام: كل حاجة عن المزامنة في مكان واحد
  // تنبيه لو مفيش نسخة احتياطية حديثة (الصف الثالث للأمان)
  async checkBackupAge(){
    try{
      if (S.fb.status !== 'live') return;
      const list = await this.listSnapshots();
      if (list === null) return;
      const newest = list[0] && list[0].key;
      const days = newest ? (Date.now() - new Date(String(newest).slice(0, 10) + 'T12:00:00').getTime()) / 86400000 : 999;
      S.fb.bakOld = days > 7;
      if (S.fb.bakOld && !S.fb.bakWarned){
        S.fb.bakWarned = Date.now();
        toast(newest ? 'آخر نسخة احتياطية من ' + Math.floor(days) + ' يوم — اضغط هنا لعمل نسخة دلوقتي' : 'مفيش نسخة احتياطية على السحابة — اعمل واحدة بضغطة',
          'warn', 'النسخ الاحتياطي');
      }
      paintCloud();
    }catch(e){}
  },

        (S.fb.quotaHit && S.fb.quotaHit.from === (this.mirrorCfg() || {}).projectId) ? '⏸️ السيرفر التاني وصل حده الشهر ده' :

    const body = `<div class="alerts">${lines.map(l => `<div class="alert-row ${l[2] || 'info'}">

    Modal.open({ title: 'حالة المزامنة والسحابة', sub: 'نظرة كاملة على الاتصال والنسخ الاحتياطية', size:'md', body: body,

  // الرجوع للسيرفر المختار بضغطة
  async backToPinned(){
    const pin = this.pinned();
    if (!pin){ toast('مفيش سيرفر مختار — اختار من شاشة اختيار السيرفر', 'warn'); return false; }
    toast('بنرجع لـ' + (pin.nick || pin.projectId) + '...', 'info', 'السحابة');

    return await this.connect({ silent:false });
