<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="نظام متابعة الطلبة والكورسات - أحمد فتحي | حضور، درجات، اشتراكات، تقارير">
<meta name="theme-color" content="#12141a">
<title>نظام المتابعة | أحمد فتحي</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   نظام المتابعة - أحمد فتحي | Stylesheet
   ============================================================ */
:root{
  --brand:#f5b301;
  --brand-2:#ffd451;
  --brand-ink:#1b1b1b;
  --ink:#14161c;
  --ink-2:#2b2f3a;
  --muted:#6b7280;
  --muted-2:#9aa1ad;
  --bg:#f4f5f7;
  --card:#ffffff;
  --line:#e6e8ee;
  --line-2:#eef0f5;
  --side:#12141a;
  --side-2:#1b1e26;
  --side-ink:#c9cdd6;
  --ok:#12a150;
  --ok-bg:#e7f8ee;
  --warn:#c98a00;
  --warn-bg:#fff6dd;
  --bad:#e02424;
  --bad-bg:#feecec;
  --info:#2563eb;
  --info-bg:#e8f0ff;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 6px 22px -8px rgba(16,24,40,.12);
  --shadow-lg:0 20px 50px -20px rgba(16,24,40,.35);
  --r:16px; --r-sm:10px; --r-xs:8px;
  --sb:264px;
  --font:'Cairo','Segoe UI',Tahoma,system-ui,-apple-system,sans-serif;
}
[data-theme="dark"]{
  --ink:#f2f4f8;
  --ink-2:#d6dae2;
  --muted:#9aa1ad;
  --muted-2:#7c8494;
  --bg:#0d0f13;
  --card:#151821;
  --line:#262b36;
  --line-2:#1e2229;
  --side:#0a0c10;
  --side-2:#12151b;
  --ok-bg:#0d2a1c; --warn-bg:#2c2308; --bad-bg:#2c1111; --info-bg:#101c33;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 26px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);
  font-size:14.5px;line-height:1.6;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:radial-gradient(900px 400px at 100% 0,rgba(245,179,1,.10),transparent 60%);
}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(128,134,148,.35);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(128,134,148,.6);background-clip:content-box}
.hide{display:none !important}

/* ---------- Shell ---------- */
.shell{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{
  width:var(--sb);flex:0 0 var(--sb);background:var(--side);color:var(--side-ink);
  display:flex;flex-direction:column;position:fixed;inset-block:0;inset-inline-start:0;z-index:60;
  transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.sidebar::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--brand),transparent 70%)}
.brand{display:flex;align-items:center;gap:12px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--brand);background:#000;flex:0 0 52px}
.brand .bt{min-width:0}
.brand .bt b{display:block;color:#fff;font-size:15.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .bt span{display:block;font-size:11.5px;color:var(--brand);font-weight:700;letter-spacing:.2px}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1}
.nav .nlabel{font-size:10.5px;color:#6d7482;font-weight:800;letter-spacing:.5px;padding:12px 10px 5px}
.nav a{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;text-decoration:none;
  color:var(--side-ink);font-weight:600;font-size:14px;position:relative;transition:.16s;cursor:pointer;
}
.nav a svg{width:19px;height:19px;flex:0 0 19px;opacity:.8}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:linear-gradient(90deg,rgba(245,179,1,.20),rgba(245,179,1,.04));color:#fff}
.nav a.on svg{opacity:1;color:var(--brand)}
.nav a.on::before{content:"";position:absolute;inset-inline-end:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--brand)}
.nav .pill{margin-inline-start:auto;background:var(--brand);color:#1b1b1b;font-size:11px;font-weight:800;padding:1px 7px;border-radius:20px;min-width:22px;text-align:center}
.side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.07);font-size:11.5px}
.cloud{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:11px;background:rgba(255,255,255,.05);cursor:pointer;transition:.16s}
.cloud:hover{background:rgba(255,255,255,.1)}
.cloud .dot{width:9px;height:9px;border-radius:50%;background:var(--muted-2);flex:0 0 9px;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.cloud.live .dot{background:#22c55e;animation:pulse 1.8s infinite}
.cloud.busy .dot{background:var(--brand)}
.cloud.err .dot{background:var(--bad)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(34,197,94,.15)}50%{box-shadow:0 0 0 7px rgba(34,197,94,.02)}}
.cloud .ct{min-width:0;line-height:1.35}
.cloud .ct b{display:block;color:#fff;font-size:12.5px;font-weight:700}
.cloud .ct span{display:block;font-size:10.5px;color:#8b93a1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.main{flex:1;min-width:0;margin-inline-start:var(--sb);display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;background:var(--card);
  background:color-mix(in srgb,var(--card) 88%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding:10px 20px;display:flex;align-items:center;gap:12px;min-height:66px;
}
.burger{display:none;width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--card);cursor:pointer;align-items:center;justify-content:center}
.ptitle{min-width:0}
.ptitle h1{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.searchbox{position:relative}
.searchbox svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted-2)}
.searchbox input{
  width:250px;padding:9px 38px 9px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  outline:none;transition:.16s;
}
.searchbox input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(245,179,1,.16)}
.content{padding:20px;flex:1}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);padding:9px 14px;border-radius:11px;font-weight:700;font-size:13.5px;
  cursor:pointer;transition:.15s;white-space:nowrap;text-decoration:none;
}
.btn svg{width:17px;height:17px}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#1b1b1b}
.btn.pri:hover{background:var(--brand-2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
[data-theme="dark"] .btn.dark{background:#2c313d;border-color:#3a4150}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--line-2);color:var(--ink);box-shadow:none}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.sm svg{width:15px;height:15px}
.btn.icon{padding:8px;width:36px;height:36px}
.btn.icon.sm{width:30px;height:30px;padding:0}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Cards & layout ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:15px 17px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:15.5px;font-weight:800}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:600}
.card-h .sp{margin-inline-start:auto}
.card-b{padding:17px}
.grid{display:grid;gap:15px}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-23{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g-32{grid-template-columns:minmax(0,1fr) minmax(0,1.55fr)}
.mt{margin-top:15px}

/* ---------- Stats ---------- */
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--brand);opacity:.9}
.stat.ok::after{background:var(--ok)} .stat.bad::after{background:var(--bad)} .stat.info::after{background:var(--info)}
.stat .st-h{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:700}
.stat .st-h .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--warn-bg);color:var(--warn)}
.stat .st-h .ic svg{width:16px;height:16px}
.stat.ok .st-h .ic{background:var(--ok-bg);color:var(--ok)}
.stat.bad .st-h .ic{background:var(--bad-bg);color:var(--bad)}
.stat.info .st-h .ic{background:var(--info-bg);color:var(--info)}
.stat .val{font-size:26px;font-weight:900;margin-top:6px;letter-spacing:-.5px}
.stat .val small{font-size:13px;font-weight:700;color:var(--muted)}
.stat .foot{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.trend{font-weight:800}
.trend.up{color:var(--ok)} .trend.down{color:var(--bad)}

/* ---------- Tables ---------- */
.tbl-wrap{overflow:auto;border-radius:var(--r);max-height:none}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.tbl th{
  position:sticky;top:0;background:var(--card);z-index:2;text-align:start;padding:11px 13px;font-weight:800;font-size:12.5px;
  color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;
}
.tbl td{padding:10px 13px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tbody tr{transition:.12s}
.tbl tbody tr:hover{background:var(--line-2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{font-variant-numeric:tabular-nums;font-weight:700}
.tbl td .row-actions{display:flex;gap:4px;justify-content:flex-end}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;color:#fff;flex:0 0 36px;font-size:13px}
.who .wt{min-width:0}
.who .wt b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.who .wt span{display:block;font-size:11.5px;color:var(--muted)}

/* ---------- Badges / chips ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:800;white-space:nowrap}
.badge b{font-weight:900}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-info{background:var(--info-bg);color:var(--info)}
.b-gray{background:var(--line-2);color:var(--muted)}
.b-brand{background:rgba(245,179,1,.18);color:#a87900}
[data-theme="dark"] .b-brand{color:var(--brand)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
[data-theme="dark"] .chip.on{background:var(--brand);color:#1b1b1b;border-color:var(--brand)}
.chips{display:flex;gap:7px;flex-wrap:wrap}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.field>label{font-size:12.5px;font-weight:800;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.field>label .req{color:var(--bad)}
.field .hint{font-size:11px;color:var(--muted-2);font-weight:600}
.inp,input[type=text],input[type=number],input[type=date],input[type=month],input[type=time],input[type=tel],input[type=email],input[type=password],select,textarea{
  width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);outline:none;transition:.15s;
}
textarea{min-height:82px;resize:vertical;line-height:1.7}
.inp:focus,input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(245,179,1,.16)}
.inp:disabled{background:var(--line-2);color:var(--muted)}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2.2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:left 11px center;background-size:16px;padding-inline-start:34px}
.frow{display:grid;gap:13px;grid-template-columns:repeat(2,minmax(0,1fr))}
.frow-3{display:grid;gap:13px;grid-template-columns:repeat(3,minmax(0,1fr))}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch .track{width:44px;height:25px;border-radius:20px;background:var(--line);position:relative;transition:.2s;flex:0 0 44px}
.switch .track::after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;top:3px;inset-inline-end:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+.track{background:var(--ok)}
.switch input:checked+.track::after{inset-inline-end:22px}
.switch .lb{font-weight:700;font-size:13.5px}
.switch .lb span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(9,11,16,.62);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:720px;margin:auto;animation:pop .22s cubic-bezier(.2,.9,.3,1.2);border:1px solid var(--line)}
.modal.sm{max-width:460px} .modal.lg{max-width:960px} .modal.xl{max-width:1180px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;gap:12px;padding:16px 19px;border-bottom:1px solid var(--line-2)}
.modal-h h3{font-size:16.5px;font-weight:800}
.modal-h .sub{font-size:12px;color:var(--muted);font-weight:600}
.modal-h .x{margin-inline-start:auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;transition:.15s}
.modal-h .x:hover{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.modal-b{padding:19px;max-height:calc(100vh - 210px);overflow-y:auto}
.modal-f{padding:14px 19px;border-top:1px solid var(--line-2);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.modal-f .sp{margin-inline-end:auto}

/* ---------- Toasts ---------- */
.toasts{position:fixed;bottom:20px;inset-inline-start:20px;z-index:400;display:flex;flex-direction:column;gap:9px;max-width:min(380px,90vw)}
.toast{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-lg);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;animation:slideIn .25s cubic-bezier(.2,.9,.3,1.2)}
[dir=rtl] .toast{animation-name:slideInRtl}
@keyframes slideIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes slideInRtl{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.toast .ti{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 30px;background:var(--info-bg);color:var(--info)}
.toast .ti svg{width:16px;height:16px}
.toast.ok .ti{background:var(--ok-bg);color:var(--ok)}
.toast.bad .ti{background:var(--bad-bg);color:var(--bad)}
.toast.warn .ti{background:var(--warn-bg);color:var(--warn)}
.toast .tt{min-width:0;flex:1}
.toast .tt b{display:block;font-size:13.5px;font-weight:800}
.toast .tt span{font-size:12.5px;color:var(--muted)}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .ic{width:68px;height:68px;border-radius:20px;background:var(--line-2);display:grid;place-items:center;margin:0 auto 14px;color:var(--muted-2)}
.empty .ic svg{width:32px;height:32px}
.empty h4{font-size:15.5px;font-weight:800;color:var(--ink)}
.empty p{font-size:13px;margin-top:4px}

/* ---------- Attendance ---------- */
.att-row{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:13px;background:var(--card);margin-bottom:9px;transition:.15s}
.att-row:hover{border-color:var(--brand)}
.att-row .an{flex:1;min-width:0}
.att-row .an b{display:block;font-weight:700}
.att-row .an span{font-size:11.5px;color:var(--muted)}
.seg{display:flex;gap:5px;background:var(--line-2);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:9px;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--muted);transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on[data-v=present]{color:var(--ok)} .seg button.on[data-v=absent]{color:var(--bad)}
.seg button.on[data-v=late]{color:var(--warn)} .seg button.on[data-v=excused]{color:var(--info)}
.att-sum{display:flex;gap:8px;flex-wrap:wrap}
.att-sum .k{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.att-sum .k i{width:9px;height:9px;border-radius:3px;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .cd{aspect-ratio:1;border-radius:9px;background:var(--line-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);position:relative}
.cd.present{background:var(--ok-bg) !important;color:var(--ok) !important}
.cd.absent{background:var(--bad-bg) !important;color:var(--bad) !important}
.cd.late{background:var(--warn-bg) !important;color:var(--warn) !important}
.cd.excused{background:var(--info-bg) !important;color:var(--info) !important}
.cal-hd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.cal-hd div{text-align:center;font-size:11px;font-weight:800;color:var(--muted-2)}

/* ---------- Charts ---------- */
.chart{width:100%;display:block;height:230px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.legend .lg{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.legend .lg i{width:11px;height:11px;border-radius:4px;display:block}

/* ---------- Progress ---------- */
.bar{height:8px;border-radius:6px;background:var(--line-2);overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--brand);transition:width .5s}
.bar.ok>i{background:var(--ok)} .bar.bad>i{background:var(--bad)} .bar.info>i{background:var(--info)}

/* ---------- Alerts list ---------- */
.alert-row{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;background:var(--card)}
.alert-row .ai{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 34px}
.alert-row .ai svg{width:17px;height:17px}
.alert-row.warn .ai{background:var(--warn-bg);color:var(--warn)}
.alert-row.bad .ai{background:var(--bad-bg);color:var(--bad)}
.alert-row.info .ai{background:var(--info-bg);color:var(--info)}
.alert-row .at{flex:1;min-width:0}
.alert-row .at b{display:block;font-weight:700;font-size:13.5px}
.alert-row .at span{font-size:11.5px;color:var(--muted)}

/* ---------- Timeline ---------- */
.tl{position:relative;padding-inline-start:20px}
.tl::before{content:"";position:absolute;inset-inline-start:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .tli{position:relative;padding-bottom:14px}
.tl .tli::before{content:"";position:absolute;inset-inline-start:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px var(--card)}
.tl .tli b{font-weight:700;font-size:13.5px}
.tl .tli span{display:block;font-size:11.5px;color:var(--muted)}

/* ---------- Receipt ---------- */
.receipt{background:#fff;color:#111;border-radius:14px;padding:22px;border:1px dashed #c9ccd3;max-width:560px;margin:0 auto}
.receipt .rh{display:flex;align-items:center;gap:12px;border-bottom:2px dashed #d5d8de;padding-bottom:13px;margin-bottom:13px}
.receipt .rh img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #f5b301}
.receipt .rh b{display:block;font-size:16px;font-weight:800}
.receipt .rh span{font-size:12px;color:#666}
.receipt table{width:100%;border-collapse:collapse;font-size:13.5px}
.receipt table td{padding:7px 4px;border-bottom:1px solid #eee}
.receipt table td:first-child{color:#666;font-weight:700;width:42%}
.receipt .rf{margin-top:14px;display:flex;justify-content:space-between;font-size:12px;color:#666;border-top:2px dashed #d5d8de;padding-top:11px}

/* ---------- Misc ---------- */
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0;font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:11px 15px;font-weight:800;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;transition:.15s;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-color:var(--brand)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;direction:ltr;text-align:left}
.help{background:var(--info-bg);border:1px solid color-mix(in srgb,var(--info) 25%,transparent);border-radius:13px;padding:13px 15px;font-size:13px;line-height:1.8}
.help b{font-weight:800}
.help code{background:rgba(0,0,0,.07);padding:1px 6px;border-radius:6px;font-family:ui-monospace,monospace;font-size:12px;direction:ltr;display:inline-block}
[data-theme="dark"] .help code{background:rgba(255,255,255,.1)}
.sep{height:1px;background:var(--line);margin:16px 0}
.mono{font-variant-numeric:tabular-nums}
.center{text-align:center}
.nowrap{white-space:nowrap}
.flex{display:flex;align-items:center;gap:10px}
.flex.wrap{flex-wrap:wrap}
.flex .sp{margin-inline-start:auto}
.muted{color:var(--muted)}
.small{font-size:12px}
.strong{font-weight:800}
.spin{width:16px;height:16px;border:2.5px solid rgba(0,0,0,.15);border-top-color:currentColor;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.scrim{display:none}

/* ---------- Responsive ---------- */
@media (max-width:1200px){
  .g-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-23,.g-32{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .sidebar{transform:translateX(100%)}
  [dir=ltr] .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.5)}
  .main{margin-inline-start:0}
  .burger{display:flex}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;opacity:0;pointer-events:none;transition:.25s}
  .scrim.on{opacity:1;pointer-events:auto}
  .g-3,.g-2{grid-template-columns:minmax(0,1fr)}
  .searchbox input{width:150px}
}
@media (max-width:640px){
  .content{padding:13px}
  .topbar{padding:9px 12px;gap:8px}
  .g-4{grid-template-columns:minmax(0,1fr)}
  .frow,.frow-3{grid-template-columns:minmax(0,1fr)}
  .stat .val{font-size:22px}
  .ptitle h1{font-size:16px}
  .ptitle p{display:none}
  .searchbox{display:none}
  .modal-b{max-height:none}
  .overlay{padding:0;align-items:flex-end}
  .modal{max-width:100%;border-radius:18px 18px 0 0;margin:0}
  .toasts{inset-inline:12px;bottom:12px;max-width:none}
}

/* ---------- Print ---------- */
@media print{
  .sidebar,.topbar,.toasts,.modal-h .x,.modal-f,.btn,.scrim{display:none !important}
  body{background:#fff}
  .main{margin:0}
  .content{padding:0}
  .card{box-shadow:none;border-color:#ddd}
  .overlay{position:static;background:#fff;padding:0;display:block}
  .modal{box-shadow:none;max-width:none;border:0}
  .modal-b{max-height:none;overflow:visible;padding:0}
  .print-only{display:block !important}
  .no-print{display:none !important}
  a{text-decoration:none;color:#000}
}
.print-only{display:none}

'use strict';

/* ---------------- Logo fallback (inline SVG) ---------------- */
const AF_LOGO_FALLBACK = window.AF_LOGO_FALLBACK;

/* ---------------- Tiny DOM helpers ---------------- */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.prototype.slice.call(root.querySelectorAll(sel));
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function icon(name, cls){ return `<svg class="${cls||''}"><use href="#i-${name}"/></svg>`; }
function uid(prefix){
  return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function debounce(fn, ms){
  let t; return function(){ const a = arguments, c = this; clearTimeout(t); t = setTimeout(() => fn.apply(c, a), ms); };
}
function throttle(fn, ms){
  let last = 0, timer = null;
  return function(){ const a = arguments, now = Date.now();
    if (now - last > ms){ last = now; fn.apply(this, a); }
    else { clearTimeout(timer); timer = setTimeout(() => { last = Date.now(); fn.apply(this, a); }, ms - (now - last)); }
  };
}
function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
function sum(arr, f){ return arr.reduce((t, x) => t + (f ? f(x) : x), 0); }
function groupBy(arr, f){
  const m = {};
  arr.forEach(x => { const k = f(x); (m[k] = m[k] || []).push(x); });
  return m;
}
function sortBy(arr, f, dir){ return arr.slice().sort((a,b) => { const x=f(a), y=f(b); return (x<y?-1:x>y?1:0) * (dir==='desc'?-1:1); }); }
function unique(arr){ return Array.from(new Set(arr)); }

/* ---------------- Arabic dates & numbers ---------------- */
const AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const AR_DAYS   = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const AR_DAYS_SHORT = ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];

function iso(d){
  const x = d ? new Date(d) : new Date();
  const m = String(x.getMonth() + 1).padStart(2,'0');
  const day = String(x.getDate()).padStart(2,'0');
  return `${x.getFullYear()}-${m}-${day}`;
}
function today(){ return iso(new Date()); }
function parseISO(s){
  if (!s) return null;
  const p = String(s).split('-').map(Number);
  if (p.length < 3 || !p[0]) return null;
  return new Date(p[0], p[1] - 1, p[2]);
}
function monthKey(d){
  if (typeof d === 'string' && /^\d{4}-\d{2}/.test(d)) return d.slice(0,7);
  const x = d ? new Date(d) : new Date();
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`;
}
function monthName(key){
  const p = String(key).split('-');
  return AR_MONTHS[Number(p[1]) - 1] + ' ' + p[0];
}
function fmtDate(s, withDay){
  const d = parseISO(s);
  if (!d) return '—';
  const base = `${d.getDate()} ${AR_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  return withDay ? `${AR_DAYS[d.getDay()]} ${base}` : base;
}
function fmtShort(s){
  const d = parseISO(s);
  if (!d) return '—';
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}
function addDays(s, n){
  const d = typeof s === 'string' ? parseISO(s) : new Date(s);
  d.setDate(d.getDate() + n);
  return iso(d);
}
function addMonths(s, n){
  const d = parseISO(s) || new Date();
  const day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last));
  return iso(d);
}
function daysBetween(a, b){
  const d1 = parseISO(a), d2 = parseISO(b);
  if (!d1 || !d2) return 0;
  return Math.round((d2 - d1) / 86400000);
}
function daysLeft(endDate){ return daysBetween(today(), endDate); }
function monthRange(startKey, count){
  const out = []; let k = startKey;
  for (let i = 0; i < count; i++){ out.push(k); k = monthKey(addMonths(k + '-01', 1)); }
  return out;
}
function monthSeq(fromKey, toKey){
  const out = []; let k = fromKey, guard = 0;
  while (k <= toKey && guard++ < 400){ out.push(k); k = monthKey(addMonths(k + '-01', 1)); }
  return out;
}
function nf(n, dec){
  const v = Number(n) || 0;
  return v.toLocaleString('en-US', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 });
}
function money(n){ return nf(Math.round(Number(n) || 0)) + ' ' + (S.data.settings.currency || 'ج.م'); }
function money0(n){ return nf(Math.round(Number(n) || 0)); }
function pct(a, b){ return b ? Math.round((a / b) * 100) : 0; }
function initials(name){
  const p = String(name || '').trim().split(/\s+/);
  return (p[0] ? p[0][0] : '?') + (p[1] ? p[1][0] : '');
}
const AV_COLORS = ['#f5b301','#2563eb','#12a150','#e02424','#7c3aed','#0891b2','#db2777','#ea580c','#4f46e5','#0d9488'];
function avColor(key){
  let h = 0; const s = String(key || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 9973;
  return AV_COLORS[h % AV_COLORS.length];
}
function parsePhone(p){ return String(p || '').replace(/[^\d+]/g, ''); }
function waLink(phone, text){
  let p = parsePhone(phone);
  if (p.startsWith('+')) p = p.slice(1);
  if (p.startsWith('0')) p = '20' + p.slice(1);
  if (!p.startsWith('20') && p.length <= 11) p = '20' + p;
  return `https://wa.me/${p}?text=${encodeURIComponent(text || '')}`;
}

/* ---------------- Toast ---------------- */
function toast(msg, type, title){
  const box = $('#toasts');
  const t = document.createElement('div');
  const icons = { ok:'check', bad:'alert', warn:'alert', info:'bell' };
  t.className = 'toast ' + (type || 'info');
  t.innerHTML = `<span class="ti">${icon(icons[type] || 'bell')}</span>
    <span class="tt"><b>${esc(title || ({ok:'تم بنجاح',bad:'خطأ',warn:'تنبيه',info:'معلومة'})[type] || 'معلومة')}</b><span>${esc(msg)}</span></span>`;
  box.appendChild(t);
  setTimeout(() => { t.style.transition = '.3s'; t.style.opacity = '0'; t.style.transform = 'translateY(10px)';
    setTimeout(() => t.remove(), 320); }, type === 'bad' ? 6000 : 3600);
}

/* ---------------- Modal manager ---------------- */
const Modal = {
  stack: [],
  open(opt){
    const id = uid('m');
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.dataset.mid = id;
    const size = opt.size ? ' ' + opt.size : '';
    ov.innerHTML = `
      <div class="modal${size}" role="dialog" aria-modal="true">
        <div class="modal-h">
          <div>
            <h3>${esc(opt.title || '')}</h3>
            ${opt.sub ? `<div class="sub">${esc(opt.sub)}</div>` : ''}
          </div>
          <button class="x no-print" data-close="${id}" aria-label="إغلاق">${icon('x')}</button>
        </div>
        <div class="modal-b" id="mb_${id}">${opt.body || ''}</div>
        ${opt.footer === null ? '' : `<div class="modal-f no-print">${opt.footer || `<button class="btn" data-close="${id}">إغلاق</button>`}</div>`}
      </div>`;
    $('#modalRoot').appendChild(ov);
    ov.querySelectorAll('[data-close="__ID__"]').forEach(b => b.setAttribute('data-close', id));
    this.stack.push(id);
    document.body.style.overflow = 'hidden';
    ov.addEventListener('click', e => {
      if (e.target === ov && opt.dismissable !== false) this.close(id);
    });
    if (opt.onMount) opt.onMount(ov.querySelector('.modal'), ov);
    const f = ov.querySelector('input,select,textarea,button.pri');
    if (f && opt.autofocus !== false && window.innerWidth > 700) setTimeout(() => { try { f.focus(); } catch(e){} }, 60);
    return id;
  },
  close(id){
    let ov;
    if (id) ov = $(`.overlay[data-mid="${id}"]`);
    else ov = this.stack.length ? $(`.overlay[data-mid="${this.stack[this.stack.length-1]}"]`) : null;
    if (!ov) return;
    const mid = ov.dataset.mid;
    this.stack = this.stack.filter(x => x !== mid);
    ov.style.transition = '.18s'; ov.style.opacity = '0';
    setTimeout(() => ov.remove(), 180);
    if (!this.stack.length) document.body.style.overflow = '';
  },
  closeAll(){ this.stack.slice().forEach(id => this.close(id)); }
};

/* ---------------- State ---------------- */
const LS_KEY = 'af_tracker_v1';
const FB_KEY = 'af_tracker_fb';

function defaultData(){
  const t = today();
  return {
    meta: { version: 1, rev: 0, updatedAt: new Date().toISOString(), createdAt: new Date().toISOString() },
    settings: {
      centerName: 'أكاديمية أحمد فتحي',
      coachName: 'أحمد فتحي',
      phone: '',
      currency: 'ج.م',
      levels: ['مبتدئ','متوسط','متقدم'],
      expiryWarnDays: 5,
      absentWarn: 3,
      sessionPrice: 100,
      monthlyPrice: 500,
      theme: 'light',
      startMonth: monthKey(t)
    },
    groups: [], students: [], exams: [], grades: {}, payments: [], attendance: {}
  };
}

const S = {
  data: defaultData(),
  view: 'dashboard',
  query: '',
  ui: {
    stuFilter: { groupId:'', level:'', status:'', sort:'name' },
    stuView: 'table',
    att: { date: today(), groupId: '', note: '' , matrixMonth: monthKey(today()) },
    exam: { id: '' },
    rep: { type:'attendance', from: monthKey(today()) + '-01', to: today(), groupId:'', }
  },
  fb: { status:'off', cfg:null, app:null, db:null, unsubs:[], err:'', syncing:false, lastSync:null, code:'' },
  applyingRemote: false
};

/* ---------------- Storage : localStorage ---------------- */
function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if (raw){
      const d = JSON.parse(raw);
      S.data = migrate(d);
      return true;
    }
  }catch(e){ console.warn('load error', e); }
  return false;
}
function migrate(d){
  const base = defaultData();
  const out = Object.assign({}, base, d || {});
  out.meta = Object.assign({}, base.meta, d && d.meta);
  out.settings = Object.assign({}, base.settings, d && d.settings);
  out.groups = (out.groups || []).map(g => Object.assign({ id: uid('g'), name:'', level:'', days:[], time:'', price:0, note:'' }, g));
  out.students = (out.students || []).map(s => Object.assign({
    id: uid('s'), code:'', name:'', phone:'', parentPhone:'', guardian:'', groupId:'', level:'',
    status:'active', joinDate: today(), notes:'', fee: out.settings.monthlyPrice,
    sub: { type:'monthly', start: today(), end: addMonths(today(),1), total:12, used:0 }
  }, s, { sub: Object.assign({ type:'monthly', start: today(), end: addMonths(today(),1), total:12, used:0 }, (s && s.sub) || {}) }));
  out.exams = out.exams || [];
  out.grades = out.grades || {};
  out.payments = (out.payments || []).map(p => Object.assign({ id: uid('p'), method:'cash', period:'', sessions:0 }, p));
  out.attendance = out.attendance || {};
  return out;
}
const saveLocal = debounce(function(){
  try{
    S.data.meta.updatedAt = new Date().toISOString();
    localStorage.setItem(LS_KEY, JSON.stringify(S.data));
  }catch(e){
    console.warn('save error', e);
    toast('تعذّر الحفظ في المتصفح — المساحة ممتلئة؟', 'bad');
  }
}, 200);

/* Central write: marks rev, saves locally and queues a cloud push */
const dirty = { main:false, months:{} };
function commit(opts){
  opts = opts || {};
  S.data.meta.rev = (S.data.meta.rev || 0) + 1;
  S.data.meta.updatedAt = new Date().toISOString();
  dirty.main = true;
  saveLocal();
  if (!opts.silent) render();
  Cloud.push();
}

/* ---------------- Cloud (Firebase Firestore) ---------------- */
const Cloud = {
  CFG_KEY: FB_KEY,
  readCfg(){
    try{ return JSON.parse(localStorage.getItem(FB_KEY) || 'null'); }catch(e){ return null; }
  },
  writeCfg(cfg){
    if (cfg) localStorage.setItem(FB_KEY, JSON.stringify(cfg));
    else localStorage.removeItem(FB_KEY);
  },
  setStatus(status, msg){
    S.fb.status = status;
    if (msg) S.fb.err = msg;
    paintCloud();
  },
  path(){ return 'centers/' + (S.fb.cfg && S.fb.cfg.code ? S.fb.cfg.code : 'default'); },

  async connect(opts){
    opts = opts || {};
    const cfg = opts.config || this.readCfg();
    if (!cfg || !cfg.apiKey || !cfg.projectId){
      toast('أدخل إعدادات Firebase أولًا', 'warn');
      return false;
    }
    this.disconnect(true);
    S.fb.cfg = cfg;
    if (opts.save !== false) this.writeCfg(cfg);
    this.setStatus('busy', 'جارٍ الاتصال...');
    try{
      const V = '10.12.5';
      const [appMod, fsMod] = await Promise.all([
        import('https://www.gstatic.com/firebasejs/' + V + '/firebase-app.js'),
        import('https://www.gstatic.com/firebasejs/' + V + '/firebase-firestore.js')
      ]);
      const app = appMod.initializeApp(cfg, 'af-tracker-' + Date.now().toString(36));
      const db = fsMod.getFirestore(app);
      S.fb.app = app; S.fb.db = db;
      S.fb.api = {
        doc: fsMod.doc, collection: fsMod.collection, onSnapshot: fsMod.onSnapshot,
        setDoc: fsMod.setDoc, getDoc: fsMod.getDoc, getDocs: fsMod.getDocs,
        deleteDoc: fsMod.deleteDoc, serverTimestamp: fsMod.serverTimestamp, writeBatch: fsMod.writeBatch
      };
      S.fb.path = this.path();
      this.listen();
      this.setStatus('live', null);
      toast('تم الاتصال بـ Firebase — المزامنة الفورية شغالة', 'ok');
      S.fb.lastSync = new Date();
      paintCloud();
      return true;
    }catch(err){
      console.error(err);
      this.setStatus('error', (err && err.message) || 'فشل الاتصال');
      toast('فشل الاتصال بـ Firebase: ' + ((err && err.message) || ''), 'bad');
      return false;
    }
  },
  disconnect(silent){
    (S.fb.unsubs || []).forEach(u => { try{ u(); }catch(e){} });
    S.fb.unsubs = [];
    if (S.fb.app){ try{ S.fb.app.delete(); }catch(e){} }
    S.fb.app = null; S.fb.db = null;
    if (!silent){ this.setStatus('off', null); toast('تم فصل الاتصال — النظام شغال محليًا', 'info'); }
    paintCloud();
  },
  listen(){
    const api = S.fb.api, db = S.fb.db, base = S.fb.path;
    const unsub1 = api.onSnapshot(api.doc(db, base), snap => {
      if (!snap.exists()){ this.push(true); return; }
      const remote = snap.data() || {};
      if ((remote.rev || 0) <= (S.data.meta.rev || 0)) { S.fb.lastSync = new Date(); paintCloud(); return; }
      this.applyRemote(remote);
    }, err => { this.setStatus('error', err.message); });

    const unsub2 = api.onSnapshot(api.collection(db, base + '/attendance'), snap => {
      let changed = false;
      snap.forEach(d => {
        const data = d.data() || {};
        const key = d.id;
        if ((data.rev || 0) > ((S.data.attendance[key] || {}).rev || 0)){
          S.data.attendance[key] = { groupId: data.groupId || 'none', note: data.note || '', records: data.records || {}, rev: data.rev || 0, savedAt: data.savedAt || '' };
          changed = true;
        }
      });
      if (changed){ S.applyingRemote = true; saveLocal(); render(); S.applyingRemote = false; S.fb.lastSync = new Date(); paintCloud(); }
    }, err => { this.setStatus('error', err.message); });

    S.fb.unsubs.push(unsub1, unsub2);
  },
  applyRemote(remote){
    if (!remote.students) return;
    const keepRev = remote.rev || 0;
    const att = S.data.attendance;
    S.applyingRemote = true;
    S.data = migrate({
      meta: Object.assign({}, S.data.meta, remote.meta, { rev: keepRev }),
      settings: Object.assign({}, S.data.settings, remote.settings),
      groups: remote.groups, students: remote.students, exams: remote.exams,
      payments: remote.payments, grades: remote.grades, attendance: att
    });
    saveLocal();
    render();
    S.applyingRemote = false;
    S.fb.lastSync = new Date();
    toast('تم تحديث البيانات من السحابة', 'info');
  },
  push(force){
    if (S.fb.status !== 'live' || S.applyingRemote) return;
    this._push = this._push || debounce(() => this._doPush(), 900);
    if (force) this._doPush(); else this._push();
  },
  async _doPush(){
    const api = S.fb.api, db = S.fb.db, base = S.fb.path;
    if (!api || !db) return;
    const months = Object.keys(dirty.months);
    dirty.main = false; dirty.months = {};
    S.fb.syncing = true; paintCloud();
    try{
      await api.setDoc(api.doc(db, base), {
        meta: S.data.meta, settings: S.data.settings, groups: S.data.groups,
        students: S.data.students, exams: S.data.exams, payments: S.data.payments,
        grades: S.data.grades, rev: S.data.meta.rev, updatedAt: new Date().toISOString()
      }, { merge: true });
      for (const k of months){
        const items = Object.keys(S.data.attendance).filter(x => x.split('@')[0].slice(0,7) === k);
        if (!items.length) continue;
        for (const fullKey of items){
          const [date, gid] = fullKey.split('@');
          const rec = S.data.attendance[fullKey];
          await api.setDoc(api.doc(db, base + '/attendance', fullKey), {
            groupId: gid, note: rec.note || '', records: rec.records || {},
            rev: rec.rev || 0, savedAt: rec.savedAt || '', month: k
          }, { merge: true });
        }
      }
      S.fb.lastSync = new Date(); S.fb.syncing = false; paintCloud();
    }catch(err){
      S.fb.syncing = false;
      this.setStatus('error', err.message);
      console.error(err);
      toast('فشل الرفع للسحابة: ' + err.message, 'bad');
    }
  },
  async pull(){
    const api = S.fb.api, db = S.fb.db, base = S.fb.path;
    if (!api){ toast('اتصل بـ Firebase أولًا', 'warn'); return; }
    try{
      const snap = await api.getDoc(api.doc(db, base));
      if (!snap.exists()){ toast('لا توجد بيانات على السحابة — ارفع بياناتك أولًا', 'warn'); return; }
      this.applyRemote(snap.data());
      toast('تم تنزيل البيانات من السحابة', 'ok');
    }catch(e){ toast('فشل التنزيل: ' + e.message, 'bad'); }
  },
  async pushAll(){
    if (S.fb.status !== 'live'){ toast('اتصل بـ Firebase أولًا', 'warn'); return; }
    dirty.main = true;
    Object.keys(S.data.attendance).forEach(k => { dirty.months[k.split('@')[0].slice(0,7)] = true; });
    S.data.meta.rev = (S.data.meta.rev || 0) + 1;
    await this._doPush();
    toast('تم رفع كل البيانات للسحابة', 'ok');
  }
};
function paintCloud(){
  const chip = $('#cloudChip'); if (!chip) return;
  const map = { off:['', 'تخزين محلي', 'اضغط للربط بـ Firebase'],
                busy:['busy', 'جارٍ الاتصال...', 'Firebase'],
                live:['live', 'متصل بالسحابة', S.fb.syncing ? 'جارٍ المزامنة...' : (S.fb.lastSync ? 'آخر مزامنة ' + S.fb.lastSync.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}) : 'مزامنة فورية')],
                error:['err', 'خطأ اتصال', S.fb.err || 'راجع الإعدادات'] };

/* ---------------- Domain helpers ---------------- */
function student(id){ return S.data.students.find(s => s.id === id); }
function groupOf(id){ return S.data.groups.find(g => g.id === id); }
function groupName(id){ const g = groupOf(id); return g ? g.name : 'بدون مجموعة'; }
function examOf(id){ return S.data.exams.find(e => e.id === id); }
function studentsOf(groupId){ return S.data.students.filter(s => (s.groupId || '') === (groupId || '')); }
function activeStudents(){ return S.data.students.filter(s => s.status === 'active'); }

function attKey(date, groupId){ return date + '@' + (groupId || 'none'); }
function getAtt(date, groupId){ return S.data.attendance[attKey(date, groupId)] || null; }
function setAtt(date, groupId, records, note){
  const k = attKey(date, groupId);
  const prev = S.data.attendance[k] || {};
  S.data.attendance[k] = { groupId: groupId || 'none', note: note || '', records: records,
    rev: (prev.rev || 0) + 1, savedAt: new Date().toISOString() };
  dirty.months[date.slice(0,7)] = true;
}
function allAttRecords(){
  const out = [];
  Object.keys(S.data.attendance).forEach(k => {
    const parts = k.split('@');
    const rec = S.data.attendance[k];
    Object.keys(rec.records || {}).forEach(sid => {
      out.push({ date: parts[0], groupId: parts[1] === 'none' ? '' : parts[1], studentId: sid, status: rec.records[sid] });
    });
  });
  return out;
}
function attStats(studentId, fromDate, toDate){
  const st = { present:0, absent:0, late:0, excused:0, total:0 };
  allAttRecords().forEach(r => {
    if (r.studentId !== studentId) return;
    if (fromDate && r.date < fromDate) return;
    if (toDate && r.date > toDate) return;
    if (st[r.status] != null) st[r.status]++;
    st.total++;
  });
  const counted = st.present + st.absent + st.late;
  st.rate = counted ? Math.round(((st.present + st.late) / counted) * 100) : 0;
  return st;
}
function sessionsUsed(stu){
  return sum(allAttRecords().filter(r => r.studentId === stu.id && (r.status === 'present' || r.status === 'late') && (!stu.sub.start || r.date >= stu.sub.start)), () => 1);
}
function examAvg(studentId){
  const vals = [];
  S.data.exams.forEach(e => {
    const g = (S.data.grades[e.id] || {})[studentId];
    if (typeof g === 'number' && e.max) vals.push((g / e.max) * 100);
  });
  return vals.length ? Math.round(sum(vals, v => v) / vals.length) : null;
}
function paidMonths(studentId){
  const set = {};
  S.data.payments.filter(p => p.studentId === studentId).forEach(p => {
    const m = p.period || monthKey(p.date);
    set[m] = (set[m] || 0) + (Number(p.amount) || 0);
  });
  return set;
}
function stuFinance(stu){
  const fee = Number(stu.fee) || 0;
  const paidAll = sum(S.data.payments.filter(p => p.studentId === stu.id), p => Number(p.amount) || 0);
  const paidMap = paidMonths(stu.id);
  const out = { fee: fee, paidMap: paidMap, paidTotal: paidAll, due: 0, dueMonths: [], months: [], collectedThisMonth: 0 };
  if (stu.sub.type === 'sessions'){
    const used = sessionsUsed(stu);
    out.used = used;
    out.remaining = Math.max(0, (Number(stu.sub.total) || 0) - used);
    out.due = 0;
    return out;
  }
  const startOK = /^\d{4}-\d{2}/.test(stu.sub.start || '');
  const startM = startOK ? monthKey(stu.sub.start) : monthKey(today());
  const endM = stu.sub.end ? monthKey(stu.sub.end) : monthKey(today());
  const months = monthSeq(startM, endM < monthKey(today()) ? endM : monthKey(today()));
  out.months = months;
  months.forEach(m => {
    if (stu.status === 'stopped') return;
    if ((paidMap[m] || 0) + 0.001 < fee) out.dueMonths.push(m);
  });
  out.due = out.dueMonths.length * fee;
  out.collectedThisMonth = paidMap[monthKey(today())] || 0;
  return out;
}
function stuStatus(stu){
  const fin = stuFinance(stu);
  const dl = stu.sub.end ? daysLeft(stu.sub.end) : null;
  if (stu.status === 'stopped') return { key:'stopped', label:'موقوف', cls:'b-gray' };
  if (stu.status === 'paused') return { key:'paused', label:'متوقف مؤقتًا', cls:'b-gray' };
  if (stu.sub.type === 'monthly' && dl != null && dl < 0) return { key:'expired', label:'اشتراك منتهي', cls:'b-bad' };
  if (fin.due > 0) return { key:'due', label:'متأخر ' + money0(fin.due), cls:'b-bad' };
  if (dl != null && dl <= (S.data.settings.expiryWarnDays || 5)) return { key:'soon', label:'يُنتهي قريبًا', cls:'b-warn' };
  if (stu.sub.type === 'sessions' && fin.remaining <= 2) return { key:'low', label:'باقي ' + fin.remaining + ' حصة', cls:'b-warn' };
  return { key:'ok', label:'منتظم', cls:'b-ok' };
}
function attRateOf(stu, from, to){ return attStats(stu.id, from, to).rate; }

function alerts(){
  const out = [];
  const t = today();
  S.data.students.forEach(stu => {
    if (stu.status === 'stopped') return;
    const fin = stuFinance(stu);
    const st = stuStatus(stu);
    if (st.key === 'expired') out.push({ sev:'bad', icon:'clock', title:`اشتراك ${stu.name} منتهي`, sub:`انتهى في ${fmtDate(stu.sub.end)} — أعد التجديد`, act:'renew', id:stu.id });
    else if (st.key === 'soon') out.push({ sev:'warn', icon:'clock', title:`اشتراك ${stu.name} ينتهي قريبًا`, sub:`باقي ${daysLeft(stu.sub.end)} يوم (${fmtDate(stu.sub.end)})`, act:'renew', id:stu.id });
    if (fin.due > 0) out.push({ sev:'bad', icon:'wallet', title:`متأخرات على ${stu.name}`, sub:`${money(fin.due)} — ${fin.dueMonths.length} شهر غير مسدد`, act:'pay', id:stu.id });
    if (stu.sub.type === 'sessions' && fin.remaining <= 2 && stu.status === 'active')
      out.push({ sev:'warn', icon:'layers', title:`حصص ${stu.name} على وشك الانتهاء`, sub:`متبقي ${fin.remaining} حصة من ${stu.sub.total}`, act:'renew', id:stu.id });
    const a = attStats(stu.id, addDays(t, -30), t);
    if (stu.status === 'active' && a.absent >= (S.data.settings.absentWarn || 3))
      out.push({ sev:'warn', icon:'alert', title:`غياب متكرر: ${stu.name}`, sub:`${a.absent} غياب خلال 30 يوم — نسبة الحضور ${a.rate}%`, act:'wa', id:stu.id });
    if (!stu.groupId) out.push({ sev:'info', icon:'layers', title:`${stu.name} بدون مجموعة`, sub:'أضِفه لمجموعة لمتابعة الحضور', act:'edit', id:stu.id });
  });
  const order = { bad:0, warn:1, info:2 };
  return out.sort((a, b) => order[a.sev] - order[b.sev]);
}

/* ---------------- CSV / export ---------------- */
function download(filename, content, type){
  const blob = new Blob([content], { type: type || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
}
function toCSV(headers, rows){
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = [headers.map(q).join(',')];
  rows.forEach(r => lines.push(r.map(q).join(',')));
  return '\uFEFF' + lines.join('\r\n');
}
function exportCSV(name, headers, rows){
  download(name + '.csv', toCSV(headers, rows), 'text/csv;charset=utf-8');
  toast('تم تصدير ' + name + '.csv', 'ok');
}

  const labels = months.map(m => AR_MONTHS[Number(m.split('-')[1]) - 1]);
  const values = months.map(m => sum(S.data.payments.filter(p => monthKey(p.date) === m), p => Number(p.amount) || 0));

  const days = Array.from({ length: 14 }, (_, i) => addDays(t, i - 13));

/* ---------------- Charts (vanilla canvas) ---------------- */
const Charts = {
  prep(cv, h){
    if (!cv) return null;
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth || cv.parentElement.clientWidth || 300;
    const hh = h || cv.clientHeight || 220;
    cv.width = w * dpr; cv.height = hh * dpr;
    cv.style.height = hh + 'px';
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, hh);
    c.font = '600 11px Cairo, Tahoma, sans-serif';
    return { c: c, w: w, h: hh };
  },
  css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); },
  bars(cv, x, y, w, h, color, r){
    const rad = Math.min(r == null ? 6 : r, w / 2, h);
    if (h <= 0) return;
    cv.beginPath();
    cv.moveTo(x, y + h);
    cv.lineTo(x, y + rad);
    cv.quadraticCurveTo(x, y, x + rad, y);
    cv.lineTo(x + w - rad, y);
    cv.quadraticCurveTo(x + w, y, x + w, y + rad);
    cv.lineTo(x + w, y + h);
    cv.closePath();
    cv.fillStyle = color; cv.fill();
  },
  bar(cv, labels, values, opt){
    opt = opt || {};
    const p = this.prep(cv); if (!p) return;
    const { c, w, h } = p;
    const padB = 26, padT = 22, padS = 8;
    const max = Math.max(1, ...values) * 1.15;
    const n = values.length || 1;
    const slot = (w - padS * 2) / n;
    const bw = Math.min(46, slot * 0.55);
    const line = this.css('--line'), muted = this.css('--muted-2');
    c.strokeStyle = line; c.lineWidth = 1;
    for (let i = 0; i <= 4; i++){
      const yy = padT + ((h - padT - padB) / 4) * i;
      c.beginPath(); c.moveTo(padS, yy); c.lineTo(w - padS, yy); c.stroke();
    }
    values.forEach((v, i) => {
      const bh = ((h - padT - padB) * (v / max));
      const x = padS + slot * i + (slot - bw) / 2;
      const yy = h - padB - bh;
      const col = opt.color || '#f5b301';
      const g = c.createLinearGradient(0, yy, 0, h - padB);
      g.addColorStop(0, col); g.addColorStop(1, col + '55');
      this.bars(c, x, yy, bw, bh, g, 6);
      c.fillStyle = muted; c.textAlign = 'center';
      c.fillText(String(labels[i] || ''), x + bw / 2, h - padB + 16);
      if (v > 0){
        c.fillStyle = this.css('--ink-2');
        c.font = '700 11px Cairo, Tahoma, sans-serif';
        c.fillText((opt.fmt ? opt.fmt(v) : nf(v)), x + bw / 2, yy - 6);
        c.font = '600 11px Cairo, Tahoma, sans-serif';
      }
    });
  },
  line(cv, labels, values, opt){
    opt = opt || {};
    const p = this.prep(cv); if (!p) return;
    const { c, w, h } = p;
    const padB = 24, padT = 16, padS = 26;
    const max = opt.max || Math.max(1, ...values.filter(v => v != null)) * 1.15;
    const iw = w - padS - 10, ih = h - padB - padT;
    const line = this.css('--line'), muted = this.css('--muted-2');
    c.strokeStyle = line;
    for (let i = 0; i <= 4; i++){
      const yy = padT + (ih / 4) * i;
      c.beginPath(); c.moveTo(padS, yy); c.lineTo(w - 8, yy); c.stroke();
      c.fillStyle = muted; c.textAlign = 'left';
      c.fillText(String(Math.round(max - (max / 4) * i)), 2, yy + 4);
    }
    const step = values.length > 1 ? iw / (values.length - 1) : iw;
    const pts = values.map((v, i) => ({ x: padS + step * i, y: v == null ? null : padT + ih - (ih * (v / max)), v: v }));
    // area
    const def = pts.filter(p2 => p2.y != null);
    if (def.length > 1){
      const g = c.createLinearGradient(0, padT, 0, padT + ih);
      const col = opt.color || this.css('--ok') || '#12a150';
      g.addColorStop(0, col + '66'); g.addColorStop(1, col + '05');
      c.beginPath(); c.moveTo(def[0].x, padT + ih);
      def.forEach(p2 => c.lineTo(p2.x, p2.y));
      c.lineTo(def[def.length - 1].x, padT + ih); c.closePath();
      c.fillStyle = g; c.fill();
      c.beginPath(); def.forEach((p2, i) => i ? c.lineTo(p2.x, p2.y) : c.moveTo(p2.x, p2.y));
      c.strokeStyle = col; c.lineWidth = 2.5; c.lineJoin = 'round'; c.stroke();
    }
    pts.forEach(p2 => {
      if (p2.y == null) return;
      c.beginPath(); c.arc(p2.x, p2.y, 4, 0, Math.PI * 2);
      c.fillStyle = this.css('--card'); c.fill();
      c.lineWidth = 2.5; c.strokeStyle = opt.color || this.css('--ok'); c.stroke();
    });
    c.fillStyle = muted; c.textAlign = 'center';
    labels.forEach((l, i) => { if (labels.length <= 20 || i % 2 === 0) c.fillText(String(l), pts[i].x, h - 7); });
  },
  donut(cv, data){
    const p = this.prep(cv, cv ? (cv.clientHeight || 200) : 200); if (!p) return;
    const { c, w, h } = p;
    const total = sum(data, d => d.value);
    const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 12, r = R * 0.62;
    if (!total){
      c.fillStyle = this.css('--muted'); c.textAlign = 'center';
      c.fillText('لا توجد بيانات', cx, cy); return;
    }
    let a0 = -Math.PI / 2;
    data.forEach(d => {
      const a1 = a0 + (d.value / total) * Math.PI * 2;
      c.beginPath();
      c.arc(cx, cy, R, a0, a1); c.arc(cx, cy, r, a1, a0, true); c.closePath();
      c.fillStyle = d.color || '#f5b301'; c.fill();
      c.strokeStyle = this.css('--card'); c.lineWidth = 2; c.stroke();
      a0 = a1;
    });
    c.fillStyle = this.css('--ink'); c.textAlign = 'center';
    c.font = '800 21px Cairo, Tahoma, sans-serif';
    c.fillText(nf(total), cx, cy + 2);
    c.font = '600 11px Cairo, Tahoma, sans-serif';
    c.fillStyle = this.css('--muted');
    c.fillText('طالب', cx, cy + 19);
  }
};

      `<div class="card"><div class="card-b">${emptyState('لا توجد مجموعات','الحضور يُسجَّل لكل مجموعة على حدة', `<button class="btn pri" data-act="addGroup">${icon('plus')} إنشاء مجموعة</button>`)}</div></div>`;
  }
  if (attDraft == null || attDraft.date !== a.date || attDraft.groupId !== gid){
    const saved = getAtt(a.date, gid);
    attDraft = { date: a.date, groupId: gid, records: Object.assign({}, (saved && saved.records) || {}), note: (saved && saved.note) || '', dirty: false };
  }
  const ss = studentsOf(gid).filter(s => s.status !== 'stopped');
  const rec = attDraft.records;
  const counts = { present:0, absent:0, late:0, excused:0 };
  ss.forEach(s => { if (rec[s.id] && counts[rec[s.id]] != null) counts[rec[s.id]]++; });
  const marked = sum(Object.values(counts));

  const start = a.date.slice(0, 8) + '01';
  const mDays = [];
  { const y = Number(a.date.slice(0,4)), m = Number(a.date.slice(5,7));
    const last = new Date(y, m, 0).getDate();
    for (let d = 1; d <= last; d++) mDays.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`); }
  const matrixRows = (gid ? studentsOf(gid) : S.data.students).map(s => {
    let p = 0, ab = 0, l = 0, ex = 0;
    mDays.forEach(d => { const r = getAtt(d, gid); const v = r && r.records[s.id]; if (v === 'present') p++; else if (v === 'absent') ab++; else if (v === 'late') l++; else if (v === 'excused') ex++; });
    return { s: s, p: p, ab: ab, l: l, ex: ex };
  });

  return pageHead('الحضور والغياب','سجّل الحضور اليومي وتابع انتظام كل طالب',
      `<button class="btn" data-act="attMatrixPrint">${icon('print')} طباعة كشف الشهر</button>
       <button class="btn pri" data-act="attSave">${icon('save')} حفظ الحضور</button>`) + `

  <div class="card">
    <div class="card-h">
      <h3>تسجيل الحضور</h3>
      <span class="sp"></span>
      <input type="date" class="inp" style="max-width:170px" data-att="date" value="${a.date}">
      <select class="inp" style="max-width:200px" data-att="group">
        ${S.data.groups.map(g => `<option value="${g.id}" ${gid === g.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}
      </select>
      <span class="badge ${marked === ss.length && ss.length ? 'b-ok' : 'b-warn'}">${marked}/${ss.length} مُسجَّل</span>
    </div>
    <div class="card-b">
      ${ss.length ? `
      <div class="flex wrap" style="margin-bottom:13px">
        <button class="btn sm" data-act="attAll" data-v="present">${icon('check')} الكل حاضر</button>
        <button class="btn sm ghost" data-act="attClear">${icon('refresh')} تفريغ</button>
        <div class="sp"></div>
        <div class="att-sum">
          <span class="k"><i style="background:var(--ok)"></i> حاضر ${counts.present}</span>
          <span class="k"><i style="background:var(--warn)"></i> متأخر ${counts.late}</span>
          <span class="k"><i style="background:var(--bad)"></i> غائب ${counts.absent}</span>
          <span class="k"><i style="background:var(--info)"></i> بعذر ${counts.excused}</span>
        </div>
      </div>
      <div id="attList">
        ${ss.map(s => `
        <div class="att-row" data-sid="${s.id}">
          ${avatar(s.name, s.id)}
          <span class="an">
            <b>${esc(s.name)}</b>
            <span>${esc(s.code || '')}${s.phone ? ' · ' + esc(s.phone) : ''} · حضور سابق ${attStats(s.id).rate}%</span>
          </span>
          <span class="seg">
            ${[['present','حاضر'],['late','متأخر'],['absent','غائب'],['excused','بعذر']].map(x =>
              `<button data-act="mark" data-id="${s.id}" class="${rec[s.id] === x[0] ? 'on' : ''}" data-v="${x[0]}">${x[1]}</button>`).join('')}
          </span>
        </div>`).join('')}
      </div>
      <div class="field" style="margin-top:14px;margin-bottom:0">
        <label>ملاحظة الحصة ${icon('edit')}</label>
        <input class="inp" id="attNote" placeholder="مثال: تم شرح الوحدة الثالثة، تمرين على القوانين..." value="${esc(attDraft.note)}">
      </div>` : emptyState('لا يوجد طلبة في هذه المجموعة','أضف طلبة للمجموعة من صفحة الطلبة')}
    </div>
  </div>

  <div class="card mt">
    <div class="card-h"><h3>كشف حضور شهر ${monthName(a.date.slice(0,7))}</h3><span class="sub">${esc(groupName(gid))}</span>
      <span class="sp"></span>
      <div class="att-sum">
        <span class="k"><i style="background:var(--ok)"></i>حاضر</span><span class="k"><i style="background:var(--bad)"></i>غائب</span>
        <span class="k"><i style="background:var(--warn)"></i>متأخر</span><span class="k"><i style="background:var(--info)"></i>بعذر</span>
      </div>
    </div>
    <div class="tbl-wrap"><table class="tbl" id="attMatrixTable">
      <thead><tr><th style="min-width:170px">الطالب</th>
        ${mDays.map(d => `<th style="text-align:center;padding:6px 4px;min-width:34px" class="${d === today() ? 'nowrap' : ''}">${Number(d.slice(-2))}</th>`).join('')}
        <th>حضور</th><th>غياب</th><th>النسبة</th></tr></thead>
      <tbody>${matrixRows.map(r => {
        const counted = r.p + r.ab + r.l;
        const rate = counted ? Math.round(((r.p + r.l) / counted) * 100) : 0;
        return `<tr><td>${stuCell(r.s)}</td>
          ${mDays.map(d => {
            const rr = getAtt(d, gid); const v = rr && rr.records[r.s.id];
            const cls = v === 'present' ? 'present' : v === 'absent' ? 'absent' : v === 'late' ? 'late' : v === 'excused' ? 'excused' : '';
            const ch = v === 'present' ? '✓' : v === 'absent' ? '✕' : v === 'late' ? 'م' : v === 'excused' ? 'ع' : '';
            return `<td style="padding:3px 2px"><div class="cd ${cls}" data-cell="${r.s.id}:${d}" style="border-radius:7px;aspect-ratio:auto;height:26px">${ch}</div></td>`;
          }).join('')}
          <td class="num" style="color:var(--ok)">${r.p + r.l}</td>
          <td class="num" style="color:var(--bad)">${r.ab}</td>
          <td>${counted ? `<span class="badge ${rate >= 75 ? 'b-ok' : rate >= 50 ? 'b-warn' : 'b-bad'}">${rate}%</span>` : '<span class="muted small">—</span>'}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>
  <p class="small muted mt">ملاحظة: كشف الشهر يعرض نفس المجموعة المختارة. لتغيير مجموعة الكشف غيّر المجموعة بالأعلى.</p>`;
};

/* ============ EXAMS ============ */

      `<button class="btn pri" data-act="addExam">${icon('plus')} امتحان جديد</button>`) +
      `<div class="card"><div class="card-b">${emptyState('لا توجد امتحانات','أنشئ امتحانًا (اسم، تاريخ، الدرجة النهائية) وسجّل درجات المجموعة', `<button class="btn pri" data-act="addExam">${icon('plus')} إنشاء امتحان</button>`)}</div></div>`;
  }

  const maxG = sum(vals, v => v >= (sel.max * 0.5) ? 1 : 0);

  return pageHead('الامتحانات والدرجات', `${ex.length} امتحان مسجَّل`,

       <button class="btn pri" data-act="addExam">${icon('plus')} امتحان جديد</button>`) + `
  <div class="grid g-32">
    <div class="card">
      <div class="card-h"><h3>الامتحانات</h3><span class="sp"></span><span class="badge b-brand">${nf(ex.length)}</span></div>
      <div class="card-b" style="max-height:520px;overflow:auto">
        ${list.map(e => {
          const g = S.data.grades[e.id] || {};
          const nn = Object.keys(g).length;
          return `<div class="alert-row ${e.id === sel.id ? 'info' : ''}" style="cursor:pointer" data-act="selExam" data-id="${e.id}">
            <span class="ai">${icon('award')}</span>
            <span class="at"><b>${esc(e.name)}</b><span>${esc(groupName(e.groupId))} · ${fmtDate(e.date)} · النهائي ${e.max}</span></span>
            <span class="badge ${nn ? 'b-ok' : 'b-gray'}">${nn} درجة</span>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-h"><h3>${esc(sel.name)}</h3><span class="sub">${esc(groupName(sel.groupId))} · ${fmtDate(sel.date, true)}</span>
        <span class="sp"></span>
        <button class="btn sm ghost" data-act="editExam" data-id="${sel.id}">${icon('edit')} تعديل</button>
        <button class="btn sm ghost" data-act="delExam" data-id="${sel.id}">${icon('trash')}</button>
      </div>
      <div class="card-b">
        <div class="grid g-3" style="margin-bottom:14px">
          ${statCard({ label:'المتوسط', icon:'chart', value: avg ? avg.toFixed(1) : '—', unit: 'من ' + sel.max, tone:'info',
            foot:`<span class="muted">${nf(vals.length)} درجة مُدخلة</span>` })}
          ${statCard({ label:'أعلى درجة', icon:'star', value: vals.length ? nf(Math.max(...vals)) : '—', tone:'ok',
            foot:`<span class="muted">${sorted.length ? esc(sorted[0].name) : '—'}</span>` })}
          ${statCard({ label:'نسبة النجاح (50%+)', icon:'check-square', value: vals.length ? Math.round((maxG / vals.length) * 100) + '%' : '—',
            tone: vals.length && (maxG / vals.length) >= .7 ? 'ok' : 'bad', foot:`<span class="muted">${maxG} من ${vals.length}</span>` })}
        </div>
        ${ss.length ? `<div class="tbl-wrap" style="max-height:420px"><table class="tbl">
          <thead><tr><th>الطالب</th><th style="width:130px">الدرجة (من ${sel.max})</th><th>النسبة</th><th>التقدير</th></tr></thead>
          <tbody>${ss.map(s => {
            const v = grades[s.id];
            const pc = typeof v === 'number' ? Math.round((v / sel.max) * 100) : null;
            const gr = pc == null ? '' : pc >= 90 ? ['ممتاز','b-ok'] : pc >= 80 ? ['جيد جدًا','b-ok'] : pc >= 65 ? ['جيد','b-info'] : pc >= 50 ? ['مقبول','b-warn'] : ['ضعيف','b-bad'];
            return `<tr><td>${stuCell(s)}</td>
              <td><input class="inp" style="padding:6px 9px" type="number" min="0" max="${sel.max}" step="0.5" data-grade="${s.id}" value="${typeof v === 'number' ? v : ''}" placeholder="—"></td>
              <td>${pc == null ? '<span class="muted">—</span>' : bar(pc, pc >= 65 ? 'ok' : pc >= 50 ? '' : 'bad') + `<span class="small muted">${pc}%</span>`}</td>
              <td>${gr ? `<span class="badge ${gr[1]}">${gr[0]}</span>` : ''}</td></tr>`;
          }).join('')}</tbody></table></div>
          <div class="flex" style="margin-top:13px"><span class="muted small">الدرجات تُحفَظ تلقائيًا عند الخروج من الخانة</span>
            <span class="sp"></span><button class="btn pri" data-act="saveGrades" data-id="${sel.id}">${icon('save')} حفظ الدرجات</button></div>`
        : emptyState('لا يوجد طلبة في هذه المجموعة','')}
      </div>
    </div>
  </div>`;
};

/* ============ PAYMENTS ============ */
Views.payments = function(){
  const mk = monthKey(today());
  const pays = sortBy(S.data.payments, p => p.date + (p.createdAt || ''), 'desc');
  const thisMonth = pays.filter(p => monthKey(p.date) === mk);
  const activeS = activeStudents();
  const expected = sum(activeS.filter(s => s.sub.type === 'monthly'), s => Number(s.fee) || 0);
  const collected = sum(thisMonth, p => Number(p.amount) || 0);
  const debtors = sortBy(S.data.students.map(s => ({ s: s, fin: stuFinance(s) })).filter(x => x.fin.due > 0), x => x.fin.due, 'desc');
  const totalDue = sum(debtors, x => x.fin.due);
  const last6 = monthRange(monthKey(addMonths(mk + '-01', -5)), 6);
  const renewList = sortBy(S.data.students.map(s => ({ s: s, dl: daysLeft(s.sub.end) }))
    .filter(x => x.s.sub.type === 'monthly' && x.s.status !== 'stopped' && x.dl <= 30), x => x.dl);

  return pageHead('الاشتراكات والمدفوعات', `تحصيل ${monthName(mk)}: ${money(collected)} من ${money(expected)}`,
      `<button class="btn" data-act="expPayments">${icon('download')} CSV</button>

  <div class="grid g-4">
    ${statCard({ label:'تحصيل الشهر', icon:'wallet', value: money(collected), tone:'ok',
      foot:`${bar(pct(collected, expected), pct(collected, expected) >= 80 ? 'ok' : '')} <span class="muted">${pct(collected, expected)}% من ${money0(expected)}</span>` })}
    ${statCard({ label:'عدد الدفعات', icon:'receipt', value: nf(thisMonth.length), tone:'info', foot:`<span class="muted">متوسط الدفعة ${money(thisMonth.length ? collected / thisMonth.length : 0)}</span>` })}
    ${statCard({ label:'إجمالي المتأخرات', icon:'alert', value: money(totalDue), tone: totalDue ? 'bad' : 'ok',
      foot:`<span class="muted">${nf(debtors.length)} طالب متأخر</span>` })}
    ${statCard({ label:'اشتراكات للتجديد', icon:'clock', value: nf(renewList.filter(x => x.dl <= (S.data.settings.expiryWarnDays || 5)).length),

        <button class="btn sm" data-act="waAllDue">${icon('whatsapp')} تذكير الكل</button></div>
      <div class="card-b" style="max-height:340px;overflow:auto">
        ${renewList.length ? renewList.slice(0, 25).map(x => {
          const stt = stuStatus(x.s);
          return `<div class="alert-row ${x.dl < 0 ? 'bad' : x.dl <= 5 ? 'warn' : 'info'}">
            <span class="ai">${icon('clock')}</span>
            <span class="at"><b>${esc(x.s.name)}</b><span>${x.dl < 0 ? `منتهي منذ ${Math.abs(x.dl)} يوم (${fmtDate(x.s.sub.end)})` : `باقي ${x.dl} يوم — ينتهي ${fmtDate(x.s.sub.end)}`} · ${esc(groupName(x.s.groupId))}</span></span>
            <button class="btn sm pri" data-act="renew" data-id="${x.s.id}">تجديد</button>

      </div>

function reportHTML(){
  const r = S.ui.rep;
  const ss = reportRows();
  if (r.type === 'attendance'){
    const rows = ss.map(s => {
      const a = attStats(s.id, r.from, r.to);
      return [s.name, s.code, groupName(s.groupId), a.present, a.late, a.absent, a.excused, a.total, a.rate + '%'];
    });
    const tot = { p:0,l:0,ab:0,ex:0,t:0 };
    ss.forEach(s => { const a = attStats(s.id, r.from, r.to); tot.p+=a.present; tot.l+=a.late; tot.ab+=a.absent; tot.ex+=a.excused; tot.t+=a.total; });
    return cardReport('تقرير الحضور والغياب', `من ${fmtDate(r.from)} إلى ${fmtDate(r.to)}`,
      ['الطالب','الكود','المجموعة','حاضر','متأخر','غائب','بعذر','إجمالي','نسبة الحضور'],
      rows, ['', '', 'الإجمالي', tot.p, tot.l, tot.ab, tot.ex, tot.t, (tot.t ? Math.round(((tot.p + tot.l) / tot.t) * 100) : 0) + '%']);
  }
  if (r.type === 'students'){
    const rows = ss.map(s => { const fin = stuFinance(s); return [s.name, s.code, s.phone, s.parentPhone, groupName(s.groupId), s.level, stuStatus(s).label, fmtDate(s.joinDate), s.sub.type === 'monthly' ? fmtDate(s.sub.end) : 'باقة حصص', money0(fin.due)]; });
    return cardReport('بيانات الطلبة', `${ss.length} طالب`, ['الاسم','الكود','هاتف','هاتف ولي الأمر','المجموعة','المستوى','الحالة','تاريخ الانضمام','الاشتراك حتى','المتأخرات'], rows);
  }
  if (r.type === 'payments'){
    const pays = sortBy(S.data.payments.filter(p => (!r.from || p.date >= r.from) && (!r.to || p.date <= r.to) && (!r.groupId || (student(p.studentId) || {}).groupId === r.groupId)), p => p.date);
    const rows = pays.map(p => { const s = student(p.studentId) || {}; return [fmtDate(p.date), s.name || '—', groupName(s.groupId), p.period ? monthName(p.period) : '—', money0(p.amount), {cash:'نقدي',transfer:'تحويل',wallet:'محفظة'}[p.method] || 'نقدي']; });
    const total = sum(pays, p => Number(p.amount) || 0);
    return cardReport('تقرير التحصيل المالي', `من ${fmtDate(r.from)} إلى ${fmtDate(r.to)}`, ['التاريخ','الطالب','المجموعة','عن شهر','المبلغ','طريقة الدفع'], rows, ['','','','الإجمالي', money0(total), '']);
  }
  if (r.type === 'dues'){
    const rows = ss.map(s => ({ s: s, fin: stuFinance(s) })).filter(x => x.fin.due > 0)
      .map(x => [x.s.name, x.s.phone, x.s.parentPhone, groupName(x.s.groupId), x.fin.dueMonths.map(m => monthName(m)).join(' · '), money0(x.fin.due)]);
    const total = sum(rows, x => Number(String(x[5]).replace(/[^\d.]/g, '')) || 0);
    return cardReport('تقرير المتأخرات', `${rows.length} طالب`, ['الطالب','هاتف','هاتف ولي الأمر','المجموعة','الشهور المتأخرة','المبلغ المستحق'], rows, ['','','','','الإجمالي', money0(total)]);
  }
  if (r.type === 'exams'){
    const e = examOf(S.ui.rep.examId) || S.data.exams[0];
    if (!e) return `<div class="card"><div class="card-b">${emptyState('لا توجد امتحانات','أضف امتحانًا من صفحة الامتحانات')}</div></div>`;
    const g = S.data.grades[e.id] || {};
    let sts = (e.groupId ? studentsOf(e.groupId) : S.data.students).filter(s => typeof g[s.id] === 'number');
    sts = sortBy(sts, s => g[s.id], 'desc');
    let rank = 0, prev = null;
    const rows = sts.map((s, i) => { if (prev !== null && g[s.id] !== prev) rank = i; if (prev === null) rank = 0; prev = g[s.id];
      return [String(rank + 1), s.name, groupName(s.groupId), g[s.id], e.max, Math.round((g[s.id] / e.max) * 100) + '%']; });
    return cardReport('نتائج امتحان: ' + e.name, `${fmtDate(e.date, true)} · ${groupName(e.groupId)} · الدرجة النهائية ${e.max}`, ['ترتيب','الطالب','المجموعة','الدرجة','من','النسبة'], rows);
  }
  // summary
  const act = ss.filter(s => s.status === 'active');
  const attR = ss.map(s => attStats(s.id, r.from, r.to)).reduce((t, a) => ({ t: t.t + a.total, ok: t.ok + a.present + a.late }), { t:0, ok:0 });
  const income = sum(S.data.payments.filter(p => (!r.from || p.date >= r.from) && (!r.to || p.date <= r.to)), p => Number(p.amount) || 0);
  const due = sum(ss, s => stuFinance(s).due);
  const rows = [
    ['عدد الطلبة المسجلين', nf(ss.length)],
    ['الطلبة النشطين', nf(act.length)],
    ['الطلبة الموقوفين', nf(ss.length - act.length)],
    ['عدد المجموعات', nf(S.data.groups.filter(g => !r.groupId || g.id === r.groupId).length)],
    ['نسبة الحضور بالفترة', (attR.t ? Math.round((attR.ok / attR.t) * 100) : 0) + '%'],
    ['عدد تسجيلات الحضور', nf(attR.t)],
    ['إجمالي التحصيل بالفترة', money(income)],
    ['إجمالي المتأخرات', money(due)],
    ['عدد الامتحانات', nf(S.data.exams.length)],
    ['متوسط الدرجات العام', (() => { const v = ss.map(s => examAvg(s.id)).filter(x => x != null); return v.length ? Math.round(sum(v) / v.length) + '%' : '—'; })()]
  ];
  return cardReport('ملخص المركز', `من ${fmtDate(r.from)} إلى ${fmtDate(r.to)}`, ['البند','القيمة'], rows);
}
function cardReport(title, sub, headers, rows, totalRow){
  return `<div class="card">
    <div class="card-h"><h3>${esc(title)}</h3><span class="sub">${esc(sub)}</span>
      <span class="sp"></span><span class="badge b-brand">${nf(rows.length)} سجل</span></div>
    ${rows.length ? `<div class="tbl-wrap" style="max-height:600px"><table class="tbl"><thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((r2, i) => `<tr>${r2.map((c, j) => `<td class="${[3,4,5,6,7,8].includes(j) ? 'num' : ''}"${j === 0 && headers[0] === 'البند' ? ' style="font-weight:700"' : ''}>${esc(c)}</td>`).join('')}</tr>`).join('')}
      ${totalRow ? `<tr>${totalRow.map(c => `<td style="font-weight:800;background:var(--warn-bg)">${esc(c)}</td>`).join('')}</tr>` : ''}
      </tbody></table></div>`
    : `<div class="card-b">${emptyState('لا توجد بيانات مطابقة','غيّر الفترة أو المجموعة ثم أعد التشغيل')}</div>`}
  </div>`;
}

  const re = ae && typeof ae.selectionEnd === 'number' ? ae.selectionEnd : null;

  const v = Views[S.view] ? S.view : 'dashboard';
  const t = TITLES[v] || TITLES.dashboard;
  $('#pageTitle').textContent = t[0];
  $('#pageSub').textContent = t[1];
  $('#content').innerHTML = Views[v]();

  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.view === v));

  pill.textContent = al; pill.classList.toggle('hide', !al);

  paintCloud();

  if (rid){
    const el = document.getElementById(rid);
    if (el){ try{ el.focus(); if (rs != null && el.setSelectionRange) el.setSelectionRange(rs, re); }catch(e){} }
  }
}
function go(view, extra){

function confirmDialog(title, msg, okLabel, cb, danger){

        const data = {
          name: name, code: $('#fCode', body).value.trim(), phone: $('#fPhone', body).value.trim(),
          parentPhone: $('#fPPhone', body).value.trim(), guardian: $('#fGuardian', body).value.trim(),
          groupId: $('#fGroup', body).value, level: $('#fLevel', body).value, status: $('#fStatus', body).value,
          joinDate: $('#fJoin', body).value || today(), fee: Number($('#fFee', body).value) || 0,
          notes: $('#fNotes', body).value.trim(),
          sub: {
            type: type,
            start: type === 'monthly' ? ($('#fStart', body).value || today()) : ($('#fStart2', body).value || today()),
            end: type === 'monthly' ? ($('#fEnd', body).value || addMonths(today(), 1)) : '',
            total: type === 'sessions' ? (Number($('#fTotal', body).value) || 0) : 0,
            used: type === 'sessions' ? (Number($('#fUsed', body).value) || 0) : 0
          }

          toast('تمت إضافة ' + name, 'ok');

      </div>
