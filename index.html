        <div class="field"><label>طريقة الدفع</label><select class="inp" id="rMethod">
          <option value="cash">نقدي</option><option value="transfer">تحويل بنكي</option><option value="wallet">محفظة</option></select></div>
      </div>
      <div class="field"><label>عدد حصص الباقة (للاشتراك بالحصص)</label><input class="inp" type="number" id="rSessions" value="${s.sub.total || 12}"></div>
      <label class="switch" style="margin-top:6px">
        <input type="checkbox" id="rPay" checked><span class="track"></span>
        <span class="lb">تسجيل دفعة بالمبلغ<span id="rTotal">—</span></span>
      </label>`,
    footer: `<button class="btn" data-close="__ID__">إلغاء</button><button class="btn pri" id="doRenew">${icon('refresh')} تجديد</button>`,
    onMount(body, ov){
      ov.querySelectorAll('[data-close]').forEach(b => b.setAttribute('data-close', ov.dataset.mid));
      const calc = () => {
        const m = Number($('#rMonths', body).value) || 1;
        const f = Number($('#rFee', body).value) || 0;
        const start = $('#rStart', body).value || today();
        $('#rTotal', body).textContent = ` (${money(f * m)}) — الشهور: ${monthSeq(monthKey(start), monthKey(addMonths(start, m - 1))).map(x => monthName(x)).join(' ، ')}`;
      };
      ['rMonths','rFee','rStart'].forEach(x => $('#' + x, body).oninput = calc);
      calc();
      $('#doRenew', body).onclick = () => {
        const m = Number($('#rMonths', body).value) || 1;
        const fee = Number($('#rFee', body).value) || 0;
        const start = $('#rStart', body).value || today();
        const isSess = s.sub.type === 'sessions';
        if (isSess){
          s.sub.total = (s.sub.total || 0) + (Number($('#rSessions', body).value) || 0);
          s.sub.start = s.sub.start || start;
        }else{
          s.sub.type = 'monthly';
          s.sub.start = s.sub.start || start;
          s.sub.end = addMonths(start, m);
          s.fee = fee;
        }
        if (s.status === 'stopped' || s.status === 'paused') s.status = 'active';
        if ($('#rPay', body).checked && fee > 0){
          if (isSess){
            S.data.payments.push({ id: uid('p'), studentId: s.id, amount: fee * m, date: today(), period: '', method: $('#rMethod', body).value, note: 'تجديد باقة حصص (' + $('#rSessions', body).value + ' حصة)', createdAt: new Date().toISOString() });
          }else{
            monthSeq(monthKey(start), monthKey(addMonths(start, m - 1))).forEach(k => {
              S.data.payments.push({ id: uid('p'), studentId: s.id, amount: fee, date: today(), period: k, method: $('#rMethod', body).value, note: 'تجديد اشتراك', createdAt: new Date().toISOString() });
            });
          }
        }
        Modal.closeAll(); commit();
        toast('تم تجديد اشتراك ' + s.name + (isSess ? '' : ' حتى ' + fmtDate(s.sub.end)), 'ok');
      };
    }
  });
}

/* ---------------- Student profile ---------------- */
function openProfile(id){
  const s = student(id); if (!s) return;
  const fin = stuFinance(s), stt = stuStatus(s);
  const a30 = attStats(s.id, addDays(today(), -30), today());
  const aAll = attStats(s.id);
  const pays = sortBy(S.data.payments.filter(p => p.studentId === id), p => p.date, 'desc');
  const avg = examAvg(id);
  const ss = groupOf(s.groupId);
  // attendance calendar of current month
  const mk = monthKey(today());
  const y = Number(mk.slice(0,4)), m = Number(mk.slice(5,7));
  const first = new Date(y, m - 1, 1).getDay();
  const last = new Date(y, m, 0).getDate();
  let cal = '';
  for (let i = 0; i < first; i++) cal += '<div class="cd" style="background:transparent"></div>';
  for (let d = 1; d <= last; d++){
    const ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const r = getAtt(ds, s.groupId);
    const v = r && r.records[s.id];
    cal += `<div class="cd ${v || ''}" title="${fmtDate(ds)}">${d}</div>`;
  }
  Modal.open({
    title: s.name, sub: `${s.code || ''} · ${groupName(s.groupId)} · ${s.level || 'بدون مستوى'}`, size: 'lg',
    body: `

/* ---------------- Reports: print & export ---------------- */
function reportTitle(){
  const r = S.ui.rep, map = { attendance:'تقرير الحضور والغياب', students:'بيانات الطلبة', payments:'تقرير التحصيل المالي', dues:'تقرير المتأخرات', exams:'نتائج الامتحانات', summary:'ملخص المركز' };
  return map[r.type] || 'تقرير';
}
function reportCSV(){
  const r = S.ui.rep, ss = reportRows();
  if (r.type === 'attendance')
    return { name:'attendance-report', headers:['الطالب','الكود','المجموعة','حاضر','متأخر','غائب','بعذر','إجمالي','النسبة'],
      rows: ss.map(s => { const a = attStats(s.id, r.from, r.to); return [s.name, s.code, groupName(s.groupId), a.present, a.late, a.absent, a.excused, a.total, a.rate + '%']; }) };
  if (r.type === 'students')
    return { name:'students', headers:['الاسم','الكود','هاتف','هاتف ولي الأمر','المجموعة','المستوى','الحالة','الانضمام','الاشتراك حتى','المتأخرات'],
      rows: ss.map(s => { const f = stuFinance(s); return [s.name, s.code, s.phone, s.parentPhone, groupName(s.groupId), s.level, stuStatus(s).label, s.joinDate, s.sub.end, f.due]; }) };
  if (r.type === 'payments')
    return { name:'payments', headers:['التاريخ','الطالب','المجموعة','عن شهر','المبلغ','الطريقة'],
      rows: S.data.payments.filter(p => (!r.from || p.date >= r.from) && (!r.to || p.date <= r.to)).map(p => { const s = student(p.studentId) || {}; return [p.date, s.name || '', groupName(s.groupId), p.period, p.amount, p.method]; }) };
  if (r.type === 'dues')
    return { name:'dues', headers:['الطالب','هاتف','المجموعة','الشهور','المستحق'],
      rows: ss.filter(s => stuFinance(s).due > 0).map(s => { const f = stuFinance(s); return [s.name, s.phone, groupName(s.groupId), f.dueMonths.join(' | '), f.due]; }) };
  if (r.type === 'exams'){
    const e = examOf(S.ui.rep.examId) || S.data.exams[0];
    if (!e) return { name:'exam', headers:['—'], rows: [] };
    const g = S.data.grades[e.id] || {};
    return { name:'exam-' + e.name, headers:['الطالب','المجموعة','الدرجة','من','النسبة'],
      rows: ss.filter(s => typeof g[s.id] === 'number').map(s => [s.name, groupName(s.groupId), g[s.id], e.max, Math.round((g[s.id] / e.max) * 100) + '%']) };
  }
  return { name:'summary', headers:['البند','القيمة'], rows: [] };
}
function tableToPrint(headers, rows, title, sub){
  return `<div class="sum">${sub || ''}</div>
    <table><thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function printReport(){
  const r = S.ui.rep, ss = reportRows();
  let headers = [], rows = [], sub = '';
  if (r.type === 'attendance'){
    headers = ['الطالب','المجموعة','حاضر','متأخر','غائب','بعذر','النسبة'];
    rows = ss.map(s => { const a = attStats(s.id, r.from, r.to); return [s.name, groupName(s.groupId), a.present, a.late, a.absent, a.excused, a.rate + '%']; });
    sub = `<div>الفترة: <b>${fmtDate(r.from)} — ${fmtDate(r.to)}</b></div><div>عدد الطلبة: <b>${ss.length}</b></div>`;
  }else if (r.type === 'dues'){
    headers = ['الطالب','هاتف','المجموعة','الشهور المتأخرة','المستحق'];
    rows = ss.filter(s => stuFinance(s).due > 0).map(s => { const f = stuFinance(s); return [s.name, s.phone, groupName(s.groupId), f.dueMonths.map(m => monthName(m)).join(' · '), money0(f.due)]; });
    sub = `<div>إجمالي المتأخرات: <b>${money(sum(rows, x => Number(String(x[4]).replace(/\D/g,'')) || 0))}</b></div>`;
  }else if (r.type === 'payments'){
    headers = ['التاريخ','الطالب','عن شهر','المبلغ','الطريقة'];
    rows = sortBy(S.data.payments.filter(p => (!r.from || p.date >= r.from) && (!r.to || p.date <= r.to)), p => p.date).map(p => { const s = student(p.studentId) || {}; return [fmtDate(p.date), s.name || '', p.period ? monthName(p.period) : '—', money0(p.amount), p.method]; });
    sub = `<div>إجمالي التحصيل: <b>${money(sum(rows, x => Number(String(x[3]).replace(/\D/g,'')) || 0))}</b></div><div>عدد الدفعات: <b>${rows.length}</b></div>`;
  }else if (r.type === 'exams'){
    const e = examOf(S.ui.rep.examId) || S.data.exams[0];
    if (!e){ toast('لا توجد امتحانات', 'warn'); return; }
    const g = S.data.grades[e.id] || {};
    headers = ['الطالب','المجموعة','الدرجة','من','النسبة'];
    rows = ss.filter(s => typeof g[s.id] === 'number').map(s => [s.name, groupName(s.groupId), g[s.id], e.max, Math.round((g[s.id] / e.max) * 100) + '%']);
    sub = `<div>${esc(e.name)} — ${fmtDate(e.date)}</div>`;
  }else if (r.type === 'students'){
    headers = ['الاسم','هاتف','المجموعة','المستوى','الحالة','الاشتراك حتى'];
    rows = ss.map(s => [s.name, s.phone || s.parentPhone, groupName(s.groupId), s.level, stuStatus(s).label, s.sub.end ? fmtDate(s.sub.end) : '—']);
    sub = `<div>عدد الطلبة: <b>${ss.length}</b></div>`;
  }else{
    headers = ['البند','القيمة'];
    const act = ss.filter(s => s.status === 'active');
    rows = [['عدد الطلبة', ss.length], ['الطلبة النشطين', act.length], ['عدد المجموعات', S.data.groups.length],
      ['إجمالي المتأخرات', money(sum(ss, s => stuFinance(s).due))],
      ['تحصيل الشهر', money(sum(S.data.payments.filter(p => monthKey(p.date) === monthKey(today())), p => p.amount))]];
  }
  printHTML(reportTitle(), tableToPrint(headers, rows, reportTitle(), sub));
}

/* ---------------- Seed demo data ---------------- */
function seedDemo(){
  const names = ['محمد أحمد فتحي','يوسف خالد','عمر مصطفى','آدم طارق','زياد حسام','مالك إبراهيم','علي محمود','حسن سامي','كريم وليد','سيف الدين',
    'ملك أشرف','جنى عمرو','مريم شريف','حبيبة رامي','سلمى نادر','نور الهدى','رقية أيمن','فريدة مازن','هنا خالد','ريم عصام',
    'أحمد ياسر','مروان عادل','لؤي هشام','تميم فؤاد'];
  const gs = [
    { name:'المستوى الأول — سبت وثلاثاء', level:'مبتدئ', days:[6,2], time:'4:00 م', price:450, note:'' },
    { name:'المستوى الثاني — أحد وأربعاء', level:'متوسط', days:[0,3], time:'5:30 م', price:550, note:'' },
    { name:'المستوى الثالث — اثنين وخميس', level:'متقدم', days:[1,4], time:'7:00 م', price:650, note:'مراجعة أسبوعية' },
    { name:'مجموعة البنات — جمعة', level:'مبتدئ', days:[5], time:'11:00 ص', price:500, note:'' }
  ];
  const data = defaultData();
  const gids = gs.map(g => { const id = uid('g'); data.groups.push(Object.assign({ id: id }, g)); return id; });
  names.forEach((n, i) => {
    const gi = i % gids.length;
    const start = addMonths(today(), -2 + (i % 3));
    const type = i % 7 === 0 ? 'sessions' : 'monthly';
    data.students.push({
      id: uid('s'), code: 'S' + String(i + 1).padStart(3, '0'), name: n,
      phone: '010' + String(10000000 + i * 137911).slice(0, 8),
      parentPhone: '011' + String(20000000 + i * 271911).slice(0, 8), guardian: 'والد ' + n.split(' ')[0],
      groupId: gids[gi], level: gs[gi].level, status: i % 13 === 12 ? 'paused' : 'active',
      joinDate: start, notes: i % 5 === 0 ? 'طالب متميز في الحساب الذهني' : '',
      fee: gs[gi].price,
      sub: type === 'sessions'
        ? { type:'sessions', start: start, end:'', total: 12, used: 0 }
        : { type:'monthly', start: start, end: addMonths(today(), i % 4 === 3 ? -1 : (i % 3) + 1), total: 0, used: 0 }
    });
  });
  // attendance last 45 days on group days
  for (let d = 45; d >= 0; d--){
    const date = addDays(today(), -d);
    const dow = parseISO(date).getDay();
    data.groups.forEach(g => {
      if (!g.days.includes(dow)) return;
      const ss = data.students.filter(s => s.groupId === g.id);
      if (!ss.length) return;
      const records = {};
      ss.forEach(s => {
        const r = Math.random();
        records[s.id] = r < 0.76 ? 'present' : r < 0.85 ? 'late' : r < 0.94 ? 'absent' : 'excused';
      });
      data.attendance[date + '@' + g.id] = { groupId: g.id, note:'', records: records, rev: 1, savedAt: new Date().toISOString() };
    });
  }
  // payments for last 3 months
  data.students.forEach(s => {
    const months = monthRange(monthKey(addMonths(today(), -2)), 3);
    months.forEach((m, i) => {
      if (Math.random() < (i === 2 ? 0.55 : 0.9)){
        data.payments.push({ id: uid('p'), studentId: s.id, amount: s.fee, date: m + '-0' + (3 + i),
          period: m, method: ['cash','transfer','wallet'][Math.floor(Math.random() * 3)], note:'', createdAt: new Date().toISOString() });
      }
    });
  });
  // exams
  [['امتحان الشهر الأول', -35, 20], ['امتحان نصف المستوى', -18, 30], ['امتحان الشهر الثاني', -4, 20]].forEach((e, i) => {
    const g = data.groups[i % data.groups.length];
    const ex = { id: uid('e'), name: e[0], groupId: g.id, date: addDays(today(), e[1]), max: e[2], createdAt: new Date().toISOString() };
    data.exams.push(ex); data.grades[ex.id] = {};
    data.students.filter(s => s.groupId === g.id).forEach(s => { data.grades[ex.id][s.id] = Math.round(e[2] * (0.4 + Math.random() * 0.6) * 2) / 2; });
  });
  S.data = migrate(data);
  commit();
  toast('تم تحميل بيانات تجريبية (24 طالب · 4 مجموعات)', 'ok');
}

function importJSON(file){
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      if (!d || (!d.students && !d.groups)) throw new Error('ملف غير صالح');
      S.data = migrate(d);
      dirty.main = true;
      Object.keys(S.data.attendance || {}).forEach(k => { dirty.months[k.split('@')[0].slice(0,7)] = true; });
      commit();
      toast('تم استيراد البيانات: ' + (S.data.students.length) + ' طالب', 'ok');
    }catch(e){ toast('فشل الاستيراد: ' + e.message, 'bad'); }
  };
  rd.readAsText(file);
}

/* ---------------- Global click delegation ---------------- */
document.addEventListener('click', function(e){
  const closeBtn = e.target.closest('[data-close]');
  if (closeBtn){ Modal.close(closeBtn.getAttribute('data-close')); return; }

  const nav = e.target.closest('#nav a[data-view]');
  if (nav){ go(nav.dataset.view); return; }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  const A = el.dataset; // shortcut

  switch (act){
    /* ---- navigation ---- */
    case 'go': go(id, { groupId: A.group }); break;
    case 'clearFilters': S.ui.stuFilter = { groupId:'', level:'', status:'', sort:'name' }; S.query = ''; $('#globalSearch').value = ''; render(); break;
    case 'filterGroup': S.ui.stuFilter.groupId = id; S.view = 'students'; render(); break;

    /* ---- students ---- */
    case 'addStudent': openStudentForm(); break;
    case 'editStudent': Modal.closeAll(); setTimeout(() => openStudentForm(id), 120); break;
    case 'profile': Modal.closeAll(); setTimeout(() => openProfile(id), 120); break;
    case 'delStudent': {
      const s = student(id); if (!s) break;
      confirmDialog('حذف الطالب', `هل أنت متأكد من حذف «${s.name}»؟ سيتم حذف درجاته ومدفوعاته وسجل حضوره. لا يمكن التراجع.`, 'حذف نهائيًا', () => {
        S.data.students = S.data.students.filter(x => x.id !== id);
        S.data.payments = S.data.payments.filter(p => p.studentId !== id);
        Object.keys(S.data.attendance).forEach(k => { delete S.data.attendance[k].records[id];
          if (!Object.keys(S.data.attendance[k].records).length){ delete S.data.attendance[k]; dirty.months[k.split('@')[0].slice(0,7)] = true; } });
        Object.keys(S.data.grades).forEach(eid => { delete S.data.grades[eid][id]; });
        commit(); toast('تم حذف الطالب', 'ok');
      }, true);
      break;
    }
    case 'printStudents': {
      printHTML('بيانات الطلبة', tableToPrint(['الاسم','الهاتف','المجموعة','المستوى','الحالة','الاشتراك حتى','المتأخرات'],
        S.data.students.map(s => { const f = stuFinance(s); return [s.name, s.phone || s.parentPhone || '—', groupName(s.groupId), s.level || '—', stuStatus(s).label, s.sub.end ? fmtDate(s.sub.end) : '—', f.due ? money0(f.due) : '—']; }),
        'بيانات الطلبة', `<div>عدد الطلبة: <b>${S.data.students.length}</b></div>`));
      break;
    }
    case 'expStudents': exportCSV('students-' + today(), ['الاسم','الكود','هاتف','ولي الأمر','المجموعة','المستوى','الحالة','الانضمام','نهاية الاشتراك','المتأخرات'],
      S.data.students.map(s => { const f = stuFinance(s); return [s.name, s.code, s.phone, s.parentPhone, groupName(s.groupId), s.level, stuStatus(s).label, s.joinDate, s.sub.end, f.due]; })); break;

    /* ---- groups ---- */
    case 'addGroup': openGroupForm(); break;
    case 'editGroup': Modal.closeAll(); setTimeout(() => openGroupForm(id), 120); break;
    case 'delGroup': {
      const g = groupOf(id); if (!g) break;
      const n = studentsOf(id).length;
      confirmDialog('حذف المجموعة', n ? `المجموعة «${g.name}» بها ${n} طالب — سيتم نقلهم إلى «بدون مجموعة». متابعة؟` : `حذف المجموعة «${g.name}»؟`, 'حذف', () => {
        S.data.students.forEach(s => { if (s.groupId === id) s.groupId = ''; });
        S.data.groups = S.data.groups.filter(x => x.id !== id);
        commit(); toast('تم حذف المجموعة', 'ok');
      }, true);
      break;
    }

    /* ---- attendance ---- */
    case 'mark': {
      if (!attDraft) break;
      attDraft.records[id] = A.v; attDraft.dirty = true;
      const row = el.closest('.att-row');
      $$('.seg button', row).forEach(b => b.classList.toggle('on', b.dataset.v === A.v));
      const cell = document.querySelector(`#attMatrixTable [data-cell="${id}:${attDraft.date}"]`);
      if (cell){ cell.className = 'cd ' + (A.v || ''); cell.textContent = A.v === 'present' ? '✓' : A.v === 'absent' ? '✕' : A.v === 'late' ? 'م' : A.v === 'excused' ? 'ع' : ''; }
      refreshAttCounts();
      break;
    }
    case 'attAll': {
      if (!attDraft) break;
      studentsOf(attDraft.groupId).filter(s => s.status !== 'stopped').forEach(s => { attDraft.records[s.id] = 'present'; });
      attDraft.dirty = true; render(); break;
    }
    case 'attClear': {
      if (!attDraft) break;
      confirmDialog('تفريغ الحضور', 'سيتم تفريغ تسجيل الحضور لهذا اليوم من الشاشة (لم يتم الحفظ بعد). متابعة؟', 'تفريغ', () => {
        attDraft.records = {}; attDraft.dirty = true; render();
      });
      break;
    }
    case 'attSave': {
      if (!attDraft) break;
      const gid = attDraft.groupId, date = attDraft.date;
      const noteEl = $('#attNote'); if (noteEl) attDraft.note = noteEl.value;
      if (!Object.keys(attDraft.records).length){ toast('سجّل حضور طالب واحد على الأقل', 'warn'); return; }
      setAtt(date, gid, attDraft.records, attDraft.note);
      attDraft.dirty = false;
      commit();
      const absent = Object.keys(attDraft.records).filter(k => attDraft.records[k] === 'absent').map(k => student(k)).filter(Boolean);
      toast('تم حفظ حضور ' + groupName(gid) + ' — ' + fmtDate(date), 'ok');
      if (absent.length){
        waListModal('غياب اليوم — إرسال تنبيه لأولياء الأمور',
          absent.map(s => ({ name: s.name, sub: 'غائب اليوم ' + fmtDate(date), phone: s.parentPhone || s.phone, tone: 'bad', icon: 'alert',
            msg: `السلام عليكم ${s.guardian || ''}، نود إبلاغكم بغياب ${s.name} عن حصة اليوم ${fmtDate(date)}. برجاء التواصل معنا. — ${S.data.settings.centerName || 'أكاديمية أحمد فتحي'}` })));
      }
      break;
    }
    case 'attMatrixPrint': {
      const gid = S.ui.att.groupId || (S.data.groups[0] || {}).id;
      const date = S.ui.att.date;
      const y = Number(date.slice(0,4)), m = Number(date.slice(5,7));
      const last = new Date(y, m, 0).getDate();
      const days = []; for (let d = 1; d <= last; d++) days.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
      const ss = studentsOf(gid);
      printHTML('كشف حضور ' + monthName(date.slice(0,7)),
        tableToPrint(['الطالب'].concat(days.map(d => String(Number(d.slice(-2))))).concat(['حضور','غياب','النسبة']),
          ss.map(s => {
            let p = 0, ab = 0, l = 0, ex = 0;
            const cells = days.map(d => { const r = getAtt(d, gid); const v = r && r.records[s.id];
              if (v === 'present'){ p++; return '✓'; } if (v === 'absent'){ ab++; return '✕'; } if (v === 'late'){ l++; return 'م'; } if (v === 'excused'){ ex++; return 'ع'; } return ''; });
            const counted = p + ab + l;
            return [s.name].concat(cells).concat([p + l, ab, (counted ? Math.round(((p + l) / counted) * 100) : 0) + '%']);
          }), 'كشف حضور ' + monthName(date.slice(0,7)),
          `<div>المجموعة: <b>${esc(groupName(gid))}</b></div><div>عدد الطلبة: <b>${ss.length}</b></div>`));
      break;
    }

    /* ---- exams ---- */
    case 'addExam': openExamForm(); break;
    case 'editExam': Modal.closeAll(); setTimeout(() => openExamForm(id), 120); break;
    case 'selExam': S.ui.exam.id = id; render(); break;
    case 'delExam': {
      const e2 = examOf(id); if (!e2) break;
      confirmDialog('حذف الامتحان', `حذف «${e2.name}» وكل درجاته؟`, 'حذف', () => {
        S.data.exams = S.data.exams.filter(x => x.id !== id); delete S.data.grades[id];
        commit(); toast('تم حذف الامتحان', 'ok');
      }, true);
      break;
    }
    case 'saveGrades': {
      const e2 = examOf(id); if (!e2) break;
      let n = 0;
      $$('[data-grade]').forEach(inp => {
        const v = inp.value.trim();
        S.data.grades[e2.id] = S.data.grades[e2.id] || {};
        if (v === ''){ delete S.data.grades[e2.id][inp.dataset.grade]; }
        else { S.data.grades[e2.id][inp.dataset.grade] = clamp(Number(v) || 0, 0, e2.max); n++; }
      });
      commit(); toast('تم حفظ ' + n + ' درجة', 'ok');
      break;
    }
    case 'expExam': {
      const e2 = examOf(id); if (!e2) break;
      const g = S.data.grades[e2.id] || {};
      exportCSV('exam-' + e2.name, ['الطالب','الكود','المجموعة','الدرجة','من','النسبة'],
        sortBy((e2.groupId ? studentsOf(e2.groupId) : S.data.students).filter(s => typeof g[s.id] === 'number'), s => g[s.id], 'desc')
          .map(s => [s.name, s.code, groupName(s.groupId), g[s.id], e2.max, Math.round((g[s.id] / e2.max) * 100) + '%']));
      break;
    }
    case 'printExam': {
      const e2 = examOf(id); if (!e2) break;
      const g = S.data.grades[e2.id] || {};
      const sts = sortBy((e2.groupId ? studentsOf(e2.groupId) : S.data.students).filter(s => typeof g[s.id] === 'number'), s => g[s.id], 'desc');
      printHTML('نتائج ' + e2.name, tableToPrint(['الترتيب','الطالب','المجموعة','الدرجة','من','النسبة'],
        sts.map((s, i) => [i + 1, s.name, groupName(s.groupId), g[s.id], e2.max, Math.round((g[s.id] / e2.max) * 100) + '%']),
        'نتائج ' + e2.name, `<div>التاريخ: <b>${fmtDate(e2.date)}</b></div><div>الدرجة النهائية: <b>${e2.max}</b></div><div>عدد الطلبة: <b>${sts.length}</b></div>`));
      break;
    }

    /* ---- payments ---- */
    case 'addPayment': Modal.closeAll(); setTimeout(() => openPaymentForm(id), 120); break;
    case 'receipt': openReceipt(id); break;
    case 'renew': Modal.closeAll(); setTimeout(() => openRenew(id), 120); break;
    case 'delPayment': {
      const p = S.data.payments.find(x => x.id === id); if (!p) break;
      confirmDialog('حذف الدفعة', `حذف دفعة بقيمة ${money(p.amount)}؟`, 'حذف', () => {
        S.data.payments = S.data.payments.filter(x => x.id !== id);
        Modal.closeAll(); commit(); toast('تم حذف الدفعة', 'ok');
      }, true);
      break;
    }
    case 'printPayments': {
      printHTML('كشف التحصيل', tableToPrint(['التاريخ','الطالب','المجموعة','عن شهر','المبلغ','الطريقة'],
        sortBy(S.data.payments, p => p.date, 'desc').map(p => { const s = student(p.studentId) || {}; return [fmtDate(p.date), s.name || '—', groupName(s.groupId), p.period ? monthName(p.period) : '—', money0(p.amount), {cash:'نقدي',transfer:'تحويل',wallet:'محفظة'}[p.method] || 'نقدي']; }),
        'كشف التحصيل', `<div>إجمالي التحصيل: <b>${money(sum(S.data.payments, p => Number(p.amount) || 0))}</b></div><div>تحصيل الشهر: <b>${money(sum(S.data.payments.filter(p => monthKey(p.date) === monthKey(today())), p => Number(p.amount) || 0))}</b></div>`));
      break;
    }
    case 'expPayments': exportCSV('payments-' + today(), ['التاريخ','الطالب','المجموعة','عن شهر','المبلغ','طريقة الدفع'],
      sortBy(S.data.payments, p => p.date, 'desc').map(p => { const s = student(p.studentId) || {}; return [p.date, s.name || '', groupName(s.groupId), p.period || '', p.amount, p.method]; })); break;
    case 'waAllDue': {
      const list = S.data.students.map(s => ({ s: s, fin: stuFinance(s), stt: stuStatus(s) }))
        .filter(x => x.fin.due > 0 || x.stt.key === 'expired' || x.stt.key === 'soon')
        .map(x => ({ name: x.s.name, tone: x.fin.due > 0 ? 'bad' : 'warn', icon: x.fin.due > 0 ? 'wallet' : 'clock',
          phone: x.s.parentPhone || x.s.phone,
          sub: (x.fin.due > 0 ? 'متأخرات ' + money(x.fin.due) : '') + (x.stt.key === 'expired' ? ' · الاشتراك منتهي' : x.stt.key === 'soon' ? ' · ينتهي ' + fmtDate(x.s.sub.end) : ''),
          msg: `السلام عليكم ${x.s.guardian || ''}، تذكير بخصوص اشتراك ${x.s.name}${x.fin.due > 0 ? ` — يوجد متأخرات بقيمة ${money(x.fin.due)}` : ''}${x.stt.key !== 'ok' && x.stt.key !== 'due' ? ` (ينتهي ${fmtDate(x.s.sub.end)})` : ''}. برجاء التواصل للتجديد. شكرًا — ${S.data.settings.centerName || 'أكاديمية أحمد فتحي'}` }));
      waListModal('تذكير الاشتراكات والمتأخرات', list);
      break;
    }

    /* ---- reports ---- */
    case 'repType': S.ui.rep.type = id; render(); break;
    case 'runReport': render(); toast('تم تحديث التقرير', 'info'); break;
    case 'expReport': { const r = reportCSV(); exportCSV(r.name + '-' + today(), r.headers, r.rows); break; }
    case 'printReport': printReport(); break;
    case 'printProfile': printProfile(id); break;

    /* ---- settings ---- */
    case 'saveSettings': {
      const st = S.data.settings;
      $$('[data-set]').forEach(inp => {
        const k = inp.dataset.set;
        if (k === 'levels') st.levels = inp.value.split(/[,،]/).map(x => x.trim()).filter(Boolean);
        else if (['sessionPrice','monthlyPrice','expiryWarnDays','absentWarn'].includes(k)) st[k] = Number(inp.value) || 0;
        else st[k] = inp.value;
      });
      commit(); toast('تم حفظ الإعدادات', 'ok');
      break;
    }
    case 'fbConnect': {
      const cfg = {};
      $$('[data-fb]').forEach(inp => { if (inp.value.trim()) cfg[inp.dataset.fb] = inp.value.trim(); });
      if (!cfg.code) cfg.code = (Cloud.readCfg() || {}).code || '';
      if (!cfg.apiKey || !cfg.projectId || !cfg.code){ toast('اكتب API Key و Project ID وكود المركز', 'warn'); return; }
      Cloud.connect({ config: cfg });
      break;
    }
    case 'fbPull': Cloud.pull(); break;
    case 'fbPushAll': Cloud.pushAll(); break;
    case 'fbDisconnect': Cloud.disconnect(); render(); break;
    case 'expJSON': downloadJSON(); break;
    case 'impJSON': $('#fileInput').click(); break;
    case 'expCSVAll': exportCSVAll(); break;
    case 'seed': {
      const run = () => seedDemo();
      if (S.data.students.length) confirmDialog('بيانات تجريبية', 'سيتم استبدال البيانات الحالية بالكامل ببيانات تجريبية. متابعة؟ (اعمل نسخة احتياطية أولًا)', 'استبدال', run, true);
      else run();
      break;
    }
    case 'wipe': confirmDialog('حذف كل البيانات', 'سيتم حذف كل الطلبة والمجموعات والمدفوعات وسجل الحضور نهائيًا. هل أنت متأكد؟', 'حذف الكل', () => {
      localStorage.removeItem(LS_KEY);
      S.data = defaultData();
      commit(); toast('تم حذف كل البيانات', 'ok');
    }, true); break;
    case 'quickEnd': break;
  }
});

function refreshAttCounts(){
  if (!attDraft) return;
  const ss = studentsOf(attDraft.groupId).filter(s => s.status !== 'stopped');
  const counts = { present:0, absent:0, late:0, excused:0 };
  ss.forEach(s => { const v = attDraft.records[s.id]; if (counts[v] != null) counts[v]++; });
  const marked = sum(Object.values(counts));
  const ch = $$('#content .att-sum .k');
  if (ch.length >= 4) ch.forEach(k => {
    const t = k.textContent.trim();
    if (t.startsWith('حاضر')) k.lastChild.nodeValue = ' حاضر ' + counts.present;
    else if (t.startsWith('متأخر')) k.lastChild.nodeValue = ' متأخر ' + counts.late;
    else if (t.startsWith('غائب')) k.lastChild.nodeValue = ' غائب ' + counts.absent;
    else if (t.startsWith('بعذر')) k.lastChild.nodeValue = ' بعذر ' + counts.excused;
  });
  const badge = $('#content .card-h .badge');
  if (badge && /مُسجَّل/.test(badge.textContent)){ badge.textContent = marked + '/' + ss.length + ' مُسجَّل'; badge.className = 'badge ' + (marked === ss.length && ss.length ? 'b-ok' : 'b-warn'); }
}
function printProfile(id){
  const s = student(id); if (!s) return;
  const fin = stuFinance(s), a = attStats(s.id), avg = examAvg(s.id);
  const rows = [
    ['الاسم', s.name], ['الكود', s.code || '—'], ['المجموعة', groupName(s.groupId)], ['المستوى', s.level || '—'],
    ['هاتف الطالب', s.phone || '—'], ['هاتف ولي الأمر', s.parentPhone || '—'], ['تاريخ الانضمام', fmtDate(s.joinDate)],
    ['الحالة', stuStatus(s).label], ['قيمة الاشتراك', money(s.fee)],
    [s.sub.type === 'monthly' ? 'نهاية الاشتراك' : 'باقة الحصص', s.sub.type === 'monthly' ? fmtDate(s.sub.end) + ' (' + daysLeft(s.sub.end) + ' يوم)' : (s.sub.total + ' حصة — متبقي ' + fin.remaining)],
    ['إجمالي المدفوع', money(fin.paidTotal)], ['المتأخرات', fin.due > 0 ? money(fin.due) + ' (' + fin.dueMonths.map(m => monthName(m)).join(' ، ') + ')' : 'لا يوجد'],
    ['نسبة الحضور', a.rate + '% (' + (a.present + a.late) + ' حضور · ' + a.absent + ' غياب · ' + a.late + ' تأخير من ' + a.total + ')'],
    ['متوسط الدرجات', avg == null ? '—' : avg + '%'],
    ['ملاحظات', s.notes || '—']
  ];
  printHTML('تقرير الطالب — ' + s.name, tableToPrint(['البند','التفاصيل'], rows, 'ملف الطالب: ' + s.name,
    `<div>تاريخ الطباعة: <b>${fmtDate(today())}</b></div><div>الحالة: <b>${esc(stuStatus(s).label)}</b></div>`));
}

/* ---------------- Other listeners ---------------- */
document.addEventListener('change', function(e){
  const t = e.target;
  if (t.matches('[data-filter]')){ S.ui.stuFilter[t.dataset.filter] = t.value; render(); return; }
  if (t.matches('[data-att="date"]')){ S.ui.att.date = t.value; render(); return; }
  if (t.matches('[data-att="group"]')){ S.ui.att.groupId = t.value; S.ui.att.matrixMonth = monthKey(t.value); render(); return; }
  if (t.matches('[data-rep]')){ S.ui.rep[t.dataset.rep] = t.value; render(); return; }
  if (t.matches('[data-grade]')){
    const sel = S.data.exams.find(x => x.id === S.ui.exam.id) || S.data.exams[0];
    if (!sel) return;
    S.data.grades[sel.id] = S.data.grades[sel.id] || {};
    const v = t.value.trim();
    if (v === '') delete S.data.grades[sel.id][t.dataset.grade];
    else S.data.grades[sel.id][t.dataset.grade] = clamp(Number(v) || 0, 0, sel.max);
    commit({ silent: true });
    return;
  }
  if (t.id === 'fileInput' && t.files && t.files[0]){ importJSON(t.files[0]); t.value = ''; return; }
  if (t.id === 'darkToggle'){ setTheme(t.checked ? 'dark' : 'light'); return; }
  if (t.matches('[data-set]') && t.dataset.set === 'levels'){ /* handled on save */ return; }
});
document.addEventListener('input', debounce(function(e){
  const t = e.target;
  if (t.id === 'globalSearch'){
    S.query = t.value;
    if (S.query && S.view !== 'students') S.view = 'students';
    render();
    return;
  }
  if (t.id === 'stuSearch'){ S.query = t.value; render(); return; }
  if (t.id === 'attNote' && attDraft){ attDraft.note = t.value; return; }
}, 260));

/* sidebar / header */
$('#burger').onclick = () => { $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('on'); };
$('#scrim').onclick = closeDrawer;
$('#quickAddBtn').onclick = () => openStudentForm();
$('#themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
$('#cloudChip').onclick = () => go('settings');

function setTheme(t){
  document.documentElement.dataset.theme = t;
  S.data.settings.theme = t;
  localStorage.setItem(LS_KEY + '_theme', t);
  const use = $('#themeBtn use');
  if (use) use.setAttribute('href', t === 'dark' ? '#i-sun' : '#i-moon');
  const cb = $('#darkToggle'); if (cb) cb.checked = t === 'dark';
  saveLocal();
  if (S.view === 'dashboard' || S.view === 'payments') render();
}
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && Modal.stack.length){ Modal.close(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
    if (S.view === 'attendance' && attDraft){ e.preventDefault(); $('[data-act=attSave]').click(); }
  }
});
window.addEventListener('resize', throttle(() => {
  const v = 'after_' + S.view;
  if (typeof Views[v] === 'function'){ try{ Views[v](); }catch(e){} }
}, 220));

/* ---------------- Boot ---------------- */
(function boot(){
  const theme = localStorage.getItem(LS_KEY + '_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = theme;
  const had = loadLocal();
  if (!had){
    const d = defaultData();
    d.meta.rev = 1;
    S.data = d;
    saveLocal();
  }
  S.data.settings.theme = theme;
  const use = $('#themeBtn use'); if (use) use.setAttribute('href', theme === 'dark' ? '#i-sun' : '#i-moon');
  const cfg = Cloud.readCfg();
  if (cfg && cfg.apiKey && cfg.projectId){ S.fb.cfg = cfg; Cloud.connect({ config: cfg, save: false }); }
  paintCloud();
  render();
  if (!had) setTimeout(() => toast('أهلًا بك في نظام المتابعة 👋 ابدأ بإضافة أول طالب أو حمّل بيانات تجريبية من الإعدادات', 'info', 'مرحبًا'), 700);
  window.addEventListener('beforeunload', () => { if (dirty.main) Cloud.push(true); });
})();

/* expose for debugging */
window.AF = { S: S, Cloud: Cloud, render: render, go: go, seedDemo: seedDemo, exportCSVAll: exportCSVAll };

</script>
