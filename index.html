<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="منصة المستر - نظام متابعة الطلاب والحصص والامتحانات والحضور | أحمد فتحي">
<meta name="theme-color" content="#fac518">
<meta name="color-scheme" content="light dark">
<title>منصة المستر | أحمد فتحي</title>
<link rel="icon" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="منصة المستر">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   منصة المستر — Stylesheet
   ألوان الهوية مأخوذة من اللوجو: الذهبي #fac518 + الأسود
   ========================================================== */

/* شبكة أمان: أي أيقونة SVG جوه المنصة ليها مقاس افتراضي معقول.
   من غير القاعدة دي أي حاوية من غير قاعدة مقاس خاصة بتخلي الأيقونة
   تترسم بحجم المتصفح الافتراضي (150px) وتخرج بره الكارت. */
.shell svg, .modal svg, #toasts svg{
  width:18px; height:18px; flex:0 0 auto;
  max-width:100%; max-height:100%;
}
/* أيقونة عنوان الكارت (زي عناوين التنبيهات: عاجل / متابعة / ملاحظات) */
.card-h .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 30px}
.card-h .ic svg{width:16px;height:16px}
/* شبكة الأنيميشن الجاهزة (sprite) بتتخفي ومش بتاخد مكان */
svg.sprite{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}

/* أداء: تمرير ناعم بدون تعقيد الرسم على الأجهزة الضعيفة */
.tbl-wrap, .modal-b, .nav{ -webkit-overflow-scrolling:touch; }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}

:root{
  --brand:#fac518;          /* اللون الذهبي من اللوجو */
  --brand-2:#ffd94a;
  --brand-3:#e0a800;
  --brand-soft:rgba(250,197,24,.16);
  --ink:#101014;
  --ink-2:#33363f;
  --muted:#6b7280;
  --muted-2:#9aa1ad;
  --bg:#f5f6f8;
  --card:#ffffff;
  --line:#e7e9ee;
  --line-2:#f0f1f5;
  --side:#0b0b0d;
  --side-2:#16161a;
  --side-ink:#c6cad3;
  --ok:#12a150; --ok-bg:#e7f8ee;
  --warn:#c07a00; --warn-bg:#fff5dc;
  --bad:#e02424; --bad-bg:#feecec;
  --info:#2563eb; --info-bg:#e9f0ff;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 6px 22px -10px rgba(16,24,40,.16);
  --shadow-lg:0 24px 60px -24px rgba(16,24,40,.42);
  --r:16px; --r-sm:11px;
  --sb:266px;
  --font:'Cairo','Segoe UI',Tahoma,system-ui,-apple-system,sans-serif;
}
[data-theme="dark"]{
  --ink:#f3f4f7; --ink-2:#d8dbe2; --muted:#9aa1ad; --muted-2:#79808d;
  --bg:#0a0a0c; --card:#141418; --line:#26262c; --line-2:#1c1c21;
  --side:#000000; --side-2:#101014; --side-ink:#c2c6cf;
  --ok-bg:#0c2a1c; --warn-bg:#2b2208; --bad-bg:#2b1111; --info-bg:#0f1c33;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.65;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(760px 320px at 100% 0,rgba(250,197,24,.13),transparent 62%)}
h1,h2,h3,h4,p,dl,dd,dt{margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(130,136,150,.38);border-radius:20px;border:3px solid transparent;background-clip:content-box}
.hide{display:none !important}

/* ---------- Shell ---------- */
.shell{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{width:var(--sb);flex:0 0 var(--sb);background:var(--side);color:var(--side-ink);
  display:flex;flex-direction:column;position:fixed;inset-block:0;inset-inline-start:0;z-index:60;transition:transform .28s cubic-bezier(.4,0,.2,1)}
.sidebar::after{content:"";position:absolute;top:0;bottom:0;inset-inline-start:0;width:3px;background:linear-gradient(180deg,var(--brand),transparent 72%)}
.brand{display:flex;align-items:center;gap:12px;padding:16px 15px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo-wrap{position:relative;flex:0 0 56px;width:56px;height:56px}
.brand .logo-edit{position:absolute;inset-inline-end:-6px;bottom:-6px;width:24px;height:24px;border-radius:50%;
  border:2px solid var(--side);background:var(--brand);color:#1b1b1b;display:grid;place-items:center;cursor:pointer;
  padding:0;box-shadow:0 3px 10px rgba(0,0,0,.45);transition:.15s;z-index:2}
.brand .logo-edit svg{width:12px;height:12px}
.brand .logo-edit:hover{transform:scale(1.12);background:#fff}
.brand .logo{width:56px;height:56px;border-radius:50%;object-fit:cover;flex:0 0 56px;background:#000;box-shadow:0 0 0 2px var(--brand),0 6px 18px -6px rgba(250,197,24,.6)}
.brand .bt{min-width:0}
.brand .bt b{display:block;color:#fff;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .bt span{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--brand);letter-spacing:.2px}
.brand .bt span i{width:6px;height:6px;border-radius:50%;background:var(--brand);display:block}
.nav{padding:10px 9px 14px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1}
.nav .nlabel{font-size:10.5px;color:#6b7280;font-weight:800;letter-spacing:.4px;padding:11px 11px 4px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--side-ink);
  font-weight:600;font-size:14px;position:relative;transition:.16s;cursor:pointer}
.nav a svg{width:19px;height:19px;flex:0 0 19px;opacity:.82}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:linear-gradient(90deg,var(--brand-soft),rgba(250,197,24,.03));color:#fff}
.nav a.on svg{opacity:1;color:var(--brand)}
.nav a.on::before{content:"";position:absolute;inset-inline-end:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--brand)}
.nav .pill{margin-inline-start:auto;background:var(--brand);color:#1b1b1b;font-size:11px;font-weight:800;padding:1px 7px;border-radius:20px;min-width:22px;text-align:center}
.side-foot{padding:11px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:8px}
.cloud{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:11px;background:rgba(255,255,255,.06);cursor:pointer;transition:.16s;border:0;color:inherit;text-align:start;width:100%}
.cloud:hover{background:rgba(255,255,255,.12)}
.cloud .dot{width:9px;height:9px;border-radius:50%;background:var(--muted-2);flex:0 0 9px}
.cloud.live .dot{background:#22c55e;position:relative}
.cloud.live .dot::after{content:'';position:absolute;inset:0;border-radius:50%;background:#22c55e;
  animation:pulse 2s ease-out infinite;will-change:transform,opacity}
.cloud.busy .dot{background:var(--brand)} .cloud.err .dot{background:var(--bad)}
@keyframes pulse{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(2.6);opacity:0}}
.cloud .ct{min-width:0;line-height:1.35}
.cloud .ct b{display:block;color:#fff;font-size:12.5px;font-weight:700}
.cloud .ct span{display:block;font-size:10.5px;color:#8b93a1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.install-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:11px;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--brand),var(--brand-3));color:#1b1b1b;font-weight:800;font-size:13px;transition:.16s}
.install-btn:hover{filter:brightness(1.07)}
.install-btn svg{width:17px;height:17px}

.main{flex:1;min-width:0;margin-inline-start:var(--sb);display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:var(--card);
  border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:11px;min-height:66px}
.burger{display:none;width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--card);cursor:pointer;align-items:center;justify-content:center}
.burger svg{width:20px;height:20px}
.ptitle{min-width:0}
.ptitle h1{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.searchbox{position:relative}
.searchbox svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted-2)}
.searchbox input{width:250px;padding:9px 38px 9px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);outline:none;transition:.16s}
.searchbox input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.content{padding:18px;flex:1;min-width:0}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);padding:9px 14px;border-radius:11px;font-weight:700;font-size:13.5px;cursor:pointer;transition:.15s;white-space:nowrap;text-decoration:none}
.btn svg{width:17px;height:17px}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#1b1b1b}
.btn.pri:hover{background:var(--brand-2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
[data-theme="dark"] .btn.dark{background:#2b2b33;border-color:#3a3a44}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--line-2);color:var(--ink);box-shadow:none}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.sm svg{width:15px;height:15px}
.btn.icon{padding:8px;width:36px;height:36px}
.btn.icon.sm{width:30px;height:30px;padding:0}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:14px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.card-h h3 svg{width:18px;height:18px;color:var(--brand-3)}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:600}
.card-h .sp,.sp{margin-inline-start:auto}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-23{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-32{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
.mt{margin-top:14px}

/* ---------- Stats ---------- */
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--brand)}
.stat.ok::after{background:var(--ok)} .stat.bad::after{background:var(--bad)} .stat.info::after{background:var(--info)}
.stat .st-h{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:700}
.stat .st-h .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-3)}
.stat .st-h .ic svg{width:16px;height:16px}
.stat.ok .st-h .ic{background:var(--ok-bg);color:var(--ok)}
.stat.bad .st-h .ic{background:var(--bad-bg);color:var(--bad)}
.stat.info .st-h .ic{background:var(--info-bg);color:var(--info)}
.stat .val{font-size:26px;font-weight:900;margin-top:5px;letter-spacing:-.5px}
.stat .val small{font-size:13px;font-weight:700;color:var(--muted)}
.stat .foot{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* ---------- Tables ---------- */
.tbl-wrap{overflow:auto}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.tbl th{position:sticky;top:0;background:var(--card);z-index:2;text-align:start;padding:11px 12px;font-weight:800;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tbody tr:hover{background:var(--line-2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{font-variant-numeric:tabular-nums;font-weight:700}
.tbl td .row-actions{display:flex;gap:4px;justify-content:flex-end}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;color:#1b1b1b;flex:0 0 36px;font-size:13px;background:var(--brand)}
.who .wt{min-width:0}
.who .wt b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.who .wt span{display:block;font-size:11.5px;color:var(--muted)}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:800;white-space:nowrap;border:1px solid transparent}
.badge svg{width:13px;height:13px}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-info{background:var(--info-bg);color:var(--info)}
.b-gray{background:var(--line-2);color:var(--muted)}
.b-brand{background:var(--brand-soft);color:var(--brand-3);border-color:rgba(250,197,24,.35)}
[data-theme="dark"] .b-brand{color:var(--brand)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--brand)}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
[data-theme="dark"] .chip.on{background:var(--brand);color:#1b1b1b;border-color:var(--brand)}
.chips{display:flex;gap:7px;flex-wrap:wrap}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field>label{font-size:12.5px;font-weight:800;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.field .req{color:var(--bad)}
.field .hint{font-size:11px;color:var(--muted-2);font-weight:600}
.inp,input[type=text],input[type=number],input[type=date],input[type=month],input[type=time],input[type=tel],input[type=email],input[type=password],select,textarea{
  width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);outline:none;transition:.15s}
textarea{min-height:78px;resize:vertical;line-height:1.7}
.inp:focus,input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.inp:disabled,input:disabled{background:var(--line-2);color:var(--muted)}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2.2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:left 11px center;background-size:16px;padding-inline-start:34px}
.frow{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.frow-3{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch .track{width:44px;height:25px;border-radius:20px;background:var(--line);position:relative;transition:.2s;flex:0 0 44px}
.switch .track::after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;top:3px;inset-inline-end:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+.track{background:var(--ok)}
.switch input:checked+.track::after{inset-inline-end:22px}
.switch .lb{font-weight:700;font-size:13.5px}
.switch .lb span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,8,10,.72);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:22px 14px;overflow-y:auto;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:720px;margin:auto;animation:pop .22s cubic-bezier(.2,.9,.3,1.2);border:1px solid var(--line)}
.modal.sm{max-width:470px} .modal.lg{max-width:940px} .modal.xl{max-width:1180px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line-2)}
.modal-h h3{font-size:16.5px;font-weight:800}
.modal-h .sub{font-size:12px;color:var(--muted);font-weight:600}
.modal-h .x{margin-inline-start:auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;transition:.15s}
.modal-h .x:hover{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.modal-h .x svg{width:17px;height:17px}
.modal-b{padding:18px;max-height:calc(100vh - 210px);overflow-y:auto}
.modal-f{padding:13px 18px;border-top:1px solid var(--line-2);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- Toasts ---------- */
.toasts{position:fixed;bottom:18px;inset-inline-start:18px;z-index:400;display:flex;flex-direction:column;gap:9px;max-width:min(380px,90vw)}
.toast{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-lg);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;animation:slideInRtl .26s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slideInRtl{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.toast .ti{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 30px;background:var(--info-bg);color:var(--info)}
.toast .ti svg{width:16px;height:16px}
.toast.ok .ti{background:var(--ok-bg);color:var(--ok)}
.toast.bad .ti{background:var(--bad-bg);color:var(--bad)}
.toast.warn .ti{background:var(--warn-bg);color:var(--warn)}
.toast .tt{min-width:0;flex:1}
.toast .tt b{display:block;font-size:13.5px;font-weight:800}
.toast .tt span{font-size:12.5px;color:var(--muted)}

/* ---------- Empty ---------- */
.empty{text-align:center;padding:42px 18px;color:var(--muted)}
.empty .ic{width:68px;height:68px;border-radius:20px;background:var(--line-2);display:grid;place-items:center;margin:0 auto 13px;color:var(--brand-3)}
.empty .ic svg{width:32px;height:32px}
.empty h4{font-size:15.5px;font-weight:800;color:var(--ink)}
.empty p{font-size:13px;margin-top:4px}

/* ---------- Attendance ---------- */
.att-row{display:flex;align-items:center;gap:12px;padding:10px 13px;border:1px solid var(--line);border-radius:13px;background:var(--card);margin-bottom:8px;transition:.15s;flex-wrap:wrap}
.att-row:hover{border-color:var(--brand)}
.att-row .an{flex:1;min-width:150px}
.att-row .an b{display:block;font-weight:700}
.att-row .an span{font-size:11.5px;color:var(--muted)}
.seg{display:flex;gap:5px;background:var(--line-2);padding:4px;border-radius:12px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:800;font-size:12.5px;cursor:pointer;color:var(--muted);transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on[data-v=present]{color:var(--ok)} .seg button.on[data-v=absent]{color:var(--bad)}
.seg button.on[data-v=late]{color:var(--warn)} .seg button.on[data-v=excused]{color:var(--info)}
.att-sum{display:flex;gap:10px;flex-wrap:wrap}
.att-sum .k{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.att-sum .k i{width:9px;height:9px;border-radius:3px;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-hd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.cal-hd div{text-align:center;font-size:11px;font-weight:800;color:var(--muted-2)}
.cd{aspect-ratio:1;border-radius:9px;background:var(--line-2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.cd.present{background:var(--ok-bg) !important;color:var(--ok) !important}
.cd.absent{background:var(--bad-bg) !important;color:var(--bad) !important}
.cd.late{background:var(--warn-bg) !important;color:var(--warn) !important}
.cd.excused{background:var(--info-bg) !important;color:var(--info) !important}

/* ---------- Schedule (week grid) ---------- */
.sched{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}
.sched .day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px;min-height:120px}
.sched .day h4{font-size:12.5px;font-weight:800;text-align:center;color:var(--muted);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.sched .slot{background:linear-gradient(135deg,var(--brand-soft),rgba(250,197,24,.05));border:1px solid rgba(250,197,24,.4);border-radius:11px;padding:8px;margin-bottom:7px;cursor:pointer;transition:.15s}
.sched .slot:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.sched .slot b{display:block;font-size:12.5px;font-weight:800}
.sched .slot span{display:block;font-size:11px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.sched .slot em{display:block;font-size:10.5px;color:var(--brand-3);font-style:normal;font-weight:800;margin-top:3px}
.sched .none{text-align:center;color:var(--muted-2);font-size:11.5px;padding:18px 0}

/* ---------- Charts ---------- */
.chart{width:100%;display:block;height:210px}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:9px}
.legend .lg{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.legend .lg i{width:11px;height:11px;border-radius:4px;display:block}

/* ---------- Progress & misc ---------- */
.bar{height:8px;border-radius:6px;background:var(--line-2);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--brand);transition:width .5s}
.bar.ok>i{background:var(--ok)} .bar.bad>i{background:var(--bad)} .bar.info>i{background:var(--info)}
.alert-row{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;background:var(--card);flex-wrap:wrap}
.alert-row .ai{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 34px;background:var(--line-2);color:var(--muted)}
.alert-row .ai svg{width:17px;height:17px}
.alert-row.warn .ai{background:var(--warn-bg);color:var(--warn)}
.alert-row.bad .ai{background:var(--bad-bg);color:var(--bad)}
.alert-row.info .ai{background:var(--info-bg);color:var(--info)}
.alert-row .at{flex:1;min-width:140px}
.alert-row .at b{display:block;font-weight:700;font-size:13.5px}
.alert-row .at span{font-size:11.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0;font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:15px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:800;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;transition:.15s;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--brand)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;direction:ltr;text-align:left}
.help{background:var(--info-bg);border-radius:13px;padding:12px 14px;font-size:13px;line-height:1.85}
.help.brand{background:var(--brand-soft)}
.help code{background:rgba(0,0,0,.08);padding:1px 6px;border-radius:6px;font-family:ui-monospace,monospace;font-size:12px;direction:ltr;display:inline-block}
[data-theme="dark"] .help code{background:rgba(255,255,255,.12)}
.sep{height:1px;background:var(--line);margin:15px 0}
.flex{display:flex;align-items:center;gap:10px}
.flex.wrap{flex-wrap:wrap}
.muted{color:var(--muted)} .small{font-size:12px} .strong{font-weight:800}
.center{text-align:center} .nowrap{white-space:nowrap} .mono{font-variant-numeric:tabular-nums}
.scrim{display:none}
.pick-list{max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px}
.pick{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;cursor:pointer;transition:.14s}
.pick:hover{background:var(--line-2)}
.pick input{width:17px;height:17px;accent-color:var(--brand-3);flex:0 0 17px}
.pick .pt{flex:1;min-width:0}
.pick .pt b{display:block;font-size:13px;font-weight:700}
.pick .pt span{font-size:11px;color:var(--muted)}

/* ---------- Responsive ---------- */
@media (max-width:1200px){
  .g-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-23,.g-32{grid-template-columns:minmax(0,1fr)}
  .sched{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:900px){
  .sidebar{transform:translateX(100%)}
  [dir=ltr] .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.55)}
  .main{margin-inline-start:0}
  .burger{display:flex}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;opacity:0;pointer-events:none;transition:.25s}
  .scrim.on{opacity:1;pointer-events:auto}
  .g-3,.g-2{grid-template-columns:minmax(0,1fr)}
  .searchbox input{width:150px}
  .sched{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .content{padding:12px}
  .topbar{padding:9px 12px;gap:8px}
  .g-4{grid-template-columns:minmax(0,1fr)}
  .frow,.frow-3{grid-template-columns:minmax(0,1fr)}
  .stat .val{font-size:22px}
  .ptitle h1{font-size:16px} .ptitle p{display:none}
  .searchbox{display:none}
  .overlay{padding:0;align-items:flex-end}
  .modal{max-width:100%;border-radius:18px 18px 0 0;margin:0}
  .modal-b{max-height:none}
  .toasts{inset-inline:12px;bottom:12px;max-width:none}
  .sched{grid-template-columns:minmax(0,1fr)}
}

/* ==========================================================
   PRINT / PDF  — منطقة الطباعة المخصصة
   ========================================================== */
#printArea{display:none}
.rep-head{display:flex;align-items:center;gap:14px;border-bottom:3px solid #fac518;padding-bottom:12px;margin-bottom:14px}
.rep-head img{width:66px;height:66px;border-radius:50%;object-fit:cover;border:2px solid #fac518}
.rep-head .rm{flex:1}
.rep-head .rm b{display:block;font-size:19px;font-weight:800}
.rep-head .rm span{display:block;font-size:12.5px;color:#555}
.rep-head .rd{font-size:12px;color:#555;text-align:left;line-height:1.7}
.rep-title{background:#fff6dd;border:1px solid #f0dca0;border-radius:10px;padding:9px 13px;font-weight:800;font-size:14px;margin-bottom:12px}
.rep-sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rep-sum div{border:1px solid #e2e2e2;border-radius:10px;padding:8px 13px;font-size:12.5px;color:#444}
.rep-sum div b{display:block;font-size:16px;color:#111;font-weight:800}
.rep-table{width:100%;border-collapse:collapse;font-size:12.5px}
.rep-table th,.rep-table td{border:1px solid #d9d9d9;padding:6px 8px;text-align:right}
.rep-table th{background:#f4f5f7;font-weight:800}
.rep-table tr:nth-child(even) td{background:#fafbfc}
.rep-table td.c{text-align:center;font-variant-numeric:tabular-nums}
.rep-foot{margin-top:16px;border-top:1px dashed #ccc;padding-top:9px;font-size:11px;color:#666;display:flex;justify-content:space-between}

@media print{
  @page{size:A4;margin:12mm 10mm}
  html,body{background:#fff !important;height:auto}
  body>*{display:none !important}
  #printArea{display:block !important;color:#111;padding:0;margin:0}
  #printArea .rep-table{font-size:11.5px}
  #printArea .rep-table th,#printArea .rep-table td{padding:5px 6px}
  .rep-foot{position:fixed;bottom:0;left:0;right:0}
}

/* ============ الأدوار ============ */
.req-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:8px}
body.lmode .shell,body.lmode .fab{display:none!important}
#lview{display:none}
body.lmode #lview{display:block;max-width:460px;margin:0 auto;padding:26px 16px 40px;position:relative;z-index:5}
body.lmode{background:radial-gradient(520px 320px at 50% -40px,var(--brand-soft),transparent),var(--bg)}
.guest-bar{position:sticky;top:0;z-index:60;background:var(--warn-bg);color:var(--warn);border-bottom:1px solid var(--line);
  padding:9px 14px;font-size:13px;line-height:1.95;text-align:center}

  border:1px solid transparent;cursor:pointer;background:var(--brand-soft);color:var(--brand-3);font-family:var(--font)}

.role-badge.b-warn{background:var(--warn-bg);color:var(--warn)}

.role-strip{background:var(--info-bg);color:var(--info);border-radius:12px;padding:8px 11px;font-size:12.5px;line-height:1.9}

body.jmode .shell,body.jmode .fab,body.jmode .toasts{display:none!important}

body.jmode #jview{display:block;max-width:460px;margin:0 auto;padding:26px 16px 40px}

.jv-t{text-align:center;font-size:19px;font-weight:800}

.jv-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-top:15px;box-shadow:var(--shadow)}

.jv-foot{text-align:center;font-size:12px;color:var(--muted);margin-top:14px;line-height:2}

.pm-plat{font-weight:800;font-size:16px}
.pm-sub{font-size:12px;color:var(--muted)}
.pm-kid{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#1b1b1b;border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}

.pm-chip.ok{background:var(--ok-bg);color:var(--ok)}
.pm-chip.bad{background:var(--bad-bg);color:var(--bad)}

.pm-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}

.pm-foot{text-align:center;margin-top:16px;font-size:12px;color:var(--muted);line-height:2}
.pm-empty{text-align:center;color:var(--muted);font-size:13px;padding:9px 0}
.pm-btns{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}

<script>

/* ==== 20-core.js ==== */
/* ==========================================================
   منصة المستر — Part 1/4 : Core
   الأدوات · الحالة · التخزين · Firebase · المكوّنات
   ========================================================== */
'use strict';

const AF_LOGO_FALLBACK = window.AF_LOGO_FALLBACK;

/* ---------------- DOM helpers ---------------- */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.prototype.slice.call(root.querySelectorAll(sel));
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function icon(name, cls){ return `<svg class="${cls || ''}"><use href="#i-${name}"/></svg>`; }
function uid(p){ return (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function debounce(fn, ms){ let t; return function(){ const a = arguments, c = this; clearTimeout(t); t = setTimeout(() => fn.apply(c, a), ms); }; }
function throttle(fn, ms){ let last = 0, tm = null; return function(){ const a = arguments, now = Date.now();
  if (now - last > ms){ last = now; fn.apply(this, a); } else { clearTimeout(tm); tm = setTimeout(() => { last = Date.now(); fn.apply(this, a); }, ms - (now - last)); } }; }
function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
function sum(arr, f){ return arr.reduce((t, x) => t + (f ? f(x) : x), 0); }
function groupBy(arr, f){ const m = {}; arr.forEach(x => { const k = f(x); (m[k] = m[k] || []).push(x); }); return m; }
function sortBy(arr, f, dir){
  // بنحسب مفتاح الترتيب مرة واحدة لكل عنصر (مش مع كل مقارنة) — فرق كبير مع الجداول الكبيرة
  const k = dir === 'desc' ? -1 : 1, n = arr.length;
  const keyed = new Array(n);
  for (let i = 0; i < n; i++){ const x = arr[i]; keyed[i] = { k: f(x), v: x }; }
  keyed.sort((a, b) => (a.k < b.k ? -1 : a.k > b.k ? 1 : 0) * k);
  const out = new Array(n);
  for (let i = 0; i < n; i++) out[i] = keyed[i].v;
  return out;
}
function unique(a){ return Array.from(new Set(a)); }
// أرقام عربية للكلام (واحد، اتنين...) — بنستخدمها في الرسائل الودّية
function addAr(n){
  const v = Number(n) || 0;
  const small = ['صفر','واحد','اتنين','تلاتة','أربعة','خمسة','ستة','سبعة','تمانية','تسعة','عشرة'];
  if (v <= 10) return small[v];
  return nf(v);
}
function nf(n, dec){ return (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 }); }
function pct(a, b){ return b ? Math.round((a / b) * 100) : 0; }
function ar(n){ return nf(n, 0); }

/* ---------------- Arabic dates & times ---------------- */
const AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const AR_DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const AR_DAYS_SHORT = ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const DAY_ORDER = [6,0,1,2,3,4,5]; // سبت أول الأسبوع

function iso(d){ const x = d ? new Date(d) : new Date();
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; }
function today(){ return iso(new Date()); }
function parseISO(s){ if (!s) return null; const p = String(s).split('-').map(Number); if (p.length < 3 || !p[0]) return null; return new Date(p[0], p[1]-1, p[2]); }
function monthKey(d){ if (typeof d === 'string' && /^\d{4}-\d{2}/.test(d)) return d.slice(0,7); const x = d ? new Date(d) : new Date();
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`; }
function monthName(k){ const p = String(k).split('-'); return (AR_MONTHS[Number(p[1])-1] || '') + ' ' + p[0]; }
function fmtDate(s, withDay){ const d = parseISO(s); if (!d) return '—'; const base = `${d.getDate()} ${AR_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  return withDay ? `${AR_DAYS[d.getDay()]} ${base}` : base; }
function fmtShort(s){ const d = parseISO(s); return d ? `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}` : '—'; }
function addDays(s, n){ const d = typeof s === 'string' ? parseISO(s) : new Date(s); d.setDate(d.getDate() + n); return iso(d); }
function addMonths(s, n){ const d = parseISO(s) || new Date(); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
  const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day, last)); return iso(d); }
function daysBetween(a, b){ const d1 = parseISO(a), d2 = parseISO(b); return (d1 && d2) ? Math.round((d2 - d1) / 86400000) : 0; }
function monthRange(startKey, n){ const out = []; let k = startKey; for (let i = 0; i < n; i++){ out.push(k); k = monthKey(addMonths(k + '-01', 1)); } return out; }
function monthSeq(a, b){ const out = []; let k = a, g = 0; while (k <= b && g++ < 240){ out.push(k); k = monthKey(addMonths(k + '-01', 1)); } return out; }
/* الوقت */
function toMin(t){ const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || '')); return m ? (+m[1]) * 60 + (+m[2]) : null; }
function fmtTime(t){
  const m = toMin(t); if (m == null) return '—';
  let h = Math.floor(m / 60); const mm = m % 60;
  const suf = h >= 12 ? 'م' : 'ص';
  let hh = h % 12; if (hh === 0) hh = 12;
  return `${hh}:${String(mm).padStart(2,'0')} ${suf}`;
}
function timeRange(g){ return fmtTime(g.from) + ' — ' + fmtTime(g.to); }
function nowStamp(){ const d = new Date(); return d.toLocaleDateString('ar-EG', { day:'2-digit', month:'2-digit', year:'numeric' }) + ' — ' + d.toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' }); }
function initials(n){ const p = String(n || '').trim().split(/\s+/); return (p[0] ? p[0][0] : '?') + (p[1] ? p[1][0] : ''); }
const AV_COLORS = ['#fac518','#2563eb','#12a150','#e02424','#7c3aed','#0891b2','#db2777','#ea580c','#4f46e5','#0d9488'];
function avColor(k){ let h = 0; const s = String(k || ''); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 9973; return AV_COLORS[h % AV_COLORS.length]; }
function parsePhone(p){ return String(p || '').replace(/[^\d+]/g, ''); }
function waLink(phone, text){
  let p = parsePhone(phone);
  if (p.startsWith('+')) p = p.slice(1);
  if (p.startsWith('0')) p = '20' + p.slice(1);
  if (!p.startsWith('20') && p.length <= 11) p = '20' + p;
  return `https://wa.me/${p}?text=${encodeURIComponent(text || '')}`;
}

/* ---------------- Toast ---------------- */
function toast(msg, type, title, withUndo){
  const box = $('#toasts'); if (!box) return;
  const t = document.createElement('div');
  const icons = { ok:'check', bad:'alert', warn:'alert', info:'bell' };
  t.className = 'toast ' + (type || 'info');
  t.innerHTML = `<span class="ti">${icon(icons[type] || 'bell')}</span>
    <span class="tt"><b>${esc(title || ({ok:'تم بنجاح',bad:'خطأ',warn:'تنبيه',info:'معلومة'})[type] || 'معلومة')}</b><span>${esc(msg)}</span></span>` +
    (withUndo ? `<button class="btn sm pri" data-act="undoLast" style="margin-inline-start:8px">${icon('refresh')} رجّع</button>` : '');
  box.appendChild(t);
  const life = withUndo ? 10000 : (type === 'bad' ? 6000 : 3600);
  setTimeout(() => { t.style.transition = '.3s'; t.style.opacity = '0'; t.style.transform = 'translateY(10px)'; setTimeout(() => t.remove(), 320); }, life);
}

const Modal = {
  stack: [],
  open(opt){
    const id = uid('m');
    const ov = document.createElement('div');
    ov.className = 'overlay'; ov.dataset.mid = id;
    ov.innerHTML = `
      <div class="modal${opt.size ? ' ' + opt.size : ''}" role="dialog" aria-modal="true">
        <div class="modal-h">
          <div><h3>${esc(opt.title || '')}</h3>${opt.sub ? `<div class="sub">${esc(opt.sub)}</div>` : ''}</div>
          <button class="x no-print" data-close="${id}" aria-label="إغلاق">${icon('x')}</button>
        </div>
        <div class="modal-b">${opt.body || ''}</div>
        ${opt.footer === null ? '' : `<div class="modal-f no-print">${opt.footer || `<button class="btn" data-close="${id}">إغلاق</button>`}</div>`}
      </div>`;
    $('#modalRoot').appendChild(ov);
    ov.querySelectorAll('[data-close="__ID__"]').forEach(b => b.setAttribute('data-close', id));
    this.stack.push(id);
    document.body.style.overflow = 'hidden';
    ov.addEventListener('click', e => { if (e.target === ov && opt.dismissable !== false) this.close(id); });
    if (opt.onMount) opt.onMount(ov.querySelector('.modal'), ov);
    const f = ov.querySelector('input,select,textarea,button.pri');
    if (f && opt.autofocus !== false && window.innerWidth > 700) setTimeout(() => { try{ f.focus(); }catch(e){} }, 60);
    return id;
  },
  close(id){
    const ov = id ? $(`.overlay[data-mid="${id}"]`) : (this.stack.length ? $(`.overlay[data-mid="${this.stack[this.stack.length-1]}"]`) : null);
    if (!ov) return;
    this.stack = this.stack.filter(x => x !== ov.dataset.mid);
    ov.style.transition = '.18s'; ov.style.opacity = '0';
    setTimeout(() => ov.remove(), 180);
    if (!this.stack.length) document.body.style.overflow = '';
  },
  closeAll(){ this.stack.slice().forEach(id => this.close(id)); }
};

function migrate(d){
  const base = defaultData();
  const out = Object.assign({}, base, d || {});
  out.meta = Object.assign({}, base.meta, d && d.meta);
  out.settings = Object.assign({}, base.settings, d && d.settings);
  ['stages','studySystems','studySystemsBac','studentTypes','levels'].forEach(k => {
    if (!Array.isArray(out.settings[k]) || !out.settings[k].length) out.settings[k] = base.settings[k].slice();
  });
  out.groups = (out.groups || []).map(g => Object.assign({ id: uid('g'), name:'', stage:'', day: 6, from:'16:00', to:'18:00', payMode:'monthly', level:'', note:'' }, g));
  out.students = (out.students || []).map(s => Object.assign({
    id: uid('s'), code:'', name:'', stage:'', studySystem:'', type:'', level:'', groupId:'',
    payMode:'monthly', phone:'', parentPhone:'', guardian:'', joinDate: today(), status:'active', notes:''
  }, s));
  out.exams = (out.exams || []).map(e => Object.assign({ id: uid('e'), name:'', stage:'', groupId:'', date: today(), max: 20, hw:'', note:'' }, e));
  out.grades = out.grades || {};
  out.attendance = out.attendance || {};
  out.feedback = out.feedback || {};
  out.absNotes = out.absNotes || {};
  out.msgSent = out.msgSent || {};
  out.meta.secrev = out.meta.secrev || {};
  out.meta.attrev = out.meta.attrev || {};
  out.meta.logorev = Number(out.meta.logorev || 0);
  return out;
}
